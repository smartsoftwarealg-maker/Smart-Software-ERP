<mat-card>
    <mat-card-content>
        @defer (when form) {
            <form novalidate [formGroup]="form">
                <mat-form-field id="memo" class="default-100">
                    <mat-label translate>REMUN_IEP_FORMULA</mat-label>
                    <textarea matInput formControlName="iepRate" type="text" rows="3"></textarea>
                </mat-form-field>

                <mat-form-field id="code" class="default-50">
                    <mat-label translate>REMUN_MAX_SALARY</mat-label>
                    <input matInput formControlName="maxSalary" type="number" autofocus>
                    @if (form.controls['maxSalary'].invalid) {
                        <mat-error translate>COMMON_FIELD_MAX_LENGTH</mat-error>
                    }
                </mat-form-field>

                <mat-form-field class="default-50">
                    <mat-label translate>REMUN_VACATION_DAYS</mat-label>
                    <input matInput formControlName="vacationRate" type="number" autofocus>
                    @if (form.controls['vacationRate'].invalid) {
                        <mat-error translate>COMMON_FIELD_MAX_LENGTH</mat-error>
                    }
                </mat-form-field>

                <mat-form-field class="default-50 sm-100">
                    <mat-label translate>REMUN_PERSONAL_ROLE</mat-label>
                    <ss-auto-complete matInput
                                      [model]="roleLookup0"
                                      formControlName="personalRole">
                    </ss-auto-complete>
                </mat-form-field>

                <mat-form-field class="default-50 sm-100">
                    <mat-label translate>REMUN_PAYROLL_ROLE</mat-label>
                    <ss-auto-complete matInput
                                      [model]="roleLookup1"
                                      formControlName="payrollRole">
                    </ss-auto-complete>
                </mat-form-field>

                <div class="default-50 sm-100">
                    <mat-checkbox formControlName="codifyId" translate>REMUN_CODIFY_ID</mat-checkbox>
                </div>
            </form>
        }
    </mat-card-content>
</mat-card>
