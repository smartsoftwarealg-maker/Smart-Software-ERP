<div class="b-b-disabled-btn card-title" translate>
    PAYROLL_EMPLOYEE_WIVES
</div>
<div class="table-container">
    <mat-table mat-table [dataSource]="uiSrv.instance.data" class="main-table">

        <ng-container matColumnDef="birthdate">
            <mat-header-cell *matHeaderCellDef translate style="justify-content: center">
                PAYROLL_BIRTH_DATE
            </mat-header-cell>
            <mat-cell *matCellDef="let e" style="justify-content: center">
                {{e.birthdate}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="name">
            <mat-header-cell *matHeaderCellDef translate style="justify-content: center">
                PAYROLL_NAME
            </mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.name}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="birthPlace">
            <mat-header-cell *matHeaderCellDef translate style="justify-content: center">
                PAYROLL_BIRTH_PLACE
            </mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.birthPlace}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="father">
            <mat-header-cell *matHeaderCellDef translate style="justify-content: center">
                PAYROLL_FATHER
            </mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.father}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="mother">
            <mat-header-cell *matHeaderCellDef translate style="justify-content: center">
                PAYROLL_MOTHER
            </mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.mother}}
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == uiSrv.instance.selected" (click)="uiSrv.instance.select(row.id)"
            *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>

</div>

    <ss-pagination [paginationModel]="uiSrv.instance.pagination"></ss-pagination>
</div-->
