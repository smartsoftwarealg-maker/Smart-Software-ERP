<mat-card>
    <form>
        <mat-form-field appearance="fill"  class="default-100">
            <mat-label translate>REMUN_NET_PAYMENT</mat-label>
            <input matInput type="number" step="1" [formField]="form.net" >
        </mat-form-field>

        <mat-form-field appearance="fill" class="default-100">
            <mat-label translate>PAYROLL_SS</mat-label>
            <input matInput type="text" step="1" [formField]="form.ss" >
        </mat-form-field>

        <mat-form-field appearance="fill" class="default-100">
            <mat-label translate>REMUN_IRG</mat-label>
            <input matInput type="text" step="1" [formField]="form.irg" >
        </mat-form-field>

        <mat-form-field appearance="fill" class="default-100">
            <mat-label translate>PAYROLL_BASE_SALARY</mat-label>
            <input matInput type="text" step="1" [formField]="form.base">
        </mat-form-field>

    </form>
</mat-card>
