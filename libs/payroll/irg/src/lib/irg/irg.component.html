<mat-card>
    <form [formGroup]="form">
        <mat-form-field appearance="fill"  class="default-100">
            <mat-label translate>REMUN_BASE</mat-label>
            <input matInput type="number" step="1" formControlName="base">
        </mat-form-field>

        <mat-form-field appearance="fill" class="default-100">
            <mat-label translate>PAYROLL_ABSENCE</mat-label>
            <input matInput type="number" step="1" formControlName="absence">
        </mat-form-field>

        <mat-form-field appearance="fill" class="default-100">
            <mat-label translate>REMUN_IRG</mat-label>
            <input matInput type="number" step="1" formControlName="irg" readonly>
        </mat-form-field>

    </form>
</mat-card>
