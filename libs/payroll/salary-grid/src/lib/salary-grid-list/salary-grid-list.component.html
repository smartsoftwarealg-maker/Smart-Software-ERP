<div class="container_div">
    <mat-table mat-table [dataSource]="data" class="content-div" matSort (matSortChange)="sort($event)" >

        <ng-container matColumnDef="category">
            <mat-header-cell *matHeaderCellDef  mat-sort-header translate>PAYROLL_CATEGORY</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.category }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="sec">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>PAYROLL_SECTION</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.sec }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="baseSalary">
            <mat-header-cell *matHeaderCellDef mat-sort-header><span translate>PAYROLL_BASE_SALARY</span></mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.baseSalary | number: '1.2-2' }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="indexValue">
            <mat-header-cell *matHeaderCellDef mat-sort-header><span translate>PAYROLL_INDEX_VALUE</span></mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.indexValue | number: '1.2-4' }}
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
</div>
<div class="pagination-container b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
