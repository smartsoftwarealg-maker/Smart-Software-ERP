<div class="button_div size" *ngIf="form">
    <button mat-mini-fab (click)="save()"
            color="accent" *ngIf="isEditable">
        <i class="fas fa-save"></i>
    </button>
    <button mat-mini-fab (click)="cancel()" color="warn">
        <i class="fas fa-redo"></i>
    </button>
</div>

<mat-card class="size">
    <form *ngIf="form" novalidate [formGroup]="form" >

        <mat-form-field floatLabel="always" class="default-50 sm-100">
            <mat-label translate>PAYROLL_RANK</mat-label>
            <input matInput formControlName="rank" type="number" required>
        </mat-form-field>

        <mat-form-field floatLabel="always" class="default-50 sm-100">
            <mat-label translate>PAYROLL_INDEX</mat-label>
            <input matInput formControlName="index" type="number" required>
        </mat-form-field>

        <mat-form-field floatLabel="always" class="default-50 sm-100">
            <mat-label translate>PAYROLL_BASE_SALARY</mat-label>
            <input matInput formControlName="baseSalary" type="number" required>
        </mat-form-field>

        <!--                <pre>{{form.value | json}}</pre>-->
    </form>
</mat-card>
