<mat-card>
    <mat-card-content>
        <form *ngIf="form !== null" novalidate [formGroup]="form">
            <mat-form-field id="code" class="default-50 sm-100">
                <mat-label translate>PAYROLL_CATEGORY</mat-label>
                <input matInput formControlName="category" type="text" autofocus maxlength="4">
                <mat-error *ngIf="form.controls['category'].invalid" translate>COMMON_FIELD_MAX_LENGTH
                </mat-error>
            </mat-form-field>

            <mat-form-field class="default-50 sm-100">
                <mat-label translate>PAYROLL_SEC</mat-label>
                <input matInput formControlName="sec" type="text" required>
                <mat-error *ngIf="form.controls['sec'].invalid" translate>COMMON_FIELD_REQUIRED
                </mat-error>
            </mat-form-field>

            <mat-form-field class="default-50 sm-100">
                <mat-label><span translate>PAYROLL_BASE_SALARY </span></mat-label>
                <input matInput formControlName="baseSalary" type="number" required>
                <mat-error *ngIf="form.controls['baseSalary'].invalid" translate>COMMON_FIELD_REQUIRED
                </mat-error>
            </mat-form-field>

            <mat-form-field class="default-50 sm-100">
                <mat-label><span translate>PAYROLL_INDEX_VALUE</span></mat-label>
                <input matInput formControlName="indexValue" type="number" required>
                <mat-error *ngIf="form.controls['indexValue'].invalid" translate>COMMON_FIELD_REQUIRED
                </mat-error>
            </mat-form-field>
        </form>

    </mat-card-content>
</mat-card>

@if (loaded()) {
    <router-outlet></router-outlet>
}
