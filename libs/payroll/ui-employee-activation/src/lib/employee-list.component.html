<div class="main-table-scroll">
    <mat-table mat-table [dataSource]="data" class="main-table">

        <ng-container matColumnDef="photo">
            <mat-header-cell *matHeaderCellDef style="justify-content: center" translate>PAYROLL_PHOTO</mat-header-cell>
            <mat-cell *matCellDef="let e">
                <div class="person-photo">
                    <!--ng-container *ngIf="e.photoUrl == 'loading'; else personPhoto">
                        <i class="fas fa-spinner fa-spin"></i>
                    </ng-container-->
                    <!--ng-template #personPhoto>
                        <img [src]="e.photoSafeUrl">
                    </ng-template-->
                    <ss-image-input width="60px" height="76px" [ImageModel]="e.imageModel" style="display: inline-block;">
                    </ss-image-input>
                    <i *ngIf="e.sex == 1" style="color: #00AAAA" class="abs-end-0 gender-icon fas fa-mars"></i>
                    <i *ngIf="e.sex == 2" style="color: #ff69b4" class="abs-end-0 gender-icon fas fa-venus"></i>
                </div>
            </mat-cell>
        </ng-container>
    
        <ng-container matColumnDef="id">
            <mat-header-cell *matHeaderCellDef translate>PAYROLL_ID</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.id}}
            </mat-cell>
        </ng-container>
    
        <ng-container matColumnDef="fullname">
            <mat-header-cell *matHeaderCellDef translate>PAYROLL_FULLNAME</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.fullName}}
            </mat-cell>
        </ng-container>
    
        <ng-container matColumnDef="date">
            <mat-header-cell *matHeaderCellDef style="justify-content: center; text-align: center" translate>PAYROLL_FROM_TO
            </mat-header-cell>
            <mat-cell *matCellDef="let e" style="justify-content: center; text-align: center">
                <i *ngIf="e.loading" class="fas fa-spinner fa-spin"></i>
                <span *ngIf="!e.loading" style="display: inline-block;">
                    {{e.from}} {{e.to}}
                </span>
            </mat-cell>
        </ng-container>
    
        <ng-container matColumnDef="suspended">
            <mat-header-cell style="justify-content: center" *matHeaderCellDef translate>
                PAYROLL_SUSPENDED
            </mat-header-cell>
            <mat-cell style="justify-content: center" *matCellDef="let e">
                <i *ngIf="e.loading" class="fas fa-spinner fa-spin"></i>
                <span *ngIf="!e.loading" style="display: inline-block;">
                    <i *ngIf="e.suspended" class="fas fa-times"></i>
                </span>
            </mat-cell>
        </ng-container>
    
        <ng-container matColumnDef="employmentType">
            <mat-header-cell *matHeaderCellDef translate>
                PAYROLL_EMPLOYMENT_TYPE
            </mat-header-cell>
            <mat-cell *matCellDef="let e">
                <i *ngIf="e.loading" class="fas fa-spinner fa-spin"></i>
                <span *ngIf="!e.loading" style="display: inline-block;">
                    {{employmentTypes[e.employmentType]}}
                </span>
            </mat-cell>
        </ng-container>
    
        <ng-container matColumnDef="suspensionReason">
            <mat-header-cell *matHeaderCellDef translate>
                PAYROLL_SUSPENSION_REASON
            </mat-header-cell>
            <mat-cell *matCellDef="let e">
                <i *ngIf="e.loading" class="fas fa-spinner fa-spin"></i>
                <span *ngIf="!e.loading" style="display: inline-block;">
                    {{suspensionReasons[e.suspensionReason]}}
                </span>
            </mat-cell>
        </ng-container>
    
        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
            *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
</div>

<div class="pagination-container b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
