<div class="b-b-disabled-btn card-title" translate>
    PAYROLL_ACTIVITY_HISTORY
</div>
<div class="table-container">
    <mat-table mat-table [dataSource]="uiSrv.instance.data" class="main-table">

        <ng-container matColumnDef="suspensionDate" style="justify-content: center">
            <mat-header-cell *matHeaderCellDef translate style="justify-content: center; text-align: center;">
                PAYROLL_SUSP_DATE
            </mat-header-cell>
            <mat-cell *matCellDef="let e" style="justify-content: center">
                {{e.suspensionDate}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="hireDate" style="justify-content: center; text-align: center">
            <mat-header-cell *matHeaderCellDef translate style="justify-content: center">
                PAYROLL_HIRE_DATE
            </mat-header-cell>
            <mat-cell *matCellDef="let e" style="justify-content: center">
                {{e.hireDate}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="suspended">
            <mat-header-cell style="justify-content: center" *matHeaderCellDef translate>
                PAYROLL_SUSPENDED
            </mat-header-cell>
            <mat-cell style="justify-content: center" *matCellDef="let e">
                <i *ngIf="e.suspended" class="fas fa-times"></i>
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="employmentType">
            <mat-header-cell *matHeaderCellDef translate>
                PAYROLL_EMPLOYMENT_TYPE
            </mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{uiSrv.instance.employmentTypes[e.employmentType]}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="suspensionReason">
            <mat-header-cell *matHeaderCellDef translate>
                PAYROLL_SUSPENSION_REASON
            </mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{uiSrv.instance.suspensionReasons[e.suspensionReason]}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="inConflict">
            <mat-header-cell style="justify-content: center" *matHeaderCellDef translate>
                PAYROLL_IN_CONFLICT
            </mat-header-cell>
            <mat-cell style="justify-content: center" *matCellDef="let e">
                <i *ngIf="e.inConflict" class="fas fa-times"></i>
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == uiSrv.instance.selected" (click)="uiSrv.instance.select(row.id)"
            *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>

</div>

    <ss-pagination [paginationModel]="uiSrv.instance.pagination"></ss-pagination>
</div-->
