@if (form) {
    <div class="button_div size">
        @if (isEditable) {
            <button mat-mini-fab (click)="save()" color="accent">
                <i class="fas fa-save"></i>
            </button>
        }
        <button mat-mini-fab (click)="cancel()"
                color="warn">
            <i class="fas fa-redo"></i>
        </button>
    </div>
}

<mat-card>
    <mat-card-content>
        @if (form) {
            <form [formGroup]="form" style="min-height: 100%; display: unset">
                <mat-form-field class="default-50 sm-100">
                    <mat-label translate>PAYROLL_HIRE_DATE</mat-label>
                    <ss-date-picker formControlName="hireDate" [required]=true></ss-date-picker>
                </mat-form-field>

                <mat-form-field floatLabel="always" class="default-50 sm-100">
                    <mat-label translate>PAYROLL_EMPLOYMENT_TYPE</mat-label>
                    <mat-select formControlName="employmentType">
                        <mat-option [value]="null"></mat-option>
                        <mat-option *ngFor="let v of employmentTypes | async" [value]="v.id">
                            {{ v.description }}
                        </mat-option>
                    </mat-select>
                </mat-form-field>

                <div class="default-50 sm-100" style="height: 64.8px; line-height: 64.8px;">
                    <mat-checkbox formControlName="suspended" translate>PAYROLL_SUSPENDED</mat-checkbox>
                </div>

                <div class="default-50 sm-100" style="height: 64.8px; line-height: 64.8px;">
                    <mat-checkbox formControlName="inConflict" translate>PAYROLL_IN_CONFLICT</mat-checkbox>
                </div>

                <div class="default-50 sm-100" style="height: 64.8px; line-height: 64.8px;">
                    <mat-checkbox formControlName="dasOut" translate>PAYROLL_DAS_OUT</mat-checkbox>
                </div>

                <div class="default-50 sm-100" style="height: 64.8px; line-height: 64.8px;">
                    <mat-checkbox formControlName="isFinal" translate>PAYROLL_FINAL</mat-checkbox>
                </div>

                <mat-form-field class="default-50 sm-100">
                    <mat-label translate>PAYROLL_SUSP_DATE</mat-label>
                    <ss-date-picker [required]="form.value['suspended']"
                                    formControlName="suspensionDate"></ss-date-picker>
                </mat-form-field>

                <mat-form-field floatLabel="always" class="default-50 sm-100">
                    <mat-label translate>PAYROLL_SUSPENSION_REASON</mat-label>
                    <mat-select formControlName="suspensionReason" [required]="form.value['suspended']">
                        <mat-option [value]="null"></mat-option>
                        <mat-option *ngFor="let v of suspensionReasons | async" [value]="v.id">
                            {{ v.description }}
                        </mat-option>
                    </mat-select>
                </mat-form-field>

            </form>
        }
    </mat-card-content>
</mat-card>
