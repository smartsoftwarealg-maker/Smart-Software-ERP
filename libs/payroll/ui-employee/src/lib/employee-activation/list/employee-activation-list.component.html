<div class="buttons" *ngIf="isEditable">
    <button mat-mini-fab color="primary" (click)="showDetail(0)" [matTooltip]="'COMMON_ADD' | translate">
        <span class="fas fa-plus"></span>
    </button>
    <button mat-mini-fab (click)="edit()"
            [disabled]="!selectedId"
            [matTooltip]="'COMMON_EDIT' | translate"
            color="accent">
        <span class="fas fa-pen"></span>
    </button>
    <button mat-mini-fab (click)="deleteSelected()" [matTooltip]="'COMMON_DELETE' | translate"
            [disabled]="!selectedId"
            color="warn">
        <span class="fas fa-trash-alt"></span>
    </button>
</div>
<div class="table-container">
    <mat-table mat-table [dataSource]="data$ | async" class="main-table">

        <ng-container matColumnDef="suspensionDate" style="justify-content: center">
            <mat-header-cell *matHeaderCellDef translate style="justify-content: center; text-align: center;">
                PAYROLL_SUSP_DATE
            </mat-header-cell>
            <mat-cell *matCellDef="let e" style="justify-content: center">
                {{e.suspensionDate | date: 'dd/MM/yyyy'}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="hireDate" style="justify-content: center; text-align: center">
            <mat-header-cell *matHeaderCellDef translate style="justify-content: center">
                PAYROLL_HIRE_DATE
            </mat-header-cell>
            <mat-cell *matCellDef="let e" style="justify-content: center">
                {{e.hireDate  | date: 'dd/MM/yyyy'}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="suspended">
            <mat-header-cell style="justify-content: center" *matHeaderCellDef translate>
                PAYROLL_SUSPENDED
            </mat-header-cell>
            <mat-cell style="justify-content: center" *matCellDef="let e">
                <i *ngIf="e.suspended" class="fas fa-times"></i>
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="empTypeDescription">
            <mat-header-cell *matHeaderCellDef translate>
                PAYROLL_EMPLOYMENT_TYPE
            </mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.empTypeDescription}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="suspendReasonDescription">
            <mat-header-cell *matHeaderCellDef translate>
                PAYROLL_SUSPENSION_REASON
            </mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.suspendReasonDescription}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="centerName">
            <mat-header-cell *matHeaderCellDef translate>ADMINISTRATION_CENTER</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.centerName}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="inConflict">
            <mat-header-cell style="justify-content: center" *matHeaderCellDef translate>
                PAYROLL_IN_CONFLICT
            </mat-header-cell>
            <mat-cell style="justify-content: center" *matCellDef="let e">
                <i *ngIf="e.inConflict" class="fas fa-times"></i>
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selectedId" (click)="select(row.id)"
            *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>

</div>

<div class="pagination-container b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
