@if (activePersonnel && hrMode && editable) {
  <div class="buttons">
    @if (activePersonnelSrv.val) {
      <button mat-mini-fab color="primary" (click)="showDetail(0)" [matTooltip]="'COMMON_ADD' | translate">
        <span class="fas fa-plus"></span>
      </button>
    }
    <button mat-mini-fab (click)="edit()"
      [disabled]="!selectedId"
      [matTooltip]="'COMMON_EDIT' | translate"
      color="accent">
      <span class="fas fa-pen"></span>
    </button>
    @if (activePersonnelSrv.val) {
      <button mat-mini-fab (click)="deleteSelected()" [matTooltip]="'COMMON_DELETE' | translate"
        [disabled]="!selectedId"
        color="warn">
        <span class="fas fa-trash-alt"></span>
      </button>
    }
  </div>
}

<div class="table-container">
  <mat-table mat-table [dataSource]="data$ | async" class="main-table">

    <ng-container matColumnDef="post">
      <mat-header-cell *matHeaderCellDef translate>
        COMMON_POST
      </mat-header-cell>
      <mat-cell *matCellDef="let e">
        {{ e.post }}
      </mat-cell>
    </ng-container>

    <ng-container matColumnDef="rate" style="justify-content: center; text-align: center">
      <mat-header-cell *matHeaderCellDef translate style="justify-content: center">
        COMMON_RATE
      </mat-header-cell>
      <mat-cell *matCellDef="let e" style="justify-content: center">
        {{ e.rate }}
      </mat-cell>
    </ng-container>

    <ng-container matColumnDef="from_date" style="justify-content: center; text-align: center">
      <mat-header-cell *matHeaderCellDef translate style="justify-content: center">
        PAYROLL_FROM
      </mat-header-cell>
      <mat-cell *matCellDef="let e" style="justify-content: center">
        {{ e.from_date | date: 'dd/MM/yyyy' }}
      </mat-cell>
    </ng-container>

    <ng-container matColumnDef="to_date" style="justify-content: center; text-align: center">
      <mat-header-cell *matHeaderCellDef translate style="justify-content: center">
        PAYROLL_TO
      </mat-header-cell>
      <mat-cell *matCellDef="let e" style="justify-content: center">
        {{ e.to_date | date: 'dd/MM/yyyy' }}
      </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
    <mat-row class="selectable" [class.selected]="row.id == selectedId" (click)="select(row.id)"
    *matRowDef="let row; columns: displayedColumns;"></mat-row>
  </mat-table>

</div>

<div class="pagination-container b-b-background">
  <ss-pagination [paginationModel]="paginator"></ss-pagination>
</div>
