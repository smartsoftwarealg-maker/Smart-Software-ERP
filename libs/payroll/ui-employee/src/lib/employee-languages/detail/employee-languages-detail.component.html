@defer (when form) {
    <div class="button_div size">
        <button mat-mini-fab (click)="save()"
                color="accent" *ngIf="isEditable">
            <i class="fas fa-save"></i>
        </button>
        <button mat-mini-fab (click)="cancel()"
                color="warn">
            <i class="fas fa-redo"></i>
        </button>
    </div>
}
<mat-card class="form-container">
    <form *ngIf="form" novalidate [formGroup]="form" style="min-height: 100%; display: unset">

        <mat-form-field floatLabel="always" class="default-100">
            <mat-label translate>PAYROLL_LANGUAGE</mat-label>
            <mat-select formControlName="languageId" required>
                <mat-option *ngFor="let v of languages" [value]="v.id">
                    {{ v.description }}
                </mat-option>
            </mat-select>
        </mat-form-field>

        <mat-form-field floatLabel="always" class="default-100">
            <mat-label translate>PAYROLL_LANGUAGE_READ_LEVEL</mat-label>
            <mat-select formControlName="readLevel" required>
                <mat-option *ngFor="let v of languageLevels" [value]="v.id">
                    {{ v.description }}
                </mat-option>
            </mat-select>
        </mat-form-field>

        <mat-form-field floatLabel="always" class="default-100">
            <mat-label translate>PAYROLL_LANGUAGE_WRITE_LEVEL</mat-label>
            <mat-select formControlName="writeLevel" required>
                <mat-option *ngFor="let v of languageLevels" [value]="v.id">
                    {{ v.description }}
                </mat-option>
            </mat-select>
        </mat-form-field>

    </form>
</mat-card>
