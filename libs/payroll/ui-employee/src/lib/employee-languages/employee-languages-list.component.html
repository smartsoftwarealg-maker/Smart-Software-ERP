<div class="buttons" *ngIf="activePersonnel && editable">
    <button mat-mini-fab color="primary" (click)="showDetail(0)">
        <span class="fas fa-plus"></span>
    </button>
    <button mat-mini-fab (click)="edit()"
            [disabled]="!selected"
            color="accent">
        <span class="fas fa-pen"></span>
    </button>
    <button mat-mini-fab (click)="deleteSelected()"
            [disabled]="!selected"
            color="warn">
        <span class="fas fa-trash-alt"></span>
    </button>
</div>

<div class="table-container">
    <mat-table mat-table [dataSource]="data" class="main-table">

        <ng-container matColumnDef="language_id">
            <mat-header-cell *matHeaderCellDef translate>
                PAYROLL_LANGUAGE
            </mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{languages[e.language_id]}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="read_level">
            <mat-header-cell *matHeaderCellDef translate>
                PAYROLL_LANGUAGE_READ_LEVEL
            </mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{languageLevels[e.read_level]}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="write_level">
            <mat-header-cell *matHeaderCellDef translate>
                PAYROLL_LANGUAGE_WRITE_LEVEL
            </mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{languageLevels[e.write_level]}}
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
            *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>

</div>

<div class="pagination-container b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
