
<div class="main-table-scroll">
    <mat-table mat-table [dataSource]="data" class="main-table">

        <ng-container matColumnDef="photo">
            <mat-header-cell *matHeaderCellDef style="justify-content: center" translate>PAYROLL_PHOTO</mat-header-cell>
            <mat-cell *matCellDef="let e">
                <div class="person-photo">
                    <!--ng-container *ngIf="e.photoUrl == 'loading'; else personPhoto">
                        <i class="fas fa-spinner fa-spin"></i>
                    </ng-container-->
                    <!--ng-template #personPhoto>
                        <img [src]="e.photoSafeUrl">
                    </ng-template-->
                    <ss-image-input width="60px" height="76px" [ImageModel]="e.imageModel" style="display: inline-block;">
                    </ss-image-input>
                    <i *ngIf="e.sex == 1" style="color: #00AAAA" class="abs-end-0 gender-icon fas fa-mars"></i>
                    <i *ngIf="e.sex == 2" style="color: #ff69b4" class="abs-end-0 gender-icon fas fa-venus"></i>
                </div>
            </mat-cell>
        </ng-container>
    
        <ng-container matColumnDef="id">
            <mat-header-cell *matHeaderCellDef translate>PAYROLL_ID</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.id}}
            </mat-cell>
        </ng-container>
    
        <ng-container matColumnDef="fullname">
            <mat-header-cell *matHeaderCellDef translate>PAYROLL_FULLNAME</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.fullName}}
            </mat-cell>
        </ng-container>
    
        <ng-container matColumnDef="birth">
            <mat-header-cell *matHeaderCellDef translate>PAYROLL_BIRTHINFO</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.birthDate}}
                <br>
                {{e.birthPlace}}
            </mat-cell>
        </ng-container>
    
        <ng-container matColumnDef="address">
            <mat-header-cell *matHeaderCellDef translate>PAYROLL_ADDRESS</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.address1}}
            </mat-cell>
        </ng-container>
    
        <ng-container matColumnDef="maritalStatus">
            <mat-header-cell *matHeaderCellDef translate>COMMON_MARITAL_STATUS</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{maritalStatus[e.maritalStatus]}}
            </mat-cell>
        </ng-container>
    
        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)" *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
</div>

<div class="pagination-container b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
