<div class="buttons" *ngIf="editable">
    <button mat-mini-fab color="primary" (click)="showDetail(0)" [matTooltip]="'COMMON_ADD' | translate">
        <span class="fas fa-plus"></span>
    </button>
    <button mat-mini-fab (click)="edit()"
            [disabled]="!selectedId"
            [matTooltip]="'COMMON_EDIT' | translate"
            color="accent">
        <span class="fas fa-pen"></span>
    </button>
    <button mat-mini-fab (click)="deleteSelected()" [matTooltip]="'COMMON_DELETE' | translate"
            [disabled]="!selectedId"
            color="warn">
        <span class="fas fa-trash-alt"></span>
    </button>
</div>

<div class="table-container">
    <mat-table mat-table [dataSource]="data$ | async" class="main-table">

        <ng-container matColumnDef="dec_reference">
            <mat-header-cell *matHeaderCellDef translate>
                PAYROLL_REFERENCE
            </mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.dec_reference}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="dec_date" style="justify-content: center; text-align: center">
            <mat-header-cell *matHeaderCellDef translate style="justify-content: center">
                PAYROLL_DATE
            </mat-header-cell>
            <mat-cell *matCellDef="let e" style="justify-content: center">
                {{e.dec_date}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="application_date" style="justify-content: center; text-align: center">
            <mat-header-cell *matHeaderCellDef translate style="justify-content: center">
                PAYROLL_APPLICATION_DATE
            </mat-header-cell>
            <mat-cell *matCellDef="let e" style="justify-content: center">
                {{e.application_date}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="motiveName">
            <mat-header-cell *matHeaderCellDef translate>
                COMMON_MOTIVE
            </mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.motiveName}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="application_period">
            <mat-header-cell *matHeaderCellDef translate>
                PAYROLL_APPLICATION_PERIOD
            </mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.application_period}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="dec_header">
            <mat-header-cell *matHeaderCellDef translate>
                COMMON_MEMO
            </mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.dec_header}}
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selectedId" (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>

</div>

<div class="pagination-container b-b-background">
    <ss-pagination [paginationModel]="paginator"></ss-pagination>
</div>
