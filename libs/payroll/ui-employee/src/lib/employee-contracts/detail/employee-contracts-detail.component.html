<div class="button_div size" *ngIf="form">
    <button mat-mini-fab (click)="save()"
            color="accent" *ngIf="isEditable">
        <i class="fas fa-save"></i>
    </button>
    <button mat-mini-fab (click)="cancel()"
            color="warn">
        <i class="fas fa-redo"></i>
    </button>
</div>

<mat-card class="form__div">
    <mat-card-content>
        <form *ngIf="form" novalidate [formGroup]="form" style="min-height: 100%; display: unset">

            <mat-form-field floatLabel="always" class="default-50 sm-100">
                <mat-label translate>COMMON_NUMBER</mat-label>
                <input matInput required [maxLength]="20" formControlName="number">
            </mat-form-field>

            <mat-form-field floatLabel="always" class="default-50 sm-100">
                <mat-label translate>COMMON_REFERENCE</mat-label>
                <input matInput [maxLength]="20" formControlName="recordNumber" required>
            </mat-form-field>

            <mat-form-field floatLabel="always" class="default-50 sm-100">
                <mat-label translate>PAYROLL_DATE</mat-label>
                <ss-date-picker formControlName="date"></ss-date-picker>
            </mat-form-field>

            <!--mat-form-field floatLabel="always" class="default-50 sm-100">
                <mat-label translate>PAYROLL_CONTRACT_INFO</mat-label>
                <input matInput [maxLength]="48" formControlName="info">
            </mat-form-field-->

            <mat-form-field floatLabel="always" class="default-50 sm-100">
                <mat-label translate>PAYROLL_FROM</mat-label>
                <ss-date-picker [required]=true formControlName="fromdate"></ss-date-picker>
                <mat-error *ngIf="form.controls['fromdate'].hasError('required')" translate>
                    COMMON_FIELD_REQUIRED
                </mat-error>
            </mat-form-field>

            <mat-form-field floatLabel="always" class="default-50 sm-100">
                <mat-label translate>PAYROLL_TO</mat-label>
                <ss-date-picker [required]=true formControlName="todate"></ss-date-picker>
            </mat-form-field>

            <mat-form-field floatLabel="always" class="default-50 sm-100">
                <mat-label translate>PAYROLL_VALID_DATE</mat-label>
                <ss-date-picker formControlName="valid_date"></ss-date-picker>
            </mat-form-field>

            <mat-form-field floatLabel="always" class="default-50 sm-100">
                <mat-label translate>PAYROLL_POST</mat-label>
                <ss-auto-complete matInput
                                  formControlName="post"
                                  [model]="postLookup">
                </ss-auto-complete>
            </mat-form-field>


            <mat-form-field floatLabel="always" class="default-50 sm-100">
                <mat-label translate>PAYROLL_DIVISION</mat-label>
                <ss-auto-complete matInput
                                  formControlName="division"
                                  [model]="divisionLookup">
                </ss-auto-complete>
            </mat-form-field>

            <mat-form-field floatLabel="always" class="default-50 sm-100">
                <mat-label translate>PAYROLL_DEPARTMENT</mat-label>
                <ss-auto-complete matInput
                                  formControlName="department"
                                  [model]="departmentLookup">
                </ss-auto-complete>
            </mat-form-field>

            <mat-form-field floatLabel="always" class="default-50 sm-100">
                <mat-label translate>PAYROLL_SERVICE</mat-label>
                <ss-auto-complete matInput
                                  formControlName="service"
                                  [model]="serviceLookup">
                </ss-auto-complete>
            </mat-form-field>

            <mat-form-field floatLabel="always" class="default-25 sm-50">
                <mat-label translate>PAYROLL_BASE_SALARY</mat-label>
                <input matInput formControlName="basesalary" type="number" style="text-align: end;">
            </mat-form-field>

            <mat-form-field floatLabel="always" class="default-25 sm-50">
                <mat-label translate>PAYROLL_SALARY_RANK</mat-label>
                <input matInput formControlName="salary_rank" type="number" style="text-align: end;">
            </mat-form-field>

            <mat-form-field floatLabel="always" class="default-25 sm-50">
                <mat-label translate>PAYROLL_SALARY_GRID</mat-label>
                <ss-auto-complete matInput
                                  formControlName="salarygrid"
                                  [model]="gridLookup">
                </ss-auto-complete>
            </mat-form-field>

            <mat-form-field floatLabel="always" class="default-25 sm-50">
                <mat-label translate>PAYROLL_TRIAL_PERIOD</mat-label>
                <input matInput formControlName="trial_period" type="number" style="text-align: end;">
            </mat-form-field>

            <mat-form-field floatLabel="always" class="default-50 sm-100">
                <mat-label translate>COMMON_MOTIVE</mat-label>
                <ss-auto-complete matInput
                                  formControlName="info"
                                  [model]="motiveLookup">
                </ss-auto-complete>
            </mat-form-field>


            <mat-form-field floatLabel="always" class="default-50 sm-100">
                <mat-label translate>PAYROLL_NOTES</mat-label>
                <input matInput [maxLength]="96" formControlName="notes">
            </mat-form-field>
        </form>
    </mat-card-content>
</mat-card>
