<div class="form-container">
    <form *ngIf="form" novalidate [formGroup]="form" style="min-height: 100%; display: unset">
        <mat-form-field class="default-50 sm-100">
            <mat-label translate>PAYROLL_DIPLOMAS</mat-label>
            <ss-auto-complete matInput
                              [required]="true"
                              [model]="diplomaAutoCompleteModel"
                              formControlName="diploma"></ss-auto-complete>
            <mat-error *ngIf="form.controls['diploma'].invalid" translate>COMMON_FIELD_REQUIRED</mat-error>
        </mat-form-field>

        <mat-form-field class="default-50 sm-100">
            <mat-label translate>PAYROLL_DIPLOMA_SUBJECT</mat-label>
            <ss-auto-complete matInput
                              [required]="true"
                              [model]="subjectAutoCompleteModel"
                              formControlName="subject"></ss-auto-complete>
            <mat-error *ngIf="form.controls['subject'].invalid" translate>COMMON_FIELD_REQUIRED</mat-error>
        </mat-form-field>

        <mat-form-field class="default-25 sm-100">
            <mat-label translate>PAYROLL_FROM</mat-label>
            <ss-date-picker required="true" formControlName="from_date"></ss-date-picker>
            <mat-error *ngIf="form.controls.from_date.hasError('required')" translate>
                COMMON_FIELD_REQUIRED
            </mat-error>
        </mat-form-field>

        <div class="filler default-25"></div>
        <mat-form-field class="default-25 sm-100">
            <mat-label translate>PAYROLL_TO</mat-label>
            <ss-date-picker required="true" formControlName="to_date"></ss-date-picker>
            <mat-error *ngIf="form.controls.to_date.hasError('required')" translate>
                COMMON_FIELD_REQUIRED
            </mat-error>
        </mat-form-field>
        <div class="filler default-25"></div>

        <mat-form-field class="default-50 sm-100">
            <mat-label translate>PAYROLL_TRN_PROVIDER</mat-label>
            <ss-auto-complete matInput
                              [model]="supplierAutoCompleteModel"
                              formControlName="agent"></ss-auto-complete>
        </mat-form-field>

        <mat-form-field class="default-50 sm-100">
            <mat-label translate>PAYROLL_EDUCATION_LEVEL</mat-label>
            <ss-auto-complete matInput
                              [model]="educationLevelAutoCompleteModel"
                              formControlName="education_level"></ss-auto-complete>
        </mat-form-field>

        <mat-form-field floatLabel="always" class="default-50 sm-100">
            <mat-label translate>COMMON_MEMO</mat-label>
            <input matInput [maxLength]="64" formControlName="memo">
        </mat-form-field>

        <mat-form-field floatLabel="always" class="default-50 sm-100">
            <mat-label translate>PAYROLL_INSTITUTION</mat-label>
            <input matInput [maxLength]="64" formControlName="institution">
        </mat-form-field>

    </form>

</div>
