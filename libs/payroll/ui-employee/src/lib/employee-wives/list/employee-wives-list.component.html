<div class="buttons">
    @if ((rights?.write||false) && activePersonnelSrv.val) {
        <button mat-mini-fab color="primary"
                (click)="showDetail(0)"
                [matTooltip]="'COMMON_ADD' | translate">
            <span class="fas fa-plus"></span>
        </button>
    }
    <button mat-mini-fab (click)="edit()"
            [disabled]="!selectedId"
            color="accent"
            [matTooltip]="'COMMON_EDIT' | translate">
        <span class="fas fa-pen"></span>
    </button>
    @if (rights?.delete && activePersonnelSrv.val) {
        <button mat-mini-fab (click)="deleteSelected()"
                [disabled]="!selectedId || !rights?.delete"
                [matTooltip]="'COMMON_DELETE' | translate"
                color="warn">
            <span class="fas fa-trash-alt"></span>
        </button>
    }
</div>

<div class="table-container">
    <mat-table mat-table [dataSource]="data$ | async " class="main-table">

        <ng-container matColumnDef="birthdate">
            <mat-header-cell *matHeaderCellDef translate style="justify-content: center">
                PAYROLL_BIRTH_DATE
            </mat-header-cell>
            <mat-cell *matCellDef="let e" style="justify-content: center">
                {{e.birthdate}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="name">
            <mat-header-cell *matHeaderCellDef translate style="justify-content: center">
                PAYROLL_NAME
            </mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.name}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="birthPlace">
            <mat-header-cell *matHeaderCellDef translate style="justify-content: center">
                PAYROLL_BIRTH_PLACE
            </mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.birthPlace}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="father">
            <mat-header-cell *matHeaderCellDef translate style="justify-content: center">
                PAYROLL_FATHER
            </mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.father}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="mother">
            <mat-header-cell *matHeaderCellDef translate style="justify-content: center">
                PAYROLL_MOTHER
            </mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.mother}}
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selectedId" (click)="select(row.id)"
            *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>

</div>

<div class="pagination-container b-b-background">
    <ss-pagination [paginationModel]="paginator"></ss-pagination>
</div>
