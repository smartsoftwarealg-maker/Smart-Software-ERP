@if (form) {
    <div class="button_div size">
        @if (isEditable) {
            <button mat-mini-fab (click)="save()"
                    color="accent">
                <i class="fas fa-save"></i>
            </button>
        }
        <button mat-mini-fab (click)="cancel()"
                color="warn">
            <i class="fas fa-redo"></i>
        </button>
    </div>

    <mat-card class="form-container">
        <mat-card-content>
            <form novalidate [formGroup]="form" style="min-height: 100%; display: unset">

                <mat-form-field floatLabel="always" class="default-50 sm-100">
                    <mat-label translate>COMMON_REFERENCE</mat-label>
                    <input matInput formControlName="reference">
                </mat-form-field>

                <mat-form-field floatLabel="always" class="default-50 sm-100">
                    <mat-label translate>PAYROLL_ISSUE_DATE</mat-label>
                    <ss-date-picker formControlName="issueDate"></ss-date-picker>
                </mat-form-field>

                <mat-form-field floatLabel="always" class="default-50 sm-100">
                    <mat-label translate>PAYROLL_INVITATION_DATE</mat-label>
                    <ss-date-picker formControlName="invitationDate"></ss-date-picker>
                </mat-form-field>

                <mat-form-field floatLabel="always" class="default-50 sm-100">
                    <mat-label translate>PAYROLL_INVITATION_HOUR</mat-label>
                    <input matInput type="number" formControlName="invitationHour">
                </mat-form-field>

                <mat-form-field floatLabel="always" class="default-50 sm-100">
                    <mat-label translate>COMMON_SUBJECT</mat-label>
                    <input matInput formControlName="subject">
                </mat-form-field>

            </form>
        </mat-card-content>
    </mat-card>
}
