<mat-card>
  <mat-card-content>
    @if (form !== null) {
      <form [formGroup]="form">
        <mat-form-field id="code" class="default-100">
          <mat-label translate>COMMON_DESCRIPTION</mat-label>
          <input matInput formControlName="description" type="text" autofocus maxlength="50">
          @if (form.controls['description'].invalid) {
            <mat-error translate>COMMON_DESCRIPTION
            </mat-error>
          }
        </mat-form-field>

        <mat-form-field class="default-100">
          <mat-label translate>COMMON_ACCOUNTNO</mat-label>
          <input matInput formControlName="accountNo" type="text" required>
          @if (form.controls['accountNo'].invalid) {
            <mat-error translate>COMMON_ACCOUNTNO
            </mat-error>
          }
        </mat-form-field>

      </form>
    }
  </mat-card-content>
</mat-card>
