<mat-card>
    <mat-card-content>
        @if (form !== null) {
        <form [formGroup]="form">
            <mat-form-field id="code" class="default-50 sm-100">
                <mat-label translate>COMMON_DESCRIPTION</mat-label>
                <input matInput formControlName="description" type="text" autofocus maxlength="4">
                <mat-error *ngIf="form.controls['description'].invalid" translate>COMMON_DESCRIPTION
                </mat-error>
            </mat-form-field>

            <mat-form-field class="default-50 sm-100">
                <mat-label translate>COMMON_ACCOUNTNO</mat-label>
                <input matInput formControlName="accountNo" type="text" required>
                <mat-error *ngIf="form.controls['accountNo'].invalid" translate>COMMON_ACCOUNTNO
                </mat-error>
            </mat-form-field>

        </form>
        }
    </mat-card-content>
</mat-card>
