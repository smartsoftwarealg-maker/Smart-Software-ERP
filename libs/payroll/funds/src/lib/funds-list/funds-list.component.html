<div class="container_div">
    <mat-table mat-table [dataSource]="data" class="content-div" matSort (matSortChange)="sort($event)" >

        <ng-container matColumnDef="description">
            <mat-header-cell *matHeaderCellDef  mat-sort-header translate>COMMON_DESCRIPTION</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.description }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="accountNo">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_ACCOUNTNO</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.accountNo }}
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
</div>
