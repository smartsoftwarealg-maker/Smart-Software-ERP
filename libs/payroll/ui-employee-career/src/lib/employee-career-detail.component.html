<div class="b-b-disabled-btn card-title" translate>
    PAYROLL_EMPLOYEE_CAREER_DETAIL
</div>
<div style="height: 16px"></div>

<div class="form-container">
    <form *ngIf="form" novalidate [formGroup]="form" style="min-height: 100%; display: unset">

        <mat-form-field class="default-50 sm-100">
            <mat-label translate>PAYROLL_FROM</mat-label>
            <ss-date-picker required="true" formControlName="from_date"></ss-date-picker>
            <mat-error *ngIf="form.controls.from_date.hasError('required')" translate>
                COMMON_FIELD_REQUIRED
            </mat-error>
        </mat-form-field>

        <mat-form-field floatLabel="always" class="default-50 sm-100">
            <mat-label translate>PAYROLL_POST</mat-label>
            <mat-select formControlName="post">
                <mat-option *ngFor="let v of posts" [value]="v.id">
                    {{v.description}}
                </mat-option>
            </mat-select>
        </mat-form-field>

    </form>
</div>

<div style="height: 16px"></div>
