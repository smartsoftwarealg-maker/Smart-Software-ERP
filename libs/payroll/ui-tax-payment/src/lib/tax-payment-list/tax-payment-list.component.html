<div class="container size">
    <div class="header-div b-b-app-bar">
        <mat-form-field class="default-50 sm-100">
            <mat-label translate>COMMON_YEAR</mat-label>
            <input matInput [formControl]="yearCtrl" type="number">
        </mat-form-field>
    </div>
    <mat-table mat-table [dataSource]="data" class="main-table" matSort (matSortChange)="sort($event)">
<!--        <ng-container matColumnDef="month">-->
<!--            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_MONTH</mat-header-cell>-->
<!--            <mat-cell *matCellDef="let e" translate>-->
<!--                {{ e.month }}-->
<!--            </mat-cell>-->
<!--        </ng-container>-->

        <ng-container matColumnDef="date">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_DATE</mat-header-cell>
            <mat-cell *matCellDef="let e" translate>
                {{ e.date }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="base">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>REMUN_BASE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.base }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="irg">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>REMUN_IRG</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.irg }}
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
</div>
<div class="size b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
