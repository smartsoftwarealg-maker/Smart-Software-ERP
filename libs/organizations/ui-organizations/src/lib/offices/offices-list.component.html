<div class="main-container">

    <div class="table-container">
        <mat-table mat-table [dataSource]="data" class="main-table">

            <ng-container matColumnDef="description">
                <mat-header-cell *matHeaderCellDef translate>DESCRIPTION</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{e.description}}
                </mat-cell>
            </ng-container>


            <ng-container matColumnDef="blockNo">
                <mat-header-cell *matHeaderCellDef translate>ASSET_BLOCK_NO</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{ e.blockNo }}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="floorNo">
                <mat-header-cell *matHeaderCellDef translate>ASSET_FLOOR_NO</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{ e.floorNo }}
                </mat-cell>
            </ng-container>

            <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
            <mat-row class="selectable" [class.selected]="row.id == selected" (click)="selectRow(row)"
                     *matRowDef="let row; columns: displayedColumns;"></mat-row>

        </mat-table>
    </div>
    <div class="pagination-container b-b-background">
        <ss-pagination [paginationModel]="pagination"></ss-pagination>
    </div>

</div>
