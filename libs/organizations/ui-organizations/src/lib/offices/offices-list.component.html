<div class="table-container size">
    <mat-table mat-table [dataSource]="data" class="main-table" matSort (matSortChange)="sort($event)" >

        <ng-container matColumnDef="description">
            <mat-header-cell *matHeaderCellDef  mat-sort-header translate>COMMON_DESCRIPTION</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.description}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="locationDescription">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_LOCATION</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.locationDescription}}
            </mat-cell>
        </ng-container>


        <ng-container matColumnDef="code">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>ADMINISTRATION_CODE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.code }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="floorNo">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>ASSET_FLOOR_NO</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.floorNo }}
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selected" (click)="selectRow(row)"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>

    </mat-table>
</div>
<div class="size b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
