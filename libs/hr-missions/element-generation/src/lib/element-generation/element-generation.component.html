<div class="main-table">
    @if (loaded()) {
        <mat-table mat-table [dataSource]="data">

            <ng-container matColumnDef="checkBox">
                <mat-header-cell *matHeaderCellDef></mat-header-cell>
                <mat-cell *matCellDef="let e">
                    <mat-checkbox [checked]="selected.includes(e.number)"
                                  (change)="selectId($event.checked, e.number)">
                    </mat-checkbox>
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="number">
                <mat-header-cell *matHeaderCellDef translate>COMMON_NUMBER</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{ e.number }}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="lastName">
                <mat-header-cell *matHeaderCellDef translate>COMMON_LAST_NAME</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{ e.lastName }}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="firstName">
                <mat-header-cell *matHeaderCellDef translate>COMMON_FIRST_NAME</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{ e.firstName }}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="route">
                <mat-header-cell *matHeaderCellDef translate>MISSION_ROUTE_COUNT</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{ e.route }}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="period">
                <mat-header-cell *matHeaderCellDef translate>COMMON_PERIOD</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{ e.period }}
                </mat-cell>
            </ng-container>

            <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
            <mat-row class="selectable" *matRowDef="let row; columns: displayedColumns;"></mat-row>
        </mat-table>
    }
    <div class="ctrl-div">
        <button mat-raised-button (click)="refresh()" translate>COMMON_REFRESH</button>
        <button mat-raised-button (click)="save()" translate>COMMON_GENERATE</button>
    </div>
</div>
