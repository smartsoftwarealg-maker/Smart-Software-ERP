<mat-card>
    <mat-card-header>
        <div class="ctrl_div default-100">
            <button mat-mini-fab color="primary"
                    [matTooltip]="'COMMON_SAVE' | translate"
                    (click)="save()"
                    [disabled]="!form?.valid">
                <i class="fas fa-save"></i>
            </button>
            <button mat-mini-fab
                    color="warn"
                    [matTooltip]="'COMMON_CANCEL' | translate"
                    translate (click)="cancel()">
                <i class="fas fa-redo"></i>
            </button>
        </div>
    </mat-card-header>
    @if (form !== null) {
        <mat-card-content>
            <form [formGroup]="form">
                <mat-form-field class="default-50 sm-100">
                    <mat-label translate>COMMON_FROM</mat-label>
                    <ss-date-picker formControlName="fromDate" type="datetime"></ss-date-picker>
                </mat-form-field>
                <mat-form-field class="default-50 sm-100">
                    <mat-label translate>COMMON_TO</mat-label>
                    <ss-date-picker formControlName="toDate" type="datetime"></ss-date-picker>
                </mat-form-field>
                <mat-form-field class="default-50 sm-100">
                    <mat-label translate>MISSION_ROUTE_COUNT</mat-label>
                    <input matInput formControlName="routeCount" type="number">
                </mat-form-field>
                <div class="default-50 sm-100">
                    <mat-checkbox formControlName="exclMeal" translate>MISSION_EXCL_MEAL</mat-checkbox>
                </div>
            </form>
        </mat-card-content>
    }
</mat-card>
