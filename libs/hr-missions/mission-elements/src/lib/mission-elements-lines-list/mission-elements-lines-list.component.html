<div class="main-container">
    <div class="ctrl-div">
        @if (isEditable) {
            <button mat-mini-fab color="primary" (click)="showDetail(0)" [matTooltip]="'COMMON_ADD' | translate">
                <span class="fas fa-plus"></span>
            </button>
        }
        <button mat-mini-fab (click)="edit()"
                [matTooltip]="'COMMON_EDIT' | translate"
                [disabled]="!selectedId"
                color="accent">
            <span class="fas fa-pen"></span>
        </button>
        @if (isEditable) {
            <button mat-mini-fab (click)="deleteSelected()" [matTooltip]="'COMMON_DELETE' | translate"
                    [disabled]="!selectedId"
                    color="warn">
                <span class="fas fa-trash-alt"></span>
            </button>
        }
    </div>

    <div class="main-table">
        <mat-table mat-table [dataSource]="data$">
            <ng-container matColumnDef="zoneDescription">
                <mat-header-cell *matHeaderCellDef translate>COMMON_ZONE_DESCRIPTION</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{ e.zoneDescription }}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="categoryDescription">
                <mat-header-cell *matHeaderCellDef translate>COMMON_CATEGORY_DESCRIPTION</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{ e.categoryDescription }}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="amount">
                <mat-header-cell *matHeaderCellDef translate>COMMON_AMOUNT</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{ e.amount | number }}
                </mat-cell>
            </ng-container>

            <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
            <mat-row class="selectable" [class.selected]="row.id === selectedId" (click)="select(row.id)"
                     *matRowDef="let row; columns: displayedColumns;"></mat-row>
        </mat-table>
    </div>

    <div class="pagination-container b-b-background">
        <ss-pagination [paginationModel]="paginator"></ss-pagination>
    </div>

</div>
