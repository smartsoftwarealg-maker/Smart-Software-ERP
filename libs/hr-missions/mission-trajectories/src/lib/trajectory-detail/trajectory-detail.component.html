<mat-card>
  <mat-card-content>
    @if (form !== null) {
      <form novalidate [formGroup]="form">
        <mat-form-field id="description" class="default-100">
          <mat-label translate>MISSION_DESTINATION</mat-label>
          <input matInput formControlName="description" type="text" required>
          @if (form.controls['description'].invalid) {
            <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
          }
        </mat-form-field>
        <mat-form-field class="sm-25">
          <mat-label translate>MISSION_DISTANCE</mat-label>
          <input matInput formControlName="distance" type="number" autofocus>
          @if (form.controls['distance'].invalid) {
            <mat-error translate>COMMON_FIELD_MAX_LENGTH</mat-error>
          }
        </mat-form-field>
      </form>
    }

  </mat-card-content>
</mat-card>
