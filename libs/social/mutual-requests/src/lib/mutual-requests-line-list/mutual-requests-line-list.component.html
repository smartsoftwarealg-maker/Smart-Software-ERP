<div class="content__div button__div">
    <!--    <mat-form-field>-->
    <!--        <mat-label translate>COMMON_SEARCH</mat-label>-->
    <!--        <input matInput [formControl]="searchText" type="text">-->
    <!--    </mat-form-field>-->

    <button mat-mini-fab color="primary" (click)="showDetail(0)" [matTooltip]="'COMMON_ADD' | translate">
        <span class="fas fa-plus"></span>
    </button>
    <button mat-mini-fab (click)="edit()"
            [disabled]="!selectedId"
            [matTooltip]="'COMMON_EDIT' | translate"
            color="accent">
        <span class="fas fa-pen"></span>
    </button>
    <button mat-mini-fab (click)="deleteSelected()" [matTooltip]="'COMMON_DELETE' | translate"
            [disabled]="!selectedId"
            color="warn">
        <span class="fas fa-trash-alt"></span>
    </button>
</div>

<div class="content__div table__container">
    <mat-table mat-table [dataSource]="data$|async" class="main-table">
        <ng-container matColumnDef="date">
            <mat-header-cell *matHeaderCellDef translate>COMMON_DATE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.date | date: 'dd/MM/yyyy' }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="number">
            <mat-header-cell *matHeaderCellDef translate>COMMON_NUMBER</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.number}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="mutualNo">
            <mat-header-cell *matHeaderCellDef translate>PAYROLL_MUTUAL_NUMBER</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.mutualNo}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="folderCount">
            <mat-header-cell *matHeaderCellDef translate>SOCIAL_FOLDER_COUNT</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.folderCount}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="firstName">
            <mat-header-cell *matHeaderCellDef translate>COMMON_FIRST_NAME</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.firstName}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="lastName">
            <mat-header-cell *matHeaderCellDef translate>COMMON_LAST_NAME</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.lastName}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="rejectionDescription">
            <mat-header-cell *matHeaderCellDef translate>SOCIAL_MUTUAL_REJECTION</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.rejectionDescription}}
            </mat-cell>
        </ng-container>



        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selectedId" (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
</div>

<div class="pagination-container b-b-background content__div">
    <ss-pagination [paginationModel]="paginator"></ss-pagination>
</div>
