@if (form !== null) {
    <div class="size button_div size">
        <button mat-mini-fab (click)="save()"
                color="primary" *ngIf="isEditable">
            <i class="fas fa-save"></i>
        </button>
        <button mat-mini-fab (click)="cancel()"
                color="warn">
            <i class="fas fa-redo"></i>
        </button>
    </div>
}

<mat-card class="size">
    <mat-card-header>
    </mat-card-header>
    <mat-card-content>
        @if (form !== null) {
            <form novalidate [formGroup]="form">

                <mat-form-field class="default-100">
                    <mat-label translate>PAYROLL_EMPLOYEE</mat-label>
                    <ss-auto-complete matInput
                                      [model]="personLookup"
                                      formControlName="employeeId">
                    </ss-auto-complete>
                </mat-form-field>

                <mat-form-field class="default-100">
                    <mat-label translate>SOCIAL_FOLDER_COUNT</mat-label>
                    <input matInput formControlName="folderCount" type="number">
                </mat-form-field>

                <mat-form-field class="default-100">
                    <mat-label translate>SOCIAL_MUTUAL_TYPE</mat-label>
                    <ss-auto-complete matInput
                                      [model]="mutualTypeLookup"
                                      formControlName="mutualType">
                    </ss-auto-complete>
                </mat-form-field>

                <mat-form-field class="default-100">
                    <mat-label translate>SOCIAL_MUTUAL_REJECTION</mat-label>
                    <ss-auto-complete matInput
                                      [model]="rejectionLookup"
                                      formControlName="rejectionId">
                    </ss-auto-complete>
                </mat-form-field>
            </form>
        }
    </mat-card-content>
</mat-card>
