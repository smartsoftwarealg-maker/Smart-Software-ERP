@defer (when form) {
    <mat-card class="mat__card__900">
        <mat-card-content>
            <form [formGroup]="form">

                <mat-form-field class="default-50 sm-100">
                    <mat-label translate>COMMON_DATE</mat-label>
                    <ss-date-picker formControlName="date"></ss-date-picker>
                </mat-form-field>

                <mat-form-field class="default-50 sm-100">
                    <mat-label translate>COMMON_NUMBER</mat-label>
                    <input matInput formControlName="number" type="number" readonly>
                </mat-form-field>

                <mat-form-field class="default-50 sm-100">
                    <mat-label translate>PAYROLL_EMPLOYEE</mat-label>
                    <ss-auto-complete matInput
                                      [model]="employeeLookup"
                                      formControlName="personId">
                    </ss-auto-complete>
                    <mat-error *ngIf="form.controls['personId'].invalid" translate>COMMON_FIELD_REQUIRED</mat-error>
                </mat-form-field>

                <mat-form-field class="default-50 sm-100">
                    <mat-label translate>COMMON_TYPE</mat-label>
                    <ss-auto-complete matInput
                                      [model]="medicalAidTypeLookup"
                                      formControlName="medicalAidType">
                    </ss-auto-complete>
                    <mat-error *ngIf="form.controls['personId'].invalid" translate>COMMON_FIELD_REQUIRED</mat-error>
                </mat-form-field>

                <mat-form-field class="default-50 sm-100">
                    <mat-label translate>SOCIAL_REFERENCE_AMOUNT</mat-label>
                    <input matInput formControlName="referenceAmount" type="number" required step="0.01" class="number">
                </mat-form-field>

                <mat-form-field class="default-50 sm-100">
                    <mat-label translate>COMMON_RATE</mat-label>
                    <input matInput formControlName="rate" type="number" required step="1" class="number" min="5"
                           max="100">
                </mat-form-field>


                <mat-form-field class="default-50 sm-100">
                    <mat-label translate>SOCIAL_SPONSORED_AMOUNT</mat-label>
                    <input matInput formControlName="amount" type="number" required class="number">
                </mat-form-field>

                <mat-form-field class="default-50 sm-100">
                    <mat-label translate>SOCIAL_INSTALLMENT_COUNT</mat-label>
                    <input matInput formControlName="installmentCount" type="number" required step="1">
                </mat-form-field>

                <mat-form-field class="default-100">
                    <mat-label translate>COMMON_DESCRIPTION</mat-label>
                    <input matInput formControlName="description" type="text">
                </mat-form-field>

            </form>

        </mat-card-content>
    </mat-card>
    @if (form.controls['personId'].value > 0) {
        <div class="mat__card__900">
            <ss-aid-history [id]="form.controls['personId'].value"></ss-aid-history>
        </div>
    }
}
