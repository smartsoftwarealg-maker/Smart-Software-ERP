<div class="table_div container__1200">
    <mat-table mat-table [dataSource]="data">

        <ng-container matColumnDef="number">
            <mat-header-cell *matHeaderCellDef translate>COMMON_NUMBER</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.number}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="typeDescription">
            <mat-header-cell *matHeaderCellDef translate>COMMON_TYPE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.typeDescription}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="firstName">
            <mat-header-cell *matHeaderCellDef translate>COMMON_FIRST_NAME</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.firstName}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="lastName">
            <mat-header-cell *matHeaderCellDef translate>COMMON_LAST_NAME</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.lastName}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="amount">
            <mat-header-cell *matHeaderCellDef translate>COMMON_AMOUNT</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.amount}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="date">
            <mat-header-cell *matHeaderCellDef translate>COMMON_DATE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.date | date: 'dd/MM/yyyy' }}
            </mat-cell>
        </ng-container>


        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id === selected" (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
</div>

<div class="container b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
