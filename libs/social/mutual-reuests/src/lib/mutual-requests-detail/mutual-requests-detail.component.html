<mat-card>
    <mat-card-content>
        @if (form !== null) {
            <form [formGroup]="form">
                <mat-form-field id="serialNumber" class="default-50 sm-100">
                    <mat-label translate>COMMON_NUMBER</mat-label>
                    <input matInput formControlName="serialNumber" type="text" autofocus maxlength="4">
                </mat-form-field>

                <mat-form-field class="default-50 sm-100">
                    <mat-label translate>COMMON_DATE</mat-label>
                    <ss-date-picker formControlName="date"></ss-date-picker>
                </mat-form-field>

                <mat-form-field id="description" class="default-100">
                    <mat-label translate>ADMINISTRATION_DESCRIPTION</mat-label>
                    <input matInput formControlName="description" type="text" required>
                </mat-form-field>
            </form>
        }
    </mat-card-content>
</mat-card>
