<div class="button_div" *ngIf="form">
    <button mat-mini-fab (click)="save()"
            color="primary" *ngIf="isEditable">
        <i class="fas fa-save"></i>
    </button>
    <button mat-mini-fab (click)="cancel()"
            color="warn">
        <i class="fas fa-redo"></i>
    </button>
</div>

<mat-card>
    @if (form) {
        <form novalidate [formGroup]="form">

            <mat-form-field class="default-50 sm-100">
                <mat-label translate>COMMON_REFERENCE</mat-label>
                <input matInput formControlName="reference" type="text">
                <mat-error *ngIf="form.controls['reference'].invalid" translate>COMMON_FIELD_REQUIRED</mat-error>
            </mat-form-field>

            <mat-form-field class="default-50 sm-100">
                <mat-label translate>COMMON_DATE</mat-label>
                <ss-date-picker formControlName="date" autofocus></ss-date-picker>
            </mat-form-field>

            <mat-form-field class="default-50 sm-100">
                <mat-label translate>COMMON_AMOUNT</mat-label>
                <input matInput formControlName="amount" type="number" required>
            </mat-form-field>

        </form>
    }
</mat-card>
