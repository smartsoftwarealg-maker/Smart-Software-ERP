<div class="table-container">
    <mat-table mat-table [dataSource]="data$|async" class="main-table">
        <ng-container matColumnDef="date">
            <mat-header-cell *matHeaderCellDef translate>COMMON_DATE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.date | date: 'dd/MM/yyyy' }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="number">
            <mat-header-cell *matHeaderCellDef translate>COMMON_REFERENCE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.number}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="beneficiary">
            <mat-header-cell *matHeaderCellDef translate>ASSET_BENEFICIARY</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.beneficiary}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="location">
            <mat-header-cell *matHeaderCellDef translate>COMMON_OFFICE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.location}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="key">
            <mat-header-cell *matHeaderCellDef ></mat-header-cell>
            <mat-cell *matCellDef="let e">
                <i class="fas fa-folder-open" (click)="openAppointment(e.id)" matTooltip="{{ 'COMMON_GOTO_DETAIL' | translate }}"></i>
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id === selectedId()" (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
</div>

<div class="pagination-container b-b-background">
    <ss-pagination [paginationModel]="paginator"></ss-pagination>
</div>
