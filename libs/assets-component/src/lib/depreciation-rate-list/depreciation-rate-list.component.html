<div class="ctrl-div" *ngIf="editable">
    <button mat-mini-fab color="primary" (click)="showDetail(0)">
        <span class="fas fa-plus"></span>
    </button>
    <button mat-mini-fab (click)="edit()"
            [disabled]="!selected"
            color="accent">
        <span class="fas fa-pen"></span>
    </button>
    <button mat-mini-fab (click)="deleteSelected()"
            [disabled]="!selected"
            color="warn">
        <span class="fas fa-trash-alt"></span>
    </button>
</div>

<div class="table-container">
    <mat-table mat-table [dataSource]="rates" class="main-table">

        <ng-container matColumnDef="year" style="justify-content: center; text-align: center">
            <mat-header-cell *matHeaderCellDef translate style="justify-content: center">
                COMMON_YEAR
            </mat-header-cell>
            <mat-cell *matCellDef="let e" style="justify-content: center">
                {{ e.year }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="rate" style="justify-content: center; text-align: center">
            <mat-header-cell *matHeaderCellDef translate style="justify-content: center">
                COMMON_RATE
            </mat-header-cell>
            <mat-cell *matCellDef="let e" style="justify-content: center">
                {{e.rate}}
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
    <div class="pagination-container b-b-background">
        <ss-pagination [paginationModel]="pagination"></ss-pagination>
    </div>
</div>
