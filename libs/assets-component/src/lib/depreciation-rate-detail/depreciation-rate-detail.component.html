<div class="button_div size" *ngIf="form">
    <button mat-mini-fab (click)="save()"
            color="accent" *ngIf="isEditable">
        <i class="fas fa-save"></i>
    </button>
    <button mat-mini-fab (click)="cancel()"
            color="warn">
        <i class="fas fa-redo"></i>
    </button>
</div>

<div class="form-container">
    <form *ngIf="form" novalidate [formGroup]="form" >


        <mat-form-field floatLabel="always" class="default-50">
            <mat-label translate>COMMON_YEAR</mat-label>
            <input matInput formControlName="year" type="number" required>
        </mat-form-field>

        <mat-form-field floatLabel="always" class="default-50">
            <mat-label translate>COMMON_RATE</mat-label>
            <input matInput formControlName="rate" type="number" required>
        </mat-form-field>

        <!--                <pre>{{form.value | json}}</pre>-->
    </form>
</div>
