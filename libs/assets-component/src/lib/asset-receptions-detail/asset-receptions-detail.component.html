<div mat-subheader class="title b-primary" translate> {{ 'COMMON_ARCHIVE' }}</div>
<mat-card>
    <mat-card-content>
        <form *ngIf="form !== null" novalidate [formGroup]="form">
            <mat-form-field class="default-50">
                <mat-label translate>COMMON_NUMBER</mat-label>
                <input matInput formControlName="invoiceNumber" type="text" autofocus readonly>
            </mat-form-field>

            <mat-form-field class="default-50">
                <mat-label translate>COMMON_DATE</mat-label>
                <ss-date-picker formControlName="acquisitionDate"></ss-date-picker>
            </mat-form-field>

            <mat-form-field class="default-50">
                <mat-label translate>LOGISTICS_SUPPLIER</mat-label>
                <input matInput formControlName="supplierName" type="text" readonly>
            </mat-form-field>
        </form>

    </mat-card-content>
</mat-card>

<div class="content">
    <ss-app-archive-main [id]="id" [appId]="1"></ss-app-archive-main>
</div>
