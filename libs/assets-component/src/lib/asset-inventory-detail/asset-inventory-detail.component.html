<mat-card>
    <mat-card-content>
        <form *ngIf="form !== null" novalidate [formGroup]="form">
            <mat-form-field class="default-100">
                <mat-label translate>COMMON_OFFICE</mat-label>
                <ss-auto-complete matInput
                                  [model]="officeLookup"
                                  formControlName="office">
                </ss-auto-complete>
            </mat-form-field>

            <mat-form-field class="default-100">
                <mat-label translate>ASSETS</mat-label>
                <ss-auto-complete matInput
                                  [model]="assetLookupModel"
                                  formControlName="investId">
                </ss-auto-complete>
            </mat-form-field>

        </form>

    </mat-card-content>
</mat-card>
<div class="scanner">
    <ngx-scanner-qrcode class="default-100 scanner" #action="scanner" (data)="onScan($event)"></ngx-scanner-qrcode>
    <button mat-raised-button (click)="action.toggleCamera()" class="default-100">Toggle</button>
</div>
