<mat-card>
  <mat-card-content>
    @if (form !== null) {
      <form novalidate [formGroup]="form">
        <mat-form-field class="default-50 sm-100">
          <mat-label translate>COMMON_DATE</mat-label>
          <ss-date-picker formControlName="date"></ss-date-picker>
        </mat-form-field>
        <mat-form-field class="default-100">
          <mat-label translate>COMMON_OFFICE</mat-label>
          <ss-auto-complete matInput
            [model]="officeLookup"
            formControlName="office">
          </ss-auto-complete>
        </mat-form-field>
        <mat-form-field class="default-100">
          <mat-label translate>ASSETS</mat-label>
          <ss-auto-complete matInput
            [model]="assetLookupModel"
            formControlName="investId">
          </ss-auto-complete>
        </mat-form-field>
        <mat-form-field class="default-100">
          <mat-label translate>COMMON_STATUS</mat-label>
          <ss-auto-complete matInput
            [model]="statusLookup"
            formControlName="status">
          </ss-auto-complete>
        </mat-form-field>
      </form>
    }

  </mat-card-content>
</mat-card>
