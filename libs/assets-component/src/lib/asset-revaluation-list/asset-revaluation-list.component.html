<div class="ctrl-div" *ngIf="editable">
    <button mat-mini-fab type="button" color="primary" (click)="showDetail(0)"  [matTooltip]="'COMMON_ADD' | translate">
        <span class="fas fa-plus"></span>
    </button>
    <button mat-mini-fab
            type="button"
            (click)="edit()"
            [disabled]="!selected"
            color="accent">
        <span class="fas fa-pen"></span>
    </button>
    <button mat-mini-fab
            type="button"
            (click)="deleteSelected()"
            [disabled]="!selected"
            color="warn">
        <span class="fas fa-trash-alt"></span>
    </button>
</div>

<div class="table-container">
    <mat-table mat-table [dataSource]="revaluations" class="main-table">

        <ng-container matColumnDef="typeDescription" style="justify-content: center; text-align: center">
            <mat-header-cell *matHeaderCellDef translate style="justify-content: center">
                COMMON_TYPE
            </mat-header-cell>
            <mat-cell *matCellDef="let e" style="justify-content: center">
                {{e.typeDescription}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="deprec_year" style="justify-content: center; text-align: center">
            <mat-header-cell *matHeaderCellDef translate style="justify-content: center">
                LOGISTICS_AMOUNT
            </mat-header-cell>
            <mat-cell *matCellDef="let e" style="justify-content: center">
                {{e.deprec_year}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="useful_life" style="justify-content: center; text-align: center">
            <mat-header-cell *matHeaderCellDef translate style="justify-content: center">
                LOGISTICS_AMOUNT
            </mat-header-cell>
            <mat-cell *matCellDef="let e" style="justify-content: center">
                {{e.useful_life}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="amount" style="justify-content: center; text-align: center">
            <mat-header-cell *matHeaderCellDef translate style="justify-content: center">
                LOGISTICS_AMOUNT
            </mat-header-cell>
            <mat-cell *matCellDef="let e" style="justify-content: center">
                {{e.amount | number: '1.2-2'}}
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
    <div class="pagination-container b-b-background">
        <ss-pagination [paginationModel]="pagination"></ss-pagination>
    </div>
</div>
