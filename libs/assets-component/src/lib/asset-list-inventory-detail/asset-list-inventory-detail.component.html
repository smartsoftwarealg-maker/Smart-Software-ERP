@defer (when form) {
    <mat-card>
        <mat-card-content>
            <form [formGroup]="form">
                <mat-form-field id="comment" class="default-100">
                    <mat-label translate>COMMON_MEMO</mat-label>
                    <input matInput formControlName="comment" type="text">
                    @if (form.controls['comment'].invalid) {
                        <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
                    }
                </mat-form-field>

                <mat-form-field class="default-50 sm-100">
                    <mat-label translate> COMMON_LOCATION</mat-label>
                    <ss-auto-complete matInput
                                      formControlName="locationId"
                                      [model]="locationLookup">
                    </ss-auto-complete>
                </mat-form-field>

                <mat-form-field class="default-50 sm-100">
                    <mat-label translate> ASSET_BUILDINGS</mat-label>
                    <ss-auto-complete matInput
                                      formControlName="newBuildingId"
                                      [model]="buildingLookup">
                    </ss-auto-complete>
                </mat-form-field>

                <mat-form-field class="default-50 sm-100">
                    <mat-label translate>COMMON_OFFICE</mat-label>
                    <ss-auto-complete matInput
                                      [model]="officeLookup"
                                      formControlName="newOfficeId">
                    </ss-auto-complete>
                </mat-form-field>

                <mat-form-field class="default-50 sm-100">
                    <mat-label translate>ASSET_BENEFICIARY</mat-label>
                    <ss-auto-complete matInput
                                      [model]="beneficiaryLookup"
                                      formControlName="newBeneficiary">
                    </ss-auto-complete>
                </mat-form-field>

            </form>
        </mat-card-content>
    </mat-card>
}
