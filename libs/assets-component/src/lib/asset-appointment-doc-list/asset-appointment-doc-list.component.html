<mat-table mat-table [dataSource]="data" class="main-table" matSort (matSortChange)="sort($event)">

    <ng-container matColumnDef="serialNumber">
        <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_NUMBER</mat-header-cell>
        <mat-cell *matCellDef="let e">
            {{e.serialNumber}}
        </mat-cell>
    </ng-container>

    <ng-container matColumnDef="date">
        <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_DATE</mat-header-cell>
        <mat-cell *matCellDef="let e">
            {{e.date| date: 'dd/MM/yyyy' }}
        </mat-cell>
    </ng-container>

    <ng-container matColumnDef="officeName">
        <mat-header-cell *matHeaderCellDef mat-sort-header translate>ASSET_LOCATIONS</mat-header-cell>
        <mat-cell *matCellDef="let e">
            {{ e.officeName }}
        </mat-cell>
    </ng-container>

    <ng-container matColumnDef="beneficiary">
        <mat-header-cell *matHeaderCellDef mat-sort-header translate>ASSET_BENEFICIARY</mat-header-cell>
        <mat-cell *matCellDef="let e">
            {{ e.beneficiary }}
        </mat-cell>
    </ng-container>

    <ng-container matColumnDef="requestNumber">
        <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_REFERENCE</mat-header-cell>
        <mat-cell *matCellDef="let e">
            {{ e.requestNumber }}
        </mat-cell>
    </ng-container>

    <ng-container matColumnDef="creatorName">
        <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_CREATED_BY</mat-header-cell>
        <mat-cell *matCellDef="let e">
            {{ e.creatorName }}
        </mat-cell>
    </ng-container>

    <ng-container matColumnDef="requestDate">
        <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_DATE</mat-header-cell>
        <mat-cell *matCellDef="let e">
            {{ e.requestDate | date: 'dd/MM/yyyy' }}
        </mat-cell>
    </ng-container>

    <ng-container matColumnDef="reappointment">
        <mat-header-cell *matHeaderCellDef mat-sort-header translate>ASSET_REAPPOINTMENT</mat-header-cell>
        <mat-cell *matCellDef="let e">
            <mat-checkbox [class.mat-checkbox-disabled]="false" disabled="true"
                          [checked]="e.reappointment"></mat-checkbox>
        </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
    <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
             *matRowDef="let row; columns: displayedColumns;"></mat-row>
</mat-table>

<div class="pagination-container b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
