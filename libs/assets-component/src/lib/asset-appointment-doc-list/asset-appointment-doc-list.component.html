<mat-table mat-table [dataSource]="data" class="main-table">

    <ng-container matColumnDef="serialNumber">
        <mat-header-cell *matHeaderCellDef translate>COMMON_NUMBER</mat-header-cell>
        <mat-cell *matCellDef="let e">
            {{e.serialNumber}}
        </mat-cell>
    </ng-container>

    <ng-container matColumnDef="date">
        <mat-header-cell *matHeaderCellDef translate>COMMON_DATE</mat-header-cell>
        <mat-cell *matCellDef="let e">
            {{e.date| date: 'dd/MM/yyyy' }}
        </mat-cell>
    </ng-container>

    <ng-container matColumnDef="officeName">
        <mat-header-cell *matHeaderCellDef translate>ASSET_LOCATIONS</mat-header-cell>
        <mat-cell *matCellDef="let e">
            {{ e.officeName }}
        </mat-cell>
    </ng-container>

    <ng-container matColumnDef="valName">
        <mat-header-cell *matHeaderCellDef translate>ASSET_BENEFICIARY</mat-header-cell>
        <mat-cell *matCellDef="let e">
            {{ e.beneficiary }}
        </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
    <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
             *matRowDef="let row; columns: displayedColumns;"></mat-row>
</mat-table>

<div class="pagination-container b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
