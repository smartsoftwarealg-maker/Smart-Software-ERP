<mat-card>
    <mat-card-content>
        <form *ngIf="form !== null" novalidate [formGroup]="form">
            <mat-form-field id="code" class="value">
                <mat-label translate>ADMINISTRATION_CODE</mat-label>
                <input matInput formControlName="code" type="text" autofocus maxlength="4">
                <mat-error *ngIf="form.controls['code'].errors?.maxlength" [translate]="{ maxLen: 4 }">
                    COMMON_FIELD_MAX_LENGTH
                </mat-error>
            </mat-form-field>
            <mat-form-field id="description" class="value">
                <mat-label translate>ADMINISTRATION_DESCRIPTION</mat-label>
                <input matInput formControlName="description" type="text" required>
                <mat-error *ngIf="form.controls['description'].invalid" translate>COMMON_FIELD_REQUIRED
                </mat-error>
            </mat-form-field>
        </form>

    </mat-card-content>
</mat-card>
