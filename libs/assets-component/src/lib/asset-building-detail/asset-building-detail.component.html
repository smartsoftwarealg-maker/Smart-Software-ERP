<mat-card>
    <mat-card-content>
        <form *ngIf="form !== null" novalidate [formGroup]="form">
            <mat-form-field class="default-100">
                <mat-label translate>ASSET_SITE</mat-label>
                <ss-auto-complete matInput
                                  [model]="locationLookup"
                                  formControlName="locationId"></ss-auto-complete>
            </mat-form-field>

            <mat-form-field id="code" class="default-100" autofocus>
                <mat-label translate>ADMINISTRATION_CODE</mat-label>
                <input matInput formControlName="code" type="text" autofocus maxlength="4">
                <mat-error *ngIf="form.controls['code'].invalid" translate>COMMON_FIELD_MAX_LENGTH
                </mat-error>
            </mat-form-field>

            <mat-form-field id="description" class="default-100">
                <mat-label translate>ADMINISTRATION_DESCRIPTION</mat-label>
                <input matInput formControlName="description" type="text" required>
                <mat-error *ngIf="form.controls['description'].invalid" translate>COMMON_FIELD_REQUIRED
                </mat-error>
            </mat-form-field>
        </form>

    </mat-card-content>
</mat-card>
