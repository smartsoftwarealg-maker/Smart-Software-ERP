<div class="container">
    <div class="left">
        <div class="tree_div">
            <mat-tree [dataSource]="dataSource" [treeControl]="treeControl" class="example-tree">
                <!-- This is the tree node template for leaf nodes -->
                <!-- There is inline padding applied to this node using styles.
                  This padding value depends on the mat-icon-button width. -->
                <mat-tree-node *matTreeNodeDef="let node"
                               matTreeNodeToggle
                               class="selectable"
                               (click)="selectNode(node)"
                               [class.selected]="selectedNode?.ent?.id == node.ent.id">
                    <button mat-icon-button matTreeNodeToggle
                            [attr.aria-label]="'Toggle ' + node.ent.description">
                        <i class="fa-solid fa-leaf"></i>
                    </button>
                    {{node.ent.reference}} {{node.ent.description}}
                </mat-tree-node>
                <!-- This is the tree node template for expandable nodes -->
                <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild"
                                      (click)="selectNode(node)"
                >
                    <div class="mat-tree-node selectable"
                         [class.selected]="selectedNode?.ent?.id == node?.ent?.id">
                        <button mat-icon-button matTreeNodeToggle
                                [attr.aria-label]="'Toggle ' + node.ent.description">
                            <i class="fa-solid fa-circle-plus" *ngIf="!treeControl.isExpanded(node)"></i>
                            <i class="fa-solid fa-circle-minus" *ngIf="treeControl.isExpanded(node)"></i>
                        </button>
                        {{node.ent.reference}} {{node.ent.description}}
                    </div>
                    <!-- There is inline padding applied to this div using styles.
                        This padding value depends on the mat-icon-button width.  -->
                    <div [class.example-tree-invisible]="!treeControl.isExpanded(node)"
                         role="group">
                        <ng-container matTreeNodeOutlet></ng-container>
                    </div>
                </mat-nested-tree-node>
            </mat-tree>
        </div>
        <div class="b-b-background">
            <ss-pagination [paginationModel]="pagingModel"></ss-pagination>
        </div>

        <div class="btn_div">
            <button mat-raised-button
                    color="primary"
                    type="button"
                    (click)="removeNode()"
                    [disabled]="selectedNode === null || !selectedNode.ent.parentId">
                <i class="fa-solid fa-minus"></i>
                {{ 'ASSET_REMOVE' | translate }}
            </button>
        </div>
    </div>

    <div class="right">
        <div class="ctrl_div">
            <mat-form-field>
                <mat-label translate>COMMON_SEARCH</mat-label>
                <input matInput [formControl]="searchText">
            </mat-form-field>
            <button mat-raised-button color="primary"
                    type="button"
                    (click)="refreshList()">
                <i class="fas fa-sync-alt"></i>
                {{ 'COMMON_REFRESH' | translate }}
            </button>
        </div>

        <div class="list_div">
            <mat-list role="list">
                <mat-list-item role="listitem"
                               *ngFor="let i of listData"
                               class="selectable"
                               (click)="selectAsset(i)"
                               [class.selected]="selectedAsset?.id == i.id">
                    {{ i.reference }} {{ i.description }}
                </mat-list-item>
            </mat-list>
        </div>
        <div class="b-b-background">
            <ss-pagination [paginationModel]="listModel"></ss-pagination>
        </div>

        <div class="btn_div">
            <button mat-raised-button
                    color="primary"
                    type="button"
                    (click)="addNode()"
                    [disabled]="selectedNode === null || selectedAsset === null">
                <i class="fa-solid fa-plus"></i>
                {{ 'ASSET_ADD' | translate }}
            </button>
        </div>
    </div>
</div>
