<mat-form-field class="default-100 top_field">
  <mat-label translate>ASSET_SITE</mat-label>
  <ss-auto-complete matInput
    [model]="locationLookup"
    [formControl]="locationFF">
  </ss-auto-complete>
</mat-form-field>

<mat-form-field class="default-100">
  <mat-label translate>ASSET_BUILDINGS</mat-label>
  <ss-auto-complete matInput
    [model]="buildingLookup"
    [formControl]="buildingFF">
  </ss-auto-complete>
</mat-form-field>


@if (!isCMMS) {
  <mat-form-field class="default-100">
    <mat-label translate>ASSET_FLOOR_NO</mat-label>
    <mat-select [formControl]="floorFF">
      @for (f of floors; track f) {
        <mat-option [value]="f.id">{{ f.description }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
}

<div class="list_div">
  <mat-list role="list">
    @for (d of list; track d) {
      <mat-list-item class="selectable"
        role="listitem"
        (click)="onSelect(d)"
        [class.selected]="d.id === selectedOffice?.id">
        {{ d.code }}: {{ d.description }}
      </mat-list-item>
    }
  </mat-list>
</div>

<div mat-dialog-actions class="ctrl-div">
  <button mat-raised-button [mat-dialog-close]="selectedOffice" color="primary" translate>
    COMMON_SELECT
  </button>
  <button mat-raised-button (click)="close()" translate color="accent">COMMON_CANCEL</button>
</div>
