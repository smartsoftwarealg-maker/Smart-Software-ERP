<mat-card>
    <div class="container__div">
        <mat-form-field>
            <mat-label translate>ASSET_INVENTORY_DOC</mat-label>
            <ss-auto-complete matInput
                              [model]="inventoryDocLookup"
                              [formControl]="inventoryDoc">
            </ss-auto-complete>
        </mat-form-field>
            <mat-form-field>
                <mat-label translate>COMMON_OFFICE</mat-label>
                <ss-auto-complete matInput
                                  [model]="officeLookup"
                                  [formControl]="officeCtrl">
                </ss-auto-complete>
            </mat-form-field>
            <button mat-mini-fab (click)="openSearchDlg()" type="button">
                <i class="fa-solid fa-file-magnifying-glass"></i>
            </button>
        </div>
</mat-card>
<div class="table__div container">
    <mat-table mat-table [dataSource]="data" class="main-table" matSort (matSortChange)="sort($event)">

        <ng-container matColumnDef="description">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>ADMINISTRATION_DESCRIPTION</mat-header-cell>
            <mat-cell *matCellDef="let e" [ngClass]="{ sold: e.dateOut }">
                {{ e.description }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="reference">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_REFERENCE</mat-header-cell>
            <mat-cell *matCellDef="let e" [ngClass]="{ sold: e.dateOut }">
                {{ e.reference }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="officeDescription">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>ASSET_LOCATIONS</mat-header-cell>
            <mat-cell *matCellDef="let e" [ngClass]="{ sold: e.dateOut }">
                {{ e.officeDescription }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="recorded">
            <mat-header-cell *matHeaderCellDef translate><i class="fa-solid fa-location-question located"></i>
            </mat-header-cell>
            <mat-cell *matCellDef="let e">

                <mat-checkbox [checked]="(e.inventoryId||0) > 0" (click)="update(e)"></mat-checkbox>
            </mat-cell>
        </ng-container>


        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selected" (click)="selectRow(row)"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
</div>
<div class="container b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
