<mat-card>
  <mat-card-content>
    @if (form !== null) {
      <form novalidate [formGroup]="form">
        <mat-form-field class="default-100" >
          <mat-label translate>COMMON_DESCRIPTION</mat-label>
          <input matInput formControlName="description" type="text">
          @if (form.controls['description'].invalid) {
            <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
          }
        </mat-form-field>
        <mat-form-field class="default-100" >
          <mat-label translate>COMMON_DESCRIPTION_AR</mat-label>
          <input matInput formControlName="descriptionAr" type="text">
          @if (form.controls['descriptionAr'].invalid) {
            <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
          }
        </mat-form-field>
      </form>
    }

  </mat-card-content>
</mat-card>
