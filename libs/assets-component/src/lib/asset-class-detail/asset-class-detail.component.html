<mat-card>
    <mat-card-content>
        <form *ngIf="form !== null" novalidate [formGroup]="form">
            <mat-form-field id="description" class="default-50 sm-100">
                <mat-label translate>ADMINISTRATION_DESCRIPTION</mat-label>
                <input matInput formControlName="description" type="text" required>
                <mat-error *ngIf="form.controls['description'].invalid" translate>COMMON_FIELD_REQUIRED
                </mat-error>
            </mat-form-field>

            <mat-form-field class="default-50 sm-100">
                <mat-label translate>ASSET_DEPRECIATION_RATE</mat-label>
                <input matInput formControlName="depreciationRate" type="number" min="1" max="100">
                <mat-error *ngIf="form.controls['depreciationRate'].invalid" translate>COMMON_FIELD_MAX_LENGTH
                </mat-error>
            </mat-form-field>

            <mat-form-field class="default-50 sm-100">
                <mat-label translate>ASSET_USEFUL_LIFE</mat-label>
                <input matInput formControlName="usefulLife" type="number" min="1" max="100">
                <mat-error *ngIf="form.controls['usefulLife'].invalid" translate>COMMON_FIELD_MAX_LENGTH
                </mat-error>
            </mat-form-field>

        </form>

    </mat-card-content>
</mat-card>
