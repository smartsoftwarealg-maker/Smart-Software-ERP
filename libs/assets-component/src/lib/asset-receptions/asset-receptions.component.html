<mat-table mat-table [dataSource]="data" class="main-table">

    <ng-container matColumnDef="receptionDate">
        <mat-header-cell *matHeaderCellDef translate>COMMON_DATE</mat-header-cell>
        <mat-cell *matCellDef="let e">
            {{e.receptionDate | date: 'dd/MM/yyyy' }}
        </mat-cell>
    </ng-container>

    <ng-container matColumnDef="serialNumber">
        <mat-header-cell *matHeaderCellDef translate>COMMON_NUMBER</mat-header-cell>
        <mat-cell *matCellDef="let e">
            {{e.serialNumber}}
        </mat-cell>
    </ng-container>

    <ng-container matColumnDef="supplierName">
        <mat-header-cell *matHeaderCellDef translate>LOGISTICS_SUPPLIER</mat-header-cell>
        <mat-cell *matCellDef="let e">
            {{e.supplierName}}
        </mat-cell>
    </ng-container>

    <ng-container matColumnDef="count">
        <mat-header-cell *matHeaderCellDef translate>COMMON_COUNT</mat-header-cell>
        <mat-cell *matCellDef="let e">
            {{e.count}}
        </mat-cell>
    </ng-container>

    <ng-container matColumnDef="amount">
        <mat-header-cell *matHeaderCellDef translate>LOGISTICS_AMOUNT</mat-header-cell>
        <mat-cell *matCellDef="let e">
            {{ e.amount | number: '1.2-2' }}
        </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
    <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
             *matRowDef="let row; columns: displayedColumns;"></mat-row>
</mat-table>

<div class="pagination-container b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
