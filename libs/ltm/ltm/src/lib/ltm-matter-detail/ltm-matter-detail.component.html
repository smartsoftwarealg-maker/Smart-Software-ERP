<mat-card>
    <form *ngIf="form !== null" novalidate [formGroup]="form">
        <mat-form-field class="default-100">
            <mat-label translate>COMMON_DESCRIPTION</mat-label>
            <input matInput formControlName="description" type="text" required autofocus>
        </mat-form-field>

        <mat-form-field class="default-100">
            <mat-label translate>COMMON_EQUIPMENT</mat-label>
            <ss-auto-complete matInput
                              [model]="equipmentLookup"
                              formControlName="equipment">
            </ss-auto-complete>
        </mat-form-field>

        <mat-form-field class="default-100" >
            <mat-label translate>COMMON_PRODUCT</mat-label>
            <ss-auto-complete matInput
                              [model]="productLookup"
                              formControlName="product">
            </ss-auto-complete>
        </mat-form-field>

    </form>
</mat-card>
<router-outlet *ngIf="form !== null && id"></router-outlet>
