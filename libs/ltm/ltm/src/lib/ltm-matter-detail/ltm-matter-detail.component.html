<mat-card>
  @if (form !== null) {
    <form novalidate [formGroup]="form">
      <mat-form-field class="default-100">
        <mat-label translate>COMMON_DESCRIPTION</mat-label>
        <input matInput formControlName="description" type="text" required autofocus>
      </mat-form-field>
      <mat-form-field class="default-50">
        <mat-label translate>ADMINISTRATION_CODE</mat-label>
        <input matInput formControlName="code" type="text">
      </mat-form-field>
      <mat-form-field class="default-100">
        <mat-label translate>LTM_STANDARD_NAME</mat-label>
        <input matInput formControlName="name" type="text">
      </mat-form-field>
    </form>
  }
</mat-card>
