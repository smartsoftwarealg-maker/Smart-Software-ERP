<div class="ctrl__div content_div">
    <mat-form-field>
        <mat-label translate>COMMON_FROM</mat-label>
        <ss-date-picker [formControl]="from"></ss-date-picker>
    </mat-form-field>

    <mat-form-field>
        <mat-label translate>COMMON_TO</mat-label>
        <ss-date-picker [formControl]="to"></ss-date-picker>
    </mat-form-field>

</div>
<div class="content_div container">
    <mat-table mat-table [dataSource]="data" class="main-table" matSort (matSortChange)="sort($event)">


        <ng-container matColumnDef="memo">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_MEMO</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.memo}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="userDescription">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>ADMINISTRATION_USERS</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.userDescription}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="matterDescription">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>LTM_MATTER</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.matterDescription}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="anomalyDescription">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>LTM_ANOMALY</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.anomalyDescription}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="date">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_DATE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.date | date: 'dd/MM/yyyy HH:mm' }}
            </mat-cell>
        </ng-container>


        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
</div>
<div class="content_div b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
