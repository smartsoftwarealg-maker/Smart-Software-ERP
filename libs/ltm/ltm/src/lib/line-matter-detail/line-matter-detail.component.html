<mat-card>
    <mat-card-header>
        <div class="ctrl_div default-100">
            <button mat-mini-fab color="primary"
                    [matTooltip]="'COMMON_SAVE' | translate"
                    (click)="save()"
                    [disabled]="!form?.valid">
                <i class="fas fa-save"></i>
            </button>
            <button mat-mini-fab
                    color="warn"
                    [matTooltip]="'COMMON_CANCEL' | translate"
                    translate (click)="cancel()">
                <i class="fas fa-redo"></i>
            </button>
        </div>
    </mat-card-header>
    <mat-card-content>
        <form *ngIf="form !== null" novalidate [formGroup]="form">
            <mat-form-field class="default-100">
                <mat-label translate>LTM_MATTER</mat-label>
                <ss-auto-complete matInput
                                  formControlName="matterId"
                                  [model]="matterLookup">
                </ss-auto-complete>
            </mat-form-field>
        </form>
    </mat-card-content>
</mat-card>
