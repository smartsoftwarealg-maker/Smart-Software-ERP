<mat-card>
    <mat-card-content>
        <form *ngIf="form !== null" novalidate [formGroup]="form">
            <mat-form-field class="default-100">
                <mat-label translate>LTM_MATTER</mat-label>
                <ss-auto-complete matInput
                                  formControlName="matterId"
                                  [model]="matterLookup">
                </ss-auto-complete>
            </mat-form-field>
            <mat-form-field class="default-50 sm-100">
                <mat-label translate>COMMON_EQUIPMENT</mat-label>
                <ss-auto-complete matInput
                                  [model]="equipmentLookup"
                                  formControlName="equipment">
                </ss-auto-complete>
            </mat-form-field>

            <mat-form-field class="default-50 sm-100">
                <mat-label translate>COMMON_PRODUCT</mat-label>
                <ss-auto-complete matInput
                                  [model]="productLookup"
                                  formControlName="product">
                </ss-auto-complete>
            </mat-form-field>
            <mat-form-field class="default-50 sm-100">
                <mat-label translate>LTM_PICKUP_POINT</mat-label>
                <ss-auto-complete matInput
                                  [model]="pickupPointLookup"
                                  formControlName="pickupPoint">
                </ss-auto-complete>
            </mat-form-field>
        </form>
    </mat-card-content>
</mat-card>

@if (form && id) {
    <router-outlet></router-outlet>
}
