<fieldset>
    <div class="file-upload">
        <input type="file" class="file-input"
               [accept]="requiredFileType"
               (change)="onChange(fileUpload.files)"
               #fileUpload>

        <span translate>{{ fileName || "COMMON_NO_FILE_SELECTED" }} </span>

        <button mat-mini-fab color="primary"
                class="upload-btn"
                (click)="fileUpload.click()"
                *ngIf="!uploadProgress">
            <i class="fas fa-paperclip"></i>
        </button>
    </div>
</fieldset>

<mat-progress-bar class="progress-bar" mode="indeterminate" *ngIf="processing"></mat-progress-bar>
<mat-card>
    <mat-card-header>
        <mat-radio-group aria-label="Select an option">
            <mat-radio-button value="1" (change)="onFormat($event)" translate [checked]="true">LTM_STANDARD_FORMAT</mat-radio-button>
            <mat-radio-button value="2" (change)="onFormat($event)" translate>LTM_UPDATE_FORMAT</mat-radio-button>
        </mat-radio-group>
    </mat-card-header>

    <mat-card-content>
        <form novalidate [formGroup]="form">
            <mat-form-field class="default-50">
                <mat-label translate>COMMON_FROM</mat-label>
                <ss-date-picker formControlName="from"></ss-date-picker>
            </mat-form-field>
            <mat-form-field class="default-50">
                <mat-label translate>COMMON_TO</mat-label>
                <ss-date-picker formControlName="to"></ss-date-picker>
            </mat-form-field>
        </form>
    </mat-card-content>
</mat-card>
<!--    <div><pre>{{form?.value | json }}</pre></div>-->


<div class="ctrl-div">
    <div *ngIf="!uploadProgress">
        <button mat-raised-button color="primary"
                type="button"
                (click)="upload(fileUpload.files)"
                [disabled]="!form.valid || fileName?.length < 4">
            {{ 'COMMON_UPLOAD' | translate }}
            <i class="fa-solid fa-upload  icon"></i>
        </button>
    </div>
    <div *ngIf="!uploadProgress">
        <button mat-raised-button color="warn" type="button" (click)="cancel()">
            {{ 'COMMON_CANCEL' | translate }}
            <i class="fa-solid fa-rotate-left icon"></i>
        </button>
    </div>
</div>
