<mat-card>
    <form *ngIf="form !== null" novalidate [formGroup]="form">
        <mat-form-field class="default-100">
            <mat-label translate>COMMON_DESCRIPTION</mat-label>
            <input matInput formControlName="description" type="text" required autofocus>
        </mat-form-field>

        <mat-form-field class="default-100">
            <mat-label translate>COMMON_DESCRIPTION_AR</mat-label>
            <input matInput formControlName="descriptionAr" type="text">
        </mat-form-field>

        <mat-form-field class="default-100">
            <mat-label translate>COMMON_VARIABLE</mat-label>
            <input matInput formControlName="variable" type="text">
        </mat-form-field>

        <mat-form-field class="default-100">
            <mat-label translate>COMMON_FORMULA</mat-label>
            <input matInput formControlName="formula" type="text">
        </mat-form-field>

        <div id="manager" class="default-100">
            <mat-checkbox formControlName="showGraph" translate>LTM_SHOW_GRAPH</mat-checkbox>
        </div>

    </form>
</mat-card>
