    <button mat-mini-fab color="primary" (click)="showDetail(0)" [matTooltip]="'COMMON_ADD' | translate">

    <button mat-mini-fab (click)="deleteSelected()" [matTooltip]="'COMMON_DELETE' | translate"
            [disabled]="!selectedId"
            color="warn">
        <span class="fas fa-trash-alt"></span>
    </button>

<div class="table__div content__div">
    <mat-table mat-table matSort [dataSource]="data$ | async" class="main-table" (matSortChange)="sort($event)">

        <ng-container matColumnDef="document">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_DOCUMENT</mat-header-cell>
            <mat-cell *matCellDef="let e" translate>
                {{ documents[e.document - 1] }}
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id === selectedId()" (click)="selectRow(row)"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
</div>
<div class="content__div b-b-background">
    <ss-pagination [paginationModel]="paginator"></ss-pagination>
</div>
