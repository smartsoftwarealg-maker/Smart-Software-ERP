<mat-card>
    @if (form !== null) {
        <form  [formGroup]="form">

        <mat-form-field class="default-50 sm-100">
            <mat-label translate>COMMON_DATE</mat-label>
            <ss-date-picker formControlName="date" type="datetime" autofocus></ss-date-picker>
        </mat-form-field>

        <mat-form-field id="matterType" class="default-100">
            <mat-label translate>LTM_MATTER</mat-label>
            <ss-auto-complete matInput
                              formControlName="matterId"
                              [model]="matterLookup">
            </ss-auto-complete>
        </mat-form-field>

        <mat-form-field id="anomalyType" class="default-100">
            <mat-label translate>LTM_ANOMALY</mat-label>
            <ss-auto-complete matInput
                              formControlName="anomalyId"
                              [model]="anomalyLookup">
            </ss-auto-complete>
        </mat-form-field>

        <mat-form-field class="default-100">
            <mat-label translate>LTM_PICKUP_POINT</mat-label>
            <ss-auto-complete matInput
                              formControlName="pickupPoint"
                              [model]="pickupPointLookup">
            </ss-auto-complete>
        </mat-form-field>


        <mat-form-field class="default-100">
            <mat-label translate>COMMON_DESCRIPTION</mat-label>
            <input matInput formControlName="memo" type="text" >
        </mat-form-field>

    </form>
    }
</mat-card>
