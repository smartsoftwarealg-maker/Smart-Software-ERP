<mat-progress-bar mode="indeterminate" *ngIf="processing"></mat-progress-bar>

<mat-sidenav-container class="container">
    <mat-sidenav mode="side" [opened]="menuOpened" class="menu_nav">
        <div class="line_div ">
            <mat-form-field class="default-100 sm-50">
                <mat-label translate>COMMON_FROM</mat-label>
                <ss-date-picker [formControl]="from" type="datetime"></ss-date-picker>
            </mat-form-field>

            <mat-form-field class="default-100 sm-50">
                <mat-label translate>COMMON_TO</mat-label>
                <ss-date-picker [formControl]="to" type="datetime"></ss-date-picker>
            </mat-form-field>

            <mat-form-field class="default-100 sm-50">
                <mat-label translate>COMMON_PERIOD</mat-label>
                <mat-select required [formControl]="period">
                    @for (m of periods; track m.id) {
                        <mat-option [value]="m.id" translate>{{ m.description }}</mat-option>
                    }
                </mat-select>
            </mat-form-field>

            <mat-checkbox [formControl]="anomaly" (click)="onMatter(selectedMatter)" translate>LTM_ANOMALIES_ONLY
            </mat-checkbox>

            <mat-form-field class="default-100 sm-50">
                <mat-label translate>COMMON_SEARCH</mat-label>
                <input matInput [formControl]="searchText" type="text">
            </mat-form-field>


            <div class="list_div">
                <mat-card>
                    <mat-list [disabled]="processing">
                        @for (m of matters$ | async; track m.id) {
                            <mat-list-item [class.selected]="selectedMatter?.id == m.id"
                                           (click)="onMatter(m)"
                                           class="list-item selectable">
                                {{ m.matterDescription }}
                            </mat-list-item>
                        }
                    </mat-list>
                </mat-card>
            </div>
            <div class="btn__div">
                <button mat-raised-button color="primary"
                        type="button"
                        (click)="export()">
                    <i class="fa-solid fa-file-excel"></i>
                    {{ 'COMMON_EXCEL_EXPORT' | translate }}
                </button>
            </div>
        </div>
    </mat-sidenav>
    <mat-sidenav-content>
        <div class="chart_container">
            <canvas *ngFor="let c of charts" [id]="c"
                    class="chart"
                    [ngStyle]="processing? {display: 'none'} : {display: 'block'}"
                    [style.background]="light?'white' : 'black'"
                    [style.width]="wideDisplay? '200%' : '200%' ">

            </canvas>
        </div>
    </mat-sidenav-content>
</mat-sidenav-container>
