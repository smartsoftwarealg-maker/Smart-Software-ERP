<div class="container">
    <div class="line_div ">
        <mat-form-field class="default-100">
            <mat-label translate>LTM_LINE</mat-label>
            <mat-select [formControl]="lineCtrl" (selectionChange)="onLine()">
                <mat-option *ngFor="let l of lines$ | async" [value]="l.id">
                    {{ l.description }}
                </mat-option>
            </mat-select>
        </mat-form-field>

        <mat-form-field class="default-100 sm-50">
            <mat-label translate>COMMON_FROM</mat-label>
            <ss-date-picker [formControl]="from"></ss-date-picker>
        </mat-form-field>

        <mat-form-field class="default-100 sm-50">
            <mat-label translate>COMMON_TO</mat-label>
            <ss-date-picker [formControl]="to"></ss-date-picker>
        </mat-form-field>

        <mat-checkbox [formControl]="anomaly" (click)="onMatter(selectedMatter)" translate>LTM_ANOMALIES_ONLY</mat-checkbox>

        <mat-card>
            <mat-list>
                <mat-list-item *ngFor="let m of matters$ | async"
                               [class.selected]="selectedMatter?.id == m.id"
                               (click)="onMatter(m)"
                               class="list-item selectable">
                    {{ m.description }}
                </mat-list-item>
            </mat-list>
        </mat-card>
    </div>

    <div class="chart_container">
        <div class="chart_div">
            <canvas *ngFor="let c of charts" [id]="c" class="chart"></canvas>
        </div>
    </div>
</div>
