<div class="content_div container">
    <mat-table mat-table [dataSource]="data" class="main-table" matSort (matSortChange)="sort($event)">

        <ng-container matColumnDef=id>
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>ADMINISTRATION_CODE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.id}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="description">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_DESCRIPTION</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.description}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="descriptionAr">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_INFO</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.descriptionAr}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="varianceControl">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>LTM_VC</mat-header-cell>
            <mat-cell *matCellDef="let e">
                <mat-checkbox [class.mat-checkbox-disabled]="false" disabled="true"
                              [checked]="e.varianceControl">
                </mat-checkbox>
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="variable">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_VARIABLE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.variable}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="chemicalFormula">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>LTM_CHEMICAL_FORMULA</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.chemicalFormula}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="formula">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_FORMULA</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.formula}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="showGraph">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>LTM_SHOW_GRAPH</mat-header-cell>
            <mat-cell *matCellDef="let e">
                <mat-checkbox [class.mat-checkbox-disabled]="false" disabled="true"
                              [checked]="e.showGraph">
                </mat-checkbox>
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="showKPI">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>LTM_SHOW_KPI</mat-header-cell>
            <mat-cell *matCellDef="let e">
                <mat-checkbox [class.mat-checkbox-disabled]="false" disabled="true"
                              [checked]="e.showKPI">
                </mat-checkbox>
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="isSimulated">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>LTM_SIMULATED</mat-header-cell>
            <mat-cell *matCellDef="let e">
                <mat-checkbox [class.mat-checkbox-disabled]="false" disabled="true"
                              [checked]="e.isSimulated">
                </mat-checkbox>
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
</div>
<div class="content_div b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
