<mat-card>
    <form *ngIf="form !== null" novalidate [formGroup]="form">
        <mat-form-field class="default-100">
            <mat-label translate>COMMON_DESCRIPTION</mat-label>
            <input matInput formControlName="description" type="text" required autofocus>
        </mat-form-field>

        <mat-form-field class="default-100" >
            <mat-label translate>COMMON_EQUIPMENT</mat-label>
            <ss-auto-complete matInput
                              [required]="true"
                              formControlName="equipmentId"
                              [model]="equipmentLookup">
            </ss-auto-complete>
        </mat-form-field>

        <mat-form-field class="default-100" >
            <mat-label translate>LTM_BLEACHER</mat-label>
            <ss-auto-complete matInput
                              formControlName="bleacherId"
                              [model]="bleacherLookup">
            </ss-auto-complete>
        </mat-form-field>

        <mat-form-field class="default-100" >
            <mat-label translate>LTM_ZONE</mat-label>
            <ss-auto-complete matInput
                              formControlName="zoneId"
                              [model]="zoneLookup">
            </ss-auto-complete>
        </mat-form-field>
    </form>
</mat-card>
