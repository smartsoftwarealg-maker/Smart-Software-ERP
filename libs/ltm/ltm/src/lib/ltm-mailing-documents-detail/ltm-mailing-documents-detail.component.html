<mat-card>
    <mat-card-header>
        <div class="ctrl_div default-100">
            <button mat-mini-fab color="primary"
                    [matTooltip]="'COMMON_SAVE' | translate"
                    (click)="save()"
                    [disabled]="!form?.valid">
                <i class="fas fa-save"></i>
            </button>
            <button mat-mini-fab
                    color="warn"
                    [matTooltip]="'COMMON_CANCEL' | translate"
                    translate (click)="cancel()">
                <i class="fas fa-redo"></i>
            </button>
        </div>
    </mat-card-header>
    @if (form !== null) {
        <mat-card-content>
            <form [formGroup]="form">
                <mat-form-field floatLabel="always" class="default-50 sm-100">
                    <mat-label translate>PAYROLL_EMPLOYMENT_TYPE</mat-label>
                    <mat-select formControlName="document" required>
                        <mat-option [value]="1" translate> {{"LTM_PRODUCT_LIBERATION"}} </mat-option>
                        <mat-option [value]="2" translate> {{"LTM_NON_CONFORMITY"}} </mat-option>
                        <mat-option [value]="3" translate> {{"LTM_QUALITY_CERTIFICATE"}} </mat-option>
                    </mat-select>
                </mat-form-field>

            </form>
        </mat-card-content>
    }
</mat-card>
