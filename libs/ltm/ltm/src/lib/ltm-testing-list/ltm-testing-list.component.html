<div class="content_div container">
    <mat-table mat-table [dataSource]="data" class="main-table" matSort (matSortChange)="sort($event)">

        <ng-container matColumnDef="matter">
            <mat-header-cell *matHeaderCellDef mat-sort-header mat-sort-header translate>LTM_MATTER</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.matter}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="test">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>LTM_TEST</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.test}}
            </mat-cell>
        </ng-container>


        <ng-container matColumnDef="value">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>LTM_VALUE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.value | number: '1.2-4'}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="timeStamp">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_TIME</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.timeStamp | date: 'dd/MM/yyyy hh:mm'}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="maxValue">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>LTM_MAX_VALUE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.maxValue | number: '1.2-2'}}
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
</div>
<div class="content_div b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
