<div class="content_div container">
    <mat-table mat-table [dataSource]="data" class="main-table" matSort (matSortChange)="sort($event)">


        <ng-container matColumnDef="description">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_DESCRIPTION</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.description}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="equipmentDescription">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_EQUIPMENT</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.equipmentDescription}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="bleacherDescription">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>LTM_BLEACHER</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.bleacherDescription}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="zoneDescription">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>LTM_ZONE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.zoneDescription}}
            </mat-cell>
        </ng-container>


        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
</div>
<div class="content_div b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
