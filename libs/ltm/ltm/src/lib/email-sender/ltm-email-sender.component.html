<mat-card>
    <mat-card-content>
        <form [formGroup]="form">
            <mat-form-field class="default-100">
                <mat-label translate>COMMON_SUBJECT</mat-label>
                <input matInput formControlName="subject" type="text" autocomplete="none" required autofocus>
            </mat-form-field>

            <mat-form-field class="default-100">
                <mat-label translate>COMMON_MESSAGE</mat-label>
                <textarea matInput formControlName="message" rows="5"></textarea>
            </mat-form-field>

            <mat-form-field class="default-100">
                <mat-label translate>ADMINISTRATION_PASSWORD</mat-label>
                <input matInput formControlName="password" type="password" maxlength="40">
            </mat-form-field>
        </form>
    </mat-card-content>
</mat-card>
<div class="ctrl-div">
    <button mat-raised-button color="primary" (click)="send()" translate>COMMON_SEND</button>
    <button mat-raised-button (click)="cancel()" translate>COMMON_CANCEL</button>
</div>
