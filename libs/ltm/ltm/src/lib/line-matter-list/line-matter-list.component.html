<div class="table_div content_div">
    <mat-table mat-table [dataSource]="data" class="main-table" matSort (matSortChange)="sort($event)">

        <ng-container matColumnDef="normDescription">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>LTM_NORM</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.normDescription}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="matterDescription">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>LTM_MATTER</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.matterDescription}}
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selected" (click)="selectRow(row)"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
</div>
<div class="content_div b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
