<mat-card>
    <mat-card-header>
        <div class="ctrl_div default-100">
            <button mat-mini-fab color="primary"
                    [matTooltip]="'COMMON_SAVE' | translate"
                    (click)="save()"
                    [disabled]="!form?.valid">
                <i class="fas fa-save"></i>
            </button>
            <button mat-mini-fab
                    color="warn"
                    [matTooltip]="'COMMON_CANCEL' | translate"
                    translate (click)="cancel()">
                <i class="fas fa-redo"></i>
            </button>
        </div>
    </mat-card-header>
    <mat-card-content>
        @if (form !== null) {
            <form [formGroup]="form">

                <mat-form-field class="default-100">
                    <mat-label translate>COMMON_PRODUCT</mat-label>
                    <ss-auto-complete matInput
                                      formControlName="productId"
                                      [model]="productLookup">
                    </ss-auto-complete>
                </mat-form-field>
                <mat-form-field class="default-100">
                    <mat-label translate>LTM_SILO</mat-label>
                    <ss-auto-complete matInput
                                      formControlName="siloId"
                                      [model]="siloLookup">
                    </ss-auto-complete>
                </mat-form-field>
              <mat-form-field class="default-100">
                    <mat-label translate>COMMON_TYPE</mat-label>
                    <ss-auto-complete matInput
                                      formControlName="typeId"
                                      [model]="productTypeLookup">
                    </ss-auto-complete>
                </mat-form-field>
            </form>
        }
    </mat-card-content>
</mat-card>
