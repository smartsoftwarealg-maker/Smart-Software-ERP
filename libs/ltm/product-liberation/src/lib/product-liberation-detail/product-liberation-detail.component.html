<mat-card>
  <form *ngIf="form !== null" [formGroup]="form">
    <mat-form-field class="default-50">
      <mat-label translate>COMMON_DATE</mat-label>
      <ss-date-picker formControlName="date" required="true" [type]="'date'"></ss-date-picker>
      <mat-error *ngIf="form.controls['date'].invalid" translate>COMMON_FIELD_REQUIRED</mat-error>
    </mat-form-field>

    <mat-form-field class="default-100">
      <mat-label translate>COMMON_DESCRIPTION</mat-label>
      <input matInput formControlName="description" type="text" required autofocus>
    </mat-form-field>

  </form>
</mat-card>5
@if (form !== null && id) {
  <div class="detail__div">
    <router-outlet></router-outlet>
  </div>
}
