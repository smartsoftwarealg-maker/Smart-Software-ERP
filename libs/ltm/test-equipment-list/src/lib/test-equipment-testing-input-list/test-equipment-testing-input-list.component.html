<div class="table-container">
    <mat-table mat-table [dataSource]="data" class="main-table">
        <ng-container matColumnDef="equipmentDescription">
                <mat-header-cell *matHeaderCellDef translate>COMMON_EQUIPMENT</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.equipmentDescription }}
            </mat-cell>
        </ng-container>


        <ng-container matColumnDef="time">
                <mat-header-cell *matHeaderCellDef translate>COMMON_DATE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.time| date:'dd-MM-yyyy HH:mm' }}
            </mat-cell>
        </ng-container>


        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
</div>

<div class="pagination-container b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
