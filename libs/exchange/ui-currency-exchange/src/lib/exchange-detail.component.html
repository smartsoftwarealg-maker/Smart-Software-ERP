<mat-card>
  <mat-card-content>
    @if (form !== null) {
      <form novalidate [formGroup]="form">
        <mat-form-field id="excDate" class="default-50 sm-100">
          <mat-label translate>COMMON_DATE</mat-label>
          <ss-date-picker formControlName="exchDate"></ss-date-picker>
        </mat-form-field>
        <mat-form-field class="default-50 sm-100">
          <mat-label translate>LOGISTICS_CUSTOMER</mat-label>
          <ss-auto-complete matInput
            [required]="true"
            [model]="agentAutoCompleteModel"
            formControlName="agentId">
          </ss-auto-complete>
        </mat-form-field>
        <mat-form-field class="default-50 sm-100">
          <mat-label translate>EXCHANGE_PURCHASE</mat-label>
          <ss-auto-complete matInput
            [required]="true"
            [model]="purchaseAutoCompleteModel"
          formControlName="purchCurrency"></ss-auto-complete>
        </mat-form-field>
        <mat-form-field class="default-50 sm-100">
          <mat-label translate>EXCHANGE_SALES</mat-label>
          <ss-auto-complete matInput
            [required]="true"
            [model]="salesAutoCompleteModel"
          formControlName="soldCurrency"></ss-auto-complete>
        </mat-form-field>
        <mat-form-field class="default-50 sm-100">
          <mat-label translate>COMMON_DESCRIPTION</mat-label>
          <input matInput formControlName="memo" type="text">
        </mat-form-field>
        <mat-form-field class="default-50 sm-100">
          <mat-label translate>LOGISTICS_EXCHANGE_RATE</mat-label>
          <input matInput formControlName="exchRate"
            type="number"
            step="0.00001"
            required
            (change)="onChange()">
            @if (form.controls.exchRate.invalid) {
              <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
            }
          </mat-form-field>
          <mat-form-field class="default-50 sm-100">
            <mat-label translate>EXCHANGE_AMOUNT</mat-label>
            <input matInput formControlName="amount"
              type="number"
              step="0.00001"
              required
              (change)="onChange()">
              @if (form.controls.amount.invalid) {
                <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
              }
            </mat-form-field>
            <mat-form-field class="default-50 sm-100">
              <mat-label translate>EXCHANGE_SOLD_AMOUNT</mat-label>
              <input matInput formControlName="soldAmount"
                type="number"
                step="0.00001">
              </mat-form-field>
            </form>
          }
        </mat-card-content>
      </mat-card>
