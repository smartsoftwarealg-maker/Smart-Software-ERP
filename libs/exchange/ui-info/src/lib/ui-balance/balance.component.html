<div class="scrollable">
    <mat-table mat-table [dataSource]="data" class="main-table">
        <ng-container matColumnDef="currency">
            <mat-header-cell *matHeaderCellDef translate>LOGISTICS_CURRENCY</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.currency }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="debit">
            <mat-header-cell *matHeaderCellDef translate>EXCHANGE_WITHDRAWAL</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.debit  | number: '1.5-5' }}
            </mat-cell>
        </ng-container>


        <ng-container matColumnDef="credit">
            <mat-header-cell *matHeaderCellDef translate>EXCHANGE_DEPOSIT</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.credit  | number: '1.5-5' }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="balance">
            <mat-header-cell *matHeaderCellDef translate>EXCHANGE_BALANCE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.credit - e.debit  | number: '1.5-5' }}
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
</div>
<div class="pagination-container b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
