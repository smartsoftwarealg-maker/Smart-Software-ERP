<ng-container *ngIf="data">
    <mat-table mat-table [dataSource]="data" class="main-table">


        <ng-container matColumnDef="document">
            <mat-header-cell *matHeaderCellDef translate>STOCK_DOCUMENT</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.document}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="number">
            <mat-header-cell *matHeaderCellDef translate>STOCK_NUMBER</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.number }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="date">
            <mat-header-cell *matHeaderCellDef translate>STOCK_DATE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.date }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="qty">
            <mat-header-cell *matHeaderCellDef translate>STOCK_QTY</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.qty }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="price">
            <mat-header-cell *matHeaderCellDef translate>STOCK_PRICE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.price }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="pprice">
            <mat-header-cell *matHeaderCellDef translate>STOCK_PPRICE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.pprice }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="customer">
            <mat-header-cell *matHeaderCellDef translate>STOCK_CUSTOMER</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.customer }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="store">
            <mat-header-cell *matHeaderCellDef translate>STOCK_STORE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.store }}
            </mat-cell>
        </ng-container>


        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>

    <div class="pagination-container b-b-background">
        <ss-pagination [paginationModel]="pagination"></ss-pagination>
    </div>

</ng-container>
