<mat-card>
    <div [formGroup]="storeForm" class="btn_container">

        <mat-form-field >
            <mat-label translate>STOCK_STORE</mat-label>
            <ss-auto-complete matInput
                              [model]="storeAutoCompleteModel"
                              formControlName="storeId"></ss-auto-complete>
            <mat-error
                *ngIf="storeForm.controls['storeId'].hasError('required')" translate>COMMON_FIELD_REQUIRED
            </mat-error>
            <mat-error
                *ngIf="storeForm.controls['storeId'].hasError('validOption')" translate>COMMON_NO_MATCH
            </mat-error>
        </mat-form-field>
        <button mat-mini-fab
                color="primary"
                [disabled]="storeForm.controls['storeId'].value == null"
                [matTooltip]="'COMMON_ADD'|translate"
                (click)="addStore()">
            <i class="fas fa-plus"></i>
        </button>


        <button mat-mini-fab
                [disabled]="selectedStore == null"
                [matTooltip]="'COMMON_DELETE'|translate"
                (click)="removeStore()">
            <i class="fas fa-trash-alt"></i>
        </button>

    </div>
    <ng-container>
        <mat-table mat-table [dataSource]="data" class="main-table">

            <ng-container matColumnDef="storeName">
                <mat-header-cell *matHeaderCellDef translate>STOCK_STORE</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{e.storeName}}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="lotNumber">
                <mat-header-cell *matHeaderCellDef translate>STOCK_LOT_NUMBER</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{e.lotNumber}}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="stock">
                <mat-header-cell *matHeaderCellDef translate>STOCK_STOCK</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{ e.stock.toFixed(2) }}
                </mat-cell>
            </ng-container>


            <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
            <mat-row *matRowDef="let row; columns: displayedColumns;" class="selectable" (click)="selectStore(row)"></mat-row>
        </mat-table>

        <div class="pagination-container b-b-background">
            <ss-pagination [paginationModel]="pagination"></ss-pagination>
        </div>

    </ng-container>

</mat-card>
