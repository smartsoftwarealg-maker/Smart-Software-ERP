<div *ngIf="parentId" class="main-container">

    <div class="add-button">
        <button mat-mini-fab color="primary" (click)="showDetail(0)">
            <span class="fas fa-plus"></span>
        </button>
        <button mat-mini-fab (click)="edit()"
                [disabled]="!selectedId"
                color="accent">
            <span class="fas fa-pen"></span>
        </button>
        <button mat-mini-fab (click)="deleteSelected()"
                [disabled]="!selectedId"
                color="warn">
            <span class="fas fa-trash-alt"></span>
        </button>
    </div>

    <mat-table mat-table [dataSource]="data" class="main-table">


        <ng-container matColumnDef="position">
            <mat-header-cell *matHeaderCellDef translate>STOCK_POSITION</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.position}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="store">
            <mat-header-cell *matHeaderCellDef translate>STOCK_STORE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ stores[e.store] }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="reference">
            <mat-header-cell *matHeaderCellDef translate>STOCK_REFERENCE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.reference }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="description">
            <mat-header-cell *matHeaderCellDef translate>STOCK_DESCRIPTION</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ articles[e.reference] }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="qtySatisfied">
            <mat-header-cell *matHeaderCellDef translate>LOGISTICS_QTY_SATISFIED</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.qtySatisfied | number : '1.2-2'}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="price">
            <mat-header-cell *matHeaderCellDef translate>STOCK_PRICE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.price | number : '1.2-2'}}
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selectedId" (click)="selectRow(row)"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
    <div class="pagination-container b-b-background">
        <ss-pagination [paginationModel]="pagination"></ss-pagination>
    </div>

    <ss-doc-info
        *ngIf="selectedId"
        [displayedGroups]="['article', 'document']"
        [params]="{
            documentId: selectedRow?.transacId,
            documentURL:'/correctionIn',
            articleReference: selectedRow?.reference,
            articleStoreId: selectedRow?.store
        }">
    </ss-doc-info>
</div>
