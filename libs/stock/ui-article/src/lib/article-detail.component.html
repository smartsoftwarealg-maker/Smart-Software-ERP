<div class="main_container">
    <mat-card>
        <mat-card-content>
            <div class="form_container">
                <div class="image">
                    <ss-image-input width="160px" height="200px" [ImageModel]="imageModel"
                                    style="display: inline-block;">
                    </ss-image-input>
                </div>
                <form *ngIf="form" novalidate [formGroup]="form">

                    <div style="height: 16px"></div>

                    <mat-form-field floatLabel="always" class="default-25 sm-50">
                        <mat-label translate>COMMON_REFERENCE</mat-label>
                        <input matInput formControlName="reference" type="text" required>
                    </mat-form-field>
                    <div class="default-25 sm-hide"></div>
                    <mat-form-field floatLabel="always" class="default-50 sm-100">
                        <mat-label translate>LOGISTICS_DESCRIPTION</mat-label>
                        <input matInput formControlName="description2" type="text" required>
                    </mat-form-field>

                    <mat-form-field floatLabel="always" class="default-25 sm-50">
                        <mat-label translate>LOGISTICS_PRICE</mat-label>
                        <input matInput formControlName="price1" type="number" >
                    </mat-form-field>
                    <div class="default-25 sm-hide"></div>

                    <mat-form-field floatLabel="always" class="default-25 sm-100">
                        <mat-label translate>STOCK_VAT</mat-label>
                        <mat-select formControlName="vat">
                            <mat-option [value]="null"></mat-option>
                            <mat-option *ngFor="let v of vats" [value]="v.id">
                                {{v.value == null ? '0.00' : v.value.toFixed(2)}}
                            </mat-option>
                        </mat-select>
                    </mat-form-field>

                    <mat-form-field floatLabel="always" class="default-50 sm-100">
                        <mat-label translate>STOCK_MARK</mat-label>
                        <mat-select formControlName="mark">
                            <mat-option *ngFor="let m of marks" [value]="m.id">
                                {{m.description}}
                            </mat-option>
                        </mat-select>
                    </mat-form-field>

                    <mat-form-field class="default-50 sm-100">
                        <mat-label translate>STOCK_CLASS</mat-label>
                        <ss-auto-complete matInput
                                          [required]="true"
                                          [model]="classLookup"
                                          formControlName="klass">
                        </ss-auto-complete>
                        <mat-error
                            *ngIf="form.controls['klass'].hasError('required')" translate>COMMON_FIELD_REQUIRED
                        </mat-error>
                    </mat-form-field>

                    <mat-form-field floatLabel="always" class="default-50 sm-100">
                        <mat-label translate>STOCK_UNIT</mat-label>
                        <mat-select formControlName="salesUnit">
                            <mat-option *ngFor="let m of units" [value]="m.id">
                                {{m.description}}
                            </mat-option>
                        </mat-select>
                    </mat-form-field>

                    <div class="default-50 sm-100">
                        <mat-checkbox formControlName="notForSale" translate>STOCK_NON_STOCKED</mat-checkbox>
                    </div>

                </form>
            </div>
        </mat-card-content>
    </mat-card>
    <ss-article-store *ngIf="selectedRow && selectedRow.id !== 0" [article]="selectedRow"></ss-article-store>
</div>
