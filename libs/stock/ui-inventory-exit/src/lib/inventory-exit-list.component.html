<mat-table mat-table [dataSource]="data" class="main-table">


    <ng-container matColumnDef="number">
        <mat-header-cell *matHeaderCellDef translate>STOCK_NUMBER</mat-header-cell>
        <mat-cell *matCellDef="let e">
            {{e.number}}
        </mat-cell>
    </ng-container>


    <ng-container matColumnDef="date">
        <mat-header-cell *matHeaderCellDef translate>STOCK_DATE</mat-header-cell>
        <mat-cell *matCellDef="let e">
            {{ e.date }}
        </mat-cell>
    </ng-container>

    <ng-container matColumnDef="reference">
        <mat-header-cell *matHeaderCellDef translate>STOCK_REFERENCE</mat-header-cell>
        <mat-cell *matCellDef="let e">
            {{ e.reference }}
        </mat-cell>
    </ng-container>

    <ng-container matColumnDef="referenceDocDate">
        <mat-header-cell *matHeaderCellDef translate>STOCK_REFERENCE_DOC_DATE</mat-header-cell>
        <mat-cell *matCellDef="let e">
            {{ e.referenceDocDate }}
        </mat-cell>
    </ng-container>

    <ng-container matColumnDef="dealer">
        <mat-header-cell *matHeaderCellDef translate>STOCK_DEALER</mat-header-cell>
        <mat-cell *matCellDef="let e">
            {{ dealers[e.dealer] }}
        </mat-cell>
    </ng-container>


    <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
    <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
             routerLink="totals"   [queryParams]="{selected:row.id}"
             *matRowDef="let row; columns: displayedColumns;"></mat-row>
</mat-table>

<div class="pagination-container b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>

<mat-card id="report-area">
    <nav mat-tab-nav-bar mat-align-tabs="start">

        <a mat-tab-link [active]="rl2.isActive"
           routerLink="totals" routerLinkActive #rl2="routerLinkActive" [queryParams]="{selected:selected}"
           translate>STOCK_TOTALS
        </a>

    </nav>
    <mat-card-content>
        <router-outlet></router-outlet>
    </mat-card-content>
</mat-card>
