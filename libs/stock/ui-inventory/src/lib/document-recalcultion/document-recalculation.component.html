<mat-card>
    <mat-card-content>
        @if (form !== null) {
            <form [formGroup]="form">
                <mat-form-field id="eval_price" class="default-100">
                    <mat-label translate>COMMON_DOCUMENT</mat-label>
                    <mat-select formControlName="document" required>
                        @for (f of evalDocumentOptions; track f.id) {
                            <mat-option [value]="f.id" translate>{{ f.name }}</mat-option>
                        }
                    </mat-select>
                </mat-form-field>

                <mat-form-field class="default-100">
                    <mat-label translate>COMMON_FROM</mat-label>
                    <ss-date-picker formControlName="inventory_date"></ss-date-picker>
                </mat-form-field>

                <div class="btn_div default-100">
                    <button mat-raised-button
                            color="primary"
                            type="button"
                            [disabled]="processing() || !form?.valid"
                            (click)="recalculate()">
                        {{ 'STOCK_RECALCULATE' | translate }}
                    </button>
                </div>
            </form>
        }
    </mat-card-content>
</mat-card>
