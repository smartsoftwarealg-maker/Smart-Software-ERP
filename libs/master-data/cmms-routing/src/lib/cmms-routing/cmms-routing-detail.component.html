<mat-card class="size">
  @if (form !== null) {
    <form novalidate [formGroup]="form">
      <mat-form-field class="default-100">
        <mat-label translate>COMMON_DESCRIPTION</mat-label>
        <input matInput formControlName="description" type="text" required autofocus>
      </mat-form-field>
      <mat-form-field class="default-100">
        <mat-label translate>ADMINISTRATION_DESCRIPTION_AR</mat-label>
        <input matInput formControlName="descriptionAr" type="text">
      </mat-form-field>
    </form>
  }

</mat-card>
@if (showParts()) {
  <mat-tab-group (selectedIndexChange)="onTabChange($event)" class="size">
    <mat-tab label="{{ 'COMMON_DETAIL' | translate }}" [disabled]="isOnEdit"></mat-tab>
    @if (!isChecklist) {
      <mat-tab label="{{ 'STOCK_ARTICLES' | translate }}" [disabled]="isOnEdit"></mat-tab>
    }
    <mat-tab label="{{ 'COMMON_ARCHIVE' | translate }}" [disabled]="isOnEdit"></mat-tab>
  </mat-tab-group>
}
@if (id > 0 && !isLoading()) {
  <router-outlet> </router-outlet>
}
