<div class="container size">
    <mat-table mat-table [dataSource]="data" class="main-table" matSort (matSortChange)="sort($event)">

        <ng-container matColumnDef="description">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_DESCRIPTION</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.description}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="descriptionAr">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>ADMINISTRATION_DESCRIPTION_AR</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.descriptionAr}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="cost">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>CMMS_LABOR_COST</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.cost | number: '1.2-2'}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="laborHours">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>CMMS_LABOR_HOURS</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.laborHours | number: '1.2-2'}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="isCheckList">
            <mat-header-cell *matHeaderCellDef >{{ 'CMMS_CHECKLIST' | translate }} ?</mat-header-cell>
            <mat-cell *matCellDef="let e">
                <mat-checkbox [class.mat-checkbox-disabled]="false" disabled="true"
                              [checked]="e.isChecklist">
                </mat-checkbox>
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
</div>
<div class="size b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
