<div class="container">
  <mat-card class="user-list-div">
    <mat-list role="list" class="user-list-div">
      @for (u of users; track u) {
        <mat-list-item class="selectable"
          [class.selected]="u.id === selectedUserId"
          role="listitem"
          (click)="selectUser(u)">
          {{ u.fullName }}
        </mat-list-item>
      }
    </mat-list>
    <mat-card-footer>
      <div class="pagination-container b-b-background">
        <ss-pagination [paginationModel]="userPagination"></ss-pagination>
      </div>
    </mat-card-footer>
  </mat-card>

  <div class="store-div">
    @if (isManager) {
      <div [formGroup]="storeForm" class="btn-div">
        <mat-form-field>
          <mat-label translate>STOCK_STORE</mat-label>
          <ss-auto-complete matInput
            [model]="storeAutoCompleteModel"
          formControlName="id"></ss-auto-complete>
          @if (storeForm.controls['id'].hasError('required')) {
            <mat-error
              translate>COMMON_FIELD_REQUIRED
            </mat-error>
          }
        </mat-form-field>
        @if (isManager) {
          <button mat-mini-fab
            color="primary"
            [disabled]="storeForm.controls['id']?.value == null || !selectedUserId "
            [matTooltip]="'COMMON_ADD'|translate"
            (click)="addStore()">
            <i class="fas fa-plus"></i>
          </button>
        }
        @if (isManager) {
          <button mat-mini-fab
            [disabled]="selectedStore == null || !selectedUserId || !selectedStore"
            [matTooltip]="'COMMON_DELETE'|translate"
            (click)="removeStore()">
            <i class="fas fa-trash-alt"></i>
          </button>
        }
      </div>
    }
    <mat-card class="store-list-div">
      <mat-list role="list">
        @for (s of stores; track s) {
          <mat-list-item class="selectable"
            [class.selected]="s.id === selectedStore?.id"
            role="listitem"
            (click)="selectStore(s)">
            {{ s.storeDescription }}
          </mat-list-item>
        }
      </mat-list>
    </mat-card>
    <div class="pagination-container b-b-background">
      <ss-pagination [paginationModel]="storePagination"></ss-pagination>
    </div>
  </div>
</div>
