<div class="div_table size">
    <mat-table mat-table [dataSource]="data" class="main-table" matSort (matSortChange)="sort($event)">

        <ng-container matColumnDef="from">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_FROM</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.from | date: 'dd/MM/yyyy' }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="to">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_TO</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.to | date: 'dd/MM/yyyy' }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="description">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>ADMINISTRATION_DESCRIPTION</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.description}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="childDescription">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_PRODUCT</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.childDescription}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="version">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_VERSION</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.version}}
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns;">
        </mat-row>
    </mat-table>
</div>
<div class="size b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
