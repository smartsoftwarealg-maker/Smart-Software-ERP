@if (form !== null) {
    <mat-card>
        <mat-card-content>
            <form [formGroup]="form">

                <mat-form-field id="description" class="default-100">
                    <mat-label translate>ADMINISTRATION_DESCRIPTION</mat-label>
                    <input matInput formControlName="description" type="text" required>
                    @if (form.controls['description'].invalid) {
                        <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
                    }
                </mat-form-field>

                <mat-form-field class="default-100">
                    <mat-label translate>COMMON_PRODUCT</mat-label>
                    <ss-auto-complete matInput
                                      [required]="true"
                                      [model]="finalProductLookup"
                                      formControlName="productId">
                    </ss-auto-complete>
                    @if (form.controls['productId'].hasError('required')) {
                        <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
                    }
                </mat-form-field>

                <mat-form-field class="default-50 sm-100">
                    <mat-label translate>COMMON_FROM</mat-label>
                    <ss-date-picker formControlName="from" type="date"></ss-date-picker>
                </mat-form-field>

                <mat-form-field class="default-50 sm-100">
                    <mat-label translate>COMMON_TO</mat-label>
                    <ss-date-picker formControlName="to" type="date"></ss-date-picker>
                </mat-form-field>

                <mat-form-field class="default-50 sm-100">
                    <mat-label translate>COMMON_VERSION</mat-label>
                    <input matInput formControlName="version" type="number" required>
                </mat-form-field>

                <mat-form-field class="default-50 sm-100">
                    <mat-label translate>PROD_UPDATE_DATE</mat-label>
                    <ss-date-picker formControlName="updateDate" type="date"></ss-date-picker>
                </mat-form-field>

                <mat-form-field class="default-100">
                    <mat-label translate>COMMON_MEMO</mat-label>
                    <input matInput formControlName="updateMemo" type="text">
                </mat-form-field>
            </form>

        </mat-card-content>
    </mat-card>
}

@if (id) {
    <ss-bom-children [bomId]="id"/>
}
