<div class="div_table size">
    <mat-table mat-table [dataSource]="data" class="main-table" matSort (matSortChange)="sort($event)">

        <ng-container matColumnDef="reference">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_REFERENCE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.reference}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="storeName">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>STOCK_STORE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.storeName}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="lotNumber">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>STOCK_LOT_NUMBER</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.lotNumber}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="description">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>ADMINISTRATION_DESCRIPTION</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.description}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="price1">
            <mat-header-cell *matHeaderCellDef mat-sort-header><span translate>STOCK_PRICE</span>1</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.price1 | number:'1.2-4'}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="price2">
            <mat-header-cell *matHeaderCellDef mat-sort-header><span translate>STOCK_PRICE</span>2</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.price2 | number:'1.2-4'}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="price3">
            <mat-header-cell *matHeaderCellDef mat-sort-header><span translate>STOCK_PRICE</span>3</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.price3 | number:'1.2-4'}}
            </mat-cell>
        </ng-container>


        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns;">
        </mat-row>
    </mat-table>
</div>
<div class="size b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
