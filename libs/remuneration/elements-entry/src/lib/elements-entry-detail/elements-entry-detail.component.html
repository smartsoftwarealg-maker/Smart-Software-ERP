<mat-card class=size_div>
    <div class="default-20 sm-50 employee-card selectable mat-elevation-z6" *ngIf="form">

        <div class="person-photo">
            <ss-image-input width="120px" height="120px" [imageModel]="employee.imageModel"
                            style="display: inline-block;">
            </ss-image-input>
        </div>

        <div class="employee-details">
            <div style="font-size: 1.5em; text-align: start; font-weight: bolder">{{employee.id}}</div>
            <div style="font-weight: bold;">{{employee.fullName}}</div>
            <div style="font-size: 0.7em">{{employee.post}}</div>
        </div>
    </div>

    <div class="default-80 sm-50">
        <mat-form-field class="default-100">
            <mat-label><span translate>REMUN_INPUT_FILTERS</span></mat-label>
            <mat-select (selectionChange)="selectInput($event)" [value]="infoSrv.selectedInput">
                <mat-option *ngFor="let i of infoSrv.inputFilter" [value]="i.id">
                    {{ i.description }}
                </mat-option>
            </mat-select>
        </mat-form-field>

        <mat-radio-group aria-label="Select an option">
            <mat-radio-button value="1"
                              class="default-80"
                              [checked]="infoSrv.selectionMode === 1 "
                              (click)="setSelectionMode(1)"
                              translate>COMMON_VARIABLE
            </mat-radio-button>
            <mat-radio-button value="2"
                              class="default-80"
                              [checked]="infoSrv.selectionMode === 2 "
                              (click)="setSelectionMode(2)"
                              translate>REMUN_FIXED
            </mat-radio-button>
        </mat-radio-group>
    </div>
</mat-card>
