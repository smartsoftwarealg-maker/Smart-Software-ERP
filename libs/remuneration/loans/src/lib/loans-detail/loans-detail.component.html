@defer (when form) {
    <mat-card>
        <mat-card-content>
            <form [formGroup]="form">

                <mat-form-field class="default-50 sm-100">
                    <mat-label translate>PAYROLL_EMPLOYEE</mat-label>
                    <ss-auto-complete matInput
                                      [required]="true"
                                      [model]="employeeAutoCompleteModel"
                                      formControlName="employee">
                    </ss-auto-complete>
                    <mat-error
                        *ngIf="form.controls['employee'].hasError('required')" translate>COMMON_FIELD_REQUIRED
                    </mat-error>
                </mat-form-field>

                <mat-form-field class="default-50 sm-100">
                    <mat-label translate>REMUN_LOAN</mat-label>
                    <ss-auto-complete matInput
                                      [required]="true"
                                      [model]="loanLookup"
                                      formControlName="loan">
                    </ss-auto-complete>
                    <mat-error
                        *ngIf="form.controls['loan'].hasError('required')" translate>COMMON_FIELD_REQUIRED
                    </mat-error>
                </mat-form-field>


                <mat-form-field class="default-50">
                    <mat-label translate>PAYROLL_STARTING_MONTH</mat-label>
                    <ss-paymonth-editor formControlName="payMonth" required></ss-paymonth-editor>
                    <mat-error *ngIf="form.controls['payMonth'].invalid" translate>COMMON_FIELD_REQUIRED</mat-error>
                </mat-form-field>

                <mat-form-field class="default-50">
                    <mat-label translate>PAYROLL_MONTH_COUNT</mat-label>
                    <input matInput formControlName="number" type="number" required step="1">
                    <mat-error *ngIf="form.controls['number'].invalid" translate>COMMON_FIELD_REQUIRED</mat-error>
                </mat-form-field>

                <mat-form-field class="default-50 sm-100">
                    <mat-label translate>COMMON_AMOUNT</mat-label>
                    <input matInput formControlName="amount" type="number" required step="1">
                    <mat-error *ngIf="form.controls['amount'].invalid" translate>COMMON_FIELD_REQUIRED</mat-error>
                </mat-form-field>

                <!--           <pre>{{form.value | json}}</pre>-->
            </form>

        </mat-card-content>
    </mat-card>
}
