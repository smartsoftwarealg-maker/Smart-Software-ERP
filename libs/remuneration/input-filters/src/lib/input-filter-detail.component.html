<form *ngIf="form !== null" novalidate [formGroup]="form" class="container">

  <mat-form-field id="description" class="description">
    <mat-label translate>COMMON_DESCRIPTION</mat-label>
    <input matInput formControlName="description" type="text" autofocus required>
    <mat-error *ngIf="form.controls['description'].invalid" translate>COMMON_FIELD_REQUIRED</mat-error>
  </mat-form-field>

  <mat-form-field id="selection" class="selection">
    <mat-label translate>REMUN_SELECTION</mat-label>
    <input matInput formControlName="selection" type="text" required readonly>
    <mat-error *ngIf="form.controls['description'].invalid" translate>COMMON_FIELD_REQUIRED</mat-error>
  </mat-form-field>

  <div class="llist">
    <mat-toolbar mat-subheader class="b-primary" translate> {{ 'REMUN_SELECTION' }}</mat-toolbar>
    <mat-selection-list #llist>
      <mat-list-option *ngFor="let s of selectionArray" [value]="s">
        {{ s }}
      </mat-list-option>
    </mat-selection-list>
  </div>

  <div class="rlist">
    <mat-toolbar color="primary" class="search_div">
      {{ 'REMUN_FIELDS' | translate }}
      <mat-form-field>
        <mat-label translate>COMMON_SEARCH</mat-label>
        <input matInput [formControl]="filter" type="text">
      </mat-form-field>
    </mat-toolbar>
    <div class="list-container">
      <mat-selection-list #elemlist>
        <mat-list-option *ngFor="let e of filteredElements" [value]="e.field">
          {{e.field}} {{ e.description }}
        </mat-list-option>
      </mat-selection-list>
    </div>
  </div>
  <div class="lbutton selection_buttons">
    <button mat-mini-fab color="primary" (click)="addElements(elemlist.selectedOptions)">&lt;</button>
    <button mat-mini-fab color="primary" (click)="elemlist.selectAll()"><i class="fa-solid fa-check-double"></i></button>
    <button mat-mini-fab color="primary" (click)="elemlist.deselectAll()"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div class="rbutton selection_buttons">
    <button mat-mini-fab color="primary" (click)="llist.deselectAll()"><i class="fa-solid fa-xmark"></i></button>
    <button mat-mini-fab color="primary" (click)="llist.selectAll()"><i class="fa-solid fa-check-double"></i></button>
    <button mat-mini-fab color="primary" (click)="removeElements(llist.selectedOptions)">&gt;</button>
  </div>
</form>
