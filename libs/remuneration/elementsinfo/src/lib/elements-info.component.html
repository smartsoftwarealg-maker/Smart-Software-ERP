<div class="container">
    <div class="main-table">
        <mat-table mat-table [dataSource]="data" matSort (matSortChange)="sort($event)">

            <ng-container matColumnDef="field">
                <mat-header-cell *matHeaderCellDef mat-sort-header translate>REMUN_FIELD</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{e.field}}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="description">
                <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_DESCRIPTION</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{e.description}}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="fixed">
                <mat-header-cell *matHeaderCellDef mat-sort-header translate>REMUN_FIXED</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    <mat-checkbox [class.mat-checkbox-disabled]="false" disabled="true"
                                  [checked]="e.fixed"></mat-checkbox>
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="specialFixed">
                <mat-header-cell *matHeaderCellDef mat-sort-header translate>REMUN_SPECIAL_FIXED</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    <mat-checkbox [class.mat-checkbox-disabled]="false" disabled="true"
                                  [checked]="e.specialFixed"></mat-checkbox>
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="common">
                <mat-header-cell *matHeaderCellDef mat-sort-header translate>REMUN_COLLECTIVE</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    <mat-checkbox [class.mat-checkbox-disabled]="false" disabled="true"
                                  [checked]="e.common"></mat-checkbox>
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="gridComputed">
                <mat-header-cell *matHeaderCellDef mat-sort-header translate>REMUN_GRID_COMPUTED</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    <mat-checkbox [class.mat-checkbox-disabled]="false" disabled="true"
                                  [checked]="e.gridComputed"></mat-checkbox>
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="postComputed">
                <mat-header-cell *matHeaderCellDef mat-sort-header translate>REMUN_POST_COMPUTED</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    <mat-checkbox [class.mat-checkbox-disabled]="false" disabled="true"
                                  [checked]="e.postComputed"></mat-checkbox>
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="minValue">
                <mat-header-cell *matHeaderCellDef mat-sort-header translate>REMUN_MIN</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{e.minValue | number: '1.2-2'}}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="maxValue">
                <mat-header-cell *matHeaderCellDef mat-sort-header translate>REMUN_MIN</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{e.maxValue | number: '1.2-2'}}
                </mat-cell>
            </ng-container>

            <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
            <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
                     *matRowDef="let row; columns: displayedColumns;"></mat-row>
        </mat-table>
    </div>
</div>
<div class="pagination-container b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
