<div class="container">
    <form *ngIf="form" [formGroup]="form">
        <mat-form-field class="default-50">
            <mat-label translate>PAYROLL_LAST_NAME</mat-label>
            <input matInput formControlName="lastName" type="text" autofocus readonly>
        </mat-form-field>

        <mat-form-field class="default-50">
            <mat-label translate>PAYROLL_FIRST_NAME</mat-label>
            <input matInput formControlName="firstName" type="text" readonly>
        </mat-form-field>

        <mat-form-field class="default-50">
            <mat-label translate>REMUN_ACQUIRED</mat-label>
            <input matInput formControlName="acquired" type="number" readonly>
        </mat-form-field>
        <mat-form-field class="default-50">
            <mat-label translate>REMUN_TAKEN</mat-label>
            <input matInput formControlName="taken" type="number" readonly>
        </mat-form-field>
        <mat-form-field class="default-50">
            <mat-label translate>REMUN_REST</mat-label>
            <input matInput formControlName="rest" type="number" readonly>
        </mat-form-field>
    </form>

    <ss-vacation-planning-detail-list></ss-vacation-planning-detail-list>
</div>
