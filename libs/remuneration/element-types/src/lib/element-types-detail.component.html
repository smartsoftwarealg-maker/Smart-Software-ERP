<mat-card>
    <mat-card-content>
        <form *ngIf="form !== null" novalidate [formGroup]="form">

            <mat-form-field class="default-50 sm-100" >
                <mat-label translate>COMMON_DESCRIPTION</mat-label>
                <input matInput formControlName="description" type="text"  readonly>
                <mat-error *ngIf="form.controls['description'].invalid" translate>COMMON_FIELD_REQUIRED</mat-error>
            </mat-form-field>

<!--            <mat-form-field id="fieldId" class="default-50 sm-100">-->
<!--                <mat-label translate>REMUN_FIELD</mat-label>-->
<!--                <input matInput formControlName="fieldId" type="text" autofocus required>-->
<!--                <mat-error *ngIf="form.controls['fieldId'].invalid" translate>COMMON_FIELD_REQUIRED</mat-error>-->
<!--            </mat-form-field>-->

            <mat-form-field class="default-50 sm-100">
                <mat-label translate>COMMON_FIELD_REQUIRED</mat-label>
                <ss-auto-complete matInput
                                  [required]="true"
                                  [model]="infoLookupModel"
                                  formControlName="fieldId">
                </ss-auto-complete>
                                <mat-error
                                    *ngIf="form.controls['fieldId'].hasError('required')" translate>COMMON_FIELD_REQUIRED
                                </mat-error>
            </mat-form-field>


        </form>

    </mat-card-content>
</mat-card>
