<mat-card>
  <mat-card-content>
    @if (form !== null) {
      <form novalidate [formGroup]="form">
        <mat-form-field class="default-100" >
          <mat-label translate>COMMON_DESCRIPTION</mat-label>
          <input matInput formControlName="description" type="text"  readonly>
          @if (form.controls['description'].invalid) {
            <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
          }
        </mat-form-field>
        <mat-form-field class="default-100">
          <mat-label translate>PAYROLL_FIELD</mat-label>
          <ss-auto-complete matInput
            [required]="true"
            [model]="infoLookupModel"
            formControlName="fieldId">
          </ss-auto-complete>
          @if (form.controls['fieldId'].hasError('required')) {
            <mat-error
              translate>COMMON_FIELD_REQUIRED
            </mat-error>
          }
        </mat-form-field>
      </form>
    }

  </mat-card-content>
</mat-card>
