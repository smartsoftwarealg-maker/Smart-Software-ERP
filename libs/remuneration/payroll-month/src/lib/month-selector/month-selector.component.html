@if (form) {
    <mat-card>
        <mat-card-content>
            <form novalidate [formGroup]="form">
                <mat-form-field class="default-50 sm-100">
                    <mat-label translate>PAYROLL_MONTH</mat-label>
                    <input matInput formControlName="month" type="number" required autofocus step="1">
                </mat-form-field>

                <mat-form-field class="default-50 sm-100">
                    <mat-label translate>PAYROLL_YEAR</mat-label>
                    <input matInput formControlName="year" type="number" required step="1">
                </mat-form-field>

                <mat-form-field floatLabel="always" class="default-50 sm-100">
                    <mat-label translate>PAYROLL_EMPLOYMENT_TYPE</mat-label>
                    <mat-select formControlName="offset" required>
                        @for (v of specialList; track v.id){
                        <mat-option [value]="v.paymonth">
                            {{ v.description }}
                        </mat-option>
                        }
                    </mat-select>
                </mat-form-field>

                @if (!processing) {
                    <div class="default-50 sm-50">
                        <button mat-raised-button color="primary"
                                type="button"
                                [disabled]="+form.controls['year'].value * 100 + (+form.controls['month'].value) > maxMonth()"
                                (click)="select(true)">
                            <i class="fa-solid fa-truck-ramp-box"></i>
                            {{ 'REMUN_LOAD_SPECIAL' | translate }}
                        </button>
                    </div>
                }
                <span class="default-100 sm-100"></span>
                <div class="default-50 sm-50"><span translate>REMUN_MIN</span>: <span class="mm__span">{{ minMM() }}
                    /{{ minYY() }} </span></div>
                <div class="default-50 sm-50"><span translate>REMUN_MAX</span>: <span class="mm__span">{{ maxMM() }}
                    /{{ maxYY() }} </span></div>
                <span class="default-100 sm-100"></span>

                @if (!processing) {
                    <div class="default-50 sm-50">
                        <button mat-raised-button color="primary"
                                type="button"
                                [disabled]="+form.controls['year'].value * 100 + (+form.controls['month'].value)> maxMonth()"
                                (click)="select(false)">
                            <i class="fa-solid fa-check"></i>
                            {{ 'REMUN_SELECT_MONTH' | translate }}
                        </button>
                    </div>
                }
                @if (!processing) {
                    <div class="default-50 sm-50">
                        <button mat-raised-button color="accent" type="button" (click)="cancel()">
                            <i class="fa-solid fa-person-to-door"></i>
                            {{ 'COMMON_CANCEL' | translate }}
                        </button>
                    </div>
                }
            </form>

            <span class="default-100 sm-100"></span>
            @if (processing) {
                <mat-progress-bar mode="indeterminate"></mat-progress-bar>
            }
        </mat-card-content>
    </mat-card>


}
