<mat-card *ngIf="form">
    <mat-card-content>
        <form  novalidate [formGroup]="form">
            <mat-form-field class="default-50 sm-100" >
                <mat-label translate>COMMON_MONTH</mat-label>
                <input matInput formControlName="month" type="number"  required autofocus readonly>
            </mat-form-field>
            <mat-form-field class="default-50 sm-100" >
                <mat-label translate>COMMON_YEAR</mat-label>
                <input matInput formControlName="year" type="number"  required readonly>
            </mat-form-field>

            <span class="default-100 sm-100"></span>

            <div *ngIf="!processing" class="default-50 sm-100" >
                <button mat-raised-button color="primary" type="button" (click)="close()">
                    {{ 'REMUN_CLOSE' | translate }}
                </button>
            </div>

            <div  *ngIf="!processing" class="default-50 sm-100">
                <button  mat-button type="button" (click)="cancel()">
                    {{ 'REMUN_CANCEL' | translate }}
                </button>
            </div>

        </form>

        <span class="default-100 sm-100"></span>

        <mat-progress-bar mode="indeterminate" *ngIf="processing"></mat-progress-bar>
    </mat-card-content>
</mat-card>
