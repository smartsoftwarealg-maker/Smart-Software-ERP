@if (form) {
    <mat-card>
        <mat-card-content>
            <form novalidate [formGroup]="form">
                <mat-form-field class="default-50">
                    <mat-label translate>PAYROLL_MONTH</mat-label>
                    <input matInput formControlName="month" type="number" required autofocus>
                </mat-form-field>
                <mat-form-field class="default-50">
                    <mat-label translate>PAYROLL_YEAR</mat-label>
                    <input matInput formControlName="year" type="number" required>
                </mat-form-field>

                <span class="default-100 sm-100"></span>
                @if (!processing) {
                    <div class="default-50">
                        <button mat-raised-button color="primary" type="button" (click)="generate()">
                            <i class="fa-solid fa-check"></i>
                            {{ 'COMMON_GENERATE' | translate }}
                        </button>
                    </div>

                    <div class="default-50">
                        <button mat-raised-button color="accent" type="button" (click)="cancel()">
                            <i class="fa-solid fa-person-to-door"></i>
                            {{ 'COMMON_EXIT' | translate }}
                        </button>
                    </div>
                }
            </form>

            <span class="default-100 sm-100"></span>

            @if (processing) {
                <mat-progress-bar mode="indeterminate"></mat-progress-bar>
            }
        </mat-card-content>
    </mat-card>
}
