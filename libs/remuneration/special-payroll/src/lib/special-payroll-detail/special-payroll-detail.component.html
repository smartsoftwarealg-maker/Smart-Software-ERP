<div class="container" [style.display]="processing? 'none': 'flex'">
    <form *ngIf="form !== null" novalidate [formGroup]="form">

        <mat-form-field class="description">
            <mat-label translate>COMMON_DESCRIPTION</mat-label>
            <input matInput formControlName="description" type="text" autofocus required>
            <mat-error *ngIf="form.controls['description'].invalid" translate>COMMON_FIELD_REQUIRED</mat-error>
        </mat-form-field>
    </form>

    <div class="ctrl-div" *ngIf="payrollId">
        <button mat-mini-fab color="primary" translate
                matTooltip="{{'REMUN_GENERATE_ALL' | translate}}"
                (click)="generateAll()">
            <i class="fas fa-layer-plus"></i>
        </button>

        <div class="employee-div" *ngIf="payrollId">
            <mat-form-field>
                <mat-label translate>PAYROLL_EMPLOYEE</mat-label>
                <ss-auto-complete matInput
                                  [required]="true"
                                  [model]="employeeAutoCompleteModel"
                                  [formControl]="employeeLookup"></ss-auto-complete>
            </mat-form-field>
            <button mat-mini-fab color="primary"
                    matTooltip="{{'REMUN_GENERATE_ONE' | translate}}"
                    [disabled]="!employeeLookup.value"
                    (click)="generateOne()">
                <i class="fas fa-plus-circle"></i>
            </button>
        </div>

        <div class="delete-div">
            <button mat-mini-fab color="warn"
                    [disabled]="!selected"
                    matTooltip="{{ 'REMUN_DELETE_SELECTED' | translate}}"
                    (click)="deleteSelected()">
                <i class="fas fa-minus-circle"></i>
            </button>

            <button mat-mini-fab color="warn"
                    matTooltip="{{ 'REMUN_DELETE_ALL' | translate}}"
                    (click)="deleteAll()">
                <i class="fas fa-layer-minus"></i>
            </button>
        </div>
    </div>

    <div class="main-table" *ngIf="payrollId">
        <mat-table mat-table [dataSource]="data">

            <ng-container matColumnDef="photo">
                <mat-header-cell *matHeaderCellDef style="justify-content: center" translate>PAYROLL_PHOTO
                </mat-header-cell>
                <mat-cell *matCellDef="let e">
                    <div class="person-photo">
                        <ss-image-input width="60px" height="76px"
                                        [ImageModel]="e.imageModel"
                                        style="display: inline-block;">
                        </ss-image-input>
                    </div>
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="id">
                <mat-header-cell *matHeaderCellDef translate>PAYROLL_ID</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{e.id}}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="firstName">
                <mat-header-cell *matHeaderCellDef translate>PAYROLL_FIRST_NAME</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{e.firstName}}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="lastName">
                <mat-header-cell *matHeaderCellDef translate>PAYROLL_LAST_NAME</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{e.lastName}}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="post">
                <mat-header-cell *matHeaderCellDef translate>PAYROLL_POST</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{e.post}}
                </mat-cell>
            </ng-container>


            <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
            <mat-row class="selectable" [class.selected]="row.id === selected" (click)="selectRow(row)"
                     *matRowDef="let row; columns: displayedColumns;"></mat-row>
        </mat-table>
    </div>

    <div class="pagination-container b-b-background">
        <ss-pagination [paginationModel]="pagingModel"></ss-pagination>
    </div>
</div>
<mat-spinner [style.display]="processing? 'block': 'none'"></mat-spinner>
