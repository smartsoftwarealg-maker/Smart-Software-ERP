<mat-card>
    <mat-card-content>
        <form *ngIf="form !== null" novalidate [formGroup]="form">

            <mat-form-field id="code" class="default-50">
                <mat-label translate>COMMON_JOURNAL</mat-label>
                <input matInput formControlName="journalDesc" type="text">
            </mat-form-field>

            <mat-form-field class="default-50 short-ctrl">
                <mat-label translate>COMMON_DATE</mat-label>
                <ss-date-picker formControlName="transacDate"></ss-date-picker>
            </mat-form-field>

            <mat-form-field id="description" class="default-100">
                <mat-label translate>ADMINISTRATION_DESCRIPTION</mat-label>
                <input matInput formControlName="description" type="text" required>
                <mat-error *ngIf="form.controls['description'].invalid" translate>COMMON_FIELD_REQUIRED</mat-error>
            </mat-form-field>

            <mat-form-field class="default-50" >
                <mat-label translate>COMMON_AGENT</mat-label>
                <ss-auto-complete matInput
                                  [required]="true"
                                  formControlName="agent"
                                  [model]="agentLookup">
                </ss-auto-complete>
            </mat-form-field>

            <mat-form-field class="default-50 a-number">
                <mat-label translate>TRS_EXPENSE</mat-label>
                <input matInput
                       min="0"
                       formControlName="expense"
                       type="number"
                       (blur)="onAmount()"
                       required>
                <mat-error *ngIf="form.controls['expense']?.value < 0.1" translate>COMMON_FIELD_REQUIRED</mat-error>
            </mat-form-field>

            <mat-form-field class="default-50">
                <mat-label translate>TRS_PIECENO</mat-label>
                <input matInput formControlName="pieceno" type="number" required>
            </mat-form-field>

            <mat-form-field class="default-50">
                <mat-label translate>TRS_NATURE</mat-label>
                <ss-auto-complete matInput
                                  [model]="groupLookup"
                                  formControlName="treasuryGroup"
                                  autofocus>
                </ss-auto-complete>
                <mat-error *ngIf="form.controls['treasuryGroup']?.invalid" translate>COMMON_FIELD_REQUIRED</mat-error>
            </mat-form-field>

            <mat-form-field class="default-100">
                <mat-label translate>COMMON_MEMO</mat-label>
                <input matInput formControlName="memo" type="text">
            </mat-form-field>

        </form>

    </mat-card-content>
</mat-card>
