<div class="content__div ctrl__div">
  <button mat-mini-fab color="warn" (click)="goBack()">
    <span class="fa-solid fa-rotate-left"></span>
  </button>

  <button mat-mini-fab color="primary" (click)="save()">
    <span class="fa-solid fa-floppy-disk"></span>
  </button>
</div>


<mat-card class="content__div">
  <mat-card-content>
    @if (form !== null) {
      <form novalidate [formGroup]="form">
        <mat-form-field id="code" class="default-50">
          <mat-label translate>COMMON_INVOICE_NUMBER</mat-label>
          <input matInput formControlName="invoiceNo" type="text" autofocus maxlength="12">
          @if (form.controls['invoiceNo'].invalid) {
            <mat-error translate>COMMON_FIELD_MAX_LENGTH</mat-error>
          }
        </mat-form-field>
        <mat-form-field class="default-50">
          <mat-label translate>COMMON_DATE</mat-label>
          <ss-date-picker formControlName="invoiceDate"></ss-date-picker>
        </mat-form-field>
        <mat-form-field id="description" class="default-100">
          <mat-label translate>ADMINISTRATION_DESCRIPTION</mat-label>
          <input matInput formControlName="description" type="text" required maxlength="50">
          @if (form.controls['description'].invalid) {
            <mat-error translate>COMMON_FIELD_REQUIRED </mat-error>
          }
        </mat-form-field>
        <!--            <mat-form-field class="default-50 number_fld">-->
        <!--                <mat-label translate>COMMON_AMOUNT</mat-label>-->
        <!--                <input matInput formControlName="amount" type="number" autofocus min="0" max="9999999">-->
        <!--                <mat-error *ngIf="form.controls['amount'].invalid" translate>COMMON_INVALID</mat-error>-->
      <!--            </mat-form-field>-->
      <mat-form-field class="default-50 a-number">
        <mat-label translate>TRS_INCOME</mat-label>
        <input matInput formControlName="income"
          type="number"
          (blur)="onAmount()"
          required>
      </mat-form-field>
      <mat-form-field class="default-50 a-number">
        <mat-label translate>TRS_EXPENSE</mat-label>
        <input matInput
          formControlName="expense"
          type="number"
          (blur)="onAmount()"
          required>
      </mat-form-field>
    </form>
  }

</mat-card-content>
</mat-card>
