<mat-card class="form_container">
    <form *ngIf="form" novalidate [formGroup]="form">

        <mat-form-field class="default-50 sm-100" required>
            <mat-label translate>COMMON_BANK</mat-label>
            <ss-auto-complete matInput
                              [required]="true"
                              [model]="bankLookUp"
                              formControlName="bankId"></ss-auto-complete>
        </mat-form-field>

        <mat-form-field class="default-50" required>
            <mat-label translate>COMMON_NUMBER</mat-label>
            <input matInput formControlName="number" type="text" required>
            <mat-error *ngIf="form.controls['number'].invalid" translate>
                COMMON_FIELD_REQUIRED
            </mat-error>
        </mat-form-field>

        <mat-form-field class="default-50" required>
            <mat-label translate>COMMON_DATE</mat-label>
            <ss-date-picker formControlName="checkDate" [required]="true"></ss-date-picker>
            <mat-error *ngIf="form.controls['checkDate'].invalid" translate>
                COMMON_FIELD_REQUIRED
            </mat-error>
        </mat-form-field>


        <mat-form-field class="default-50"  required>
            <mat-label translate>COMMON_AMOUNT</mat-label>
            <input matInput formControlName="amount" type="number">
        </mat-form-field>

        <!--        <pre > {{ form?.value | json }}</pre>-->
    </form>
</mat-card>
