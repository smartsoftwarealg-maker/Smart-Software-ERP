<div class="main-container">
    <div class="table-container">
        <mat-table mat-table [dataSource]="data" class="main-table">

            <ng-container matColumnDef="id">
                <mat-header-cell *matHeaderCellDef translate>TRS_ID</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{e.id}}
                </mat-cell>
            </ng-container>

            <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
            <mat-row class="selectable" [class.selected]="row.id == selected" (click)="selectRow(row)" *matRowDef="let row; columns: displayedColumns;"></mat-row>
        </mat-table>
    </div>

    <div class="pagination-container b-b-background">
        <ss-pagination [paginationModel]="pagination"></ss-pagination>
    </div>
</div>
