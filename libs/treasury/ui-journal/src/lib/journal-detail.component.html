<div class="main_container">
    <div class="form_container">
        <form *ngIf="form" novalidate [formGroup]="form">

            <div style="height: 16px"></div>

            <mat-form-field class="default-50 sm-100">
                <mat-label translate>TRS_DESCRIPTION</mat-label>
                <input matInput formControlName="description" type="text" required maxlength="128">
                <mat-error *ngIf="form.controls['description'].invalid" translate>
                    COMMON_FIELD_REQUIRED
                </mat-error>
            </mat-form-field>

            <mat-form-field class="default-50 sm-100">
                <mat-label translate>TRS_BANK</mat-label>
                <mat-select formControlName="bankId" required>
                    <mat-option *ngFor="let p of banks" [value]="p.id">
                        {{ p.description }}
                    </mat-option>
                </mat-select>
            </mat-form-field>

            <mat-form-field class="default-50 sm-100">
                <mat-label translate>TRS_BANK_ACCOUNT</mat-label>
                <input matInput formControlName="bankAccount" type="text" maxlength="32">
            </mat-form-field>

            <mat-form-field class="default-50 sm-100">
                <mat-label translate>TRS_JOURNAL_TYPE</mat-label>
                <mat-select formControlName="jType" required>
                    <mat-option *ngFor="let p of journalTypes" [value]="p.id">
                        {{ p.description}}
                    </mat-option>
                </mat-select>
            </mat-form-field>

            <div style="height: 16px"></div>

        </form>
    </div>
</div>
