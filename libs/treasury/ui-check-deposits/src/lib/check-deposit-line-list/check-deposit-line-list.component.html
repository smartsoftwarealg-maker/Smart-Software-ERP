@if (parentId > 0) {
    <div class="content__div ctrl__div">
        <mat-form-field appearance="fill">
            <mat-label translate>COMMON_SEARCH</mat-label>
            <input matInput [formControl]="searchText" type="text">
        </mat-form-field>
        <button mat-mini-fab color="primary" (click)="showDetail(0)" [matTooltip]="'COMMON_ADD' | translate">
            <span class="fas fa-plus"></span>
        </button>
        <button mat-mini-fab (click)="edit()"
                [matTooltip]="'COMMON_EDIT' | translate"
                [disabled]="id < 1"
                color="accent">
            <span class="fas fa-pen"></span>
        </button>
        <button mat-mini-fab (click)="delete()"
                [matTooltip]="'COMMON_DELETE' | translate"
                [disabled]="id < 1"
                color="warn">
            <span class="fas fa-trash-alt"></span>
        </button>
    </div>
}

<div class="content__div">
    <mat-table mat-table [dataSource]="data()" class="main-table">

        <ng-container matColumnDef="checkNumber">
            <mat-header-cell *matHeaderCellDef translate>COMMON_NUMBER</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.checkNumber }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="bankDescription">
            <mat-header-cell *matHeaderCellDef translate>COMMON_BANK</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.bankDescription }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="date">
            <mat-header-cell *matHeaderCellDef translate>TRS_DUE_DATE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.date | date: 'dd/MM/yyyy' }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="amount">
            <mat-header-cell *matHeaderCellDef translate>COMMON_AMOUNT</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.amount | number: '1.2-2' }}
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == id" (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
</div>
<div class="content__div b-b-background">
    <ss-pagination [paginationModel]="paginator"></ss-pagination>
</div>
