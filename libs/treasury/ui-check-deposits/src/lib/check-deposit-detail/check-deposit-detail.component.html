<mat-card class="form_container">
    @if (form !== null) {
        <form novalidate [formGroup]="form">
            <mat-form-field class="default-50">
                <mat-label translate>COMMON_NUMBER</mat-label>
                <input matInput formControlName="depositNumber" type="number">
            </mat-form-field>

            <mat-form-field class="default-50">
                <mat-label translate>COMMON_DATE</mat-label>
                <ss-date-picker formControlName="depositDate"></ss-date-picker>
            </mat-form-field>

            <mat-form-field class="default-50">
                <mat-label translate>COMMON_BANK</mat-label>
                <mat-select formControlName="bankId" required>
                    @for (p of banks; track p) {
                        <mat-option [value]="p.id">
                            {{ p.description }}
                        </mat-option>
                    }
                </mat-select>
                @if (form.controls['bankId'].invalid) {
                    <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
                }
            </mat-form-field>

            <mat-form-field class="default-100">
                <mat-label translate>ADMINISTRATION_DESCRIPTION</mat-label>
                <input matInput formControlName="description" type="text">
            </mat-form-field>

            @if (form.value.id) {
                <mat-form-field class="default-50">
                    <mat-label translate>COMMON_CREATED_AT</mat-label>
                    <input matInput formControlName="createdAt" type="text">
                </mat-form-field>
                <mat-form-field class="default-50">
                    <mat-label translate>COMMON_CREATED_BY</mat-label>
                    <input matInput formControlName="creatorName" type="text">
                </mat-form-field>
                <mat-form-field class="default-50">
                    <mat-label translate>COMMON_UPDATED_AT</mat-label>
                    <input matInput formControlName="updatedAt" type="text">
                </mat-form-field>
                <mat-form-field class="default-50">
                    <mat-label translate>COMMON_UPDATED_BY</mat-label>
                    <input matInput formControlName="updaterName" type="text">
                </mat-form-field>
            }
        </form>
    }
</mat-card>

<router-outlet></router-outlet>
