<div class="content__div ctrl__div">
    <button mat-mini-fab color="warn" (click)="goBack()">
        <span class="fa-solid fa-rotate-left"></span>
    </button>

    <button mat-mini-fab color="primary" (click)="save()">
        <span class="fa-solid fa-floppy-disk"></span>
    </button>
</div>

<mat-card class="content__div">
    <mat-card-content>
        @if (form !== null) {
            <form novalidate [formGroup]="form">
                @if (checkLookup) {
                    <mat-form-field class="default-100">
                        <mat-label translate>TRS_CHECK</mat-label>
                        <ss-auto-complete matInput
                                          [model]="checkLookup"
                                          formControlName="checkId"
                                          required="true"
                                          autofocus>
                        </ss-auto-complete>
                        @if (form.controls['checkId'].invalid) {
                            <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
                        }
                    </mat-form-field>
                }

                <mat-form-field class="default-50">
                    <mat-label translate>COMMON_BANK</mat-label>
                    <input matInput [value]="checkBankId() | bankDescription | async" type="text" disabled>
                </mat-form-field>

                <mat-form-field class="default-50">
                    <mat-label translate>TRS_DUE_DATE</mat-label>
                    <input matInput formControlName="date" type="text">
                </mat-form-field>

                <mat-form-field class="default-50">
                    <mat-label translate>COMMON_AMOUNT</mat-label>
                    <input matInput formControlName="amount" type="text">
                </mat-form-field>
            </form>
        }
    </mat-card-content>
</mat-card>
