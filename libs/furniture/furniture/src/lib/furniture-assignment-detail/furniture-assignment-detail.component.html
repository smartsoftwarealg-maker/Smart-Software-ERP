<mat-card>
    <mat-card-content>
        @defer (when form) {
            <form *ngIf="form !== null" novalidate [formGroup]="form">
                <mat-form-field class="default-50">
                    <mat-label translate>COMMON_NUMBER</mat-label>
                    <input matInput formControlName="number" type="number" required>
                    <mat-error *ngIf="form.controls['number'].invalid" translate>COMMON_FIELD_REQUIRED</mat-error>
                </mat-form-field>

                <mat-form-field class="default-50">
                    <mat-label translate>COMMON_DATE</mat-label>
                    <ss-date-picker formControlName="date"></ss-date-picker>
                </mat-form-field>

                <mat-form-field class="default-100">
                    <mat-label translate>LOGISTICS_CONSUMER</mat-label>
                    <ss-auto-complete matInput
                                      [model]="supplierLookup"
                                      formControlName="supplier">
                    </ss-auto-complete>
                </mat-form-field>

                <mat-form-field class="default-50">
                    <mat-label translate>ASSET_ORDER_NUMBER</mat-label>
                    <input matInput formControlName="orderNo" type="text">
                    <mat-error *ngIf="form.controls['orderNo'].invalid" translate>COMMON_FIELD_REQUIRED</mat-error>
                </mat-form-field>

                <mat-form-field class="default-50">
                    <mat-label translate>ASSET_INVOICE_NUMBER</mat-label>
                    <input matInput formControlName="invoiceNo" type="text">
                    <mat-error *ngIf="form.controls['invoiceNo'].invalid" translate>COMMON_FIELD_REQUIRED</mat-error>
                </mat-form-field>

            </form>
        }
    </mat-card-content>
</mat-card>
@if (id) {
    <router-outlet></router-outlet>
}
