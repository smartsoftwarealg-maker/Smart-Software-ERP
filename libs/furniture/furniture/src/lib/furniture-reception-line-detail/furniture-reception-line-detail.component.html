<mat-card>
  <mat-card-header>
    <div class="ctrl_div default-100">
      <button mat-mini-fab color="primary"
        [matTooltip]="'COMMON_SAVE' | translate"
        (click)="save()">
        <i class="fas fa-save"></i>
      </button>
      <button mat-mini-fab
        color="warn"
        [matTooltip]="'COMMON_CANCEL' | translate"
        translate (click)="cancel()">
        <i class="fas fa-redo"></i>
      </button>
    </div>
  </mat-card-header>
  <mat-card-content>
    @if (form !== null) {
      <form novalidate [formGroup]="form">
        <mat-form-field class="default-100">
          <mat-label translate>ASSET_FURNITURE</mat-label>
          <ss-auto-complete matInput
            [model]="furnitureLookup"
            formControlName="furniture">
          </ss-auto-complete>
        </mat-form-field>
        <mat-form-field class="default-100">
          <mat-label translate>COMMON_QTY</mat-label>
          <input matInput formControlName="qty" type="number">
        </mat-form-field>
        <mat-form-field class="default-100">
          <mat-label translate>LOGISTICS_PRICE</mat-label>
          <input matInput formControlName="price" type="number">
        </mat-form-field>
      </form>
    }
  </mat-card-content>
</mat-card>
<router-outlet></router-outlet>
