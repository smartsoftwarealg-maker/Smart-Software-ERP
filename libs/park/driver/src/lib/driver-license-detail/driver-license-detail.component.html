@if (form) {
  <div class="button_div size">
    @if (isEditable) {
      <button mat-mini-fab (click)="save()"
        color="accent">
        <i class="fas fa-save"></i>
      </button>
    }
    <button mat-mini-fab (click)="cancel()"
      color="warn" >
      <i class="fas fa-redo"></i>
    </button>
  </div>
}

<mat-card class="size">
  <mat-card-content>
    @if (form !== null) {
      <form novalidate [formGroup]="form">
        <mat-form-field class="default-50 sm-100">
          <mat-label translate>COMMON_FROM</mat-label>
          <ss-date-picker formControlName="from"></ss-date-picker>
        </mat-form-field>
        <mat-form-field class="default-50 sm-100">
          <mat-label translate>COMMON_TO</mat-label>
          <ss-date-picker formControlName="to"></ss-date-picker>
        </mat-form-field>
        <mat-form-field class="default-50 sm-100">
          <mat-label translate>COMMON_TYPE</mat-label>
          <input matInput formControlName="licenseType" type="text" required maxlength="2">
        </mat-form-field>
      </form>
    }

  </mat-card-content>
</mat-card>
