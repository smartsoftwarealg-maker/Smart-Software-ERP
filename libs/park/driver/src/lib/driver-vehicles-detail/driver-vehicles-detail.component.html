<div class="button_div size" *ngIf="form">
    <button mat-mini-fab (click)="save()"
            color="accent" *ngIf="isEditable">
        <i class="fas fa-save"></i>
    </button>
    <button mat-mini-fab (click)="cancel()"
            color="warn" >
        <i class="fas fa-redo"></i>
    </button>
</div>

<mat-card class="size">
    <mat-card-content>
        <form *ngIf="form !== null" novalidate [formGroup]="form">

            <mat-form-field class="default-50 sm-100">
                <mat-label translate>COMMON_DATE</mat-label>
                <ss-date-picker formControlName="date" autofocus></ss-date-picker>
            </mat-form-field>

            <mat-form-field class="default-100" autofocus>
                <mat-label translate>PARK_VEHICLE</mat-label>
                <ss-auto-complete matInput
                                  [model]="vehicleLookup"
                                  formControlName="vehicleId"
                                  required="true">
                </ss-auto-complete>
                <mat-error *ngIf="form.controls['vehicleId'].invalid" translate>COMMON_FIELD_REQUIRED</mat-error>
            </mat-form-field>
        </form>

    </mat-card-content>
</mat-card>
