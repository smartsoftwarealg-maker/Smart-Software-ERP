@if (form) {
  <div class="button_div size">
    @if (isEditable) {
      <button mat-mini-fab (click)="save()"
        color="accent">
        <i class="fas fa-save"></i>
      </button>
    }
    <button mat-mini-fab (click)="cancel()"
      color="warn" >
      <i class="fas fa-redo"></i>
    </button>
  </div>
}

<mat-card class="size">
  <mat-card-content>
    @if (form !== null) {
      <form novalidate [formGroup]="form">
        <mat-form-field class="default-50 sm-100" autofocus>
          <mat-label translate>COMMON_DATE</mat-label>
          <ss-date-picker formControlName="date"></ss-date-picker>
        </mat-form-field>
        <mat-form-field class="default-50 sm-100" >
          <mat-label translate>LOGISTICS_DRIVER</mat-label>
          <ss-auto-complete matInput
            [model]="personLookup"
            formControlName="driverId"
            required="true">
          </ss-auto-complete>
          @if (form.controls['driverId'].invalid) {
            <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
          }
        </mat-form-field>
        <mat-form-field class="default-100">
          <mat-label translate>COMMON_DESCRIPTION</mat-label>
          <input matInput formControlName="description" type="text" required>
        </mat-form-field>
      </form>
    }

  </mat-card-content>
</mat-card>
