<mat-card>
    <mat-card-content>
    <form *ngIf="form" novalidate [formGroup]="form" class="size">

        <mat-form-field class="default-50">
            <mat-label translate>COMMON_DATE</mat-label>
            <ss-date-picker formControlName="acquisitionDate"></ss-date-picker>
        </mat-form-field>

        <mat-form-field class="default-50 sm-100">
            <mat-label translate>COMMON_DESCRIPTION</mat-label>
            <input matInput formControlName="description" type="text" maxlength="70">
            <mat-error *ngIf="form.controls['description'].hasError('maxlength')" [translate]="{maxLen: 70}">
                COMMON_FIELD_MAX_LENGTH
            </mat-error>
        </mat-form-field>

        <mat-form-field class="default-50 sm-100">
            <mat-label translate>COMMON_PLATE_NUMBER</mat-label>
            <input matInput formControlName="plateNumber" type="text" maxlength="15">
            <mat-error *ngIf="form.controls['plateNumber'].hasError('maxlength')" [translate]="{maxLen: 15}">
                COMMON_FIELD_MAX_LENGTH
            </mat-error>
        </mat-form-field>

        <mat-form-field class="default-50 sm-100">
            <mat-label translate>PARK_ODOMETER</mat-label>
            <input matInput formControlName="odoMeter" type="number" min="0">
        </mat-form-field>

        <mat-form-field class="default-50 sm-100">
            <mat-label translate>COMMON_TYPE</mat-label>
            <ss-auto-complete matInput
                              [model]="typeLookup"
                              formControlName="vType"
                              required="true">
            </ss-auto-complete>
            <mat-error *ngIf="form.controls['vType'].invalid" translate>COMMON_FIELD_REQUIRED</mat-error>
        </mat-form-field>

    </form>
    </mat-card-content>
</mat-card>
