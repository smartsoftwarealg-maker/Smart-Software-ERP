<div class="size button__div">
    <!--    <mat-form-field>-->
    <!--        <mat-label translate>COMMON_SEARCH</mat-label>-->
    <!--        <input matInput [formControl]="searchText" type="text">-->
    <!--    </mat-form-field>-->

    <button mat-mini-fab color="primary" (click)="showDetail(0)">
        <span class="fas fa-plus"></span>
    </button>
    <button mat-mini-fab (click)="edit()"
            [disabled]="!selectedId"
            color="accent">
        <span class="fas fa-pen"></span>
    </button>
    <button mat-mini-fab (click)="deleteSelected()"
            [disabled]="!selectedId"
            color="warn">
        <span class="fas fa-trash-alt"></span>
    </button>
</div>


<div class="table_div size">
    <mat-table mat-table [dataSource]="data$ | async" class="main-table">

        <ng-container matColumnDef="number">
            <mat-header-cell *matHeaderCellDef translate>PARK_MISSION_NUMBER</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.number}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="firstName">
            <mat-header-cell *matHeaderCellDef translate>COMMON_FIRST_NAME</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.firstName}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="lastName">
            <mat-header-cell *matHeaderCellDef translate>COMMON_LAST_NAME</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.lastName}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="missionTime">
            <mat-header-cell *matHeaderCellDef translate>PARK_MISSION_DEPART_DATE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.missionTime | date: 'dd/MM/yyyy' }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="returnTime">
            <mat-header-cell *matHeaderCellDef translate>PARK_MISSION_RETURN_DATE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.returnTime | date: 'dd/MM/yyyy' }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="destination">
            <mat-header-cell *matHeaderCellDef translate>PARK_MISSION_DESTINATION</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.destination}}
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selectedId" (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
</div>
<div class="size b-b-background">
    <ss-pagination [paginationModel]="paginator"></ss-pagination>
</div>
