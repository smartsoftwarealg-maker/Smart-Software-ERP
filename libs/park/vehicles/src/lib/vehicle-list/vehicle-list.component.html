<div class="table_div size">
    <mat-table mat-table [dataSource]="data" class="main-table" matSort (matSortChange)="sort($event)">

        <ng-container matColumnDef="plateNumber">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_PLATE_NUMBER</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.plateNumber}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="typeDescription">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_TYPE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.typeDescription}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="description">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>ADMINISTRATION_DESCRIPTION</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.description}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="acquisitionDate">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>ADMINISTRATION_DATE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.acquisitionDate | date: 'dd/MM/yyyy' }}
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
</div>
<div class="size b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
