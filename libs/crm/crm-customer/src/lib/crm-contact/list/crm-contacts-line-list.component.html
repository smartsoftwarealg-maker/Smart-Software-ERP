<div class="size ctrl__div">
    <button mat-mini-fab color="primary" (click)="showDetail(0)" [matTooltip]="'COMMON_ADD' | translate">
        <span class="fas fa-plus"></span>
    </button>
    <button mat-mini-fab (click)="edit()"
            [disabled]="!selectedId"
            [matTooltip]="'COMMON_EDIT' | translate"
            color="accent">
        <span class="fas fa-pen"></span>
    </button>
    <button mat-mini-fab (click)="deleteSelected()" [matTooltip]="'COMMON_DELETE' | translate"
            [disabled]="!selectedId"
            color="warn">
        <span class="fas fa-trash-alt"></span>
    </button>
</div>


<div class="table_div size">
    <mat-table mat-table [dataSource]="data$ | async" class="main-table">

        <ng-container matColumnDef="lastName">
            <mat-header-cell *matHeaderCellDef translate>COMMON_LAST_NAME</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.lastName }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="firstName">
            <mat-header-cell *matHeaderCellDef translate>COMMON_FIRST_NAME</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.firstName }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="primaryEmail">
            <mat-header-cell *matHeaderCellDef translate>ADMINISTRATION_EMAIL</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.primaryEmail }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="primaryPhone">
            <mat-header-cell *matHeaderCellDef translate>ADMINISTRATION_PHONE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.primaryPhone }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="addressLine1">
            <mat-header-cell *matHeaderCellDef translate>ADMINISTRATION_ADDRESS</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.addressLine1 }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="companyName">
            <mat-header-cell *matHeaderCellDef translate>COMMON_COMPANY_NAME</mat-header-cell>
            <mat-cell *matCellDef="let e" translate>
                {{ e.companyName }}
            </mat-cell>
        </ng-container>

<!--        <ng-container matColumnDef="createdAt">-->
<!--            <mat-header-cell *matHeaderCellDef translate>COMMON_CREATION_TIME</mat-header-cell>-->
<!--            <mat-cell *matCellDef="let e" translate>-->
<!--                {{ e.createdAt | date: 'dd/MM/yyyy HH:mm:ss' }}-->
<!--            </mat-cell>-->
<!--        </ng-container>-->

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selectedRow?.id" (click)="selectRow(row)"
                 *matRowDef="let row; columns: displayedColumns;">
        </mat-row>
    </mat-table>
</div>
