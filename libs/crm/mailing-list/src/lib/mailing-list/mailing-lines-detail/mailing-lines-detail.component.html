<div class="ctrl_div default-100">
    <button mat-mini-fab color="primary"
            [matTooltip]="'COMMON_SAVE' | translate"
            (click)="save()"
            [disabled]="!form?.valid">
        <i class="fas fa-save"></i>
    </button>
    <button mat-mini-fab
            color="warn"
            [matTooltip]="'COMMON_CANCEL' | translate"
            translate (click)="cancel()">
        <i class="fas fa-redo"></i>
    </button>
</div>
<mat-card>
    @if (form) {
        <form novalidate [formGroup]="form">
            <mat-form-field class="default-50">
                <mat-label translate>COMMON_FULLNAME</mat-label>
                <input matInput formControlName="fullName" type="text" required autofocus>
            </mat-form-field>

            <mat-form-field class="default-50">
                <mat-label translate>COMMON_EMAIL</mat-label>
                <input matInput formControlName="email" type="text">
            </mat-form-field>


            <mat-form-field class="default-50">
                <mat-label translate>COMMON_MOBILE</mat-label>
                <input matInput formControlName="mobile" type="text">
            </mat-form-field>

            <div class="default-50">
                <mat-checkbox formControlName="isUnsubscribed">
                    {{ 'COMMON_IS_UNSUBSCRIBED' | translate }}
                </mat-checkbox>
            </div>


        </form>
    }
</mat-card>
