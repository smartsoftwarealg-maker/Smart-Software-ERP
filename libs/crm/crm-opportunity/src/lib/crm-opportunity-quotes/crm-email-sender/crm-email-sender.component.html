<mat-card>
    <mat-card-content>
        <form [formGroup]="form">
            <mat-form-field class="default-100">
                <mat-label translate>COMMON_SUBJECT</mat-label>
                <input matInput formControlName="subject" required/>
                @if (form.get('subject')?.hasError('required')) {
                    <mat-error>
                        Subject is required
                    </mat-error>
                }
            </mat-form-field>

            <mat-form-field class="default-100">
                <mat-label translate>COMMON_MESSAGE</mat-label>
                <textarea matInput rows="5" formControlName="message" required></textarea>
                @if (form.get('message')?.hasError('required')) {
                    <mat-error>
                        Message is required
                    </mat-error>
                }
            </mat-form-field>
        </form>
    </mat-card-content>
</mat-card>

<div class="ctrl__div">
    <button mat-raised-button color="primary" (click)="send()" translate>
        COMMON_SEND
    </button>
    <button mat-raised-button (click)="cancel()" translate>
        COMMON_CANCEL
    </button>
</div>
