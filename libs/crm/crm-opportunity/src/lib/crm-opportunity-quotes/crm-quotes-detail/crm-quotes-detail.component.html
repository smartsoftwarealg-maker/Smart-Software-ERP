<div class="ctrl__div size">
    <button matButton (click)="cancel()">
        <span><i class="fa-solid fa-rotate-right"></i> {{ 'COMMON_CANCEL' | translate }}</span>
    </button>
    <button mat-button color="primary" (click)="save()" [disabled]="disableSave">
        <i class="fa-solid fa-floppy-disk"></i> {{ 'COMMON_SAVE' | translate }}
    </button>

</div>
<mat-card>
    <mat-card-content>
        @if (form !== null) {
            <form novalidate [formGroup]="form">

                <mat-form-field id="number" class="default-33 sm-100">
                    <mat-label translate>COMMON_NUMBER</mat-label>
                    <input matInput formControlName="number" type="number">
                    @if (form.controls['number'].invalid) {
                        <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
                    }
                </mat-form-field>

                <mat-form-field class="default-33 sm-100">
                    <mat-label translate>COMMON_DATE</mat-label>
                    <ss-date-picker formControlName="date"></ss-date-picker>
                </mat-form-field>


                <mat-form-field class="default-33 sm-100">
                    <mat-label translate>COMMON_USER</mat-label>
                    <ss-auto-complete matInput
                                      [model]="userLookup"
                                      formControlName="userId">
                    </ss-auto-complete>
                </mat-form-field>

                <!--  <mat-form-field class="default-25 sm-100">
                      <mat-label translate>LOGISTICS_CURRENCY</mat-label>
                      <ss-auto-complete matInput
                                        [model]="currencyLookup"
                                        formControlName="currency">
                      </ss-auto-complete>
                  </mat-form-field>

                  <mat-form-field class="default-25 sm-100">
                      <mat-label translate>CRM_CURRENCY_RATE</mat-label>
                      <input matInput formControlName="currencyRate" type="number">
                  </mat-form-field>

                  <mat-form-field class="default-25 sm-100">
                      <mat-label>Dealer</mat-label>
                      <ss-auto-complete
                          matInput
                          [model]="dealerAutoCompleteModel"
                          formControlName="dealer">
                      </ss-auto-complete>
                      @if (form.controls['dealer'].hasError('required')) {
                          <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
                      }
                  </mat-form-field>


                  <mat-form-field class="default-25 sm-100">
                      <mat-label translate>COMMON_LOCKED</mat-label>
                      <mat-select formControlName="locked">
                          <mat-option [value]="false">No</mat-option>
                          <mat-option [value]="true">Yes</mat-option>
                      </mat-select>
                  </mat-form-field>
  -->
            </form>
        }
    </mat-card-content>
</mat-card>

@if (formId) {
    <router-outlet></router-outlet>
}
