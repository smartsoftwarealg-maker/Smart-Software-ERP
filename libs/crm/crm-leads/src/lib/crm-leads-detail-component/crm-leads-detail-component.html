<div class="ctrl__div size">
    <button matButton (click)="list()">
        @if (this.form?.touched && this.form.dirty) {
            <span><i class="fa-solid fa-rotate-right"></i> {{ 'COMMON_CANCEL'|translate }}</span>
        } @else {
            <span><i class="fa-solid fa-list"></i> {{ 'COMMON_LIST'|translate }}</span>
        }
    </button>
    <button matButton (click)="save()"><span><i
            class="fa-solid fa-floppy-disk"></i> {{ 'COMMON_SAVE'|translate }}</span></button>
</div>
@if (form) {
    <mat-card class="size">
        <form [formGroup]="form">
            <mat-form-field class="default-50">
                <mat-label translate>COMMON_FIRST_NAME</mat-label>
                <input matInput type="text" formControlName="firstName">
            </mat-form-field>

            <mat-form-field class="default-50">
                <mat-label translate>COMMON_LAST_NAME</mat-label>
                <input matInput type="text" formControlName="lastName">
            </mat-form-field>

            <mat-form-field class="default-50">
                <mat-label translate>LOGISTICS_EMAIL</mat-label>
                <input matInput type="text" formControlName="email">
            </mat-form-field>

            <mat-form-field class="default-50">
                <mat-label translate>ADMINISTRATION_PHONE</mat-label>
                <input matInput type="text" formControlName="phone">
            </mat-form-field>

            <mat-form-field class="default-50">
                <mat-label translate>COMMON_STATUS</mat-label>
                <mat-select formControlName="status">
                    @for (s of STATUS; track s) {
                        <mat-option [value]="s" translate>CRM_{{ s }}</mat-option>
                    }
                </mat-select>
            </mat-form-field>

            <mat-form-field class="default-50">
                <mat-label translate>COMMON_TO</mat-label>
                <ss-date-picker formControlName="createdAt"
                                [type]="'date'"
                                [required]=true>
                </ss-date-picker>
            </mat-form-field>
        </form>
    </mat-card>
}
