<div class="ctrl__div size">
    <button matButton (click)="list()">
        @if (this.form?.touched && this.form.dirty) {
            <span><i class="fa-solid fa-rotate-right"></i> {{ 'COMMON_CANCEL'|translate }}</span>
        } @else {
            <span><i class="fa-solid fa-list"></i> {{ 'COMMON_LIST'|translate }}</span>
        }
    </button>
    <button matButton (click)="save()"><span><i
            class="fa-solid fa-floppy-disk"></i> {{ 'COMMON_SAVE'|translate }}</span></button>
</div>
@if (form) {

        <form [formGroup]="form">
            <mat-card class="size">
                <mat-card-header>
                    <h6 translate>COMMON_COMPANY</h6>
                </mat-card-header>
                <mat-card-content>
                    <mat-form-field class="default-50">
                        <mat-label translate>COMMON_DESCRIPTION</mat-label>
                        <input matInput type="text" formControlName="description">
                    </mat-form-field>

                    <mat-form-field class="default-50">
                        <mat-label translate>COMMON_DETAIL</mat-label>
                        <input matInput type="text" formControlName="detail">
                    </mat-form-field>


                    <mat-form-field class="default-50">
                        <mat-label translate>COMMON_STATUS</mat-label>
                        <mat-select formControlName="status">
                            @for (s of STATUS; track s) {
                                <mat-option [value]="s" translate>CRM_{{ s }}</mat-option>
                            }
                        </mat-select>
                    </mat-form-field>
                </mat-card-content>
            </mat-card>
            <mat-card class="size">
                <mat-card-header>
                    <h6 translate>CRM_PROGRESS</h6>
                </mat-card-header>
                <mat-card-content></mat-card-content>
            </mat-card>

            <mat-card class="size">
                <mat-card-header>
                    <h6 translate>CRM_COMPANY_DETAIL</h6>
                </mat-card-header>
                <mat-card-content></mat-card-content>
            </mat-card>

            <mat-card class="size">
                <mat-card-header>
                    <h6 translate>CRM_CONTACT_DETAIL</h6>
                </mat-card-header>
                <mat-card-content>
                    <mat-form-field class="default-50">
                        <mat-label translate>LOGISTICS_EMAIL</mat-label>
                        <input matInput type="text" formControlName="email">
                    </mat-form-field>
                    <mat-form-field class="default-50">
                        <mat-label translate>ADMINISTRATION_PHONE</mat-label>
                        <input matInput type="text" formControlName="phone">
                    </mat-form-field>

                </mat-card-content>
            </mat-card>




            <mat-form-field class="default-50">
                <mat-label translate>COMMON_TO</mat-label>
                <ss-date-picker formControlName="createdAt"
                                [type]="'date'"
                                [required]=true>
                </ss-date-picker>
            </mat-form-field>
        </form>
}
