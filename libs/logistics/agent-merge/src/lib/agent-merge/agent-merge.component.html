<mat-card>
    <mat-card-content>
        <form [formGroup]="form">
            <mat-form-field class="default-100">
                <mat-label translate>COMMON_SOURCE</mat-label>
                <ss-auto-complete matInput
                                  [required]="true"
                                  formControlName="oldId"
                                  [model]="oldAgentLookup">
                </ss-auto-complete>
            </mat-form-field>

            <mat-form-field class="default-100">
                <mat-label translate>COMMON_DESTINATION</mat-label>
                <ss-auto-complete matInput
                                  [required]="true"
                                  formControlName="newId"
                                  [model]="newAgentLookup">
                </ss-auto-complete>
            </mat-form-field>
        </form>
    </mat-card-content>
    <mat-card-actions>
        <button mat-raised-button color="primary"
                [disabled]="!form.value.oldId || !form.value.newId || form.value.oldId ===form.value.newId"
                type="button"
                (click)="merge()">
            <i class="fa-regular fa-check"></i>
            {{ 'LOGISTICS_AGENT_MERGE' | translate }}
        </button>
    </mat-card-actions>
</mat-card>
