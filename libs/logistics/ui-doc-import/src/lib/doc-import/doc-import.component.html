<div class="container">
  <div class="crtl__div">
    <mat-form-field appearance="fill">
      <mat-label translate>LOGISTICS_DOCUMENT</mat-label>
      <mat-select matNativeControl required [formControl]="document">
        @for (d of documentList; track d) {
          <mat-option
            value="{{ d.id }}">{{ d.description | translate }}
          </mat-option>
        }
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="fill">
      <mat-label translate>COMMON_NUMBER</mat-label>
      <input matInput type="number" step="1" [formControl]="searchNumber">
    </mat-form-field>
  </div>

  <div class="list">
    <mat-table mat-table [dataSource]="importList" class="content-div">

      <ng-container matColumnDef="number">
        <mat-header-cell *matHeaderCellDef translate>STOCK_NUMBER</mat-header-cell>
        <mat-cell *matCellDef="let e">
          {{e.number}}
        </mat-cell>
      </ng-container>

      <ng-container matColumnDef="date">
        <mat-header-cell *matHeaderCellDef translate>COMMON_DATE</mat-header-cell>
        <mat-cell *matCellDef="let e">
          {{ e.date | date: 'dd-MM-yyyy' }}
        </mat-cell>
      </ng-container>

      <ng-container matColumnDef="reference">
        <mat-header-cell *matHeaderCellDef translate>COMMON_REFERENCE</mat-header-cell>
        <mat-cell *matCellDef="let e">
          {{ e.reference }}
        </mat-cell>
      </ng-container>

      <ng-container matColumnDef="refDate">
        <mat-header-cell *matHeaderCellDef translate>STOCK_REFERENCE_DOC_DATE</mat-header-cell>
        <mat-cell *matCellDef="let e">
          {{ e.refDate | date: 'dd/MM/yyyy' }}
        </mat-cell>
      </ng-container>


      <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
      <mat-row class="selectable" [class.selected]="row.number === importInfo?.number" (click)="selectRow(row)"
      *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>

  </div>
  <div class="ctrl">
    <button mat-raised-button color="primary" (click)="close()" [disabled]="!importInfo" translate>COMMON_IMPORT</button>
    <div class="pagination-container b-b-background">
      <ss-pagination [paginationModel]="paginator"></ss-pagination>
    </div>
    <button mat-raised-button (click)="cancel()" translate>COMMON_CANCEL</button>
  </div>
</div>
