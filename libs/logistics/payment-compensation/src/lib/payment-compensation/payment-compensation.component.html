<div class="form_container">
    <mat-form-field class="date">
        <mat-label translate>COMMON_DATE</mat-label>
        <ss-date-picker [formControl]="date"></ss-date-picker>
    </mat-form-field>

    <mat-form-field class="customer">
        <mat-label translate>{{ partner }}</mat-label>
        <ss-auto-complete matInput
                          [required]="true"
                          [model]="agentAutoCompleteModel"
                          [formControl]="agent">
        </ss-auto-complete>
    </mat-form-field>

    <mat-card class="payments">
        <div mat-subheader class="b-primary" translate> {{ 'COMMON_PAYMENTS' }} </div>
        <mat-tree [dataSource]="dataSource"
                  [treeControl]="treeControl"
                  id="payments">
            <!-- This is the tree node template for leaf nodes -->
            <mat-tree-node *matTreeNodeDef="let node"
                           matTreeNodePadding
                           class="selectable"
                           (click)="selectPayment(node)"
                           draggable="true"
                           (drop)="onDebtDrop($event, node.id)"
                           (dragover)="onOverChild($event, node.id)"
                           (dragstart)="onStart($event, node?.id+ '')"
                           [class.selected]="node.id === selectedPayment?.id">
                <!-- use a disabled button to provide padding for tree leaf -->
                <button mat-icon-button disabled></button>
                {{ node.description }}: {{ node.amount | number: '1.2-2'}}
            </mat-tree-node>
            <!-- This is the tree node template for expandable nodes -->
            <mat-tree-node *matTreeNodeDef="let node;when: hasChild"
                           matTreeNodePadding
                           class="selectable"
                           draggable="true"
                           (drop)="onDebtDrop($event, node.id)"
                           (dragover)="onOver($event)"
                           (dragstart)="onStart($event, node?.id+ '')"
                           (click)="selectPayment(node)"
                           [class.selected]="node.id === selectedPayment?.id">
                <button mat-icon-button matTreeNodeToggle
                        [attr.aria-label]="'Toggle ' + node.name">
                    {{treeControl.isExpanded(node) ? '-' : '+'}}
                </button>
                {{ node.description }}: {{ node.paidAmount | number: '1.2-2' }} / {{ node.amount | number: '1.2-2'}}
            </mat-tree-node>
        </mat-tree>
    </mat-card>

    <mat-card class="debts">
        <div mat-subheader class="b-primary" translate> {{ 'LOGISTICS_AGENT_DEBTS' }} </div>
        <mat-list role="list"
                  draggable="true"
                  (dragover)="onOver($event)"
                  (drop)="onPaymentDrop($event)"
                  id="debts">
            <mat-list-item role="listitem"
                           class="selectable"
                           *ngFor="let d of debts"
                           (click)="selectDebt(d)"
                           (dragstart)="onStart($event, d?.id+ '')"
                           draggable="true"
                           [class.selected]="d?.id === selectedDebt?.id">
                {{ d?.document }}: {{ d?.balance | number: '1.2-2' }}
            </mat-list-item>
        </mat-list>
    </mat-card>
    <div class="cancel">
        <button mat-raised-button
                color="accent"
                (click)="cancelPayments()"
                [disabled]="!selectedPayment || selectedPayment?.level === 0"><span
            translate>LOGISTICS_CANCEL_PAYMENT</span></button>
    </div>
    <div class="make">
        <button mat-raised-button
                color="primary"
                (click)="makePayment()"
                [disabled]="!selectedDebt || !selectedPayment || selectedPayment?.level !== 0"><span translate>LOGISTICS_MAKE_PAYMENT</span>
        </button>
    </div>
</div>
