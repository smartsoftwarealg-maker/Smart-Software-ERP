<mat-card>
  <mat-card-content>
    @if (form !== null) {
      <form novalidate [formGroup]="form">
        <mat-form-field id="description" class="value">
          <mat-label translate>LOGISTICS_DESCRIPTION</mat-label>
          <input matInput formControlName="description" type="text" required>
          @if (form.controls['description'].invalid) {
            <mat-error translate>COMMON_FIELD_REQUIRED
            </mat-error>
          }
        </mat-form-field>
        <mat-form-field id="descriptionِAr" class="value">
          <mat-label translate>LOGISTICS_DESCRIPTION_AR</mat-label>
          <input matInput formControlName="descriptionAr" type="text">
        </mat-form-field>
      </form>
    }
  </mat-card-content>
</mat-card>
