<ng-container>
    <mat-table mat-table [dataSource]="data" class="main-table">


        <ng-container matColumnDef="totalDebit">
            <mat-header-cell *matHeaderCellDef translate>LOGISTICS_DEBIT</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.totalDebit | number: '1.2-2' }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="totalCredit">
            <mat-header-cell *matHeaderCellDef translate>LOGISTICS_CREDIT</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.totalCredit | number: '1.2-2' }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="debit">
            <mat-header-cell *matHeaderCellDef translate>LOGISTICS_DEBIT</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.debit | number: '1.2-2' }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="credit">
            <mat-header-cell *matHeaderCellDef translate>LOGISTICS_CREDIT</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.credit | number: '1.2-2' }}
            </mat-cell>
        </ng-container>


        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>

    <div class="pagination-container b-b-background">
        <ss-pagination [paginationModel]="pagination"></ss-pagination>
    </div>

</ng-container>
