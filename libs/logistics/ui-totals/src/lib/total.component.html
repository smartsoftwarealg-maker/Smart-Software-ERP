<ng-container>
    <mat-table mat-table [dataSource]="data" class="main-table">


        <ng-container matColumnDef="description">
            <mat-header-cell *matHeaderCellDef translate>STOCK_DESCRIPTION</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.description}}
            </mat-cell>
        </ng-container>


        <ng-container matColumnDef="value">
            <mat-header-cell *matHeaderCellDef translate>STOCK_VALUE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.value.toFixed(2)}}
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>

    <div class="pagination-container b-b-background">
        <ss-pagination [paginationModel]="pagination"></ss-pagination>
    </div>

</ng-container>
