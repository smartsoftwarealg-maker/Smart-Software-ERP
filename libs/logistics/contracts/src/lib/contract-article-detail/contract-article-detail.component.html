<mat-toolbar>
    <button mat-mini-fab
            type="button"
            (click)="save()"
            color="primary">
        <i class="fa-solid fa-floppy-disk"></i>
    </button>

    <button mat-mini-fab
            type="button"
            (click)="cancel()"
            color="warn">
        <i class="fa-solid fa-rotate-right"></i>
    </button>

</mat-toolbar>

@if (form) {
    <form [formGroup]="form">

        <mat-form-field class="default-100">
            <mat-label translate>COMMON_ARTICLE</mat-label>
            <ss-auto-complete matInput
                              [model]="articleLookup"
                              formControlName="articleId"
                              required="true">
            </ss-auto-complete>
            <mat-error *ngIf="form.controls['articleId'].invalid" translate>COMMON_FIELD_REQUIRED</mat-error>
        </mat-form-field>

        <mat-form-field class="default-50 sm-100">
            <mat-label translate>COMMON_QTY</mat-label>
            <input matInput formControlName="qty" type="number" step="1">
        </mat-form-field>

        <mat-form-field class="default-50 sm-100">
            <mat-label translate>LOGISTICS_PRICE</mat-label>
            <input matInput formControlName="price" type="number" step="1">
        </mat-form-field>

        <mat-form-field class="default-50 sm-100">
            <mat-label translate>COMMON_VAT</mat-label>
            <input matInput formControlName="vat" type="number" step="1">
        </mat-form-field>

    </form>
}
