<div class="agent-div" autofocus>
    <mat-form-field>
        <mat-label translate>COMMON_AGENT</mat-label>
        <ss-auto-complete matInput
                          [model]="agentLookup"
                          [formControl]="agentId"
                          autofocus>
        </ss-auto-complete>
    </mat-form-field>
</div>
<div class="table-div">
    <mat-table mat-table [dataSource]="data" class="main-table">

        <ng-container matColumnDef="contractNo">
            <mat-header-cell *matHeaderCellDef translate>COMMON_NUMBER</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.contractNo}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="description">
            <mat-header-cell *matHeaderCellDef translate>COMMON_DESCRIPTION</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.description}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="fromDate">
            <mat-header-cell *matHeaderCellDef translate>COMMON_FROM</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.fromDate | date: 'dd/MM/yyyy' }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="toDate">
            <mat-header-cell *matHeaderCellDef translate>COMMON_TO</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.toDate | date: 'dd/MM/yyyy' }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="customerName">
            <mat-header-cell *matHeaderCellDef translate>LOGISTICS_CUSTOMER</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.customerName}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="projDate">
            <mat-header-cell *matHeaderCellDef translate>COMMON_DATE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.projDate | date: 'dd/MM/yyyy' }}
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
</div>
<div class="pagination-container b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
