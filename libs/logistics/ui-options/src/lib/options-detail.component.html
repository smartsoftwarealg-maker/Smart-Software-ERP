<mat-card>
    <mat-card-content>
        <form *ngIf="form !== null" novalidate [formGroup]="form">

            <mat-form-field id="defaultCurrency" class="default-50 sm-100">
                <mat-label translate>LOGISTICS_CURRENCY</mat-label>
                <mat-select formControlName="defaultCurrency" required>
                    <mat-option *ngFor="let f of currencies" [value]="f.id">{{f.description}}</mat-option>
                </mat-select>
                <mat-error *ngIf="form.controls['defaultCurrency'].invalid" translate>COMMON_FIELD_REQUIRED </mat-error>
            </mat-form-field>

            <mat-form-field id="eval_price" class="default-50 sm-100">
                <mat-label translate>LOGISTICS_EVAL_PRICE</mat-label>
                <mat-select formControlName="eval_price" required>
                    <mat-option *ngFor="let f of evalPriceOptions" [value]="f.id" translate>{{f.name}}</mat-option>
                </mat-select>
                <mat-error *ngIf="form.controls['eval_price'].invalid" translate>COMMON_FIELD_REQUIRED </mat-error>
            </mat-form-field>


            <mat-form-field class="default-50 sm-100">
                <mat-label translate>LOGISTICS_MAIN_STORE</mat-label>
                <ss-auto-complete matInput
                                  [required]="true"
                                  [model]="storeAutoCompleteModel"
                                  formControlName="mainStore">
                </ss-auto-complete>
            </mat-form-field>


            <mat-form-field class="default-50 sm-100">
                <mat-label translate>LOGISTICS_INVENTORY_DATE</mat-label>
                <ss-date-picker formControlName="inventory_date"></ss-date-picker>
            </mat-form-field>

            <div class="default-100 sm-100" >
                <mat-checkbox formControlName="checkPrices" translate>LOGISTICS_CHECK_PRICES</mat-checkbox>
            </div>

        </form>
    </mat-card-content>
</mat-card>
