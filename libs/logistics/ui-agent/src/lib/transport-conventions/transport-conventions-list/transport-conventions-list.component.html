<div class="size button__div">
    <button mat-mini-fab color="primary" (click)="showDetail(0)" [matTooltip]="'COMMON_ADD' | translate">
        <span class="fas fa-plus"></span>
    </button>
    <button mat-mini-fab (click)="edit()"
            [disabled]="!selectedId"
            [matTooltip]="'COMMON_EDIT' | translate"
            color="accent">
        <span class="fas fa-pen"></span>
    </button>
    <button mat-mini-fab (click)="deleteSelected()" [matTooltip]="'COMMON_DELETE' | translate"
            [disabled]="!selectedId"
            color="warn">
        <span class="fas fa-trash-alt"></span>
    </button>
</div>

<div class="table_div size">
    <mat-table mat-table [dataSource]="data$ | async" class="main-table" matSort (matSortChange)="sort($event)">

        <ng-container matColumnDef="conventionType">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>LOGISTICS_CONVENTION_TYPE</mat-header-cell>
            <mat-cell *matCellDef="let e" translate>
                {{ CONVENTIONS_TYPES[e.conventionType - 1] }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="centerDescription">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>LOGISTICS_SPECIFIC_TO</mat-header-cell>
            <mat-cell *matCellDef="let e" translate>
                {{e.centerDescription }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="conventionDate">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>LOGISTICS_CONVENTION_DATE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.conventionDate | date: 'dd/MM/yyyy' }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="fromDate">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_FROM</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.fromDate | date: 'dd/MM/yyyy' }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="toDate">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_TO</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.toDate | date: 'dd/MM/yyyy' }}
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selectedId" (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
</div>
<div class="size b-b-background">
    <ss-pagination [paginationModel]="paginator"></ss-pagination>
</div>
