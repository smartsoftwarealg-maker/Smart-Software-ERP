<div class="main-container">
    <mat-table mat-table [dataSource]="data" class="main-table">

        <ng-container matColumnDef="date">
            <mat-header-cell *matHeaderCellDef translate>COMMON_DATE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.date | date: 'dd-MM-yyyy'}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="denomination">
            <mat-header-cell *matHeaderCellDef translate>LOGISTICS_AGENT</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.denomination}}
            </mat-cell>
        </ng-container>


        <ng-container matColumnDef="number">
            <mat-header-cell *matHeaderCellDef translate>LOGISTICS_NUMBER</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.number }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="debit">
            <mat-header-cell *matHeaderCellDef translate>LOGISTICS_DEBIT</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ (e.amount > 0.0 ? e.amount : 0.0) | number: '1.2-2'}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="credit">
            <mat-header-cell *matHeaderCellDef translate>LOGISTICS_CREDIT</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ (e.amount < 0.0 ? e.amount : 0.0)  | number: '1.2-2' }}
            </mat-cell>
        </ng-container>


        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>

    <div class="pagination-container b-b-background">
        <ss-pagination [paginationModel]="pagination"></ss-pagination>
    </div>
</div>
