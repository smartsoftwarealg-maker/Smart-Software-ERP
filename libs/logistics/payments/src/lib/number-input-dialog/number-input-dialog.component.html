
<mat-dialog-content>
  <form [formGroup]="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ data.label | translate }}</mat-label>
      <input matInput type="number" formControlName="value">
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()" translate><i class="fas fa-times"> </i> COMMON_CANCEL</button>
  <button mat-raised-button color="primary" (click)="onConfirm()" [disabled]="form.invalid" translate><i class="fas fa-check"> </i> COMMON_OK</button>
</mat-dialog-actions>
