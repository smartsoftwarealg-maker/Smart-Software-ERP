<mat-card>
    <mat-card-content>
        <form *ngIf="form !== null" novalidate [formGroup]="form">

            <mat-form-field id="code" class="value">
                <mat-label translate>LOGISTICS_CODE</mat-label>
                <input matInput formControlName="code" type="text" required>
                <mat-error *ngIf="form.controls.code.invalid" translate>COMMON_FIELD_REQUIRED
                </mat-error>
            </mat-form-field>


            <mat-form-field id="description" class="value">
                <mat-label translate>LOGISTICS_DESCRIPTION</mat-label>
                <input matInput formControlName="description" type="text" required>
                <mat-error *ngIf="form.controls.description.invalid" translate>COMMON_FIELD_REQUIRED
                </mat-error>
            </mat-form-field>

            <mat-form-field class="value">
                <mat-label translate>LOGISTICS_GROUP</mat-label>
                <mat-select formControlName="groupId" >
                    <mat-option [value]="null"></mat-option>
                    <mat-option *ngFor="let v of groups" [value]="v.id">
                        {{v ? v.description : ''}}
                    </mat-option>
                </mat-select>
                <mat-error *ngIf="form.controls.groupId.invalid" translate>COMMON_FIELD_REQUIRED
                </mat-error>
            </mat-form-field>


        </form>
    </mat-card-content>
</mat-card>
