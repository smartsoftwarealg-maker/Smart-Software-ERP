<mat-card>
    <mat-card-content>
        <form *ngIf="form != null" novalidate [formGroup]="form">

            <mat-form-field id="code" class="value">
                <mat-label translate>LOGISTICS_CODE</mat-label>
                <input matInput formControlName="code" type="text" required>
                <mat-error *ngIf="form.controls.code.invalid" translate>COMMON_FIELD_REQUIRED
                </mat-error>
            </mat-form-field>


            <mat-form-field id="description" class="value">
                <mat-label translate>COMMON_DESCRIPTION</mat-label>
                <input matInput formControlName="description" type="text" required>
                <mat-error *ngIf="form.controls.description.invalid" translate>COMMON_FIELD_REQUIRED
                </mat-error>
            </mat-form-field>

            <mat-form-field id="descriptionAr" class="value">
                <mat-label translate>COMMON_DESCRIPTION_AR</mat-label>
                <input matInput formControlName="descriptionAr" type="text">
            </mat-form-field>

            <mat-form-field id="exchangeRate" class="value">
                <mat-label translate>LOGISTICS_EXCHANGE_RATE</mat-label>
                <input matInput formControlName="exchangeRate" type="number"  step="0.00001" required>
                <mat-error *ngIf="form.controls.exchangeRate.invalid" translate>COMMON_FIELD_REQUIRED</mat-error>
            </mat-form-field>

        </form>
    </mat-card-content>
</mat-card>
