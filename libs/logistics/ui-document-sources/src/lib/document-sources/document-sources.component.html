<div class="div_table size">
    <mat-table mat-table [dataSource]="data$|async" class="main-table" matSort (matSortChange)="sort($event)">

        <ng-container matColumnDef="document">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>ADMINISTRATION_CODE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.document}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="number">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>ADMINISTRATION_DESCRIPTION</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.number}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="date">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_DATE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.date | date: 'dd/MM/yyyy' }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="qtyOrdered">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>LOGISTICS_QTY_ORDERED</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.qtyOrdered | number: '1.2-2'}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="qtySatisfied">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>LOGISTICS_QTY_SATISFIED</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.qtySatisfied | number: '1.2-2'}}
            </mat-cell>
        </ng-container>


        <mat-header-row *matHeaderRowDef="displayedColumns(); sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selectedId()" (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns();">
        </mat-row>
    </mat-table>
</div>
