<mat-card class="container">
  <mat-card-content>
    @if (form !== null) {
      <form novalidate [formGroup]="form">
        <mat-form-field class="default-100" autofocus>
          <mat-label translate>ADMINISTRATION_USERS</mat-label>
          <ss-auto-complete matInput
            formControlName="userId"
            [model]="userLookup">
          </ss-auto-complete>
        </mat-form-field>
        <mat-form-field class="default-100">
          <mat-label translate>COMMON_MESSAGE</mat-label>
          <ss-auto-complete matInput
            formControlName="messageId"
            [model]="messageLookup">
          </ss-auto-complete>
        </mat-form-field>
        <!--            <mat-form-field class="default-100">-->
        <!--                <mat-label translate>COMMON_AMOUNT</mat-label>-->
        <!--                <input matInput formControlName="amount" type="number">-->
        <!--                <mat-error *ngIf="form.controls['amount'].invalid" translate>COMMON_FIELD_REQUIRED</mat-error>-->
      <!--            </mat-form-field>-->
    </form>
  }

</mat-card-content>
</mat-card>
