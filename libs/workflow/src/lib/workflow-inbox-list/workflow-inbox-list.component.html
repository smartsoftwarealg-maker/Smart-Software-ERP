<div class="mode-div" >
    <mat-checkbox class="example-margin"
                  (change)="changeMode($event.checked)">
        <span translate>{{ 'COMMON_SHOW_ALL' }}</span>
    </mat-checkbox>
</div>
<mat-card class="container table-div">
    <mat-table mat-table [dataSource]="data">

        <ng-container matColumnDef="message">
            <mat-header-cell *matHeaderCellDef translate>COMMON_MESSAGE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.message}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="document">
            <mat-header-cell *matHeaderCellDef translate>LOGISTICS_DOCUMENT</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.document}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="number">
            <mat-header-cell *matHeaderCellDef translate>LOGISTICS_NUMBER</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.number}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="time">
            <mat-header-cell *matHeaderCellDef translate>COMMON_TIME</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.time | date: 'dd/MM/yyyy mm:HH:ss'}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="date">
            <mat-header-cell *matHeaderCellDef translate>COMMON_DATE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.date | date: 'dd/MM/yyyy'}}
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
</mat-card>
<div class="b-b-background pagination">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
