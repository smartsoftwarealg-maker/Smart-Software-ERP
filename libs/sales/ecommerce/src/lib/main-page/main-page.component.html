<ss-header-page (refresh)="refresh($event)" (showCart)="showCart()"></ss-header-page>

<div class="main-div">
    <div class="class__list">
        <mat-list role="mat-list">
            <mat-list-item role="listitem" *ngFor="let c of classes$ | async"
                           [class.selected]="c.id === selectedClass"
                           (click)="selectClass(c.id)"
                           class="selectable">
                {{ c.description }}
            </mat-list-item>
        </mat-list>
    </div>
    <div class="ad__div">
        <div *ngIf="adsLoaded; else altImage">
            <div class="imj">
                <img [src]="uploadUtil.imgSrc"
                     *ngIf="uploadUtil.imgSrc !== './assets/img/Dummy.png'"/>
            </div>
        </div>
        <ng-template #altImage>
            <div class="imj">
                <img [src]="'./assets/img/logo.gif'" width="64" height="64"/>
            </div>
        </ng-template>
    </div>
</div>

<div *ngFor="let c of articles$ | async">
    <div class="b-primary header">{{ c.classDescription }}
        <button class="more" mat-button (click)="selectClass(c.classId)" translate>COMMON_MORE</button> &gt;
    </div>
    <div class="article-div">
        <mat-card *ngFor="let a of c.articles">
            <div class="img-div">
                <ss-image-input width="100%" height="100%"
                                [imageModel]="a.imageModel">
                </ss-image-input>
            </div>
            <div class="description"> {{ a.articleDescription }} </div>
            <div class="info_div">
                <div class="price_qty">
                    <div>
                        <span> {{ 'COMMON_QTY' | translate }}: </span> <span class="number">{{ a.stock }} </span>
                    </div>
                    <div>
                        <span> {{ 'LOGISTICS_PRICE' | translate }}: </span> <span
                        class="number">{{ a.price | number: '1.2-2'}} </span>
                    </div>
                </div>
                <button mat-icon-button (click)="addToCart(a)" class="b-primary">
                    <i class="fa-regular fa-cart-plus"></i>
                </button>
            </div>
        </mat-card>
    </div>
</div>
