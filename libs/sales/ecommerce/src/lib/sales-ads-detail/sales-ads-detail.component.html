@if (form !== null) {
  <form novalidate [formGroup]="form">
    <mat-form-field class="default-100">
      <mat-label translate>COMMON_DESCRIPTION</mat-label>
      <input matInput formControlName="description" type="text" required autofocus>
    </mat-form-field>
    <mat-form-field class="default-100">
      <mat-label translate>ADMINISTRATION_DESCRIPTION_AR</mat-label>
      <input matInput formControlName="descriptionAr" type="text">
    </mat-form-field>
    <input type="file"
      #fileInput
      style="display: none"
      multiple
      (change)="uploadUtil.onFileSelected($event)">
    <input type="hidden" name="MAX_FILE_SIZE" value="4194304"/>
    @if (id) {
      <div class="button__div">
        <!--        <button mat-mini-fab-->
        <!--                (click)="onSave()"-->
        <!--                color="primary"-->
        <!--                type="button"-->
        <!--                *ngIf="(uploadUtil.selectedFile && form.value.id) || ((form.value['documentId'] && !form.value.id))">-->
        <!--            <i class="fas fa-save"></i>-->
      <!--        </button>-->
      <!--        <button mat-mini-fab (click)="onCancel()" color="accent" type="button">-->
      <!--            <i class="fas fa-undo"></i>-->
    <!--        </button>-->
    <button mat-mini-fab (click)="fileInput.click()" color="warn" type="button">
      <i class="fas fa-upload"></i>
    </button>
  </div>
}
@if (id) {
  <div class="imj">
    <img [src]="uploadUtil.imgSrc" [alt]="'image'"/>
  </div>
}
</form>
}
