@if (form !== null) {
  <mat-card>
    <mat-card-content>
      <form [formGroup]="form">

        <mat-form-field id="description" class="default-100">
          <mat-label translate>COMMON_FULL_NAME</mat-label>
          <input matInput formControlName="description" type="text" required>
          @if (form.controls['description'].invalid) {
            <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
          }
        </mat-form-field>

        <mat-form-field id="licenceNumber" class="default-50">
          <mat-label translate>LOGISTICS_DRIVER_LICENSE</mat-label>
          <input matInput formControlName="licenceNumber" type="text" maxlength="20">
        </mat-form-field>

          <mat-form-field class="default-50 sm-50">
              <mat-label translate>LOGISTICS_LICENSE_DATE</mat-label>
              <ss-date-picker formControlName="licenceDate" type="date"></ss-date-picker>
          </mat-form-field>

        <mat-form-field id="issuedBy" class="default-100">
          <mat-label translate>LOGISTICS_LICENSE_ISSUER</mat-label>
          <input matInput formControlName="issuedBy" type="text" maxlength="200">
        </mat-form-field>

      </form>

    </mat-card-content>
  </mat-card>
}
