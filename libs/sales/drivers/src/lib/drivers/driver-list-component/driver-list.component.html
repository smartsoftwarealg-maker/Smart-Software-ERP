<div class="div_table size">
    <mat-table mat-table [dataSource]="data" class="main-table" matSort (matSortChange)="sort($event)">

        <ng-container matColumnDef="licenceNumber">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>LOGISTICS_DRIVER_LICENSE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.licenceNumber}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="licenceDate">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>LOGISTICS_LICENSE_DATE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.licenceDate | date: 'dd/MM/yyyy'}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="issuedBy">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>LOGISTICS_LICENSE_ISSUER</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.issuedBy}}
            </mat-cell>
        </ng-container>


        <ng-container matColumnDef="description">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_FULL_NAME</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.description}}
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns;">
        </mat-row>
    </mat-table>
</div>
<div class="size b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
