<ng-container *ngIf="parentId">
    <button class="add-button" mat-mini-fab color="primary" (click)="showDetail(0)"><span class="fas fa-plus"></span>
    </button>
    <mat-table mat-table [dataSource]="data" class="main-table">


        <ng-container matColumnDef="position">
            <mat-header-cell *matHeaderCellDef translate>STOCK_POSITION</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.position}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="store">
            <mat-header-cell *matHeaderCellDef translate>STOCK_STORE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ stores[e.store] }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="reference">
            <mat-header-cell *matHeaderCellDef translate>STOCK_REFERENCE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.reference }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="description">
            <mat-header-cell *matHeaderCellDef translate>STOCK_DESCRIPTION</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ articles[e.reference] }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="qtySatisfied">
            <mat-header-cell *matHeaderCellDef translate>STOCK_QTY_SATISFIED</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.qtySatisfied | number : '1.2-2'}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="price">
            <mat-header-cell *matHeaderCellDef translate>STOCK_PRICE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.price | number : '1.2-2'}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="controls">
            <mat-header-cell *matHeaderCellDef></mat-header-cell>
            <mat-cell *matCellDef="let e">
                <button mat-icon-button (click)="edit()">
                    <span class="fas fa-pen"></span>
                </button>
                <button mat-icon-button (click)="deleteSelected()"
                        *ngIf="e.qtySatisfied < 0.001">
                    <span class="fas fa-trash-alt"></span>
                </button>
            </mat-cell>
        </ng-container>


        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selectedId" (click)="select(row)"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>

    <div class="pagination-container b-b-background">
        <ss-pagination [paginationModel]="pagination"></ss-pagination>
    </div>

    <mat-card>
        <ss-doc-info [showAgent]="true"
                     [showDocument]="true"
                     [showArticle]="true"
                     [document]="{id:selectedRow?.transacId, documentURL:'/delivery'}"
                     [reference]="{ reference: selectedRow?.reference, storeId: selectedRow?.store }">
        </ss-doc-info>
    </mat-card>
</ng-container>
