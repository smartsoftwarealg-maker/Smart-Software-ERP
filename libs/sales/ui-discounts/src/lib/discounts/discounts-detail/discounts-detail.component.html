<mat-card>
    @if (form) {
        <form novalidate [formGroup]="form">
            <mat-form-field class="default-100">
                <mat-label translate>COMMON_THRESHOLD</mat-label>
                <input matInput formControlName="threshold" type="number" required autofocus>
            </mat-form-field>

            <mat-form-field class="default-100">
                <mat-label translate>COMMON_DISCOUNT</mat-label>
                <input matInput formControlName="discount" type="number">
            </mat-form-field>
        </form>
    }
</mat-card>
@if (id && loaded()) {
    <router-outlet></router-outlet>
}
