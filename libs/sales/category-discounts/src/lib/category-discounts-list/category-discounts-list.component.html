<div class="main-container">
    <div class="ctrl-div">
        @if (isEditable) {
            <button mat-mini-fab color="primary" (click)="showDetail(0)" [matTooltip]="'COMMON_ADD' | translate">
                <span class="fas fa-plus"></span>
            </button>
        }
        <button mat-mini-fab (click)="edit()"
                [matTooltip]="'COMMON_EDIT' | translate"
                [disabled]="!selectedId"
                color="accent">
            <span class="fas fa-pen"></span>
        </button>
        @if (isEditable) {
            <button mat-mini-fab (click)="deleteSelected()" [matTooltip]="'COMMON_DELETE' | translate"
                    [disabled]="!selectedId"
                    color="warn">
                <span class="fas fa-trash-alt"></span>
            </button>
        }
    </div>

    <div class="main-table">
        <mat-table mat-table [dataSource]="data$">
            <ng-container matColumnDef="discount">
                <mat-header-cell *matHeaderCellDef translate>COMMON_DISCOUNT</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{ e.discount | number: '1.2-2' }}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="reference">
                <mat-header-cell *matHeaderCellDef translate>COMMON_REFERENCE</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{ e.reference }}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="description">
                <mat-header-cell *matHeaderCellDef translate>COMMON_DESCRIPTION</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{ e.description }}
                </mat-cell>
            </ng-container>



            <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
            <mat-row class="selectable" [class.selected]="row.id === selectedId" (click)="select(row.id)"
                     *matRowDef="let row; columns: displayedColumns;"></mat-row>
        </mat-table>
    </div>

    <div class="pagination-container b-b-background">
        <ss-pagination [paginationModel]="paginator"></ss-pagination>
    </div>

</div>
