@if (form) {
    <div class="size button_div">
        @if (isEditable) {
            <button mat-mini-fab (click)="save()"
                    color="primary">
                <i class="fas fa-save"></i>
            </button>
        }
        <button mat-mini-fab (click)="cancel()"
                color="warn">
            <i class="fas fa-redo"></i>
        </button>
    </div>
}
<mat-card class="size">
    @if (form) {
        <form novalidate [formGroup]="form">
            <mat-form-field class="default-100">
                <mat-label translate>LOGISTICS_ARTICLE</mat-label>
                <ss-auto-complete matInput
                                  [model]="articleLookup"
                                  formControlName="articleId"
                                  required="true"
                                  autofocus>
                </ss-auto-complete>
                @if (form.controls['articleId'].invalid) {
                    <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
                }
            </mat-form-field>
            <mat-form-field class="default-50 sm-100">
                <mat-label translate>COMMON_DISCOUNT</mat-label>
                <input matInput formControlName="discount" type="number" required>
            </mat-form-field>
        </form>
    }
</mat-card>
