<div class="size">
    <mat-form-field appearance="fill" class="default-50 sm-100">
        <mat-label translate>ADMINISTRATION_APPLICATION</mat-label>
        <mat-select [formControl]="applicationsCtrl" (selectionChange)="refresh()">
            <mat-option *ngFor="let app of applications" [value]="app">
                {{ app }}
            </mat-option>
        </mat-select>
    </mat-form-field>
</div>
<div class="size table-container">
    <mat-table class="main-table" mat-table [dataSource]="data" >

        <ng-container matColumnDef="description">
            <mat-header-cell *matHeaderCellDef translate>ADMINISTRATION_DESCRIPTION</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.description }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="filename">
            <mat-header-cell *matHeaderCellDef translate>ADMINISTRATION_FILENAME</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.filename}}
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
</div>
<div class="size b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
