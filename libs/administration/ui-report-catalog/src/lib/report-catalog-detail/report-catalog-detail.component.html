<mat-card *ngIf="reportList">
    <mat-card-content>
        <form *ngIf="form" novalidate [formGroup]="form">

<!--            <mat-form-field class="default-50 sm-100">-->
<!--                <mat-label translate>STOCK_STORE</mat-label>-->
<!--                <ss-auto-complete matInput-->
<!--                                  [required]="true"-->
<!--                                  [model]="storeAutoCompleteModel"-->
<!--                                  formControlName="store"></ss-auto-complete>-->
<!--                <mat-error-->
<!--                    *ngIf="form.controls['store'].hasError('required')" translate>COMMON_FIELD_REQUIRED-->
<!--                </mat-error>-->
<!--                <mat-error-->
<!--                    *ngIf="form.controls['store'].hasError('validOption')" translate>COMMON_NO_MATCH-->
<!--                </mat-error>-->
<!--            </mat-form-field>-->


            <mat-form-field floatLabel="always" class="default-100 sm-100">
                <mat-label translate>ADMINISTRATION_DESCRIPTION</mat-label>
                <input matInput formControlName="description" type="text" required>
                <mat-error
                    *ngIf="form.controls['description'].hasError('required')" translate>COMMON_FIELD_REQUIRED
                </mat-error>
            </mat-form-field>

            <mat-form-field appearance="fill" class="default-100 sm-100">
                <mat-label translate>ADMINISTRATION_APPLICATION</mat-label>
                <mat-select formControlName="application" (selectionChange)="selectApp($event)">
                    <mat-option *ngFor="let app of applications" [value]="app">
                        {{ app }}
                    </mat-option>
                </mat-select>
            </mat-form-field>

            <mat-form-field floatLabel="always" class="default-100 sm-100">
                <mat-label translate>COMMON_FILENAME</mat-label>
                <input type="text" matInput formControlName="filename" [matAutocomplete]="auto">
                <mat-autocomplete #auto="matAutocomplete">
                    <mat-option *ngFor="let option of reportList" [value]="option">{{option}}</mat-option>
                </mat-autocomplete>
                <mat-error
                    *ngIf="form.controls['filename'].hasError('required')" translate>COMMON_FIELD_REQUIRED
                </mat-error>
                <mat-error
                    *ngIf="form.controls['filename'].hasError('validOption')" translate>COMMON_NO_MATCH
                </mat-error>
            </mat-form-field>
        </form>
    </mat-card-content>
</mat-card>
