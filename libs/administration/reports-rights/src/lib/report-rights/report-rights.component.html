<div class="container">
    <div class="role_div">
        <mat-form-field class="default-100" autofocus>
            <mat-label translate>ADMINISTRATION_USERS</mat-label>
            <ss-auto-complete matInput
                              [formControl]="roleCtrl"
                              [model]="roleLookup">
            </ss-auto-complete>
        </mat-form-field>
        <div class="tree-div">
            <mat-tree #role class="tree" [dataSource]="roleTree" [treeControl]="roleTreeControl">

                <mat-nested-tree-node *matTreeNodeDef="let node">
                    <li class="tree-leaf"
                        [class.selected]="selectedRole == node"
                        (click)="selectRoleReport(node)">
                        {{ node.name }}
                    </li>
                    <mat-divider></mat-divider>
                </mat-nested-tree-node>

                <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild">
                    <li>
                        <button mat-icon-button matTreeNodeToggle>
                            <i class="{{roleTreeControl.isExpanded(node) ? 'fa-solid fa-minus' : 'fa-solid fa-plus' }}"></i>
                        </button>
                        {{ node.name }}
                        <mat-divider></mat-divider>

                        <ul [class.tree-invisible]="!roleTreeControl.isExpanded(node)">
                            <ng-container matTreeNodeOutlet></ng-container>
                        </ul>
                    </li>
                    <mat-divider></mat-divider>
                </mat-nested-tree-node>
            </mat-tree>
        </div>
        <div class="ctrl_div">
            <button mat-mini-fab
                    color="primary"
                    [disabled]="!selectedRole || selectedRole?.name?.indexOf('.jasper') < 0"
                    matTooltip="{{ 'COMMON_DELETE' | translate }}"
                    (click)="deleteReport()">
                <i class="fa-solid fa-trash"></i>
            </button>
        </div>
    </div>

    <div class="report_div">
        <div class="tree-div">
            <mat-tree #tree class="tree" [dataSource]="reportTree" [treeControl]="reportTreeControl">
                <!-- This is the tree node template for leaf nodes -->

                <mat-nested-tree-node *matTreeNodeDef="let node">
                    <li class="tree-leaf"
                        [class.selected]="selectedReport == node"
                        (click)="selectReport(node)">
                        {{ node.name }}
                    </li>
                    <mat-divider></mat-divider>
                </mat-nested-tree-node>

                <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild">
                    <li>
                        <button mat-icon-button matTreeNodeToggle>
                            <i class="{{reportTreeControl.isExpanded(node) ? 'fa-solid fa-minus' : 'fa-solid fa-plus'}}"></i>
                        </button>
                        {{ node.name }}
                        <mat-divider></mat-divider>

                        <ul [class.tree-invisible]="!reportTreeControl.isExpanded(node)">
                            <ng-container matTreeNodeOutlet></ng-container>
                        </ul>
                    </li>
                    <mat-divider></mat-divider>
                </mat-nested-tree-node>
            </mat-tree>
        </div>
        <div class="ctrl_div">
            <button mat-mini-fab
                    color="primary"
                    matTooltip="{{ 'COMMON_ADD' | translate }}"
                    [disabled]="!selectedReport || selectedReport?.name?.indexOf('.jasper') < 0"
                    (click)="addReport()">
                <i class="fa-solid fa-circle-plus"></i>
            </button>
        </div>
    </div>
</div>
