<div  class="emp__div size">
    <mat-table mat-table [dataSource]="data">

        <ng-container matColumnDef="domain">
            <mat-header-cell *matHeaderCellDef translate>ADMINISTRATION_DOMAIN</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.domain}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="property">
            <mat-header-cell *matHeaderCellDef translate>ADMINISTRATION_PROPERTY</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.property}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="property_value">
            <mat-header-cell *matHeaderCellDef translate>ADMINISTRATION_PROPERTY_VALUE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.property_value}}
            </mat-cell>
        </ng-container>


        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
</div>
<div class="b-b-background size">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
