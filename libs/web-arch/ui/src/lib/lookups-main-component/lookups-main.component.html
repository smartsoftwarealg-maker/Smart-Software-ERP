<div class="container">
  <ss-ss-nav-toolbar class="tbar"
                     (change)="onFilter($event)"
                     (refresh)="refresh($event)"
                     [editEnabled]="false"
                     [deleteEnabled]="false"
                     [filter]="filter"
                     [addEnabled]="false"
                     [rights]="rights">
  </ss-ss-nav-toolbar>

  <mat-table matSort
             class="my-table"
             (matSortChange)="sortData($event)"
             [dataSource]="dataSource">


    <ng-container matColumnDef="description">
      <mat-header-cell *matHeaderCellDef
                       mat-sort-header
                       translate>{{ 'description' }}
      </mat-header-cell>
      <mat-cell *matCellDef="let lu">
        <span translate> {{ lu.description }} </span>

      </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>

    <mat-row *matRowDef="let row; columns: displayedColumns;"
             (click)="selectURL(row.url)"
             [ngClass]="{'active-list-item': row.url == selectedURL}"></mat-row>
  </mat-table>

  <ss-basic-pagination [model]="{ page: pModel.page,
                                 pageSize: pModel.pageSize,
                                 elementsCount: pModel.elementsCount,
                                 scroll: pModel.scroll }"
                       [maxButtonsCount]="4"
                       (modelChange)="pageChange($event)">
  </ss-basic-pagination>
  <router-outlet></router-outlet>
</div>
