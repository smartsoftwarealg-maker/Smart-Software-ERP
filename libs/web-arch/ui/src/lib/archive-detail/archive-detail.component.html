<div class="container">
    <form novalidate
          [formGroup]="form"
          *ngIf="form"
          class="form__container">

        <mat-form-field class="des">
            <mat-placeholder translate>COMMON_DESCRIPTION</mat-placeholder>
            <input matInput type="text" name="fileName" formControlName="description">
        </mat-form-field>


        <mat-form-field class="dat">
            <input matInput [matDatepicker]="picker" name="docDate" formControlName="docDate">
            <mat-placeholder translate>COMMON_DATE</mat-placeholder>
            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>

        <mat-form-field class="agent">
            <mat-label translate>LOGISTICS_CUSTOMER</mat-label>
            <ss-auto-complete matInput
                              [required]="true"
                              [model]="agentAutoCompleteModel"
                              formControlName="agentId"></ss-auto-complete>
        </mat-form-field>

        <div class="imj">
            <img [src]="imgSrc " [alt]="'image'"/>
        </div>

        <mat-form-field class="service">
            <mat-label translate>WAR_SERVICE</mat-label>
            <ss-auto-complete matInput
                              [required]="true"
                              [model]="serviceAutoCompleteModel"
                              formControlName="service"></ss-auto-complete>
        </mat-form-field>

        <fieldset>
            <legend><span translate>WAR_TAGS</span>:</legend>

            <div class="tags">
                <mat-selection-list #tags>
                    <mat-list-option *ngFor="let tag of tagList"
                                     [selected]="curTags.has(tag.description)"
                                     [value]="tag.description">
                        {{ tag.description }}
                    </mat-list-option>
                </mat-selection-list>
            </div>
        </fieldset>

    </form>

    <div class="ctr_div">
        <input type="file"
               #fileInput
               style="display: none"
               (change)="onFileSelected($event)">

        <input type="hidden" name="MAX_FILE_SIZE" value="104857600"/>
        <mat-progress-bar
            *ngIf="loadingRate < 100"
            mode="determinate" value="{{ loadingRate }}">
        </mat-progress-bar>
        <button mat-mini-fab (click)="onSave()" color="primary">
            <i class="fas fa-save"></i>
        </button>
        <button mat-mini-fab (click)="onCancel()" color="accent">
            <i class="fas fa-undo"></i>
        </button>

        <button mat-mini-fab (click)="fileInput.click()" color="warn">
            <i class="fas fa-upload"></i>
        </button>
    </div>
</div>
