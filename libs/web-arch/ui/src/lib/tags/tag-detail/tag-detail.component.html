<div class="role-dtl-container theme-background">
  <div class="form-container">
    <form novalidate [formGroup]="form" *ngIf="loaded">

      <mat-form-field class="description">
        <mat-placeholder translate>DESCRIPTION</mat-placeholder>
        <input matInput formControlName="description" required>
      </mat-form-field>

    </form>
  </div>

  <ss-form-save-toolbar (cancel)="cancel()" [saveAction]="saveAction"></ss-form-save-toolbar>

</div>
