<div class="div_table size">
    <mat-table mat-table [dataSource]="data" class="main-table" matSort (matSortChange)="sort($event)">

        <ng-container matColumnDef="elementDescription">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>REMUN_FIELD</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.elementDescription}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="weight">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>PAYROLL_WEIGHT</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.weight}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="cType">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_TYPE</mat-header-cell>
            <mat-cell *matCellDef="let e" translate>
                {{ e.cType === 1? 'PAYROLL_DISCIPLINE' : 'PAYROLL_ABSENCE'}}
            </mat-cell>
        </ng-container>


        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns;">
        </mat-row>
    </mat-table>
</div>
<div class="size b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
