<mat-card>
  <mat-card-content>
    @if (form !== null) {
      <form novalidate [formGroup]="form">
        <mat-form-field class="default-100">
          <mat-label translate>REMUN_FIELD</mat-label>
          <ss-auto-complete matInput
            [model]="elementLookup"
            formControlName="elementId">
          </ss-auto-complete>
        </mat-form-field>
        <mat-form-field class="default-50 sm-100" >
          <mat-label translate>PAYROLL_WEIGHT</mat-label>
          <input matInput formControlName="weight" type="number"  required step="1">
        </mat-form-field>
        <mat-form-field class="default-50 sm-100" >
          <mat-label translate>COMMON_MAX</mat-label>
          <input matInput formControlName="maxValue" type="number"  required step="1">
        </mat-form-field>
        <mat-form-field class="default-50 sm-100">
          <mat-label translate>COMMON_TYPE</mat-label>
          <mat-select formControlName="cType">
            <mat-option [value] = "1" translate>PAYROLL_DISCIPLINE</mat-option>
            <mat-option [value] = "2" translate>PAYROLL_ABSENCE</mat-option>
          </mat-select>
        </mat-form-field>
      </form>
    }

  </mat-card-content>
</mat-card>
