@if (form) {
    <mat-card>
        <mat-card-content>
            <form novalidate [formGroup]="form">

                <mat-form-field id="description" class="default-100">
                    <mat-label translate>COMMON_DESCRIPTION</mat-label>
                    <input matInput type="text" formControlName="description" autofocus>
                    @if (form.controls['description']?.invalid) {
                        <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
                    }
                </mat-form-field>

                <mat-form-field class="default-50 sm-100">
                    <mat-label translate>PAYROLL_GRADE</mat-label>
                    <input matInput formControlName="grade" type="number" min="1" max="10">
                    @if (form.controls['grade']?.invalid) {
                        <mat-error translate>COMMON_FIELD_MAX_LENGTH</mat-error>
                    }
                </mat-form-field>

                <mat-form-field class="default-50 sm-100">
                    <mat-label translate>REMUN_SIGN</mat-label>
                    <input matInput formControlName="sign" type="number" min="-1" max="1">
                    @if (form.controls['sign']?.invalid) {
                        <mat-error translate>COMMON_FIELD_MAX_LENGTH</mat-error>
                    }
                </mat-form-field>
            </form>
        </mat-card-content>
    </mat-card>
}
