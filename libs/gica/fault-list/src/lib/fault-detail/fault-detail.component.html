<mat-card>
    <mat-card-content>
        <form *ngIf="form !== null" novalidate [formGroup]="form">

            <mat-form-field class="default-100">
                <mat-label translate>PAYROLL_EMPLOYEE</mat-label>
                <ss-auto-complete matInput
                                  [model]="employeeLookup"
                                  formControlName="parentId">
                </ss-auto-complete>
            </mat-form-field>


            <mat-form-field class="default-100">
                <mat-label translate>PAYROLL_EMPLOYEE</mat-label>
                <ss-auto-complete matInput
                                  [model]="motiveLookup"
                                  formControlName="motive">
                </ss-auto-complete>
            </mat-form-field>


            <mat-form-field id="count" class="default-100">
                <mat-label translate>PAYROLL_FAULT_COUNT</mat-label>
                <input matInput formControlName="count" type="number">
                <mat-error *ngIf="form.controls['count'].invalid" translate>COMMON_FIELD_MAX_LENGTH
                </mat-error>
            </mat-form-field>
        </form>

    </mat-card-content>
</mat-card>
