<mat-card>
    <mat-card-content>
        <form *ngIf="form !== null" novalidate [formGroup]="form">

            <mat-form-field id="description" class="default-100">
                <mat-label translate>ADMINISTRATION_DESCRIPTION</mat-label>
                <input matInput formControlName="description" type="text" autofocus required>
                <mat-error *ngIf="form.controls['description'].invalid" translate>COMMON_FIELD_REQUIRED
                </mat-error>
            </mat-form-field>

            <mat-form-field id="code" class="default-100">
                <mat-label translate>PAYROLL_DAILY_GRADE</mat-label>
                <input matInput formControlName="dailyGrade" type="number">
                <mat-error *ngIf="form.controls['dailyGrade'].invalid" translate>COMMON_FIELD_MAX_LENGTH
                </mat-error>
            </mat-form-field>
        </form>

    </mat-card-content>
</mat-card>
