<div class="size">
    <mat-form-field class="default-50">
        <mat-label translate>CMMS_ASSET</mat-label>
        <ss-auto-complete matInput
                          [model]="assetLookup"
                          [formControl]="assetCtrl"
                          required="true">
        </ss-auto-complete>
    </mat-form-field>
</div>

<div class="table_div size">
    <mat-table mat-table [dataSource]="data" class="main-table" matSort (matSortChange)="sort($event)">

        <ng-container matColumnDef="description">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>CMMS_METER</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.description}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="amount">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_AMOUNT</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.amount | number: '1.2-2' }}
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
</div>
<div class="size b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
