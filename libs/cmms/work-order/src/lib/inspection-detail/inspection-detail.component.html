<mat-card-content>
    <form *ngIf="form !== null" novalidate [formGroup]="form" class="size">
        <mat-card>
            <mat-card-content>
                <mat-form-field class="default-50">
                    <mat-label translate>ASSET</mat-label>
                    <ss-auto-complete matInput
                                      [model]="assetLookup"
                                      formControlName="assetId"
                                      required="true">
                    </ss-auto-complete>
                    <mat-error *ngIf="form.controls['assetId'].invalid" translate>COMMON_FIELD_REQUIRED</mat-error>
                </mat-form-field>

                <mat-form-field class="default-50">
                    <mat-label translate>COMMON_DESCRIPTION</mat-label>
                    <input matInput formControlName="description" type="description">
                    <mat-error *ngIf="form.controls['description'].invalid" translate>COMMON_FIELD_REQUIRED</mat-error>
                </mat-form-field>


                <mat-form-field class="default-50">
                    <mat-label translate>COMMON_TYPE</mat-label>
                    <mat-select matNativeControl required formControlName="wrType">
                        <mat-option *ngFor="let t of cmmsTyes"
                                    [value]="t.id"> {{ t.description | translate }} </mat-option>
                    </mat-select>
                </mat-form-field>

                <mat-form-field class="default-50">
                    <mat-label translate>CMMS_PRIORITY</mat-label>
                    <ss-auto-complete matInput
                                      [model]="priorityLookup"
                                      formControlName="priority"
                                      required="true">
                    </ss-auto-complete>
                    <mat-error *ngIf="form.controls['priority'].invalid" translate>COMMON_FIELD_REQUIRED</mat-error>
                </mat-form-field>

                <mat-form-field class="default-50">
                    <mat-label translate>CMMS_CHECKLIST</mat-label>
                    <ss-auto-complete matInput
                                      [model]="checklistLookup"
                                      formControlName="routingId">
                    </ss-auto-complete>
                </mat-form-field>

            </mat-card-content>
        </mat-card>
    </form>
</mat-card-content>
<ss-inspection-detail-list *ngIf="id > 0"></ss-inspection-detail-list>
