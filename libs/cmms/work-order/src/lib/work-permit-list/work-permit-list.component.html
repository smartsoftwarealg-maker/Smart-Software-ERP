<div class="size button__div">
    <!--    <mat-form-field>-->
    <!--        <mat-label translate>COMMON_SEARCH</mat-label>-->
    <!--        <input matInput [formControl]="searchText" type="text">-->
    <!--    </mat-form-field>-->

    <button mat-mini-fab color="primary" (click)="showDetail(0)" [matTooltip]="'COMMON_ADD' | translate">
        <span class="fas fa-plus"></span>
    </button>
    <button mat-mini-fab (click)="edit()"
            [disabled]="!selectedId"
            [matTooltip]="'COMMON_EDIT' | translate"
            color="accent">
        <span class="fas fa-pen"></span>
    </button>
    <button mat-mini-fab (click)="deleteSelected()" [matTooltip]="'COMMON_DELETE' | translate"
            [disabled]="!selectedId"
            color="warn">
        <span class="fas fa-trash-alt"></span>
    </button>

    <button mat-mini-fab
            type="button"
            (click)="viewReport()"
            [matTooltip]="'COMMON_PRINT_REPORT' | translate"
            color="primary">
        <span class="fas fa-print"></span>
    </button>

    <button mat-mini-fab
            type="button"
            (click)="selectReport()"
            [matTooltip]="'COMMON_SELECT_REPORT' | translate"
            color="accent">
        <span class="fas fa-folders"></span>
    </button>

</div>


<div class="table_div size">
    <mat-table mat-table [dataSource]="data$ | async" class="main-table">

        <ng-container matColumnDef="typeDescription">
            <mat-header-cell *matHeaderCellDef translate>COMMON_TYPE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.typeDescription}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="number">
            <mat-header-cell *matHeaderCellDef translate>COMMON_NUMBER</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.number}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="date">
            <mat-header-cell *matHeaderCellDef translate>COMMON_DATE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.date | date: 'dd/MM/yyyy' }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="startDate">
            <mat-header-cell *matHeaderCellDef translate>COMMON_FROM</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.startDate | date: 'dd/MM/yyyy HH:mm' }}
            </mat-cell>
        </ng-container>

            <ng-container matColumnDef="dueDate">
            <mat-header-cell *matHeaderCellDef translate>COMMON_TO</mat-header-cell>
            <mat-cell *matCellDef="let e">
                    {{e.dueDate | date: 'dd/MM/yyyy HH:mm' }}
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable"
                 [class.selected]="row.id === selectedId()"
                 (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
</div>
<div class="size b-b-background">
    <ss-pagination [paginationModel]="paginator"></ss-pagination>
</div>
