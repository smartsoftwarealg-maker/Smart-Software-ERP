<div class="button_div size" *ngIf="form">
    <button mat-mini-fab (click)="save()"
            color="accent" *ngIf="isEditable">
        <i class="fas fa-save"></i>
    </button>
    <button mat-mini-fab (click)="cancel()"
            color="warn" >
        <i class="fas fa-redo"></i>
    </button>
</div>

<mat-card *ngIf="form" class="size">
    <form [formGroup]="form">
        <mat-form-field class="default-100">
            <mat-label translate>CMMS_ORDER</mat-label>
            <input matInput formControlName="order" type="number" autofocus required>
            <mat-error
                *ngIf="form.controls['order'].hasError('required')" translate>COMMON_FIELD_REQUIRED
            </mat-error>
        </mat-form-field>

        <mat-form-field class="default-100">
            <mat-label translate>COMMON_DESCRIPTION</mat-label>
            <input matInput formControlName="description" type="text" required>
            <mat-error
                *ngIf="form.controls['description'].hasError('required')" translate>COMMON_FIELD_REQUIRED
            </mat-error>
        </mat-form-field>

        <mat-form-field class="default-100">
            <mat-label translate>CMMS_TEAM_SIZE</mat-label>
            <input matInput formControlName="teamSize" type="number" required>
            <mat-error
                *ngIf="form.controls['teamSize'].hasError('required')" translate>COMMON_FIELD_REQUIRED
            </mat-error>
        </mat-form-field>

        <mat-form-field class="default-100">
            <mat-label translate>CMMS_HOPURS</mat-label>
            <input matInput formControlName="hours" type="number">
        </mat-form-field>

        <mat-form-field class="default-100">
            <mat-label translate>CMMS_COST</mat-label>
            <input matInput formControlName="cost" type="number">
        </mat-form-field>

<!--        <pre> {{ form.value | json }}</pre>-->
    </form>

</mat-card>
