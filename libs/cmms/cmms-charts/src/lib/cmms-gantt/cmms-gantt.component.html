<div class="size">
  <mat-form-field class="default-50 sm=100">
    <mat-label translate>COMMON_FROM</mat-label>
    <ss-date-picker [formControl]="dateFilter" (dateChange)="refresh($event)"></ss-date-picker>
  </mat-form-field>
</div>
<div class="chart_div size" *ngIf="loaded">
  <google-chart
    #chart
    [height]="700"
    [width]="900"
    [type]="chartType"
    [data]="data"
    [options]="options"
    [columns]="columns">
  </google-chart>
</div>
