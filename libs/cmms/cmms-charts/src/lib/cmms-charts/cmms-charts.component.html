<h1 class="size"> {{ 'COMMON_DASHBOARD' | translate }}</h1>
<div class="container size">
    <mat-card>
        <mat-card-title>
            <div translate>CMMS_WORK_ORDER</div>
        </mat-card-title>
        <mat-card-content>
            <div class="chart_div">
                <canvas [id]="'past-due'" class="chart"
                        [ngStyle]="processing? {display: 'none'} : {display: 'block'}"></canvas>
            </div>
        </mat-card-content>
    </mat-card>

    <mat-card>
        <mat-card-title>
            <div translate>CMMS_SERVICE_REQUEST</div>
        </mat-card-title>
        <mat-card-content>
            <div class="chart_div">
                <canvas [id]="'pending'" class="chart"
                        [ngStyle]="processing? {display: 'none'} : {display: 'block'}"></canvas>
            </div>
        </mat-card-content>
    </mat-card>

    <mat-card>
        <mat-card-title>
            <div>
                <span translate>CMMS_EQUIPMENT</span><span>/</span><span translate>CMMS_PRIORITY</span>
            </div>
        </mat-card-title>
        <mat-card-content>
            <div class="chart_div">
                <canvas [id]="'assets-priority'" class="chart"
                        [ngStyle]="processing? {display: 'none'} : {display: 'block'}"></canvas>
            </div>
        </mat-card-content>
    </mat-card>

    <mat-card>
        <mat-card-title>
            <div>
                <span translate>CMMS_SERVICE_REQUEST</span><span>/</span><span translate>CMMS_PRIORITY</span>
            </div>
        </mat-card-title>
        <mat-card-content>
            <div class="chart_div">
                <canvas [id]="'sr-priority'" class="chart"
                        [ngStyle]="processing? {display: 'none'} : {display: 'block'}"></canvas>
            </div>
        </mat-card-content>
    </mat-card>

    <mat-card>
        <mat-card-title>
            <div>
                <span translate>CMMS_WORK_ORDER</span><span>/</span><span translate>CMMS_PRIORITY</span>
            </div>
        </mat-card-title>
        <mat-card-content>
            <div class="chart_div">
                <canvas [id]="'wo-priority'" class="chart"
                        [ngStyle]="processing? {display: 'none'} : {display: 'block'}"></canvas>
            </div>
        </mat-card-content>
    </mat-card>

    <mat-card>
        <mat-card-title><div translate>CMMS_REPAIR_TIMES</div>
        </mat-card-title>
        <mat-card-content>
            <div class="chart_div">
                <canvas [id]="'maintenance-times'" class="chart"
                        [ngStyle]="processing? {display: 'none'} : {display: 'block'}"></canvas>
            </div>
        </mat-card-content>
    </mat-card>
</div>
