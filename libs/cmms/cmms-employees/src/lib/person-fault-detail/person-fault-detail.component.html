@if (form) {
  <div class="size button_div size">
    @if (isEditable) {
      <button mat-mini-fab (click)="save()"
        color="primary">
        <i class="fas fa-save"></i>
      </button>
    }
    <button mat-mini-fab (click)="cancel()"
      color="warn">
      <i class="fas fa-redo"></i>
    </button>
  </div>
}

<mat-card class="size">
  @if (form !== null) {
    <form novalidate [formGroup]="form">
      <mat-form-field class="default-100" autofocus>
        <mat-label translate>CMMS_EXPERTISE</mat-label>
        <ss-auto-complete matInput
          formControlName="faultId"
          [model]="faultLookup">
        </ss-auto-complete>
      </mat-form-field>
    </form>
  }
</mat-card>
