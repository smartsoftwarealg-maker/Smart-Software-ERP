@if (form) {
  <div class="size button_div size">
    @if (isEditable) {
      <button mat-mini-fab (click)="save()"
        color="primary">
        <i class="fas fa-save"></i>
      </button>
    }
    <button mat-mini-fab (click)="cancel()"
      color="warn">
      <i class="fas fa-redo"></i>
    </button>
  </div>
}

<mat-card>
  <mat-card-content>
    @if (form !== null) {
      <form novalidate [formGroup]="form">
        <mat-form-field class="default-100">
          <mat-label translate>CMMS_METER</mat-label>
          <ss-auto-complete matInput
            [model]="meterLookup"
            formControlName="meterId"
            required="true">
          </ss-auto-complete>
          @if (form.controls['meterId'].invalid) {
            <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
          }
        </mat-form-field>
        <mat-form-field class="default-50 sm-100">
          <mat-label translate>CMMS_READING_DATE</mat-label>
          <ss-date-picker formControlName="date" required="true"></ss-date-picker>
          @if (form.controls['amount'].invalid) {
            <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
          }
        </mat-form-field>
        <mat-form-field id="amount" class="default-50 sm-100">
          <mat-label translate>COMMON_AMOUNT</mat-label>
          <input matInput formControlName="amount" type="number" required>
          @if (form.controls['amount'].invalid) {
            <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
          }
        </mat-form-field>
      </form>
    }

  </mat-card-content>
</mat-card>
