<div class="container">
    <div class="product__div">
        @for (p of products; track p.name) {
            <mat-card>
                <mat-card-header>
                    <mat-card-title><span class="p-primary">{{ p.name }}</span></mat-card-title>
                </mat-card-header>
                <mat-card-content>
                    <img class="product__image" src="{{p.image}}" alt="{{p.image}}" width="100%">
                </mat-card-content>
                <mat-card-footer>
                    <div class="info__div">{{ p.description }}</div>
                </mat-card-footer>
            </mat-card>
        }
    </div>

</div>
