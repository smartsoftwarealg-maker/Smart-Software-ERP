@if (form !== null) {
    <div class="button_div size">
        @if (isEditable) {
            <button mat-mini-fab (click)="save()" color="accent">
                <i class="fas fa-save"></i>
            </button>
        }
        <button mat-mini-fab (click)="cancel()"
                color="warn">
            <i class="fas fa-redo"></i>
        </button>
    </div>

    <mat-card>
        <form [formGroup]="form">
            <mat-form-field class="default-100">
                <mat-label translate>COMMON_DESCRIPTION</mat-label>
                <input matInput formControlName="description" type="text">
            </mat-form-field>

            <mat-form-field class="default-50 sm-100">
                <mat-label translate>COMMON_PAYMENTS</mat-label>
                <ss-auto-complete matInput
                                  [model]="paymentLookup"
                                  formControlName="paymentId"></ss-auto-complete>
            </mat-form-field>


            <mat-form-field class="default-50 sm-100">
                <mat-label translate>COMMON_DATE</mat-label>
                <ss-date-picker formControlName="creationTime"></ss-date-picker>
            </mat-form-field>

            <mat-form-field class="default-50 sm-100">
                <mat-label translate>COMMON_AMOUNT</mat-label>
                <input matInput formControlName="amount" type="number">
            </mat-form-field>



        </form>
    </mat-card>
}
