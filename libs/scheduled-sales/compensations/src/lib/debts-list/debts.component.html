<div class="table__div size">
    <mat-table mat-table [dataSource]="data" class="main-table" matSort (matSortChange)="sort($event)">

        <ng-container matColumnDef="customerCode">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>ADMINISTRATION_CODE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.customerCode}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="customerName">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>LOGISTICS_DENOMINATION</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.customerName}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="invoiceNumber">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_NUMBER</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.invoiceNumber}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="date">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_DATE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.date | date: 'dd/MM/yyyy'}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="ftt">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>LOGISTICS_FTT</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.ftt | number: '1.2-4'}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="payment">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_PAYMENTS</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.payment | number: '1.2-4'}}
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns;">
        </mat-row>
    </mat-table>
</div>
<div class="size b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>

@if (selected) {
    <router-outlet/>
}
