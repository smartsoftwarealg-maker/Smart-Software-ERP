<mat-card>
    <mat-card-content>
        @if (form !== null) {
            <form novalidate [formGroup]="form">
                <mat-form-field class="default-100 sm-100">
                    <mat-label translate>COMMON_NUMBER</mat-label>
                    <input matInput formControlName="number" type="number" required autofocus>
<!--                    <ss-auto-complete matInput-->
<!--                                      formControlName="number"-->
<!--                                      [model]="complaintLookup">-->
<!--                    </ss-auto-complete>-->
                </mat-form-field>

                <mat-form-field class="default-100">
                    <mat-label translate>COMMON_DATE</mat-label>
                    <ss-date-picker [required]=true
                                    formControlName="date"
                                    [type]="'date'">
                    </ss-date-picker>
                </mat-form-field>
            </form>
        }
    </mat-card-content>
</mat-card>
