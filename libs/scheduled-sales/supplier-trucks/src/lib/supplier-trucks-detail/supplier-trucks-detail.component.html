<mat-card>
  <mat-card-content>
    @if (form !== null) {
      <form [formGroup]="form">
        <mat-form-field class="default-100">
          <mat-label translate>LOGISTICS_SUPPLIER</mat-label>
          <ss-auto-complete matInput
            [model]="customerLookupModel"
            formControlName="supplier">
          </ss-auto-complete>
          @if (form.controls['supplier'].invalid) {
            <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
          }
        </mat-form-field>

        <mat-form-field id="description" class="default-50 sm-100">
          <mat-label translate>LOGISTICS_PLATE_NUMBER</mat-label>
          <input matInput formControlName="plateNumber" type="text" required>
          @if (form.controls['plateNumber'].invalid) {
            <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
          }
        </mat-form-field>
      </form>
    }
  </mat-card-content>
</mat-card>
