<div class="table-div">
    <mat-table mat-table [dataSource]="data" class="main-table">

        <ng-container matColumnDef="reference">
            <mat-header-cell *matHeaderCellDef translate>COMMON_REFERENCE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.reference}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="description">
            <mat-header-cell *matHeaderCellDef translate>COMMON_DESCRIPTION</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.description}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="customerCode">
            <mat-header-cell *matHeaderCellDef translate>LOGISTICS_CUSTOMER_CODE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.customerCode}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="customerName">
            <mat-header-cell *matHeaderCellDef translate>LOGISTICS_CUSTOMER</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.customerName}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="salesDate">
            <mat-header-cell *matHeaderCellDef translate>COMMON_DATE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.salesDate | date: 'dd/MM/yyyy' }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="qty">
            <mat-header-cell *matHeaderCellDef translate>COMMON_QTY</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.qty | number: '1.2-2' }}
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
</div>
<div class="pagination-container b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
