<mat-card>
    <mat-card-content>
        <form *ngIf="form !== null" novalidate [formGroup]="form">

            <mat-form-field class="default-50 sm-100">
                <mat-label translate>LOGISTICS_CUSTOMER</mat-label>
                <ss-auto-complete matInput
                                  [required]="true"
                                  [model]="customerLookup"
                                  formControlName="agentId">
                </ss-auto-complete>
                                <mat-error
                                    *ngIf="form.controls['agentId'].hasError('required')" translate>COMMON_FIELD_REQUIRED
                                </mat-error>
                                <mat-error
                                    *ngIf="form.controls['agentId'].hasError('validOption')" translate>COMMON_NO_MATCH
                                </mat-error>
            </mat-form-field>


            <mat-form-field class="default-50 sm-100">
                <mat-label translate>ADMINISTRATION_DESCRIPTION</mat-label>
                <input matInput formControlName="description" type="text" required autofocus>
                <mat-error *ngIf="form.controls['description'].invalid" translate>COMMON_FIELD_REQUIRED
                </mat-error>
            </mat-form-field>

            <mat-form-field class="default-50 sm-100">
                <mat-label translate>ADMINISTRATION_CODE</mat-label>
                <input matInput formControlName="project_code" type="text"  >
            </mat-form-field>

            <mat-form-field class="default-50 sm-100">
                <mat-label translate>COMMON_FROM</mat-label>
                <ss-date-picker formControlName="start_date"></ss-date-picker>
            </mat-form-field>

            <mat-form-field class="default-50 sm-100">
                <mat-label translate>COMMON_TO</mat-label>
                <ss-date-picker formControlName="finish_date"></ss-date-picker>
            </mat-form-field>

            <mat-form-field class="default-50 sm-100">
                <mat-label translate>COMMON_QTY</mat-label>
                <input matInput formControlName="qty" type="number"  step="1">
            </mat-form-field>

        </form>

    </mat-card-content>
</mat-card>
