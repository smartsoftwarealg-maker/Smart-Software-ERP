<div class="container__div">
    <mat-card class="chart__div default-50">
        <canvas  [id]="'Statistics'" class="chart"></canvas>
    </mat-card>

    @for (s of satisArr; track s; let i=$index) {
        <ss-question-chart [index]="i" type="satisfaction" [satisfaction]="s" class="chart__div default-25 md-50 sm-100"></ss-question-chart>
    }
    @for (s of boolArr ; track s; let i=$index) {
        <ss-question-chart [index]="i+satisArr.length" type="boolean" [bool]="s" class="chart__div default-25 md-50 sm-100"></ss-question-chart>
    }

</div>
