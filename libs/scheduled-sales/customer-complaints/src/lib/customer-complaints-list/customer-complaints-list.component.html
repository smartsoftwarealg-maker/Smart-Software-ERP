<div class="div_table size">
    <mat-table mat-table [dataSource]="data" class="main-table" matSort (matSortChange)="sort($event)">

        <ng-container matColumnDef="complaintDescription">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_DESCRIPTION</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.complaintDescription}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="complaint">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_COMPLAINT</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.complaint?.substring(0, 70)}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="answer">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_ANSWER</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.answer?.substring(0, 70)}}
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selected" (click)="selectRow(row)"
                 *matRowDef="let row; columns: displayedColumns;">
        </mat-row>
    </mat-table>
</div>
<div class="size b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
