<mat-card>
    <form [formGroup]="form">


        <mat-form-field class="default-100">
            <mat-label translate>ADMINISTRATION_PASSWORD</mat-label>
            <input matInput formControlName="password" type="password" maxlength="40">
        </mat-form-field>

        <mat-form-field class="default-100">
            <mat-label translate>CONFIRMATION</mat-label>
            <input matInput formControlName="confirmation" type="password" maxlength="40">
        </mat-form-field>

        <mat-form-field class="default-100">
            <mat-label translate>ADMINISTRATION_RESET_CODE</mat-label>
            <input matInput formControlName="resetCode" maxlength="40">
        </mat-form-field>

        <mat-form-field class="default-100">
            <mat-label translate>LOGISTICS_CUSTOMER</mat-label>
            <ss-auto-complete matInput
                              [required]="true"
                              [model]="customerLookup"
                              formControlName="agentId">
            </ss-auto-complete>
            @if (form.controls.agentId.hasError('required')) {
                <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
            }
            @if (form.controls.agentId.hasError('validOption')) {
                <mat-error translate>COMMON_NO_MATCH </mat-error>
            }
        </mat-form-field>


        <div class="button-div default-100">
            <button mat-raised-button color="primary" translate
                    [disabled]="form.controls.password.value != form.controls.confirmation.value"
                    (click)="updatePassword()">UPDATE
            </button>
        </div>
    </form>
</mat-card>
