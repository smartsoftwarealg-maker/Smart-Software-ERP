<div class="main-container">
    <div class="table-container">
        <mat-table mat-table [dataSource]="data" class="main-table" matSort (matSortChange)="sort($event)">

            <ng-container matColumnDef="routingNumber">
                <mat-header-cell *matHeaderCellDef mat-sort-header translate>PROD_ROUTING_NUMBER</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{ e.routingNumber }}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="revision">
                <mat-header-cell *matHeaderCellDef mat-sort-header translate>PROD_REVISION</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{ e.revision }}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="description">
                <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_DESCRIPTION</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{ e.description }}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="status">
                <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_STATUS</mat-header-cell>
                <mat-cell *matCellDef="let e" translate>
                    PROD_{{ e.status }}
                </mat-cell>
            </ng-container>

            <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
            <mat-row class="selectable"
                     [class.selected]="row.id == selected"
                     [class.dirty]="row.dirty"
                     (click)="selectRow(row)"
                     *matRowDef="let row; columns: displayedColumns;"></mat-row>
        </mat-table>
    </div>
    <div class="pagination-container b-b-background">
        <ss-pagination [paginationModel]="pagination"></ss-pagination>
    </div>

</div>
