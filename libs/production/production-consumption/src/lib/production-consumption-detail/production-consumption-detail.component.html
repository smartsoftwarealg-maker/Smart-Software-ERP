<mat-card>
    <mat-card-content>
        @if (form !== null) {
            <form novalidate [formGroup]="form">
                <mat-form-field id="number" class="default-50 sm-100">
                    <mat-label translate>STOCK_NUMBER</mat-label>
                    <input matInput formControlName="number" type="number" readonly>
                </mat-form-field>
                <mat-form-field class="default-50 sm-100">
                    <mat-label translate>COMMON_DATE</mat-label>
                    <ss-date-picker formControlName="date"></ss-date-picker>
                </mat-form-field>
                <mat-form-field id="header" class="default-50 sm-100">
                    <mat-label translate>STOCK_HEADER</mat-label>
                    <textarea matInput formControlName="header" cdkTextareaAutosize="true"></textarea>
                </mat-form-field>
                <mat-form-field id="footer" class="default-50 sm-100">
                    <mat-label translate>STOCK_FOOTER</mat-label>
                    <textarea matInput formControlName="footer" cdkTextareaAutosize="true"></textarea>
                </mat-form-field>
            </form>
        }
    </mat-card-content>
</mat-card>

    <router-outlet></router-outlet>
}
