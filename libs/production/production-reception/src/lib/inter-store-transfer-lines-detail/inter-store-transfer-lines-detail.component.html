@if (form !== null) {
    <div class="ctrl_div default-100">
        <button mat-mini-fab color="primary"
                [matTooltip]="'COMMON_SAVE' | translate"
                (click)="save()"
                [disabled]="!form.valid">
            <i class="fas fa-save"></i>
        </button>
        <button mat-mini-fab
                color="warn"
                [matTooltip]="'COMMON_CANCEL' | translate"
                translate (click)="cancel()">
            <i class="fas fa-redo"></i>
        </button>
    </div>
    <mat-card>
        <mat-card-content>
            <form novalidate [formGroup]="form">
                <mat-form-field class="default-100">
                    <mat-label translate>COMMON_SOURCE_STORE</mat-label>
                    <ss-auto-complete matInput
                                      [required]="true"
                                      [model]="storeLookup"
                                      formControlName="sourceStore">
                    </ss-auto-complete>
                    @if (form.controls['sourceStore'].hasError('required')) {
                        <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
                    }
                </mat-form-field>


                <!--                <mat-form-field class="default-100">-->
                <!--                    <mat-label translate>COMMON_SOURCE_ARTICLE</mat-label>-->
                <!--                    <ss-auto-complete matInput-->
                <!--                                      [required]="true"-->
                <!--                                      [model]="articleLookup"-->
                <!--                                      formControlName="sourceRef">-->
                <!--                    </ss-auto-complete>-->
                <!--                    @if (form.controls['sourceRef'].hasError('required')) {-->
                <!--                        <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>-->
                <!--                    }-->
                <!--                </mat-form-field>-->
                <div class="default-100">
                    <mat-form-field style="width: calc(100% - 50px); margin-right: .5em">
                        <mat-label translate>COMMON_ARTICLE</mat-label>
                        <ss-auto-complete matInput
                                          [required]="true"
                                          [model]="articleLookup"
                                          formControlName="sourceRef">
                        </ss-auto-complete>

<!--                        <mat-hint class="info f-warn"><span  translate>STOCK_STOCK</span>: {{ selectedStock() }} </mat-hint>-->
                    </mat-form-field>
                    @let message = ('COMMON_SEARCH' | translate) + " CTRL F";
                    <button mat-mini-fab
                            (click)="showSearchDialog()"
                            color="accent"
                            [matTooltip]=message>
                        <i class="fas fa-search icon"></i>
                    </button>
                </div>

                <!--                <mat-form-field class="default-100">-->
                <!--                    <mat-label translate>COMMON_DESTINATION_ARTICLE</mat-label>-->
                <!--                    <ss-auto-complete matInput-->
                <!--                                      [required]="true"-->
                <!--                                      [model]="articleLookup2"-->
                <!--                                      formControlName="destinationRef">-->
                <!--                    </ss-auto-complete>-->
                <!--                    @if (form.controls['destinationRef']?.hasError('required')) {-->
                <!--                        <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>-->
                <!--                    }-->
                <!--                </mat-form-field>-->

                <mat-form-field class="default-50">
                    <mat-label translate>COMMON_QUANTITY</mat-label>
                    <input matInput type="number" formControlName="qty">
                    @if (form.controls['qty'].hasError('required')) {
                        <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
                    }
                </mat-form-field>
            </form>
        </mat-card-content>
    </mat-card>
}
