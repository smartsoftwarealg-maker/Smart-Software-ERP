<div class="main-container">
    <div class="add-button">

        @if (isEditable) {
            <button
                mat-mini-fab
                color="primary"
                (click)="showDetail(0)"
                [matTooltip]="'COMMON_ADD' | translate">
                <span class="fas fa-plus"></span>
            </button>
        }
        <button
            mat-mini-fab
            (click)="edit()"
            [matTooltip]="'COMMON_EDIT' | translate"
            [disabled]="!selectedId"
            color="accent">
            <span class="fas fa-pen"></span>
        </button>
        @if (isEditable) {
            <button mat-mini-fab (click)="deleteSelected()"
                    [matTooltip]="'COMMON_DELETE' | translate"
                    [disabled]="!selectedId"
                    color="warn">
                <span class="fas fa-trash-alt"></span>
            </button>
        }
    </div>

    <div class="container_div">
        <mat-table mat-table [dataSource]="data$" class="main-table">
            <ng-container matColumnDef="storeDescription">
                <mat-header-cell *matHeaderCellDef translate>STOCK_STORE</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{ e.storeDescription }}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="lotDescription">
                <mat-header-cell *matHeaderCellDef translate>STOCK_LOT</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{ e.lotDescription }}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="sourceDescription">
                <mat-header-cell *matHeaderCellDef translate>COMMON_ARTICLE</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{ e.sourceDescription }}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="qty">
                <mat-header-cell *matHeaderCellDef translate>COMMON_QUANTITY</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{ e.qty }}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="sourceRef">
                <mat-header-cell *matHeaderCellDef translate>STOCK_SOURCE_REFERENCE</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{ e.sourceRef }}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="destinationStore">
                <mat-header-cell *matHeaderCellDef translate>STOCK_DESTINATION_STORE</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{ e.destinationStore }}
                </mat-cell>
            </ng-container>


            <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
            <mat-row class="selectable" [class.selected]="row.id === selectedId" (click)="selectRow(row)"
                     *matRowDef="let row; columns: displayedColumns"></mat-row>
        </mat-table>
    </div>
</div>
<div class="pagination-container b-b-background">
    <ss-pagination [paginationModel]="paginator"></ss-pagination>
</div>

@if (selectedRow?.id) {
    <div class="doc-info">
        <ss-doc-info
            [displayedGroups]="['article', 'document']"
            [params]="{
                    documentId: selectedRow?.id,
                    documentURL:'/inter-store-transfer',
                    detailId: selectedRow?.id,
                    articleReference: selectedRow?.sourceRef,
                    articleStoreId: selectedRow?.sourceStore
        }">
        </ss-doc-info>
    </div>
}
