<div class="table-container">
    <mat-table mat-table [dataSource]="data" class="main-table" matSort (matSortChange)="sort($event)">

        <ng-container matColumnDef="number">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_NUMBER</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.number }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="date">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_DATE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.date | date: 'dd/MM/yyyy' }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="reference">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_MEMO</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.reference }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="storeDescription">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>STOCK_STORE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.storeDescription }}
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selected" (click)="selectRow(row)"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
</div>

<div class="pagination-container b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
