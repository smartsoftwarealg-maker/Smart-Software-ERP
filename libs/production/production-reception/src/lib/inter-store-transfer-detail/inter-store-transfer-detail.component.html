<mat-card>
    <mat-card-content>
        @if (form !== null) {
            <form novalidate [formGroup]="form">
                <mat-form-field class="default-50 sm-100">
                    <mat-label translate>COMMON_NUMBER</mat-label>
                    <input matInput formControlName="number" type="number">
                </mat-form-field>

                <mat-form-field class="default-50 sm-100" autofocus>
                    <mat-label translate>COMMON_DATE</mat-label>
                    <ss-date-picker formControlName="date"></ss-date-picker>
                </mat-form-field>

                <mat-form-field class="default-50 sm-100">
                    <mat-label translate>COMMON_REFERENCE</mat-label>
                    <input matInput formControlName="reference" type="text">
                </mat-form-field>
                <mat-form-field class="default-50 sm-100">
                    <mat-label translate>STOCK_STORE</mat-label>
                    <ss-auto-complete matInput
                                      [model]="storeLookup"
                                      formControlName="storeId"></ss-auto-complete>
                    @if (form.controls['storeId'].hasError('required')) {
                        <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
                    }
                    @if (form.controls['storeId'].hasError('validOption')) {
                        <mat-error translate>COMMON_NO_MATCH</mat-error>
                    }

                </mat-form-field>

            </form>
        }
    </mat-card-content>
</mat-card>

@if (id) {
    <div class="detail__div">
        <router-outlet></router-outlet>
    </div>
}
