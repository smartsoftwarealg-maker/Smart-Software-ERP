<div class="container_div">
    <mat-table mat-table [dataSource]="data"  class="main-table"  matSort (matSortChange)="sort($event)">

        <ng-container matColumnDef="reference">
            <mat-header-cell *matHeaderCellDef translate>PROD_REFERENCE</mat-header-cell>
            <mat-cell *matCellDef="let m">
                {{ m.reference }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="description">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>PROD_DESCRIPTION</mat-header-cell>
            <mat-cell *matCellDef="let m">
                {{ m.description }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="document">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>LOGISTICS_DOCUMENT</mat-header-cell>
            <mat-cell *matCellDef="let m">
                {{ m.transactionReference }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="qty">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>PROD_QTY</mat-header-cell>
            <mat-cell *matCellDef="let m">
                {{ m.qty|number:'1.2-2' }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="price">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>STOCK_PRICE</mat-header-cell>
            <mat-cell *matCellDef="let m">
                {{ m.price|number:'1.2-2' }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="value">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_VALUE</mat-header-cell>
            <mat-cell *matCellDef="let m">
                {{ m.value|number:'1.2-2' }}
            </mat-cell>
        </ng-container>


        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>

</div>
<div class="pagination-container b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
