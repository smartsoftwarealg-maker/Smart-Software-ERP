<mat-card class="size_container">
    <mat-card-content>

        @defer (when form) {
            <form [formGroup]="form">

                <mat-form-field class="default-50">
                    <mat-label translate>ADMINISTRATION_ACTIVITY_CODE</mat-label>
                    <input matInput formControlName="code" type="text" required autofocus>
                </mat-form-field>

                <mat-form-field class="default-50">
                    <mat-label translate>COMMON_NAME</mat-label>
                    <input matInput formControlName="name" type="text" required>
                </mat-form-field>

                <mat-form-field class="default-50">
                    <mat-label translate>COMMON_DESCRIPTION</mat-label>
                    <input matInput formControlName="description" type="text">
                </mat-form-field>


                <mat-form-field class="default-50 sm-100">
                    <mat-label translate>COMMON_CATEGORY</mat-label>
                    <ss-auto-complete matInput
                                      [model]="categoryLookup"
                                      formControlName="activityCategory">
                    </ss-auto-complete>
                </mat-form-field>


                <mat-form-field class="default-50 sm-100">
                    <mat-label translate>COMMON_UNIT</mat-label>
                    <ss-auto-complete matInput
                                      [model]="unitLookup"
                                      [canAdd]="false"
                                      formControlName="unitOfMeasureId">
                    </ss-auto-complete>
                </mat-form-field>


                <mat-form-field class="default-50">
                    <mat-label translate>PROD_BASE_UNIT</mat-label>
                    <mat-select formControlName="defaultBaseUnit">
                        <mat-option value="TIME" translate>COMMON_TIME</mat-option>
                        <mat-option value="QUANTITY" translate>COMMON_QUANTITY</mat-option>
                    </mat-select>
                </mat-form-field>



                <div class="default-25">
                    <mat-checkbox formControlName="isActive">
                        {{ 'COMMON_ACTIVE' | translate }}
                    </mat-checkbox>
                </div>

            </form>
        }

    </mat-card-content>
</mat-card>
