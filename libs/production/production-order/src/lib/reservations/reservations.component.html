<div class="container_div">
    <mat-table mat-table [dataSource]="data"  class="main-table">

        <ng-container matColumnDef="reference">
            <mat-header-cell *matHeaderCellDef translate>PROD_REFERENCE</mat-header-cell>
            <mat-cell *matCellDef="let m">
                {{ m.reference }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="description">
            <mat-header-cell *matHeaderCellDef translate>PROD_DESCRIPTION</mat-header-cell>
            <mat-cell *matCellDef="let m">
                {{ m.refDescription }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="qtySatisfied">
            <mat-header-cell *matHeaderCellDef translate>LOGISTICS_QTY_SATISFIED</mat-header-cell>
            <mat-cell *matCellDef="let m">
                {{ m.qtySatisfied.toFixed(2) }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="storeName">
            <mat-header-cell *matHeaderCellDef translate>STOCK_STORE</mat-header-cell>
            <mat-cell *matCellDef="let m">
                {{ m.storeName }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="unitsDescription">
            <mat-header-cell *matHeaderCellDef translate>LOGISTICS_UNITS</mat-header-cell>
            <mat-cell *matCellDef="let m">
                {{ m.unitsDescription }}
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>

</div>
