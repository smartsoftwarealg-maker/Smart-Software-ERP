<mat-card class="size_container">
    <mat-card-content>
        <div class="form_container">
            @if (form) {
                <form [formGroup]="form">

                    <mat-form-field class="default-100">
                        <mat-label translate>STOCK_STORE</mat-label>
                        <input matInput formControlName="storeName" type="text">
                    </mat-form-field>

                    <mat-form-field class="default-100">
                        <mat-label translate>STOCK_LOT_NUMBER</mat-label>
                        <input matInput formControlName="lotNumber" type="text">
                    </mat-form-field>

                    <mat-form-field class="default-100">
                        <mat-label translate>COMMON_DESCRIPTION</mat-label>
                        <input matInput formControlName="description" type="text">
                    </mat-form-field>

                    <mat-form-field floatLabel="always" class="default-100">
                        <mat-label translate>STOCK_ANALYSIS_DATE</mat-label>
                        <ss-date-picker formControlName="analysisDate"></ss-date-picker>
                    </mat-form-field>

                    <mat-checkbox class="default-100" formControlName="blockedLot" translate>STOCK_EXPIRES</mat-checkbox>

                </form>
            }
        </div>
    </mat-card-content>
</mat-card>
