<div class="table-container main-container ">
    <mat-table mat-table [dataSource]="data" class="main-table">

        <ng-container matColumnDef="reference">
            <mat-header-cell *matHeaderCellDef translate>COMMON_REFERENCE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.reference }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="description">
            <mat-header-cell *matHeaderCellDef translate>COMMON_DESCRIPTION</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.dlocation }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="analysisDate">
            <mat-header-cell *matHeaderCellDef translate>STOCK_ANALYSIS_DATE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.analysisDate | date: 'dd/MM/yyyy' }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="blocked">
            <mat-header-cell *matHeaderCellDef translate>STOCK_BLOCKED</mat-header-cell>
            <mat-cell *matCellDef="let e">
                <mat-checkbox [checked]="e.blockedLot" [disabled]="e.analysisDate == undefined" (mouseup)="block()"></mat-checkbox>
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selected" (mousedown)="selectRow(row)"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
</div>

<div class="pagination-container b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
