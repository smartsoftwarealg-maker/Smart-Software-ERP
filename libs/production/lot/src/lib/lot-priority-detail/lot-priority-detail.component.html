<mat-card class="size_container">
    <mat-card-content>
        <div class="form_container">
            @if (form) {
                <form [formGroup]="form">

                    <mat-form-field class="default-100">
                        <mat-label translate>STOCK_STORE</mat-label>
                        <input matInput formControlName="storeName" type="text">
                    </mat-form-field>

                    <mat-form-field class="default-100">
                        <mat-label translate>COMMON_DESCRIPTION</mat-label>
                        <input matInput formControlName="description" type="text">
                    </mat-form-field>

                    <mat-form-field class="default-100">
                        <mat-label translate>STOCK_LOT_NUMBER</mat-label>
                        <input matInput formControlName="lotNumber" type="number">
                    </mat-form-field>


                    <mat-form-field class="default-100">
                        <mat-label translate>COMMON_PRIORITY</mat-label>
                        <input matInput formControlName="priority" type="number" min="0" max="100">
                    </mat-form-field>

                </form>
            }
        </div>
    </mat-card-content>
</mat-card>
