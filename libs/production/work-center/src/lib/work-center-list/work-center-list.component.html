<div class="main-container">
    <div class="table-container">
        <mat-table mat-table [dataSource]="data" class="main-table" matSort (matSortChange)="sort($event)">

            <ng-container matColumnDef="code">
                <mat-header-cell *matHeaderCellDef mat-sort-header translate>LOGISTICS_CODE</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{ e.code }}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="name">
                <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_NAME</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{ e.name }}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="description">
                <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_DESCRIPTION</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{ e.description }}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="workCenterType">
                <mat-header-cell *matHeaderCellDef mat-sort-header translate>PROD_WORK_CENTER</mat-header-cell>
                <mat-cell *matCellDef="let e" translate>
                    PROD_{{ e.workCenterType }}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="ccDescription">
                <mat-header-cell *matHeaderCellDef mat-sort-header translate>PROD_CC_DESCRIPTION</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{ e.ccDescription }}
                </mat-cell>
            </ng-container>

            <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
            <mat-row class="selectable"
                     [class.selected]="row.id == selected"
                     [class.dirty]="row.dirty"
                     (click)="selectRow(row)"
                     *matRowDef="let row; columns: displayedColumns;"></mat-row>
        </mat-table>
    </div>
    <div class="pagination-container b-b-background">
        <ss-pagination [paginationModel]="pagination"></ss-pagination>
    </div>

</div>
