@if (detailSrv.getParentId()) {
    <div class="main-container">
        <div class="add-button">
            @if (isEditable) {
                <button mat-mini-fab color="primary"
                        (click)="showDetail(0)"
                        [matTooltip]="'COMMON_ADD' | translate">
                    <span class="fas fa-plus"></span>
                </button>
            }
            <button mat-mini-fab (click)="edit()"
                    [matTooltip]="'COMMON_EDIT' | translate"
                    [disabled]="!selectedId"
                    color="accent">
                <span class="fas fa-pen"></span>
            </button>
            @if (isEditable) {
                <button mat-mini-fab (click)="deleteSelected()"
                        [matTooltip]="'COMMON_DELETE' | translate"
                        [disabled]="!selectedId"
                        color="warn">
                    <span class="fas fa-trash-alt"></span>
                </button>
            }
        </div>

        <div class="container_div">
            <mat-table [dataSource]="data$" class="main-table">

                <ng-container matColumnDef="activityTypeId">
                    <mat-header-cell *matHeaderCellDef translate>CRM_ACTIVITY_TYPE</mat-header-cell>
                    <mat-cell *matCellDef="let e">{{ e.activityTypeId }}</mat-cell>
                </ng-container>

                <ng-container matColumnDef="formulaFactor">
                    <mat-header-cell *matHeaderCellDef translate>PROD_FORMULA_FACTOR</mat-header-cell>
                    <mat-cell *matCellDef="let e">{{ e.formulaFactor }}</mat-cell>
                </ng-container>

                <ng-container matColumnDef="baseUnit">
                    <mat-header-cell *matHeaderCellDef translate>PROD_BASE_UNIT</mat-header-cell>
                    <mat-cell *matCellDef="let e">{{ e.baseUnit }}</mat-cell>
                </ng-container>

                <ng-container matColumnDef="priority">
                    <mat-header-cell *matHeaderCellDef translate>CMMS_PRIORITY</mat-header-cell>
                    <mat-cell *matCellDef="let e">{{ e.priority }}</mat-cell>
                </ng-container>

                <ng-container matColumnDef="isActive">
                    <mat-header-cell *matHeaderCellDef translate>PROD_ACTIVE</mat-header-cell>
                    <mat-cell *matCellDef="let e">
                        <span [class]="e.isActive ? 'fa-solid fa-check' : 'fa-solid fa-x'"></span>
                    </mat-cell>
                </ng-container>

                <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
                <mat-row class="selectable"
                         [class.selected]="row.id === selectedId()"
                         (click)="select(row.id)"
                         *matRowDef="let row; columns: displayedColumns">
                </mat-row>
            </mat-table>
        </div>

        <div class="pagination-container b-b-background">
            <ss-pagination [paginationModel]="pagination"></ss-pagination>
        </div>
    </div>
}
