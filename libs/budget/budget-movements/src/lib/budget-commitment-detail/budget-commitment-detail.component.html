<mat-card>
    <mat-card-content>
        <form *ngIf="form !== null" novalidate [formGroup]="form">
            <mat-form-field  class="default-50 number">
                <mat-label translate>BUD_ALLOCATED_QTY</mat-label>
                <input matInput formControlName="planning" type="text" >
            </mat-form-field>

            <mat-form-field  class="default-50 number">
                <mat-label translate>BUD_COMPLEMENT</mat-label>
                <input matInput formControlName="complement" type="text" >
            </mat-form-field>

            <mat-form-field  class="default-50 number">
                <mat-label translate>BUD_COMMITMENTS</mat-label>
                <input matInput formControlName="commitment" type="text" >
            </mat-form-field>

            <mat-form-field  class="default-50 number">
                <mat-label translate>BUD_TRANSFERS</mat-label>
                <input matInput formControlName="transfer" type="text" >
            </mat-form-field>

            <mat-form-field  class="default-50 number">
                <mat-label translate>COMMON_BALANCE</mat-label>
                <input matInput formControlName="balance" type="text" >
            </mat-form-field>

            <br>
            <mat-form-field id="description" class="default-100">
                <mat-label translate>ADMINISTRATION_DESCRIPTION</mat-label>
                <input matInput formControlName="description" type="text" required>
                <mat-error *ngIf="form.controls['description'].invalid" translate>COMMON_FIELD_REQUIRED</mat-error>
            </mat-form-field>

            <mat-form-field  class="default-50">
                <mat-label translate>COMMON_DECISION</mat-label>
                <input matInput formControlName="decision" type="text" required>
            </mat-form-field>

            <mat-form-field class="default-50">
                <mat-label translate>COMMON_DATE</mat-label>
                <ss-date-picker formControlName="date"></ss-date-picker>
            </mat-form-field>

            <mat-form-field  class="default-50">
                <mat-label translate>LOGISTICS_ORDER_NO</mat-label>
                <input matInput formControlName="orderNo" type="text" >
            </mat-form-field>

            <mat-form-field  class="default-50 number">
                <mat-label translate>LOGISTICS_AMOUNT</mat-label>
                <input matInput formControlName="amount" type="number" required>
            </mat-form-field>

            <mat-form-field class="default-100">
                <mat-label translate>LOGISTICS_SUPPLIER</mat-label>
                <ss-auto-complete matInput
                                  descriptionFieldName="supplier"
                                  [model]="supplierLookup"
                                  formControlName="supplier">
                </ss-auto-complete>
            </mat-form-field>

        </form>
    </mat-card-content>
</mat-card>
