@if (form) {
  <mat-card>
    <mat-card-header>
      <div class="ctrl_div default-100">
        <button mat-mini-fab color="primary"
          [matTooltip]="'COMMON_SAVE' | translate"
          (click)="save()">
          <i class="fas fa-save"></i>
        </button>
        <button mat-mini-fab
          color="warn"
          [matTooltip]="'COMMON_CANCEL' | translate"
          translate (click)="cancel()">
          <i class="fas fa-redo"></i>
        </button>
      </div>
    </mat-card-header>
    <mat-card-content>
      @if (form !== null) {
        <form novalidate [formGroup]="form">
          <mat-form-field appearance="fill" class="default-100">
            <mat-label translate>BUD_DESTINATION</mat-label>
            <mat-select (selectionChange)="onDestination($event)">
              @for (s of destinations$ | async; track s) {
                <mat-option [value]="s.id">
                  {{s.description}}
                </mat-option>
              }
            </mat-select>
          </mat-form-field>
          <mat-form-field class="default-100">
            <mat-label translate>BUD_PLANNINGS</mat-label>
            <ss-auto-complete matInput
              formControlName="planningId"
              [model]="planningLookup">
            </ss-auto-complete>
          </mat-form-field>
          <mat-form-field id="description" class="default-100">
            <mat-label translate>COMMON_AMOUNT</mat-label>
            <input matInput formControlName="amount" type="number" required min="1">
            @if (form.controls['amount'].invalid) {
              <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
            }
          </mat-form-field>
          <!--            <pre>{{form?.value | json }}</pre>-->
        </form>
      }
    </mat-card-content>
  </mat-card>
}
