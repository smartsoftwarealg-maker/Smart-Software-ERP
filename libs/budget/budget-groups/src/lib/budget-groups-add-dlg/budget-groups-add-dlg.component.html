<mat-card>
  <form novalidate [formGroup]="form">

    <mat-form-field required autofocus>
      <mat-label translate>ADMINISTRATION_CODE</mat-label>
      <input matInput formControlName="code" type="text" >
      @if (form.controls['code'].invalid) {
        <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
      }
    </mat-form-field>

    <mat-form-field class="default-100" required>
      <mat-label translate>COMMON_DESCRIPTION</mat-label>
      <input matInput formControlName="description" type="text" >
      @if (form.controls['description'].invalid) {
        <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
      }
    </mat-form-field>

    <div id="disabled" class="default-100 sm-100">
      <mat-checkbox formControlName="disabled" translate>ADMINISTRATION_BLOCKED</mat-checkbox>
    </div>
  </form>
</mat-card>

<div class="ctrl-div">
  <button mat-raised-button color="primary"
    type="button"
    (click)="save()">
    {{ 'COMMON_SAVE' | translate }}
    <i class="fa-solid fa-upload  icon"></i>
  </button>
  <button mat-raised-button color="warn" type="button" (click)="cancel()">
    {{ 'COMMON_CANCEL' | translate }}
    <i class="fa-solid fa-rotate-left icon"></i>
  </button>
</div>
