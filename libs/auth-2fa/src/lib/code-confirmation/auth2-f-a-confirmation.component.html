<mat-card>
  <mat-card-header>
    <mat-label class="f-primary" translate>COMMON_2FA_SETUP</mat-label>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="form">
      <mat-form-field appearance="fill" class="default-100">
        <mat-label translate>ADMINISTRATION_EMAIL</mat-label>
        <input matInput placeholder="{{ 'ADMINISTRATION_EMAIL' | translate}}" formControlName="email"
          type="text" required>
      </mat-form-field>
      @if (codeSent && !verified) {
        <p class="f-warn" translate>COMMON_CODE_SENT</p>
      }
      @if (verified) {
        <p  class="f-warn" translate>COMMON_CODE_VERIFIED</p>
      }
      @if (codeSent) {
        <mat-form-field appearance="fill" class="default-100">
          <mat-label translate>ADMINISTRATION_CODE</mat-label>
          <input matInput placeholder="{{ 'ADMINISTRATION_CODE' | translate}}" formControlName="code" type="text">
        </mat-form-field>
      }
      @if (sendingEmail) {
        <mat-progress-bar mode="indeterminate"></mat-progress-bar>
      }

      <!--        <pre> {{ form.value | json }}</pre>-->
    </form>
  </mat-card-content>
  <mat-card-actions>
    <div class="button__div default-100">
      @if (form.controls['email'].value.indexOf('@') > 0) {
        <button mat-raised-button
          [disabled]="!form.valid"
          color="primary"
          translate
          (click)="sendEmail()">COMMON_SEND_CODE
        </button>
      }
      @if (codeSent && !verified) {
        <button mat-raised-button color="primary" translate
          [disabled]="!form.valid"
          (click)="verify()"
          >COMMON_VERIFY_CODE
        </button>
      }
      @if (verified) {
        <button mat-raised-button
          color="primary"
          translate
          (click)="continue()"
          >
          COMMON_CONTINUE
        </button>
      }
    </div>
  </mat-card-actions>
</mat-card>
