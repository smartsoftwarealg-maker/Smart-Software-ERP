<mat-card>
    <mat-card-header>
        <mat-label translate>COMMON_2FA_SETUP</mat-label>
    </mat-card-header>
    <mat-card-content>
        <form [formGroup]="form">
            <mat-form-field appearance="fill" class="default-100">
                <mat-label translate>ADMINISTRATION_EMAIL</mat-label>
                <input matInput placeholder="{{ 'ADMINISTRATION_EMAIL' | translate}}" formControlName="email"
                       type="text" required>
            </mat-form-field>
            <p *ngIf="codeSent && !verified" translate>COMMON_CODE_SENT</p>
            <p *ngIf="verified" translate>COMMON_CODE_VERIFIED</p>
            <mat-form-field appearance="fill" class="default-100" *ngIf="codeSent">
                <mat-label translate>ADMINISTRATION_CODE</mat-label>
                <input matInput placeholder="{{ 'ADMINISTRATION_CODE' | translate}}" formControlName="code" type="text">
            </mat-form-field>
            <mat-progress-bar mode="indeterminate" *ngIf="sendingEmail"></mat-progress-bar>

            <!--        <pre> {{ form.value | json }}</pre>-->
        </form>
    </mat-card-content>
    <mat-card-actions>
        <div class="button__div default-100">
            <button mat-raised-button
                    [disabled]="!form.valid"
                    color="primary"
                    translate
                    (click)="sendEmail()">COMMON_SEND_CODE
            </button>
            <button mat-raised-button color="primary" translate
                    [disabled]="!form.valid"
                    (click)="verify()"
                    *ngIf="codeSent && !verified">COMMON_VERIFY_CODE
            </button>
            <button mat-raised-button
                    color="primary"
                    translate
                    (click)="continue()"
                    *ngIf="verified">
                COMMON_CONTINUE
            </button>
        </div>
    </mat-card-actions>
</mat-card>
