<mat-card>
    <mat-card-header>
        <mat-label translate>COMMON_PASSWORD_SETTING</mat-label>
    </mat-card-header>
    <mat-card-content>
        <form [formGroup]="form">
            <mat-form-field appearance="fill" class="default-100">
                <mat-label translate>COMMON_PASSWORD</mat-label>
                <input matInput placeholder="{{ 'COMMON_PASSWORD' | translate}}" formControlName="password"
                       type="password" required>
                @if (!form.controls['password'].valid) {
                    <mat-error [translate]="{minLen: minLength}">
                        COMMON_FIELD_MIN_LENGTH
                    </mat-error>
                }

            </mat-form-field>
            <mat-form-field appearance="fill" class="default-100">
                <mat-label translate>COMMON_CONFIRMATION</mat-label>
                <input matInput placeholder="{{ 'COMMON_CONFIRMATION' | translate}}" formControlName="confirmation"
                       type="password" required>
                @if (form.controls['password'].getRawValue() !== form.controls['confirmation'].getRawValue()) {
                    <mat-error [translate]="{minLen: minLength}">
                        COMMON_MISS_MATCH
                    </mat-error>
                }
            </mat-form-field>
            <!--        <pre> {{ form.value | json }}</pre>-->
        </form>
    </mat-card-content>
    <mat-card-actions>
        <div class="button__div default-100">
            <button mat-raised-button color="primary" translate
                    [disabled]="!form.controls['password'].valid || form.controls['password'].value != form.controls['confirmation'].value"
                    (click)="updatePassword()">UPDATE
            </button>
        </div>
    </mat-card-actions>
</mat-card>
