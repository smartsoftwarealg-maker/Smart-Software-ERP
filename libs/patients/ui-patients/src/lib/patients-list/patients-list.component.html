<mat-table mat-table [dataSource]="data" class="main-table">

    <ng-container matColumnDef="lastName">
        <mat-header-cell *matHeaderCellDef translate>PAYROLL_LAST_NAME</mat-header-cell>
        <mat-cell *matCellDef="let e">
            {{e.lastName}}
        </mat-cell>
    </ng-container>

    <ng-container matColumnDef="firstName">
        <mat-header-cell *matHeaderCellDef translate>PAYROLL_FIRST_NAME</mat-header-cell>
        <mat-cell *matCellDef="let e">
            {{e.firstName}}
        </mat-cell>
    </ng-container>

    <ng-container matColumnDef="birthDate">
        <mat-header-cell *matHeaderCellDef translate>PAYROLL_BIRTH_DATE</mat-header-cell>
        <mat-cell *matCellDef="let e">
            {{e.birthDate | date: 'dd/MM/yyyy'}}
        </mat-cell>
    </ng-container>


    <ng-container matColumnDef="address">
        <mat-header-cell *matHeaderCellDef translate>LOGISTICS_ADDRESS</mat-header-cell>
        <mat-cell *matCellDef="let e">
            {{e.address}}
        </mat-cell>
    </ng-container>



    <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
    <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
             *matRowDef="let row; columns: displayedColumns;"></mat-row>
</mat-table>
