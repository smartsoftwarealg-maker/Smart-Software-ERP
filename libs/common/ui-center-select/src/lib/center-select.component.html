<div class="cc-container">
    <mat-vertical-stepper [ngClass]="{'hidden-stepper': loading}" (selectionChange)="onStepSelectionChanged($event)" [linear]="true" class="stepper locale-dir" #stepper>
        <ng-template matStepperIcon="edit" let-index="index">
            {{index + 1}}
        </ng-template>
        <ng-template matStepperIcon="done" let-index="index">
            {{index + 1}}
        </ng-template>
        <ng-template matStepperIcon="number" let-index="index">
            {{index + 1}}
        </ng-template>
        <mat-step [optional]="false" [completed]="selectedCompany > 0">
            <ng-template matStepLabel>
                <span *ngIf="!selectedCompany || selectedCompany < 1" style="user-select: none" translate>COMMON_SELECT_COMPANY</span>
                <span *ngIf="selectedCompany > 0" style="user-select: none">{{selectedCompanyName}}</span>
            </ng-template>
            <mat-form-field style="width: 90%">
                <mat-select (selectionChange)="selectCompany($event.value)" [value]="selectedCompany">
                    <mat-option *ngFor="let company of companyList" [value]="company.id">
                        {{ company.description }}
                    </mat-option>
                </mat-select>
            </mat-form-field>
        </mat-step>
        <mat-step [optional]="false" [completed]="false">
            <ng-template matStepLabel>
                <span style="user-select: none" translate>COMMON_SELECT_CENTER</span>
            </ng-template>
            <div *ngIf="!loadingCenters">
                <mat-form-field style="width: 90%" *ngIf="centerList.length <= 5">
                    <mat-select (selectionChange)="selectCenter($event.value)" [value]="selectedCenter">
                        <mat-option *ngFor="let center of centerList" [value]="center.id">
                            {{ center.description }}
                        </mat-option>
                    </mat-select>
                </mat-form-field>

                <mat-form-field style="width: 90%" *ngIf="centerList.length > 5">
                    <mat-label translate>ADMINISTRATION_CENTER</mat-label>
                    <input type="text"
                           [placeholder]="'COMMON_TYPE_TO_SELECT'|translate"
                           aria-label="Number"
                           matInput
                           [formControl]="centerControl"
                           [matAutocomplete]="auto">
                    <mat-autocomplete #auto="matAutocomplete" (optionSelected)="select($event)">
                        <mat-option *ngFor="let center of filteredCenters | async" [value]="center.description">
                            {{center.description}}
                        </mat-option>
                    </mat-autocomplete>
                </mat-form-field>

                <div style="height: 36px; margin-top: 8px">
                    <button mat-raised-button
                            color="primary"
							class="margin-end-8 float-end"
                            (click)="onDone()"
                            [disabled]="selectedCenter < 1"
                            translate>COMMON_SELECT
                    </button>
                </div>
            </div>
        </mat-step>
    </mat-vertical-stepper>
</div>
