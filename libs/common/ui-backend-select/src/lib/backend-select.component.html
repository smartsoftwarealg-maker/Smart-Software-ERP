<mat-card class="backend-select-container">
    <mat-toolbar color="primary" class="toolbar">
        {{'COMMON_SELECT_COMPANY'|translate}}
    </mat-toolbar>
    <mat-list>
        @for (c of companySelectorSrv.companyList; track c) {
            <mat-list-item [class.selected]="c === selectedCompany()"
                           (click)="selectCompany(c)">
                @if (c === companySelectorSrv.spaceCompany) {
                    <i class="fa-solid fa-check"></i>
                }
                {{ c|translate }}
            </mat-list-item>
        }
    </mat-list>
    <div class="btn__div">
        <button mat-raised-button type="button" (click)="select()" translate>
            <i class="fas fa-check"></i>
            {{'COMMON_SELECT_COMPANY'|translate}}
        </button>
    </div>
</mat-card>
