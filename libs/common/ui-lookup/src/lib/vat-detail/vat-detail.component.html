@if (form !== null) {
    <mat-card>
        <form novalidate [formGroup]="form">
            <mat-form-field class="default-100">
                <mat-label translate>COMMON_DESCRIPTION</mat-label>
                <input matInput formControlName="description" type="text" autofocus>
            </mat-form-field>

            <mat-form-field class="default-100">
                <mat-label translate>ADMINISTRATION_DESCRIPTION_AR</mat-label>
                <input matInput formControlName="descriptionAr" type="text">
            </mat-form-field>

            <mat-form-field class="default-50">
                <mat-label translate>STOCK_PERCENTAGE</mat-label>
                <input matInput formControlName="value" type="number" max="100" min="0">
            </mat-form-field>

            <mat-form-field class="default-100">
                <mat-label translate>COMMON_SALES_ACCOUNT</mat-label>
                <ss-auto-complete matInput
                                  [model]="salesLookup"
                                  formControlName="salesAccount">
                </ss-auto-complete>
                @if (form.controls['salesAccount'].invalid) {
                    <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
                }
            </mat-form-field>

            <mat-form-field class="default-100">
                <mat-label translate>COMMON_PURCHASE_ACCOUNT</mat-label>
                <ss-auto-complete matInput
                                  [model]="purchaseLookup"
                                  formControlName="purchaseAccount">
                </ss-auto-complete>
                @if (form.controls['purchaseAccount'].invalid) {
                    <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
                }
            </mat-form-field>

        </form>
    </mat-card>
}
