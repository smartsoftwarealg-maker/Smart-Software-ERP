<div class="table__div">
    <mat-table mat-table [dataSource]="data" class="main-table" matSort (matSortChange)="sort($event)">

        <ng-container matColumnDef="description">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_DESCRIPTION</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.description}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="descriptionAr">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>ADMINISTRATION_DESCRIPTION_AR</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.descriptionAr}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="salesAccount">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_SALES_ACCOUNT</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.salesAccount}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="purchaseAccount">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_PURCHASE_ACCOUNT</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.purchaseAccount}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="value">
            <mat-header-cell *matHeaderCellDef translate>COMMON_VALUE</mat-header-cell>
            <mat-cell style="justify-content: flex-end; direction: ltr;" *matCellDef="let e">
                {{ e.value.toFixed(2) }}
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
</div>
<div class="pagination-container b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
