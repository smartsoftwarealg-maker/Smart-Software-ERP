<div class="form_container">
    <mat-table mat-table [dataSource]="data" class="main-table" style="width: 700px">

        <ng-container matColumnDef="description">
            <mat-header-cell *matHeaderCellDef translate>COMMON_DESCRIPTION</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.description}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="descriptionAr">
            <mat-header-cell *matHeaderCellDef translate>COMMON_DESCRIPTION</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.descriptionAr}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="dairaDescription">
                <mat-header-cell *matHeaderCellDef translate>COMMON_DAIRA</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.dairaDescription}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="wilayaDescription">
            <mat-header-cell *matHeaderCellDef translate>COMMON_WILAYA</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.wilayaDescription}}
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>

    <div class="pagination-container b-b-background">
        <ss-pagination [paginationModel]="pagination"></ss-pagination>
    </div>
</div>
