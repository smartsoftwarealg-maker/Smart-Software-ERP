<mat-card>
    @if (form !== null) {
        <form novalidate [formGroup]="form">
            <mat-form-field class="default-100">
                <mat-label translate>COMMON_DESCRIPTION</mat-label>
                <input matInput formControlName="description" type="text" required autofocus>
            </mat-form-field>

            <mat-form-field class="default-100">
                <mat-label translate>ADMINISTRATION_CODE</mat-label>
                <input matInput formControlName="descriptionAr" type="text" required autofocus>
            </mat-form-field>

            <mat-form-field class="default-100">
                <mat-label translate>COMMON_ACCOUNT_MAP</mat-label>
                <ss-auto-complete matInput
                                  [model]="accountLookupModel"
                                  formControlName="accountId">
                </ss-auto-complete>
            </mat-form-field>
        </form>
    }
</mat-card>
