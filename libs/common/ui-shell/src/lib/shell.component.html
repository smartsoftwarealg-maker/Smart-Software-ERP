<div #shellDiv class="sidenav-container" >

    <mat-sidenav-container [hasBackdrop]="!showSideNav" [dir]="langSrv.dir" class="sidenav-container">
        <mat-sidenav #navBar [mode]="showSideNav ? 'side' : 'over'" [opened]="showSideNav" class="z-side-bar b-primary">
            <div [dir]="langSrv.dir" class="shell-side-nav">

                <div class="brand mat-elevation-z6">
                    <img class="brand-icon" width="56px" height="56px" src="./assets/logo.png">
                    <div class="app-name">
                        {{shellSrv.applicationTitle}}
                    </div>
                </div>

                <div class="side-nav-tree-container">
                    <mat-tree [dataSource]="shellSrv.sideNavDataSource" [treeControl]="treeControl" class="side-nav-tree">
                        <!-- This is the tree node template for leaf nodes -->
                        <mat-tree-node *matTreeNodeDef="let node" matTreeNodeToggle (click)="navBar.toggle()">
                            <li class="mat-tree-node b-primary selectable-tree-item" [routerLink]="node.route" (click)="scrollTo($event)">
                                <!-- use a disabled button to provide padding for tree leaf -->
                                <button mat-icon-button disabled></button>
                                <div class="nav-tree-icon" [style.backgroundColor]="node.backgroundColor">
                                    <i *ngIf="node.icon" [class]="node.icon"></i>
                                </div>
                                <span class="margin-start-8" translate>{{node.name}}</span>
                            </li>
                        </mat-tree-node>
                        <!-- This is the tree node template for expandable nodes -->
                        <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild">
                            <li>
                                <div class="mat-tree-node b-primary selectable-tree-item" matTreeNodeToggle  (click)="scrollTo($event)">
                                    <button mat-icon-button>
                                        <i class="{{treeControl.isExpanded(node) ? 'fas fa-chevron-down' : (langSrv.rtl ? 'fas fa-chevron-left' : 'fas fa-chevron-right')}}"></i>
                                    </button>
                                    <div class="nav-tree-icon" [style.backgroundColor]="node.backgroundColor">
                                        <i *ngIf="node.icon" [class]="node.icon"></i>
                                    </div>
                                    <span class="margin-start-8" translate>{{node.name}}</span>
                                </div>
                                <ul [class.side-nav-tree-invisible]="!treeControl.isExpanded(node)" class="b-primary">
                                    <ng-container matTreeNodeOutlet></ng-container>
                                </ul>
                            </li>
                        </mat-nested-tree-node>
                    </mat-tree>
                </div>

            </div>
        </mat-sidenav>
        <mat-sidenav-content>
            <div #toolbar class="b-primary shell-toolbar" [dir]="langSrv.dir">

                <div class="toolbar-inner">
                    <button mat-icon-button (click)="navBar.toggle()">
                        <i class="far fa-bars"></i>
                    </button>

                    <button mat-icon-button
                        (click)="toolbar.classList.remove('smll-search-mode')" class="exit-search-btn">
                        <i *ngIf="langSrv.rtl" class="fas fa-arrow-right"></i>
                        <i *ngIf="!langSrv.rtl" class="fas fa-arrow-left"></i>
                    </button>

                    <button *ngIf="shellSrv.hasGoBackFn" mat-icon-button (click)="shellSrv.goBack()"
                        class="hidden-during-search">
                        <i *ngIf="langSrv.rtl" class="fas fa-arrow-right"></i>
                        <i *ngIf="!langSrv.rtl" class="fas fa-arrow-left"></i>
                    </button>

                    <div class="shell-title" translate>{{shellSrv.shellTitle}}</div>

                    <button mat-icon-button *ngIf="shellSrv.hasSearch" class="small-only smll-search-button"
                        (click)="toolbar.classList.add('smll-search-mode')"
                        matTooltip="{{shellSrv.searchInputTitle | translate}}">
                        <i class="far fa-search"></i>
                    </button>

                    <div class="ss-form-field large-only" *ngIf="shellSrv.hasSearch">
                        <mat-form-field floatLabel="always">
                            <mat-label translate>{{shellSrv.searchInputTitle}}</mat-label>
                            <input [formControl]="shellSrv.searchFormControl" matInput type="text">
                        </mat-form-field>
                    </div>

                    <ng-container *ngFor="let b of shellSrv.buttons">
                        <ng-container *ngIf="b.keepOnToolbar != 2">
                            <ng-template [ngIf]="b.menuItems">
                                <button mat-icon-button matTooltip="{{b.label | translate}}" *ngIf="b.visible"
                                        [matMenuTriggerFor]="menu"
                                        [disabled]="b.disabled"
                                        class="hidden-during-search"
                                        [class.large-only]="b.disabled || b.keepOnToolbar != 1">
                                    <i [class]="b.icon"></i>
                                </button>
                                <mat-menu #menu>
                                    <ng-container *ngFor="let mt of b.menuItems">
                                        <button *ngIf="mt.visible" mat-menu-item (click)="mt.click()"
                                                [disabled]="mt.disabled">
                                            <i [class]="mt.icon"></i>

                                            {{mt.label | translate}}
                                        </button>
                                    </ng-container>
                                </mat-menu>
                            </ng-template>
                            <ng-template [ngIf]="!b.menuItems">
                                <button mat-icon-button matTooltip="{{b.label | translate}}" *ngIf="b.visible"
                                        (click)="b.click()" [disabled]="b.disabled" class="hidden-during-search"
                                        [class.large-only]="b.disabled || (b.keepOnToolbar != 1)">
                                    <i [class]="b.icon"></i>
                                </button>
                            </ng-template>
                        </ng-container>
                    </ng-container>

                    <button mat-icon-button #trigger="matMenuTrigger" [matMenuTriggerFor]="menu">
                        <i class="fas fa-caret-down"></i>
                    </button>

                    <div class="toolbar-username margin-end-8 large-only">
                        <div class="user-icon">
                            <i class="fas fa-user-alt"></i>
                        </div>
                        <div class="user-name margin-start-4">{{contextSrv ? contextSrv.context.fullName : ''}}</div>
                    </div>

                </div>

            </div>
            <!--app-nav-bar (menuToggle)="navBar.toggle()"></app-nav-bar-->
            <div class="b-b-app-bar static-container" [class.hidden]="shellSrv.loading || shellSrv.error" #routerContainer>
                <router-outlet></router-outlet>
                <div class="b-b-app-bar static-container-bottom-padding"></div>
            </div>
            <div *ngIf="shellSrv.loading" class="b-b-app-bar loading-spinner-container">
                <mat-spinner></mat-spinner>
            </div>
            <div *ngIf="shellSrv.error" class="b-b-app-bar loading-spinner-container">
                <i class="fas fa-exclamation-circle fa-10x f-warn"></i>
                <button mat-raised-button (click)="shellSrv.retry()" translate>RETRY</button>
            </div>
        </mat-sidenav-content>
    </mat-sidenav-container>

    <mat-menu #menu="matMenu" style="overflow: hidden">
        <div class="nav-bar-settings-menu" (click)="$event.stopPropagation()">
            <ng-container *ngFor="let b of shellSrv.buttons">

                <ng-template [ngIf]="b.menuItems">
                    <button type="button" mat-menu-item *ngIf="b.visible" class="settings-item" [class.small-only]="b.keepOnToolbar != 2"
                            [class]="{'f-b-disabled-btn': b.disabled, 'disable-events': b.disabled}"
                            [matMenuTriggerFor]="menu">
                        <div class="icon">
                            <i [class]="b.icon"></i>
                        </div>
                        <span class="text" translate>{{b.label}}</span>
                    </button>
                    <mat-menu #menu>
                        <ng-container *ngFor="let mt of b.menuItems">
                            <button *ngIf="mt.visible" mat-menu-item (click)="mt.click(); trigger.closeMenu();"
                                    [disabled]="mt.disabled">
                                <i [class]="mt.icon"></i>
                                {{mt.label | translate}}
                            </button>
                        </ng-container>
                    </mat-menu>
                </ng-template>

                <ng-template [ngIf]="!b.menuItems">
                    <button type="button" mat-menu-item *ngIf="b.visible" class="settings-item" [class.small-only]="b.keepOnToolbar != 2"
                            [class]="{'f-b-disabled-btn': b.disabled, 'disable-events': b.disabled}"
                            (click)="b.click(); trigger.closeMenu();">
                        <div class="icon">
                            <i [class]="b.icon"></i>
                        </div>
                        <span class="text" translate>{{b.label}}</span>
                    </button>
                </ng-template>



            </ng-container>

            <mat-divider *ngIf="shellSrv.buttons.length"></mat-divider>

            <button type="button" mat-menu-item class="settings-item small-only">
                <div class="icon">
                    <i class="fas fa-user-alt"></i>
                </div>
                <span class="text" style="font-weight: bold;" translate>{{contextSrv.context ? contextSrv.context.fullName : ''}}</span>
            </button>

            <mat-divider class="small-only"></mat-divider>

            <button type="button" mat-menu-item class="settings-item" (click)="langBtn.click()">
                <ss-language-select class="icon" (click)="$event.stopPropagation()" #langBtn></ss-language-select>
                <span class="text" translate>COMMON_LANGUAGE_SETTINGS</span>
            </button>
            <button type="button" mat-menu-item class="settings-item" (click)="themeBtn.click()">
                <ss-theme-select class="icon" (click)="$event.stopPropagation()" #themeBtn></ss-theme-select>
                <span class="text" translate>COMMON_THEME_SETTINGS</span>
            </button>
            <button type="button" mat-menu-item class="settings-item" (click)="logoutBtn.click()">
                <ss-logout class="icon" (click)="$event.stopPropagation()" #logoutBtn></ss-logout>
                <span class="text" translate>COMMON_LOGOUT</span>
            </button>
        </div>
    </mat-menu>

</div>
