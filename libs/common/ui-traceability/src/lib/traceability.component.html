<div class="form_container">
    <div class="log__type b-primary" [formGroup]="form">
        <mat-form-field class="date__picker">
            <mat-label translate>COMMON_FROM</mat-label>
            <ss-date-picker formControlName="fromDate"></ss-date-picker>
        </mat-form-field>

        <mat-form-field class="date__picker">
            <mat-label translate>COMMON_TO</mat-label>
            <ss-date-picker formControlName="toDate"></ss-date-picker>
        </mat-form-field>

        <mat-form-field >
            <mat-label translate>COMMON_SEARCH</mat-label>
            <input matInput formControlName="filter" type="text" maxlength="20">
        </mat-form-field>

        <mat-radio-group aria-label="Select log type" formControlName="options" (change)="refresh()">
            <mat-radio-button value="1" [checked]="form.controls['options']?.value ===  1" translate> COMMON_WRITE</mat-radio-button>
            <mat-radio-button value="2" [checked]="form.controls['options']?.value ===  2" translate>COMMON_EDIT</mat-radio-button>
            <mat-radio-button value="3" [checked]="form.controls['options']?.value ===  3"translate>COMMON_DELETE</mat-radio-button>
        </mat-radio-group>
    </div>
    <mat-tree [dataSource]="dataSource"
              [treeControl]="treeControl"
              class="schemas">
        <!-- This is the tree node template for leaf nodes -->
        <mat-tree-node *matTreeNodeDef="let node"
                       matTreeNodePadding
                       class="selectable"
                       [class.selected]="node.schema.id === selectedId"
                       (click)="select(node)">
            <!-- use a disabled button to provide padding for tree leaf -->
            <button mat-icon-button disabled></button>
            {{node.name}}
        </mat-tree-node>
        <!-- This is the tree node template for expandable nodes -->
        <mat-tree-node *matTreeNodeDef="let node;when: hasChild" matTreeNodePadding>
            <button mat-icon-button matTreeNodeToggle
                    [attr.aria-label]="'Toggle ' + node.name">
                {{treeControl.isExpanded(node) ? '-' : '+'}}
            </button>
            <span translate>{{ 'COMMON_' + node.name }} </span>
        </mat-tree-node>
    </mat-tree>
    <div class="right_div" *ngIf="displayedColumns.length > 0 && data.length > 0">
        <mat-table mat-table [dataSource]="data" class="content-div" [ngStyle]="{ 'min-width.px': tableWidth }">
            <ng-container *ngFor="let col of displayedColumns; let i = index" matColumnDef="{{ col }}">
                <mat-header-cell *matHeaderCellDef> {{ col }} </mat-header-cell>
                <mat-cell *matCellDef="let e" [class.changed]="e[i]?.indexOf('->')>0 && displayedColumns[i].indexOf('Description') < 1 && displayedColumns[i].indexOf('Name') < 1">
                    {{e[i]}}
                </mat-cell>
            </ng-container>


            <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
            <mat-row class="selectable"
                     *matRowDef="let row; columns: displayedColumns;">
            </mat-row>
        </mat-table>
    </div>

    <mat-form-field appearance="fill">
        <mat-label><span translate>COMMON_SELECT_APP</span></mat-label>
        <mat-select (selectionChange)="setApp($event)">
            <mat-option *ngFor="let app of apps" [value]="app">
                {{ langSrv.translate('COMMON_' + app) }}
            </mat-option>
        </mat-select>
    </mat-form-field>

    <ss-pagination class="pager" [paginationModel]="pagination"></ss-pagination>
</div>
