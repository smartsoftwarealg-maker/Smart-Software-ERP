<h1>Eerror: errorSrv.message()</h1>
@if (errorSrv.errorSet()) {
  <div class="abs-error-container">
    <div class="err-msg b-b-background f-f-text">
      <div class="message-content">
          @for (msg of errorSrv.message(); track $index) {
               <h2>{{msg}}</h2>
          }
      </div>
      <h3 class="error-title mat-h1 f-warn">
        <i class="fas fa-exclamation-triangle mat-48 margin-end-16"></i>
        <span translate>{{errorSrv.statusText()}}</span>
      </h3>
      <div class="dialog-actions">
        <button autofocus class="float-end" mat-mini-fab color="warn" (click)="onCloseClick()">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>
  </div>
}
