@if (form && form.value['appId'] > 0) {
  <form novalidate [formGroup]="form">
    <div class="input__div">
      <mat-form-field class="default-50 sm-100">
        <mat-label translate>ADMINISTRATION_ARCHIVE_DOCUMENTS</mat-label>
        <ss-auto-complete matInput
          [required]="true"
          [model]="documentAutoCompleteModel"
          formControlName="documentId">
        </ss-auto-complete>
      </mat-form-field>
      <input type="file"
        #fileInput
        style="display: none"
        multiple
        (change)="uploadUtil.onFileSelected($event)">
      <input type="hidden" name="MAX_FILE_SIZE" value="104857600" />
      <div class="button__div">
        @if (uploadUtil.selectedFile && this.form.controls['documentId'].value > 0) {
          <button mat-mini-fab
            (click)="onSave()"
            color="primary"
            type="button">
            <i class="fas fa-save"></i>
          </button>
        }
        <button mat-mini-fab (click)="onCancel()" color="accent" type="button">
          <i class="fas fa-undo"></i>
        </button>
        <button mat-mini-fab (click)="fileInput.click()" color="warn" type="button">
          <i class="fas fa-upload"></i>
        </button>
      </div>
    </div>
    @if (form.value['appId']) {
      <div class="imj">
        <img [src]="uploadUtil.imgSrc" [alt]="'image'" />
      </div>
    }
    <!--    <pre>{{form?.getRawValue() | json }}</pre>-->
  </form>
}
