<div class="container">
  <div class="content_div">
    <div class="tool_bar ">
      <!--            <mat-label translate>COMMON_ARCHIVE</mat-label>-->
      @if (isEditable) {
        <div class="buttons">
          <button mat-mini-fab
            color="primary"
            (click)="showDetail('0')"
            type="button">
            <span class="fas fa-plus"></span>
          </button>
          <button mat-mini-fab (click)="edit()"
            [disabled]="!selectedId"
            [matTooltip]="'COMMON_EDIT' | translate"
            type="button"
            color="accent">
            <span class="fas fa-pen"></span>
          </button>
          <button mat-mini-fab (click)="deleteSelected()" [matTooltip]="'COMMON_DELETE' | translate"
            [disabled]="!selectedId"
            type="button"
            color="warn">
            <span class="fas fa-trash-alt"></span>
          </button>

          @if (showBackButton()) {
            <button mat-mini-fab (click)="goBack()" [matTooltip]="'COMMON_CANCEL' | translate"
              type="button">
              <span class="fas fa-redo"></span>
            </button>
          }
        </div>
      }
    </div>

    <div class="list_div">
      <mat-table mat-table [dataSource]="data" class="main-table">

        <ng-container matColumnDef="filename">
          <mat-header-cell *matHeaderCellDef translate>ADMINISTRATION_FILENAME</mat-header-cell>
          <mat-cell *matCellDef="let e">
            {{ e.filename }}
          </mat-cell>
        </ng-container>

        <ng-container matColumnDef="docDescription">
          <mat-header-cell *matHeaderCellDef translate>ADMINISTRATION_DESCRIPTION</mat-header-cell>
          <mat-cell *matCellDef="let e">
            {{ e.docDescription }}
          </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selectedId" (click)="select(row)"
        *matRowDef="let row; columns: displayedColumns;"></mat-row>
      </mat-table>

    </div>
  </div>

  @if (imgSrc?.length > 100 || filename) {
    <div class="imj">
      <img [src]="imgSrc"
        [alt]="'image'"
        class="clickable"
        (dblclick)="onClick($event)"
        [matTooltip]="'COMMON_DOUBLE_CLICK_OPEN' | translate" />
    </div>
  }
</div>
