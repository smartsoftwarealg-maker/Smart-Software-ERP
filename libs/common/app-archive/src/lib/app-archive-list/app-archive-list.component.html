<div class="container">
    <div class="content_div">
        <div class="tool_bar">
            <!--        <div mat-subheader class="b-primary title" translate> {{ 'ADMINISTRATION_ARCHIVE_DOCUMENTS' }}</div>-->

            <div class="buttons" *ngIf="editable">
                <button mat-mini-fab
                        color="primary"
                        (click)="showDetail('0')"
                        type="button">
                    <span class="fas fa-plus"></span>
                </button>
                <button mat-mini-fab (click)="edit()"
                        [disabled]="!selectedId"
                        type="button"
                        color="accent">
                    <span class="fas fa-pen"></span>
                </button>
                <button mat-mini-fab (click)="deleteSelected()"
                        [disabled]="!selectedId"
                        type="button"
                        color="warn">
                    <span class="fas fa-trash-alt"></span>
                </button>
            </div>
        </div>

        <div class="list_div">
            <mat-list role="list">
                <mat-list-item role="listitem"
                               *ngFor="let d of data"
                               class="selectable"
                               [class.selected]="d.id == selectedId"
                               (click)="select(d)">
                    {{ d.docDescription}}
                </mat-list-item>
            </mat-list>
        </div>
    </div>

    <div class="imj" *ngIf="imgSrc?.length > 100 || filename">
        <img [src]="imgSrc"
             [alt]="'image'"
             class="clickable"
             (dblclick)="onClick($event)"
             [matTooltip]="'COMMON_DOUBLE_CLICK_OPEN' | translate"/>
    </div>
</div>
