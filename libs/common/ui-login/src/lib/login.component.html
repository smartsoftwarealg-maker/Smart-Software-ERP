<div class="container" [ngStyle]="{ 'cursor': loading() ? 'wait': 'auto' }">
    <div class="screen">
        <div class="screen__content">
            <form class="login" novalidate [formGroup]="form">
                <div class="login__field">
                    <i class="login__icon fas fa-user"></i>
                    <input type="text" class="login__input" [placeholder]="'COMMON_USERNAME' | translate"
                           formControlName="user"
                           [ngStyle]="{ 'cursor': loading() ? 'wait': 'auto' }">
                </div>
                <div class="login__field">
                    <i class="login__icon fas fa-lock"></i>
                    <input type="password" autocomplete="off" class="login__input"
                           [placeholder]="'COMMON_PASSWORD'|translate" formControlName="pass"
                           [ngStyle]="{ 'cursor': loading() ? 'wait': 'auto' }">
                </div>

                <div class="login__field">
                    <input type="checkbox" id="checkbox1" formControlName="keep">
                    <label for="checkbox1" translate>COMMON_KEEP_ME_SIGNED</label>
                </div>
                @if (loginSrv.connectionError) {
                    <div class="connection__error">
                        <strong translate>COMMON_CONNECTION_ERROR</strong>
                    </div>
                }

                @if (loginSrv.wrongData) {
                    <div class="connection__error">
                        <strong translate>COMMON_LOGIN_WRONG_USERNAME_PASSWORD</strong>
                    </div>
                }
                <button class="button login__submit"
                        (click)="onSubmit()"
                        [disabled]="loading() == true"
                        [ngStyle]="{ 'cursor': loading() ? 'wait': 'auto' }">
                    <span class="button__text" translate>COMMON_LOGIN</span>
                    <i class="button__icon fas fa-chevron-right"></i>
                </button>
            </form>
            <div class="social-login">
                <div class="social-icons">
                    <ss-theme-select (onTheme)="onTheme($event)"></ss-theme-select>
                    <ss-language-select></ss-language-select>
                </div>
            </div>
        </div>
        <div class="screen__background">
            <span class="screen__background__shape screen__background__shape4"></span>
            <span class="screen__background__shape screen__background__shape3"></span>
            <span class="screen__background__shape screen__background__shape2"></span>
            <span class="screen__background__shape screen__background__shape1"></span>
        </div>
    </div>
</div>
