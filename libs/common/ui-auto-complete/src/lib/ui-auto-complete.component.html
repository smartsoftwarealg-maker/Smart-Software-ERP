<form class="input-container" [formGroup]="form" [attr.aria-labelledby]="_formField?.getLabelId()">


    <input type="text"
           name="search"
           autocomplete="off"
           formControlName="descriptionValue">

    <input type="text"
           class="hidden-input"
           name="autoCompleteValue"
           formControlName="value"
           [matAutocomplete]="auto">

    <mat-autocomplete #auto="matAutocomplete"
                      (optionSelected)="changeValue($event.option.value)">
        <mat-option *ngFor="let option of data" [value]="option[idOrFilterFieldName]">
            {{option[descriptionFieldName]}}
        </mat-option>
        <mat-option *ngIf="noMatchFound" disabled="disabled" value="null">
            <span translate>COMMON_NO_MATCH</span>
        </mat-option>
    </mat-autocomplete>

</form>
