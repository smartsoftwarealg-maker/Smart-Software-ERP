<ng-container *ngIf="model">
    <input type="text" class="warn-when-invalid auto-complete-input" matInput [formControl]="autoControl"
           [matAutocomplete]="auto" [required]="required">
    <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayFn" (optionSelected)="optionSelected($event)"
                      panelWidth="null">
        <mat-option *ngFor="let option of model.options" [value]="option">
            {{ model.toString(option) }}
        </mat-option>
        <mat-option *ngIf="hasNoMatch()" [disabled]="true">
            <span translate>COMMON_NO_MATCH</span>
        </mat-option>
    </mat-autocomplete>
    @if (addAction()) {
        <i (click)="addAction()" class="ss-suffix-button abs-end-0 fa-solid fa-plus" title="{{'COMMON_ADD' | translate}}"></i>
    }
    @if (loading()) {
        <i class="ss-suffix-button abs-end-0 fa-spin warn-when-invalid far fa-spinner"></i>
    }

    @if (isInputInvalid()) {
        <i (click)="clearInput()" class="ss-suffix-button abs-end-0 f-warn far fa-times-octagon"  title="{{'COMMON_CANCEL' | translate}}"></i>
    }
    @if (notFound() && allowAdd) {
        <i (click)="addCurrentText()"
       class="ss-suffix-button fa-solid fa-folder-plus margin-30" title="{{'COMMON_ADD' | translate}}"></i>
    }
</ng-container>
