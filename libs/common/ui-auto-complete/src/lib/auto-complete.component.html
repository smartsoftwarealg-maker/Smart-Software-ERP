@if (model) {
  <div class="auto__div">
    <input type="text" class="warn-when-invalid auto-complete-input"
      matInput
      [formControl]="autoControl"
      [matAutocomplete]="auto"
      [required]="required">
    <mat-autocomplete #auto="matAutocomplete"
      [displayWith]="displayFn"
      (optionSelected)="optionSelected($event)"
      panelWidth="null">
      @for (option of model.options; track option?.id|| option?.reference) {
        <mat-option [value]="option">
          {{ model.toString(option) }}
        </mat-option>
      }
      @if (hasNoMatch()) {
        <mat-option> <span translate>COMMON_NO_MATCH</span></mat-option>
      }
    </mat-autocomplete>
  </div>
  @if (loading()) {
    <i class="ss-suffix-button abs-end-0 fa-spin warn-when-invalid far fa-spinner"></i>
    } @if (isInputInvalid()) {
    <i (click)="clearInput()" class="ss-suffix-button abs-end-0 f-warn far fa-times-octagon"
    title="{{'COMMON_CANCEL' | translate}}"></i>
    } @if (notFound() && allowAdd()) {
    <i (click)="addCurrentText()"
    class="ss-suffix-button fa-solid fa-folder-plus margin-30" title="{{'COMMON_ADD' | translate}}"></i>
  }
}
