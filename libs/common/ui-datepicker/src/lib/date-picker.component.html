<input #textField class="warn-when-invalid" style="text-align: center;" #element [disabled]="isDisabled" matInput [matDatepicker]="datePicker" [value]="date" (dateChange)="onDateChanged($event.value)" [required]="isRequired">
<button class="toggleButton abs-end-0" type="button" [disabled]="isDisabled" mat-icon-button datepicker-toggle (click)="datePicker.open()">
    <i class="warn-when-invalid far fa-calendar-alt"></i>
 </button>
<mat-datepicker #datePicker></mat-datepicker>
