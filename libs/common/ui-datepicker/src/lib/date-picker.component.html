<input #textField class="warn-when-invalid" style="text-align: center;" #element [disabled]="isDisabled" matInput
       [matDatepicker]="datePicker"
       [value]="date"
       (keyup)="onKeyUp($event)"
       (dateChange)="onDateChanged($event.value)"
       [min]="minValue" [max]="maxValue"
       [required]="isRequired"
       [matDatepickerFilter]="matDatepickerFilter">
<button class="toggleButton abs-end-0" type="button" [disabled]="isDisabled" mat-icon-button datepicker-toggle
        (click)="datePicker.open()">
    <i class="warn-when-invalid far fa-calendar-alt"></i>
</button>
<mat-datepicker [twelveHour]="false" [type]="_type" #datePicker ></mat-datepicker>
