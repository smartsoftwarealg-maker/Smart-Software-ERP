    <input matInput class="warn-when-invalid"
           [matDatepicker]="picker"
           [disabled]="isDisabled"
           #textField
           [value]="date"
           (keyup)="onKeyUp($event)"
           (dateChange)="onDateChanged($event.value)"
           [min]="minValue" [max]="maxValue"
           [required]="isRequired"
           [matDatepickerFilter]="matDatepickerFilter">
    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-datepicker  [type]="_type" #picker></mat-datepicker>
