<div class="main-container">
    <div class="apps">
        <mat-form-field appearance="fill">
            <mat-label><span translate>ADMINISTRATION_SELECT_APP</span></mat-label>
            <mat-select (selectionChange)="setApp($event)">
                <mat-option *ngFor="let app of apps" [value]="app">
                    <span translate> {{ 'COMMON_' + app }}</span>
                </mat-option>
            </mat-select>
        </mat-form-field>
    </div>
    <div class="list-container" *ngIf="menuItems !== null">
        <mat-list>
            <mat-list-item
                *ngFor="let item of menuItems"
                [ngClass]="{'b-warn': selectedItem === item }"
                (click)="selectItem(item)"> <span [class.f-primary-contrast]="selectedItem === item"> {{ item | translate }} </span> </mat-list-item>
        </mat-list>
    </div>
    <div class="table-container">
        <form [formGroup]="form">
            <div class="editor-container">
                <mat-form-field>
                    <mat-label translate>ADMINISTRATION_ROLES</mat-label>
                    <ss-auto-complete matInput
                                      formControlName="roles"
                                      [value]="selectedRow?.roleId"
                                      [model]="agentAutoCompleteModel">
                    </ss-auto-complete>
                </mat-form-field>

                <mat-slide-toggle
                    color="warn"
                    formControlName="canRead"
                    [checked]="canRead()">
                    <span translate>COMMON_READ</span>
                </mat-slide-toggle>

                <mat-slide-toggle color="warn"
                                  formControlName="canWrite"
                                  [checked]="canWrite()">
                    <span translate>COMMON_WRITE</span>
                </mat-slide-toggle>

                <mat-slide-toggle color="warn"
                                  formControlName="canEdit"
                                  [checked]="canEdit()">
                    <span translate>COMMON_EDIT</span>
                </mat-slide-toggle>

                <mat-slide-toggle color="warn"
                                  formControlName="canDelete"
                                  [checked]="canDelete()">
                    <span translate>COMMON_DELETE</span>
                </mat-slide-toggle>
            </div>
        </form>
        <mat-table mat-table [dataSource]="data" class="main-table">

            <ng-container matColumnDef="roleId">
                <mat-header-cell *matHeaderCellDef translate>ADMINISTRATION_ROLE</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{e.roleName}}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="read">
                <mat-header-cell *matHeaderCellDef translate>COMMON_READ</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    <mat-checkbox [class.mat-checkbox-disabled]="false" disabled="true"
                                  [checked]="e.read"></mat-checkbox>
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="write">
                <mat-header-cell *matHeaderCellDef translate>COMMON_WRITE</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    <mat-checkbox [class.mat-checkbox-disabled]="false" disabled="true"
                                  [checked]="e.write"></mat-checkbox>
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="edit">
                <mat-header-cell *matHeaderCellDef translate>COMMON_EDIT</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    <mat-checkbox [class.mat-checkbox-disabled]="false" disabled="true"
                                  [checked]="e.edit"></mat-checkbox>
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="delete">
                <mat-header-cell *matHeaderCellDef translate>COMMON_DELETE</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    <mat-checkbox [class.mat-checkbox-disabled]="false" disabled="true"
                                  [checked]="e.delete"></mat-checkbox>
                </mat-cell>
            </ng-container>


            <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
            <mat-row class="selectable" [class.selected]="row.id === selected" (click)="selectRow(row)"
                     *matRowDef="let row; columns: displayedColumns;"></mat-row>
        </mat-table>
        <div class="pagination-container b-b-background">
            <ss-pagination [paginationModel]="pagination"></ss-pagination>
        </div>
    </div>
</div>
