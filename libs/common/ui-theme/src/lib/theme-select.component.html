<button class="theme-btn" type="button" mat-icon-button [matMenuTriggerFor]="menu" #trigger="matMenuTrigger">
    <i class=" fas fa-palette"></i>
</button>

<mat-menu [xPosition]="langSrv.rtl ? 'before' : 'after'" yPosition="below" overlapTrigger="false" #menu="matMenu">
    <div class="themes-menu">
        @for (t of themes; track t) {
            <div mat-menu-item class="theme-button" (click)="setTheme(t)">
                <div class="{{t}}-bg theme-bg"></div>
                <div class="{{t}}-bg-p theme-pri"></div>
                <div class="theme-clickable" (click)="setTheme(t)"></div>
            </div>
        }
    </div>
</mat-menu>
