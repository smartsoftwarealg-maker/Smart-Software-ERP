<div class="grid-color-select-container">

    <div *ngIf="!useIconOnly && selectedColor >= 0" #trigger="matMenuTrigger"
         class="grid-color-select-colored-button grid-color-select-btn"
         [style.background]="mColors[selectedColor][colorKey]"
         [matMenuTriggerFor]="colorsMenu">
    </div>

    <button mat-icon-button
            *ngIf="useIconOnly || selectedColor < 0"
            class="grid-color-select-btn"
            #trigger="matMenuTrigger"
            [matMenuTriggerFor]="colorsMenu">
        <i class="fas fa-paint-brush"></i>
    </button>

    <mat-menu [xPosition]="langSrv.rtl ? 'before' : 'after'" yPosition="below" overlapTrigger="false" #colorsMenu="matMenu">
        <div class="color-picker-menu" [style.width]="(mColumnsCount * 44) + 'px'" [style.height]="(mRowCount * 44) + 'px'">
            <div *ngFor="let clr of mColors, let i = index"
                 class="grid-color-picker-disk {{clr[classKey]}}"
                 [style.backgroundColor]="clr[colorKey]"
                 (click)="selectColor(i)">
                <span *ngIf="i === selectedColor">
                  <i class="fas fa-check-circle color-picker-chosen-icon"></i>
                </span>
            </div>
        </div>
    </mat-menu>
</div>
