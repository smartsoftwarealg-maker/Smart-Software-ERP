<div class="size">
    <mat-form-field class="default-50">
        <mat-label translate>PAYROLL_EMPLOYEE</mat-label>
        <ss-auto-complete matInput
                          [model]="employeeLookup"
                          [formControl]="employeeCtrl"
                          autofocus>
        </ss-auto-complete>
    </mat-form-field>
    <mat-form-field class="default-50">
        <mat-label translate>COMMON_SERVICE</mat-label>
        <ss-auto-complete matInput
                          [model]="serviceLookup"
                          [formControl]="serviceCtrl"
                          autofocus>
        </ss-auto-complete>
    </mat-form-field>
</div>

<div class="table_div size">
    <mat-table mat-table [dataSource]="data" class="main-table">

        <ng-container matColumnDef="shiftDescription">
            <mat-header-cell *matHeaderCellDef translate>ATT_SHIFT</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.shiftDescription}}
            </mat-cell>
        </ng-container>


        <ng-container matColumnDef="date">
            <mat-header-cell *matHeaderCellDef translate>COMMON_DATE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.date | date: 'dd/MM/yyyy' }}
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
</div>
<div class="size b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
