<mat-card>
    <mat-card-content>
        <form *ngIf="form !== null" novalidate [formGroup]="form">

            <mat-form-field class="default-50">
                <mat-label translate>ATT_IP_ADDRESS</mat-label>
                <input matInput formControlName="ipAddress" type="text" autofocus required>
                <mat-error *ngIf="form.controls['ipAddress'].invalid" translate>COMMON_FIELD_REQUIRED</mat-error>
            </mat-form-field>

            <mat-form-field id="port" class="default-50">
                <mat-label translate>ATT_PORT</mat-label>
                <input matInput formControlName="port" type="text"  required>
                <mat-error *ngIf="form.controls['port'].invalid" translate>COMMON_FIELD_REQUIRED</mat-error>
            </mat-form-field>

            <mat-form-field id="description" class="default-100">
                <mat-label translate>ADMINISTRATION_DESCRIPTION</mat-label>
                <input matInput formControlName="description" type="text" required>
                <mat-error *ngIf="form.controls['description'].invalid" translate>COMMON_FIELD_REQUIRED</mat-error>
            </mat-form-field>
        </form>

    </mat-card-content>
</mat-card>
