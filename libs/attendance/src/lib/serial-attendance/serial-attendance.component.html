<mat-card>
    <mat-card-content>
        @if (form !== null) {
            <form [formGroup]="form">

                <mat-form-field class="default-100">
                    <mat-label translate>PAYROLL_EMPLOYEE</mat-label>
                    <ss-auto-complete matInput
                                      [model]="employeeLookup"
                                      formControlName="id">
                    </ss-auto-complete>
                </mat-form-field>

                <mat-form-field class="default-100">
                    <mat-label translate>COMMON_MOTIVE</mat-label>
                    <ss-auto-complete matInput
                                      [model]="absenceTypeLookup"
                                      formControlName="attendanceType">
                    </ss-auto-complete>
                </mat-form-field>

                <mat-form-field class="default-50">
                    <mat-label translate>ATT_DAY_COUNT</mat-label>
                    <input matInput formControlName="dayCount" type="number" />
                    @if (form.controls['dayCount'].invalid) {
                        <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
                    }
                </mat-form-field>

                <mat-form-field class="default-50">
                    <mat-label translate>COMMON_FROM</mat-label>
                    <ss-date-picker formControlName="from" required="true" [type]="'date'"></ss-date-picker>
                    @if (form.controls['from'].invalid) {
                        <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
                    }
                </mat-form-field>

            </form>
        }
    </mat-card-content>
</mat-card>
