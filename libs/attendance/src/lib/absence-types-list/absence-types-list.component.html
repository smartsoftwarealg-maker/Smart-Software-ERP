<div class="table_div size">
    <mat-table mat-table [dataSource]="data" class="main-table" matSort (matSortChange)="sort($event)">

        <ng-container matColumnDef="description">
            <mat-header-cell *matHeaderCellDef translate>ADMINISTRATION_DESCRIPTION</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.description}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="descriptionAr">
            <mat-header-cell *matHeaderCellDef translate>ATT_DESCRIPTION</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.descriptionAr}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="letter">
            <mat-header-cell *matHeaderCellDef translate>ATT_LETTER</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.letter}}
            </mat-cell>
        </ng-container>

      <ng-container matColumnDef="color">
        <mat-header-cell *matHeaderCellDef translate>ATT_COLOR</mat-header-cell>
        <mat-cell *matCellDef="let e">
          <div class="color-circle"  [style.background-color]="toHex(e.color)"></div>
        </mat-cell>
      </ng-container>

      <ng-container matColumnDef="field">
            <mat-header-cell *matHeaderCellDef translate>ATT_FIELD</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.field}}
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
</div>
<div class="size b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
