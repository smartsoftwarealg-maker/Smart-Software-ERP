<div class="ctrl_div content_div" >
    <button mat-mini-fab
            type="button"
            [disabled]="entitySrv.periodExhausted()"
            color="primary" (click)="showDetail(0)">
        <span class="fas fa-plus"></span>
    </button>
    <button mat-mini-fab
            type="button"
            (click)="edit()"
            [disabled]="!selectedId"
            color="accent">
        <span class="fas fa-pen"></span>
    </button>
    <button mat-mini-fab
            type="button"
            (click)="deleteSelected()"
            [disabled]="!selectedId"
            color="warn">
        <span class="fas fa-trash-alt"></span>
    </button>
</div>

<div class="table_div size">
    <mat-table mat-table [dataSource]="data$|async" class="main-table">

        <ng-container matColumnDef="date">
            <mat-header-cell *matHeaderCellDef translate>ATT_DAY</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.from | date: "EEEE" }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="from">
            <mat-header-cell *matHeaderCellDef translate>COMMON_FROM</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.from  | date: "HH:mm"  }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="to">
            <mat-header-cell *matHeaderCellDef translate>COMMON_TO</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.to  | date: "HH:mm" }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="breakFrom">
            <mat-header-cell *matHeaderCellDef translate>ATT_BREAK_FROM</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.breakFrom  | date: "HH:mm"  }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="breakTo">
            <mat-header-cell *matHeaderCellDef translate>ATT_BREAK_TO</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.breakTo  | date: "HH:mm" }}
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selectedId" (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
</div>
