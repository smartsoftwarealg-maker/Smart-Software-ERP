<mat-card>
  <mat-card-content>
    @if (form !== null) {
      <form novalidate [formGroup]="form">
        <mat-form-field class="default-100">
          <mat-label translate>COMMON_FIRST_NAME</mat-label>
          <input matInput formControlName="firstName" type="text">
        </mat-form-field>
        <mat-form-field class="default-100">
          <mat-label translate>COMMON_LAST_NAME</mat-label>
          <input matInput formControlName="lastName" type="text">
        </mat-form-field>
        <mat-form-field class="default-100">
          <mat-label translate>COMMON_TYPE</mat-label>
          <ss-auto-complete matInput
            [model]="holidayLookup"
            formControlName="hType">
          </ss-auto-complete>
          @if (form.controls['hType'].invalid) {
            <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
          }
        </mat-form-field>
        <mat-form-field class="default-100">
          <mat-label translate>COMMON_FROM</mat-label>
          <ss-date-picker formControlName="from"></ss-date-picker>
        </mat-form-field>
        <mat-form-field class="default-100">
          <mat-label translate>COMMON_TO</mat-label>
          <ss-date-picker formControlName="to"></ss-date-picker>
        </mat-form-field>
        <!--            <pre> {{ form.value | json }}</pre>-->
      </form>
    }

  </mat-card-content>
</mat-card>
