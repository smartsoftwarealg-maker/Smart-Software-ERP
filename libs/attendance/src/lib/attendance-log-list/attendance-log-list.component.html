<mat-card class="size">
    <mat-card-content>
        <mat-form-field class="default-100">
            <mat-label translate>COMMON_DATE</mat-label>
            <ss-date-picker [required]=true
                            [formControl]="dateCtrl"
                            [type]="'date'">
            </ss-date-picker>
        </mat-form-field>
    </mat-card-content>
</mat-card>

<div class="table_div size">
    <mat-table mat-table [dataSource]="data" class="main-table" matSort (matSortChange)="sort($event)">

        <ng-container matColumnDef="personId">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_ID</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.personId}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="firstName">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_FIRST_NAME</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.firstName}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="lastName">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_LAST_NAME</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.lastName}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="dateTime">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_DATE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.dateTime | date: 'dd/MM/yyyy HH:mm' }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="typeDescription">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_TYPE</mat-header-cell>
            <mat-cell *matCellDef="let e" >
                {{e.typeDescription}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="updaterName">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_USER</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.updaterName}}
            </mat-cell>
        </ng-container>


        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
</div>
<div class="size b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
