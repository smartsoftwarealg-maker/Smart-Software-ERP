<div class="table__container">
    <mat-table mat-table [dataSource]="data$|async" class="main-table" matSort (matSortChange)="sort($event)">

        <ng-container matColumnDef="ccDescription">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_COST_CENTER</mat-header-cell>
            <mat-cell *matCellDef="let p">{{ p.ccDescription }}</mat-cell>
        </ng-container>

        <ng-container matColumnDef="keyDescription">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COST_KEY</mat-header-cell>
            <mat-cell *matCellDef="let p">{{ p.keyDescription }}</mat-cell>
        </ng-container>

        <ng-container matColumnDef="isSupport">
            <mat-header-cell *matHeaderCellDef translate>ADMINISTRATION_MANAGER</mat-header-cell>
            <mat-cell *matCellDef="let e">
                <mat-checkbox [class.mat-checkbox-disabled]="false" disabled="true"
                              [checked]="e.isSupport">
                </mat-checkbox>
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>

        <mat-row class="selectable" [class.selected]="row.id == selectedId" (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns;">
        </mat-row>
    </mat-table>
</div>

<div class="size b-b-background">
    <ss-pagination [paginationModel]="paginator"></ss-pagination>
</div>
