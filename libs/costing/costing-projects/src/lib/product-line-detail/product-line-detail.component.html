<div class="size button__div" *ngIf="form">
    <button mat-mini-fab (click)="save()"
            color="primary" *ngIf="isEditable">
        <i class="fas fa-save"></i>
    </button>
    <button mat-mini-fab (click)="cancel()"
            color="warn">
        <i class="fas fa-redo"></i>
    </button>
</div>

<mat-card>
    <mat-card-content>
        <form *ngIf="form" novalidate [formGroup]="form">

            <mat-form-field class="default-100">
                <mat-label translate>COST_PRODUCT</mat-label>
                <ss-auto-complete matInput
                                  [model]="articleLookup"
                                  formControlName="productId">
                </ss-auto-complete>
                <mat-error *ngIf="form.controls['productId'].invalid" translate>COMMON_FIELD_REQUIRED</mat-error>
            </mat-form-field>


            <mat-form-field class="default-50">
                <mat-label translate>COST_UNITS</mat-label>
                <input matInput formControlName="units" type="number">
            </mat-form-field>

        </form>
    </mat-card-content>
</mat-card>
