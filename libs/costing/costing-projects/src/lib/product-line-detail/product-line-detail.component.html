
<div class="size button__div">
  <button mat-mini-fab (click)="save()"
    color="primary" [disabled]="childEditMode || !isEditable">
    <i class="fas fa-save"></i>
  </button>
  <button mat-mini-fab (click)="cancel()" color="warn"  [disabled]="childEditMode">
    <i class="fas fa-redo"></i>
  </button>
</div>

<mat-card>
  <mat-card-content>
    @if (form) {
      <form novalidate [formGroup]="form">
        <mat-form-field class="default-100">
          <mat-label translate>COST_PRODUCT</mat-label>
          <ss-auto-complete matInput
            [model]="articleLookup"
            formControlName="productId">
          </ss-auto-complete>
          @if (form.controls['productId'].invalid) {
            <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
          }
        </mat-form-field>
        <!--            <mat-form-field class="default-50">-->
        <!--                <mat-label translate>COST_DIRECT_MATERIAL</mat-label>-->
        <!--                <input matInput formControlName="directMaterial" type="number">-->
      <!--            </mat-form-field>-->
      <!--            <mat-form-field class="default-50">-->
      <!--                <mat-label translate>COST_DIRECT_LABOR</mat-label>-->
      <!--                <input matInput formControlName="directLabor" type="number">-->
    <!--            </mat-form-field>-->
    <mat-form-field class="default-50">
      <mat-label translate>COST_UNITS</mat-label>
      <input matInput formControlName="units" type="number">
    </mat-form-field>
  </form>
}
</mat-card-content>
</mat-card>

@if (loaded()) {
  <mat-accordion class="size">
    <mat-expansion-panel
      #costPanel
      [class.b-primary-expansion-panel]="costPanel.expanded">
      <div class="default-100"></div>
      <mat-expansion-panel-header>
        <mat-panel-title translate>
          COST_OH
        </mat-panel-title>
      </mat-expansion-panel-header>
      <ss-product-line-items (startedEdit)="onChildEdit($event)"></ss-product-line-items>
    </mat-expansion-panel>

    <mat-expansion-panel
      #keyPanel
      [class.b-primary-expansion-panel]="keyPanel.expanded">
      <div class="default-100"></div>
      <mat-expansion-panel-header>
        <mat-panel-title translate>
          COST_PARTITION_KEYS
        </mat-panel-title>
      </mat-expansion-panel-header>
      <ss-product-line-keys (startedEdit)="onChildEdit($event)"></ss-product-line-keys>
    </mat-expansion-panel>
  </mat-accordion>
}
