@if (form) {
    <div class="size button__div">
        @if (isEditable) {
            <button mat-mini-fab (click)="save()" color="primary" [disabled]="childEditMode">
                <i class="fas fa-save"></i>
            </button>
        }
        <button mat-mini-fab (click)="cancel()"  color="warn"  [disabled]="childEditMode">
            <i class="fas fa-redo"></i>
        </button>
    </div>

    <mat-card>
        <mat-card-content>
            <form [formGroup]="form" novalidate>

                <mat-form-field class="default-100">
                    <mat-label translate>COMMON_COST_CENTER</mat-label>
                    <ss-auto-complete matInput
                                      [model]="costServiceLookup"
                                      formControlName="costCenterId">
                    </ss-auto-complete>
                    <mat-error *ngIf="form.controls['costCenterId'].invalid" translate>COMMON_FIELD_REQUIRED</mat-error>
                </mat-form-field>

                <mat-form-field class="default-100">
                    <mat-label translate>COST_ALLOCATION_KEY</mat-label>
                    <ss-auto-complete matInput
                                      [model]="keyLookup"
                                      formControlName="keyId">
                    </ss-auto-complete>
                    <mat-error *ngIf="form.controls['keyId'].invalid" translate>COMMON_FIELD_REQUIRED</mat-error>
                </mat-form-field>

                <div id="manager" class="default-100">
                    <mat-checkbox formControlName="isSupport" translate>COST_IS_SUPPORT</mat-checkbox>
                </div>

            </form>
        </mat-card-content>
    </mat-card>

    @if (loaded()) {
        <mat-accordion class="size">
            <mat-expansion-panel
                #costPanel
                [class.b-primary-expansion-panel]="costPanel.expanded">
                <div class="default-100"></div>
                <mat-expansion-panel-header>
                    <mat-panel-title translate>
                        COST_OH
                    </mat-panel-title>
                </mat-expansion-panel-header>
                <ss-costing-pools-costs (startedEdit)="onChildEdit($event)"></ss-costing-pools-costs>
            </mat-expansion-panel>
            <mat-expansion-panel
                #keyPanel
                [class.b-primary-expansion-panel]="keyPanel.expanded">
                <div class="default-100"></div>
                <mat-expansion-panel-header>
                    <mat-panel-title translate>
                        COST_PARTITION_KEYS
                    </mat-panel-title>
                </mat-expansion-panel-header>
                <ss-costing-pool-keys (startedEdit)="onChildEdit($event)"></ss-costing-pool-keys>
            </mat-expansion-panel>
        </mat-accordion>
    }
}
