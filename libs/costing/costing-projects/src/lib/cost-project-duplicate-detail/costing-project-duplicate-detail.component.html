<mat-card>
  <mat-card-content>
    @defer (when form) {
    <form novalidate [formGroup]="form">
      <mat-form-field id="code" class="default-50">
        <mat-label translate>ADMINISTRATION_CODE</mat-label>
        <input matInput formControlName="code" type="text" required>
        @if (form.controls['code'].invalid) {
          <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
        }
      </mat-form-field>

      <mat-form-field id="description" class="default-100">
        <mat-label translate>ADMINISTRATION_DESCRIPTION</mat-label>
        <input matInput formControlName="description" type="text" required>
        @if (form.controls['description'].invalid) {
          <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
        }
      </mat-form-field>
    </form>
  }
</mat-card-content>
</mat-card>
