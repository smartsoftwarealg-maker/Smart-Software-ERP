<div class="size button__div" *ngIf="form">
    <button mat-mini-fab (click)="save()"
            color="primary" *ngIf="isEditable">
        <i class="fas fa-save"></i>
    </button>
    <button mat-mini-fab (click)="cancel()"
            color="warn">
        <i class="fas fa-redo"></i>
    </button>
</div>

<mat-card>
    <mat-card-content>
        <form *ngIf="form" novalidate [formGroup]="form">

            <mat-form-field class="default-100">
                <mat-label translate>COMMON_DESCRIPTION</mat-label>
                <input matInput formControlName="description" type="text" required>
                <mat-error *ngIf="form.controls['description'].invalid" translate>COMMON_FIELD_REQUIRED</mat-error>
            </mat-form-field>

<!--            <mat-form-field class="default-50">-->
<!--                <mat-label translate>COMMON_AMOUNT</mat-label>-->
<!--                <input matInput formControlName="amount" type="number" required>-->
<!--                <mat-error *ngIf="form.controls['description'].invalid" translate>COMMON_FIELD_REQUIRED</mat-error>-->
<!--            </mat-form-field>-->

            <mat-form-field class="default-100">
                <mat-label translate>COST_ALLOCATION_KEY</mat-label>
                <ss-auto-complete matInput
                                  [model]="keyLookup"
                                  formControlName="keyId">
                </ss-auto-complete>
                <mat-error *ngIf="form.controls['keyId'].invalid" translate>COMMON_FIELD_REQUIRED</mat-error>
            </mat-form-field>

            <mat-form-field floatLabel="always" class="default-100">
                <mat-label translate>LOGISTICS_AMOUNT</mat-label>
                <input matInput formControlName="amount" type="number" required>
                <mat-error *ngIf="form.controls['amount'].hasError('validOption')" translate>COMMON_NO_MATCH</mat-error>
                <mat-error *ngIf="form.controls['amount'].hasError('required')" translate>COMMON_FIELD_REQUIRED</mat-error>
            </mat-form-field>
        </form>
    </mat-card-content>
</mat-card>
