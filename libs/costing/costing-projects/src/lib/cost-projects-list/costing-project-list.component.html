    <div class="tbl-container">
        <mat-table mat-table [dataSource]="data" class="main-table" matSort (matSortChange)="sort($event)">

            <ng-container matColumnDef="code">
                <mat-header-cell *matHeaderCellDef mat-sort-header translate>ADMINISTRATION_CODE</mat-header-cell>
                <mat-cell *matCellDef="let p">{{ p.code }}</mat-cell>
            </ng-container>

            <ng-container matColumnDef="description">
                <mat-header-cell *matHeaderCellDef mat-sort-header translate>ADMINISTRATION_DESCRIPTION</mat-header-cell>
                <mat-cell *matCellDef="let p">{{ p.description }}</mat-cell>
            </ng-container>

            <ng-container matColumnDef="from">
                <mat-header-cell *matHeaderCellDef mat-sort-header translate>{{ 'FROM' }}</mat-header-cell>
                <mat-cell *matCellDef="let p">{{ projectFromStr(p) }}</mat-cell>
            </ng-container>

            <ng-container matColumnDef="to">
                <mat-header-cell *matHeaderCellDef mat-sort-header translate>{{ 'TO' }}</mat-header-cell>
                <mat-cell *matCellDef="let p">{{ projectToStr(p) }}</mat-cell>
            </ng-container>

            <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>

            <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
                     *matRowDef="let row; columns: displayedColumns;">
            </mat-row>
        </mat-table>
    </div>


</div>
