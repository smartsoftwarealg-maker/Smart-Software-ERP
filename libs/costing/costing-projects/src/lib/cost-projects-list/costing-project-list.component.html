<div class="table__container">
    <mat-table mat-table [dataSource]="data" class="main-table" matSort (matSortChange)="sort($event)">

        <ng-container matColumnDef="code">
            <mat-header-cell *matHeaderCellDef mat-sort-header >{{ 'ADMINISTRATION_CODE' | translate }}</mat-header-cell>
            <mat-cell *matCellDef="let p">{{ p.code }}</mat-cell>
        </ng-container>

        <ng-container matColumnDef="description">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_DESCRIPTION</mat-header-cell>
            <mat-cell *matCellDef="let p">{{ p.description }}</mat-cell>
        </ng-container>

        <ng-container matColumnDef="from">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_FROM</mat-header-cell>
            <mat-cell *matCellDef="let p">{{ projectFromStr(p) }}</mat-cell>
        </ng-container>

        <ng-container matColumnDef="to">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_TO</mat-header-cell>
            <mat-cell *matCellDef="let p">{{ projectToStr(p) }}</mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>

        <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns;">
        </mat-row>
    </mat-table>
</div>

<div class="size b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>

@if (selected) {
    <div class="size chart_div">
        <ss-costing-reports></ss-costing-reports>
    </div>
}
