@if (editMode()) {
    <div class="size button__div">
        <button mat-mini-fab (click)="save()"
                color="primary">
            <i class="fas fa-save"></i>
        </button>

        <button mat-mini-fab (click)="cancel()"
                color="warn">
            <i class="fas fa-redo"></i>
        </button>
    </div>
    <mat-card>
        <mat-card-content>
            <form [formGroup]="form">
                <mat-form-field class="default-100">
                    <mat-label translate>COST_ITEM</mat-label>
                    <ss-auto-complete matInput
                                      [model]="itemLookup"
                                      formControlName="itemId">
                    </ss-auto-complete>
                </mat-form-field>

                <mat-form-field class="number">
                    <mat-label translate>COMMON_VALUE</mat-label>
                    <input matInput formControlName="value" type="number">
                </mat-form-field>
            </form>
        </mat-card-content>
    </mat-card>

} @else {
    <div class="size button__div">
        <button mat-mini-fab color="primary" (click)="showDetail(0)" [matTooltip]="'COMMON_ADD' | translate">
            <span class="fas fa-plus"></span>
        </button>
        <button mat-mini-fab (click)="edit()"
                [disabled]="!selectedId"
                [matTooltip]="'COMMON_EDIT' | translate"
                color="accent">
            <span class="fas fa-pen"></span>
        </button>
        <button mat-mini-fab (click)="deleteSelected()" [matTooltip]="'COMMON_DELETE' | translate"
                [disabled]="!selectedId"
                color="warn">
            <span class="fas fa-trash-alt"></span>
        </button>
    </div>

    <div class="table__container">
        <mat-table mat-table [dataSource]="data$|async" class="main-table" matSort (matSortChange)="sort($event)">
            <ng-container matColumnDef="keyDescription">
                <mat-header-cell *matHeaderCellDef mat-sort-header translate>COST_KEY</mat-header-cell>
                <mat-cell *matCellDef="let p">{{ p.keyDescription }}</mat-cell>
            </ng-container>

            <ng-container matColumnDef="value">
                <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_VALUE</mat-header-cell>
                <mat-cell *matCellDef="let p">{{ p.value | number: '1.2-2' }}</mat-cell>
            </ng-container>


            <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>

            <mat-row class="selectable" [class.selected]="row.id == selectedId" (click)="select(row.id)"
                     *matRowDef="let row; columns: displayedColumns;">
            </mat-row>
        </mat-table>
    </div>

    <div class="size b-b-background">
        <ss-pagination [paginationModel]="paginator"></ss-pagination>
    </div>
}
