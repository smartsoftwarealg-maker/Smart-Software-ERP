<mat-card>
    @if (form) {
        <form [formGroup]="form">
            <mat-form-field class="default-50 sm-100">
                <mat-label translate>COMMON_DESCRIPTION</mat-label>
                <input matInput formControlName="description" type="text" required autofocus>
            </mat-form-field>

            <mat-form-field class="default-50 sm-100">
                <mat-label translate>ADMINISTRATION_DESCRIPTION_AR</mat-label>
                <input matInput formControlName="descriptionAr" type="text">
            </mat-form-field>

            <mat-form-field class="default-50 sm-100">
                <mat-label translate>ACC_CASH_ACCOUNT</mat-label>
                <ss-auto-complete matInput
                                  [model]="accountLookup1"
                                  formControlName="cashAccount">
                </ss-auto-complete>
            </mat-form-field>

            <mat-form-field class="default-50 sm-100">
                <mat-label translate>ACC_DEFERRED_ACCOUNT</mat-label>
                <ss-auto-complete matInput
                                  [model]="accountLookup2"
                                  formControlName="deferredAccount">
                </ss-auto-complete>
            </mat-form-field>
        </form>
    }
</mat-card>
