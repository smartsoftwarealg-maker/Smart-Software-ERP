<div class="div_table size">
    <mat-table mat-table [dataSource]="data" class="main-table" matSort (matSortChange)="sort($event)">

        <ng-container matColumnDef="debtor">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>{{ 'ACC_SUBSIDIARY' }}</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.debtor}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="value1">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>{{ 'ACC_INITIAL_VALUE' }}</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.value1 | number: '1.2-2' }}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="value2">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>ACC_LOSS</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{ e.value2 | number: '1.2-2' }}
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns;">
        </mat-row>
    </mat-table>
</div>
<div class="size b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
