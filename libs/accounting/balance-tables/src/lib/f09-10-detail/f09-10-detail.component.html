@if (form !== null) {
    <mat-card>
        <mat-card-content>
            <form [formGroup]="form" class="elements">
                @for (l of labels; track l; let i = $index) {
                    <mat-form-field>
                        <mat-label> {{ l }}</mat-label>
                        <input matInput [formControlName]="'p' + (i + 1)" type="number">
                    </mat-form-field>
                }
            </form>
        </mat-card-content>
    </mat-card>
}
