@if (form !== null) {
    <mat-card>
        <mat-card-content>
            <form [formGroup]="form">

                <mat-form-field class="default-100">
                    <mat-label translate>ACC_DENOMINATION</mat-label>
                    <input matInput formControlName="debtor" type="text" autofocus>
                    @if (form.controls['debtor'].invalid) {
                        <mat-error translate>COMMON_FIELD_MAX_LENGTH</mat-error>
                    }
                </mat-form-field>

                <mat-form-field class="default-50 sm-100">
                    <mat-label translate>ACC_DEBT</mat-label>
                    <input matInput formControlName="value1" type="number" required>
                    @if (form.controls['value1'].invalid) {
                        <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
                    }
                </mat-form-field>

                <mat-form-field class="default-50 sm-100">
                    <mat-label translate>ACC_LOSS</mat-label>
                    <input matInput formControlName="value2" type="number" required>
                    @if (form.controls['value2'].invalid) {
                        <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
                    }
                </mat-form-field>
            </form>

        </mat-card-content>
    </mat-card>
}
