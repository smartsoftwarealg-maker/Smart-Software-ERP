    <div translate class="f-warn">ACC_SELECT_ACC_FOLDER</div>

    <mat-radio-group [formControl]="accPeriod" required
                     (click)="selectFolder()"
                     class="two-row-radio-group">
        @for (p of periods; track p; let i = $index) {
            <mat-radio-button [value]="i + 1">
                {{ p | translate }}
            </mat-radio-button>
        }
    </mat-radio-group>

  <div class="container_div">
    <mat-table mat-table [dataSource]="data" class="main-table">

      <ng-container matColumnDef="fileYear">
        <mat-header-cell *matHeaderCellDef translate>COMMON_YEAR</mat-header-cell>
        <mat-cell *matCellDef="let e">
          {{e.fileYear}}
        </mat-cell>
      </ng-container>

      <ng-container matColumnDef="description">
        <mat-header-cell *matHeaderCellDef translate>ADMINISTRATION_DESCRIPTION</mat-header-cell>
        <mat-cell *matCellDef="let e">
          {{e.description}}
        </mat-cell>
      </ng-container>

      <ng-container matColumnDef="closed">
        <mat-header-cell *matHeaderCellDef translate>COMMON_CLOSED</mat-header-cell>
        <mat-cell *matCellDef="let e">
          <mat-checkbox [class.mat-checkbox-disabled]="false" disabled="true"
          [checked]="e.closed"></mat-checkbox>
        </mat-cell>
      </ng-container>

      <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
      <mat-row class="selectable" [class.selected]="row.id == selected" (click)="selectRow(row)"
      *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
  </div>
  <div class="pagination-container b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
  </div>
</div>
