<div class="container">
    <div class="journals">
        <div mat-subheader class="b-primary" translate> {{ 'ACC_JOURNALS' }}</div>
        <div class="list-div">
            <mat-selection-list [multiple]="false" (selectionChange)="journalSelected($event)">
                <mat-list-option *ngFor="let j of journalList" value="{{ j.id }}">
                    {{ j.description }}
                </mat-list-option>
            </mat-selection-list>
        </div>
    </div>
    <div class="transactions">
        <div class="table-div">
            <mat-table mat-table [dataSource]="data" class="main-table">

                <ng-container matColumnDef="pieceno">
                    <mat-header-cell *matHeaderCellDef translate>COMMON_NUMBER</mat-header-cell>
                    <mat-cell *matCellDef="let e">
                        {{e.pieceno}}
                    </mat-cell>
                </ng-container>

                <ng-container matColumnDef="projectName">
                    <mat-header-cell *matHeaderCellDef translate>ACC_PROJECT</mat-header-cell>
                    <mat-cell *matCellDef="let e">
                        {{e.projectName}}
                    </mat-cell>
                </ng-container>

                <ng-container matColumnDef="piecedate">
                    <mat-header-cell *matHeaderCellDef translate>COMMON_DATE</mat-header-cell>
                    <mat-cell *matCellDef="let e">
                        {{e.piecedate | date: 'dd/MM/yyyy' }}
                    </mat-cell>
                </ng-container>

                <ng-container matColumnDef="debit">
                    <mat-header-cell *matHeaderCellDef translate>ACC_DEBIT</mat-header-cell>
                    <mat-cell *matCellDef="let e">
                        {{e.debit | number: '1.2-2' }}
                    </mat-cell>
                </ng-container>

                <ng-container matColumnDef="credit">
                    <mat-header-cell *matHeaderCellDef translate>ACC_DEBIT</mat-header-cell>
                    <mat-cell *matCellDef="let e">
                        {{e.credit | number: '1.2-2' }}
                    </mat-cell>
                </ng-container>

                <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
                <mat-row class="selectable" [class.selected]="row?.oid === selectedRow?.oid" (click)="selectRow(row)"
                         *matRowDef="let row; columns: displayedColumns;"></mat-row>
            </mat-table>
        </div>
    </div>
    <div class="detail">
        <router-outlet></router-outlet>
    </div>
</div>
