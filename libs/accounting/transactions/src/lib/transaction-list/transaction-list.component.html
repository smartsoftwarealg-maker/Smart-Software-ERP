<div class="container">
    <div class="journals">
        <div mat-subheader class="b-primary" translate> {{ 'ACC_JOURNALS' }}</div>
        <mat-selection-list [multiple]="false" (selectionChange)="journalSelected($event)">
            <mat-list-option *ngFor="let j of journalList" value="{{ j.id }}">
                {{ j.description }}
            </mat-list-option>
        </mat-selection-list>
    </div>
    <div class="transactions">
        <mat-table mat-table [dataSource]="data" class="main-table">

            <ng-container matColumnDef="pieceno">
                <mat-header-cell *matHeaderCellDef translate>COMMON_NUMBER</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{e.pieceno}}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="piecedate">
                <mat-header-cell *matHeaderCellDef translate>COMMON_DATE</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{e.piecedate}}
                </mat-cell>
            </ng-container>

            <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
            <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
                     *matRowDef="let row; columns: displayedColumns;"></mat-row>
        </mat-table>

    </div>
    <div class="detail">
        <router-outlet></router-outlet>
    </div>
</div>
