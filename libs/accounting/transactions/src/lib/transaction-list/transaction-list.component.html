<div class="container">
    <div class="left_div">
        <mat-card class="journals">
            <div mat-subheader class="b-primary" class="header">
                <mat-form-field class="default-100">
                    <mat-label translate>COMMON_JOURNALS</mat-label>
                    <input matInput [formControl]="journalFilter" type="text">
                </mat-form-field>
            </div>
            <div class="list_div" >
                <mat-selection-list [multiple]="false" (selectionChange)="journalSelected($event)" [disabled]="!isRoot">
                    <mat-list-option *ngFor="let j of journalList" value="{{ j.id }}">
                        {{ j.description }}
                    </mat-list-option>
                </mat-selection-list>
            </div>
            <mat-radio-group (change)="onMode($event)" [disabled]="!isRoot">
                <mat-radio-button value="1"  translate [checked]="true">ACC_TRANSAC_DETAIL</mat-radio-button>
                <mat-radio-button value="2" translate>COMMON_ARCHIVE</mat-radio-button>
            </mat-radio-group>


        </mat-card>
        <div class="transactions">
            <div class="container_div">
                <mat-table mat-table [dataSource]="data" class="main-table" matSort (matSortChange)="sort($event)" >

                    <ng-container matColumnDef="pieceNo">
                        <mat-header-cell *matHeaderCellDef translate>COMMON_NO_</mat-header-cell>
                        <mat-cell *matCellDef="let e" [class.f-warn]="math.abs(e.debit - e.credit) > 0.01">
                            {{e.pieceNo}}
                        </mat-cell>
                    </ng-container>

                    <ng-container matColumnDef="projectName">
                        <mat-header-cell *matHeaderCellDef translate>COMMON_PROJECT</mat-header-cell>
                        <mat-cell *matCellDef="let e" [class.f-warn]="math.abs(e.debit - e.credit) > 0.01">
                            {{e.projectName}}
                        </mat-cell>
                    </ng-container>

                    <ng-container matColumnDef="pieceDate">
                        <mat-header-cell *matHeaderCellDef translate>COMMON_DATE</mat-header-cell>
                        <mat-cell *matCellDef="let e" [class.f-warn]="math.abs(e.debit - e.credit) > 0.01">
                            {{e.pieceDate | date: 'dd/MM/yyyy' }}
                        </mat-cell>
                    </ng-container>

                    <ng-container matColumnDef="debit">
                        <mat-header-cell *matHeaderCellDef translate>ACC_DEBIT</mat-header-cell>
                        <mat-cell *matCellDef="let e" [class.f-warn]="math.abs(e.debit - e.credit) > 0.01">
                            {{e.debit | number: '1.2-2' }}
                        </mat-cell>
                    </ng-container>

                    <ng-container matColumnDef="credit">
                        <mat-header-cell *matHeaderCellDef translate>ACC_CREDIT</mat-header-cell>
                        <mat-cell *matCellDef="let e" [class.f-warn]="math.abs(e.debit - e.credit) > 0.01">
                            {{e.credit | number: '1.2-2' }}
                        </mat-cell>
                    </ng-container>

                    <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>

                    <ng-container matColumnDef="isBudget">
                        <mat-header-cell *matHeaderCellDef translate>ACC_BUDGETABLE</mat-header-cell>
                        <mat-cell *matCellDef="let e">
                            <mat-checkbox [class.mat-checkbox-disabled]="false" disabled="true" [checked]="e.isBudget"></mat-checkbox>
                        </mat-cell>
                    </ng-container>


                    <mat-row class="selectable" [class.selected]="row?.oid === selectedRow?.oid"
                             (click)="selectRow(row)"
                             *matRowDef="let row; columns: displayedColumns;"></mat-row>

                </mat-table>
            </div>
            <div class="pagination-container b-b-background" >
                <ss-pagination [paginationModel]="pagination" disabled="isRoot"></ss-pagination>
            </div>
        </div>
    </div>
    <div class="right_div" *ngIf="transactionMode; else archive">
        <router-outlet></router-outlet>
    </div>

    <ng-template #archive>
        <ss-app-archive-main class="right_div" [id]="selected" [appId]="7" [editable]="isEditable"></ss-app-archive-main>
    </ng-template>
</div>
