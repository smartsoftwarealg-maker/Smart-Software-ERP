<mat-card class="container">
    <mat-card-header>
        <mat-toolbar>
            <span translate>COMMON_DUPLICATE</span>
        </mat-toolbar>
    </mat-card-header>
    <mat-card-content>
        <form [formGroup]="form">
            <mat-form-field class="default-100">
                <mat-label translate>COMMON_JOURNAL</mat-label>
                <ss-auto-complete matInput
                                  [required]="true"
                                  [model]="journalLookup"
                                  formControlName="journal">
                </ss-auto-complete>
            </mat-form-field>

            <mat-form-field class="default-50">
                <mat-label translate>TRS_PIECENO</mat-label>
                <input matInput formControlName="pieceNo" type="number" required>
            </mat-form-field>

        </form>
    </mat-card-content>
    <mat-card-actions>
        <div class="crtl__div">
            <button mat-raised-button color="primary" (click)="close()" translate>COMMON_IMPORT</button>
            <button mat-raised-button (click)="cancel()" translate>COMMON_CANCEL</button>
        </div>
    </mat-card-actions>
</mat-card>
