<div class="container">
    <div class="table-div">
        <mat-table mat-table [dataSource]="data" class="main-table">

            <ng-container matColumnDef="accountNo">
                <mat-header-cell *matHeaderCellDef translate>COMMON_ACCOUNTNO</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{e.accountNo}}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="reference">
                <mat-header-cell *matHeaderCellDef translate>COMMON_REFERENCE</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{e.reference}}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="customerName">
                <mat-header-cell *matHeaderCellDef translate>LOGISTICS_AGENT</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{e.customerName}}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="lineNumber">
                <mat-header-cell *matHeaderCellDef translate>ACC_POS</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{e.lineNumber}}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="debit">
                <mat-header-cell *matHeaderCellDef translate>ACC_DEBIT</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{ (e.balance > 0.0 ? e.balance * e.sign : 0.0)}}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="credit">
                <mat-header-cell *matHeaderCellDef translate>ACC_CREDIT</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{ (e.balance < 0.0 ? -e.balance * e.sign : 0.0)}}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="description">
                <mat-header-cell *matHeaderCellDef translate>ADMINISTRATION_DESCRIPTION</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{e.description}}
                </mat-cell>
            </ng-container>

            <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
            <mat-row class="selectable" [class.selected]="row.id == selected" (click)="selectRow(row)"
                     *matRowDef="let row; columns: displayedColumns;"></mat-row>
        </mat-table>
    </div>
    <div class="pagination-container b-b-background">
        <ss-pagination [paginationModel]="pagination"></ss-pagination>
    </div>

    <div class="ctrl-div" *ngIf="parentId">
        <button mat-mini-fab color="primary" (click)="showDetail(0)">
            <span class="fas fa-plus"></span>
        </button>
        <button mat-mini-fab (click)="edit()"
                [disabled]="!selected"
                color="accent">
            <span class="fas fa-pen"></span>
        </button>
        <button mat-mini-fab (click)="deleteSelected()"
                [disabled]="!selected"
                color="warn">
            <span class="fas fa-trash-alt"></span>
        </button>
        <button mat-mini-fab (click)="exit()" color="accent">
            <span class="fa-solid fa-person-from-portal"></span>
        </button>
    </div>

</div>
