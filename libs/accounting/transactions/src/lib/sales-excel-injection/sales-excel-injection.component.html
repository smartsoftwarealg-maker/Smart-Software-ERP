<div class="container">
    @if (!processing()) {
        @if (!processing()) {
            <mat-card>
                <div class="file-upload">
                    <input type="file"
                           class="file-input"
                           accept=".xlsx, application/msexcel"
                           (change)="onChange(fileUpload.files)"
                           #fileUpload>

                    <div translate>{{ fileName || "COMMON_NO_FILE_SELECTED" }}</div>

                    <button mat-mini-fab color="primary"
                            class="upload-btn"
                            (click)="fileUpload.click()">
                        <i class="fas fa-paperclip"></i>
                    </button>
                </div>

                <mat-form-field class="default-100">
                    <mat-label translate>COMMON_JOURNALS</mat-label>
                    <ss-auto-complete matInput
                                      [model]="journalLookup"
                                      [formControl]="journal">
                    </ss-auto-complete>
                </mat-form-field>

                <mat-form-field class="default-100">
                    <mat-label translate>LOGISTICS_MODE</mat-label>
                    <mat-select [formControl]="mode" required>
                        <mat-option [value]="1">
                            {{ 'COMMON_SALES'|translate}}
                        </mat-option>
                        <mat-option [value]="2">
                            {{ 'COMMON_PAYMENTS'|translate}}
                        </mat-option>
                    </mat-select>
                </mat-form-field>

                <div class="button__div">
                    <button mat-raised-button color="primary"
                            type="button"
                            (click)="onFileSelected(fileUpload.files)"
                            [disabled]="!fileName || journal.value < 1">
                        <i class="fa-solid fa-upload  icon"></i>
                        {{ 'COMMON_UPLOAD' | translate }}
                    </button>
                    <button mat-raised-button color="warn" type="button" (click)="cancel()">
                        <i class="fa-solid fa-arrow-rotate-left icon"></i>
                        {{ 'COMMON_CANCEL' | translate }}
                    </button>
                </div>
            </mat-card>
        }

    }
    @if (processing()) {
        <mat-progress-bar class="progress-bar" mode="indeterminate"></mat-progress-bar>
    }
</div>
