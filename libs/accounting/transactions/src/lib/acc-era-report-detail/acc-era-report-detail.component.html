<mat-card>
    <mat-card-content>

        @if (form !== null) {
            <form novalidate [formGroup]="form">

                <mat-form-field class="default-100">
                    <mat-label translate>COMMON_DESCRIPTION</mat-label>
                    <input matInput formControlName="description" required readonly>
                    @if (form.controls['description'].invalid) {
                        <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
                    }
                </mat-form-field>

                <mat-form-field class="default-100">
                    <mat-label translate>COMMON_DESCRIPTION_AR</mat-label>
                    <input matInput formControlName="descriptionAr" readonly>
                </mat-form-field>

                <mat-form-field class="default-100">
                    <mat-label translate>ACC_ACCOUNT_LIST</mat-label>
                    <input matInput formControlName="accountList">
                </mat-form-field>

            </form>
        }

    </mat-card-content>
</mat-card>
