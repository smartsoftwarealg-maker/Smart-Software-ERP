<div class="container">
    <mat-form-field floatLabel="always" class="default-50">
        <mat-label translate>ACC_PERIOD</mat-label>
        <mat-select [formControl]="accPeriod" required>
            <mat-option *ngFor="let p of periods; let i = index" [value]="i + 1">
                {{ p | translate}}
            </mat-option>
        </mat-select>
    </mat-form-field>
    <button mat-raised-button color="primary" (click)="selectPeriod()" translate>COMMON_SELECT</button>

    <div class="table-div">
        <mat-table mat-table [dataSource]="data" class="main-table">

            <ng-container matColumnDef="month">
                <mat-header-cell *matHeaderCellDef translate>ACC_PERIOD</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{e.month | translate}}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="debit">
                <mat-header-cell *matHeaderCellDef translate>ACC_DEBIT</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{e.debit | number: '1.2-2'}}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="credit">
                <mat-header-cell *matHeaderCellDef translate>ACC_DEBIT</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{e.credit | number: '1.2-2'}}
                </mat-cell>
            </ng-container>

            <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
            <mat-row class="selectable"
                     [class.imbalance]="balance(row)"
                     [class.selected]="row.id == selected" (click)="select(row.id)"
                     *matRowDef="let row; columns: displayedColumns;"></mat-row>
        </mat-table>
    </div>

</div>
