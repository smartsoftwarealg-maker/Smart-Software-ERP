<mat-card>
    <mat-card-content>
        <form *ngIf="form !== null" novalidate [formGroup]="form">
            <mat-form-field id="description" class="default-50 small-100">
                <mat-label translate>ADMINISTRATION_DESCRIPTION</mat-label>
                <input matInput formControlName="description" type="text" >
                <mat-error *ngIf="form.controls['description'].invalid" translate>COMMON_FIELD_
                </mat-error>
            </mat-form-field>

            <mat-form-field id="purchase" class="default-50 small-100">
                <mat-label translate>COMMON_PURCHASE</mat-label>
                <input matInput formControlName="purchase" type="text" >
                <mat-error *ngIf="form.controls['purchase'].invalid" translate>COMMON_FIELD_
                </mat-error>
            </mat-form-field>

            <mat-form-field id="supplier" class="default-50 small-100">
                <mat-label translate>LOGISTICS_SUPPLIER</mat-label>
                <input matInput formControlName="supplier" type="text" >
                <mat-error *ngIf="form.controls['supplier'].invalid" translate>COMMON_FIELD_
                </mat-error>
            </mat-form-field>

            <mat-form-field id="stock" class="default-50 small-100">
                <mat-label translate>COMMON_STOCK</mat-label>
                <input matInput formControlName="stock" type="text" >
                <mat-error *ngIf="form.controls['stock'].invalid" translate>COMMON_FIELD_
                </mat-error>
            </mat-form-field>

            <mat-form-field id="consumption" class="default-50 small-100">
                <mat-label translate>ADMINISTRATION_DESCRIPTION</mat-label>
                <input matInput formControlName="consumption" type="text" >
                <mat-error *ngIf="form.controls['consumption'].invalid" translate>COMMON_FIELD_
                </mat-error>
            </mat-form-field>

            <mat-form-field id="sales" class="default-50 small-100">
                <mat-label translate>COMMON_SALES</mat-label>
                <input matInput formControlName="sales" type="text" >
                <mat-error *ngIf="form.controls['sales'].invalid" translate>COMMON_FIELD_
                </mat-error>
            </mat-form-field>


        </form>

    </mat-card-content>
</mat-card>
