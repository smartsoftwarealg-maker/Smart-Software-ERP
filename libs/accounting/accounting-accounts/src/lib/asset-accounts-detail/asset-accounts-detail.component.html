<mat-card>
    <mat-card-content>
        <form *ngIf="form !== null" novalidate [formGroup]="form">

            <mat-form-field id="accountNo" class="default-50 sm-100">
                <mat-label translate>LOGISTICS_ACCOUNT_NO</mat-label>
                <input matInput formControlName="accountNo" type="text" required readonly>
                <mat-error *ngIf="form.controls['accountNo'].invalid" translate>COMMON_FIELD_REQUIRED
                </mat-error>
            </mat-form-field>

            <mat-form-field id="description" class="default-50 sm-100">
                <mat-label translate>LOGISTICS_DESCRIPTION</mat-label>
                <input matInput formControlName="description" type="text" required readonly>
                <mat-error *ngIf="form.controls['description'].invalid" translate>COMMON_FIELD_REQUIRED
                </mat-error>
            </mat-form-field>


            <mat-form-field id="depreciation_accountr" class="default-50 sm-100">
                <mat-label translate>ACC_DEPRECIATION_ACCOUNT</mat-label>
                <input matInput formControlName="depreciation_account" type="text">
            </mat-form-field>

            <mat-form-field id="endowment_account" class="default-50 sm-100">
                <mat-label translate>ACC_ENDOWMENT_ACCOUNT</mat-label>
                <input matInput formControlName="endowment_account" type="text">
            </mat-form-field>


        </form>
    </mat-card-content>
</mat-card>
