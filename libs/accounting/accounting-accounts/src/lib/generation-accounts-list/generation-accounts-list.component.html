<div class="content_div table_div">
   <mat-table mat-table [dataSource]="data"  matSort (matSortChange)="sort($event)">

    <ng-container matColumnDef="description">
        <mat-header-cell *matHeaderCellDef mat-sort-header translate>ADMINISTRATION_DESCRIPTION</mat-header-cell>
        <mat-cell *matCellDef="let e">
            {{e.description}}
        </mat-cell>
    </ng-container>

    <ng-container matColumnDef="purchase">
        <mat-header-cell *matHeaderCellDef mat-sort-header translate>ACC_PURCHASE_ACCOUNT</mat-header-cell>
        <mat-cell *matCellDef="let e">
            {{e.purchase}}
        </mat-cell>
    </ng-container>


    <ng-container matColumnDef="supplier">
        <mat-header-cell *matHeaderCellDef mat-sort-header translate>LOGISTICS_SUPPLIER</mat-header-cell>
        <mat-cell *matCellDef="let e">
            {{e.supplier}}
        </mat-cell>
    </ng-container>

    <ng-container matColumnDef="stock">
        <mat-header-cell *matHeaderCellDef mat-sort-header translate>ACC_STOCK_ACCOUNT</mat-header-cell>
        <mat-cell *matCellDef="let e">
            {{e.stock}}
        </mat-cell>
    </ng-container>

    <ng-container matColumnDef="consumption">
        <mat-header-cell *matHeaderCellDef mat-sort-header translate>ACC_CONSUMPTION_ACCOUNT</mat-header-cell>
        <mat-cell *matCellDef="let e">
            {{e.consumption}}
        </mat-cell>
    </ng-container>

    <ng-container matColumnDef="sales">
        <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_SALES_ACCOUNT</mat-header-cell>
        <mat-cell *matCellDef="let e">
            {{e.sales}}
        </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
    <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
             *matRowDef="let row; columns: displayedColumns;"></mat-row>
</mat-table>
</div>
<div class="content_div b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
