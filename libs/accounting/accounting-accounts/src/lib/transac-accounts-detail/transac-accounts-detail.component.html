<mat-card>
    <mat-card-content>
        <form *ngIf="form !== null" novalidate [formGroup]="form">
            <mat-form-field id="description" class="default-100">
                <mat-label translate>ADMINISTRATION_DESCRIPTION</mat-label>
                <input matInput formControlName="description" type="text" required readonly>
                <mat-error *ngIf="form.controls['description'].invalid" translate>COMMON_FIELD_REQUIRED
                </mat-error>
            </mat-form-field>

            <mat-form-field id="accountno" class="default-100">
                <mat-label translate>COMMON_ACCOUNTNO</mat-label>
                <input matInput formControlName="accountno" type="text" required autofocus>
                <mat-error *ngIf="form.controls['accountno'].invalid" translate>COMMON_FIELD_REQUIRED
                </mat-error>
            </mat-form-field>

        </form>


    </mat-card-content>
</mat-card>
