<mat-card>
  <mat-card-content>
    @if (form !== null) {
      <form novalidate [formGroup]="form">
        <mat-form-field id="description" class="default-100">
          <mat-label translate>ADMINISTRATION_DESCRIPTION</mat-label>
          <input matInput formControlName="description" type="text" required readonly>
          @if (form.controls['description'].invalid) {
            <mat-error translate>COMMON_FIELD_REQUIRED
            </mat-error>
          }
        </mat-form-field>
    <mat-form-field class="default-100">
      <mat-label translate>COMMON_ACCOUNTNO</mat-label>
      <ss-auto-complete matInput
        [model]="purchaseLookup"
        formControlName="accountno">
      </ss-auto-complete>
      @if (form.controls['accountno'].invalid) {
        <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
      }
    </mat-form-field>
  </form>
}


</mat-card-content>
</mat-card>
