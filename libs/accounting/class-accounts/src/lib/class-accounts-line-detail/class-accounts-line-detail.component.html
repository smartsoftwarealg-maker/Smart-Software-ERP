<mat-card>
    <mat-card-header>
        <div class="ctrl_div default-100">
            <button mat-mini-fab color="primary"
                    [matTooltip]="'COMMON_SAVE' | translate"
                    (click)="save()"
                    [disabled]="!form?.valid">
                <i class="fas fa-save"></i>
            </button>
            <button mat-mini-fab
                    color="warn"
                    [matTooltip]="'COMMON_CANCEL' | translate"
                    translate (click)="cancel()">
                <i class="fas fa-redo"></i>
            </button>
        </div>
    </mat-card-header>
    @if (form !== null) {
        <mat-card-content>
            <form [formGroup]="form">
                <mat-form-field class="default-50 sm-100">
                    <mat-label translate>PAYROLL_CATEGORY</mat-label>
                    <ss-auto-complete matInput
                                      [model]="categoryLookup"
                                      formControlName="categoryId">
                    </ss-auto-complete>
                </mat-form-field>
                <mat-form-field class="default-50 sm-100">
                    <mat-label translate>COMMON_ACCOUNTNO</mat-label>
                    <ss-auto-complete matInput
                                      [model]="accountLookup"
                                      formControlName="accountId">
                    </ss-auto-complete>
                    @if (form.controls['accountId'].hasError('required')) {
                        <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
                    }
                    @if (form.controls['accountId'].hasError('validOption')) {
                        <mat-error translate>COMMON_NO_MATCH</mat-error>
                    }
                </mat-form-field>
            </form>
        </mat-card-content>
    }
</mat-card>
