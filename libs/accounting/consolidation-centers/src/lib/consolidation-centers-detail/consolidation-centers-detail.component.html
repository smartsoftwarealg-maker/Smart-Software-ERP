<mat-card>
    <mat-card-header></mat-card-header>
    <mat-card-content>
        @if (form !== null) {
            <form [formGroup]="form">
                <mat-form-field id="description" class="default-100">
                    <mat-label translate>ADMINISTRATION_CENTER</mat-label>
                    <ss-auto-complete matInput
                                      [model]="centerLookup"
                                      formControlName="id">
                    </ss-auto-complete>
                    @if (form.controls['id'].invalid) {
                        <mat-error translate>COMMON_FIELD_REQUIRED</mat-error>
                    }
                </mat-form-field>

                <mat-form-field id="percentage" class="default-50 sm-100">
                    <mat-label translate>COMMON_RATE</mat-label>
                    <input matInput formControlName="percentage" type="number" min="0" max="100">
                    @if (form.controls['percentage'].invalid) {
                        <mat-error translate>COMMON_FIELD_MAX_LENGTH</mat-error>
                    }
                </mat-form-field>

                <mat-checkbox formControlName="headquarter" translate>ADMINISTRATION_HEADQUARTER</mat-checkbox>
            </form>
        }
    </mat-card-content>
</mat-card>
