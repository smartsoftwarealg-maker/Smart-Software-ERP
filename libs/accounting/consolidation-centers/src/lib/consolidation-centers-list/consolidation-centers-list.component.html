<div class="div_table size">
    <mat-table mat-table [dataSource]="data" class="main-table" matSort (matSortChange)="sort($event)">

        <ng-container matColumnDef="centerDescription">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>ADMINISTRATION_CENTER</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.centerDescription}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="percentage">
            <mat-header-cell *matHeaderCellDef mat-sort-header translate>COMMON_RATE</mat-header-cell>
            <mat-cell *matCellDef="let e">
                {{e.percentage | number: '1.2-2'}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="headquarter">
            <mat-header-cell *matHeaderCellDef translate>ADMINISTRATION_HEADQUARTER</mat-header-cell>
            <mat-cell *matCellDef="let e">

                <mat-checkbox [class.mat-checkbox-disabled]="false"
                              disabled="true"
                              [checked]="e.headquarter">
                </mat-checkbox>
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
                 *matRowDef="let row; columns: displayedColumns;">
        </mat-row>
    </mat-table>
</div>
<div class="size b-b-background">
    <ss-pagination [paginationModel]="pagination"></ss-pagination>
</div>
