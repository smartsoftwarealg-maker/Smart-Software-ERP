<div class="container">
    <div class="container_div">
        <mat-table mat-table [dataSource]="data" class="main-table">

            <ng-container matColumnDef="description">
                <mat-header-cell *matHeaderCellDef translate>COMMON_DESCRIPTION</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{e.description}}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="abbreviation">
                <mat-header-cell *matHeaderCellDef translate>ADMINISTRATION_CODE</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{e.abbreviation}}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="defaultLabel">
                <mat-header-cell *matHeaderCellDef translate>ACC_DEFAULT_LABEL</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{e.defaultLabel}}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="centerName">
                <mat-header-cell *matHeaderCellDef translate>ADMINISTRATION_CENTER</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{e.centerName}}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="typeName">
                <mat-header-cell *matHeaderCellDef translate>COMMON_TYPE</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{e.typeName}}
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="bankName">
                <mat-header-cell *matHeaderCellDef translate>COMMON_BANK</mat-header-cell>
                <mat-cell *matCellDef="let e">
                    {{e.bankName}}
                </mat-cell>
            </ng-container>


            <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
            <mat-row class="selectable" [class.selected]="row.id == selected" (click)="select(row.id)"
                     *matRowDef="let row; columns: displayedColumns;"></mat-row>
        </mat-table>
    </div>
    <div class="pagination-container b-b-background">
        <ss-pagination [paginationModel]="pagination"></ss-pagination>
    </div>
</div>
