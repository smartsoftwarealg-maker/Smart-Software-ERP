<div class="button_div">

    <button mat-mini-fab (click)="save()"
            color="accent" *ngIf="isEditable">
        <i class="fas fa-save"></i>
    </button>
    <button mat-mini-fab (click)="cancel()"
            color="warn" >
        <i class="fas fa-redo"></i>
    </button>
</div>

<mat-card>
    <mat-card-content>
        <form *ngIf="form !== null" novalidate [formGroup]="form">

            <mat-form-field id="position" class="default-50 sm-100">
                <mat-label translate>LOGISTICS_POSITION</mat-label>
                <input matInput formControlName="position" type="number">
            </mat-form-field>


            <mat-form-field class="default-50 sm-100">
                <mat-label translate>LOGISTICS_ARTICLE</mat-label>
                <ss-auto-complete matInput
                                  [required]="true"
                                  [model]="serviceLookup"
                                  formControlName="reference">
                </ss-auto-complete>
                <mat-error
                    *ngIf="form.controls['reference'].hasError('required')" translate>COMMON_FIELD_REQUIRED
                </mat-error>
                <mat-error
                    *ngIf="form.controls['reference'].hasError('validOption')" translate>COMMON_NO_MATCH
                </mat-error>
            </mat-form-field>


            <mat-form-field id="qtyOrdered" class="default-50 sm-100">
                <mat-label translate>LOGISTICS_QTY_ORDERED</mat-label>
                <input matInput formControlName="qtyOrdered" type="number" step=".01" readonly>
                <mat-error
                    *ngIf="form.controls['qtyOrdered'].hasError('required')" translate>COMMON_FIELD_REQUIRED
                </mat-error>
            </mat-form-field>

            <mat-form-field id="qtySatisfied" class="default-50 sm-100">
                <mat-label translate>LOGISTICS_QTY_SATISFIED</mat-label>
                <input matInput formControlName="qtySatisfied" type="number" step=".01" >
                <mat-error
                    *ngIf="form.controls['qtySatisfied'].hasError('required')" translate>COMMON_FIELD_REQUIRED
                </mat-error>
            </mat-form-field>

            <mat-form-field id="price" class="default-50 sm-100">
                <mat-label translate>LOGISTICS_PRICE</mat-label>
                <input matInput formControlName="price" type="number" step=".01" required>
                <mat-error
                    *ngIf="form.controls['price'].hasError('required')" translate>COMMON_FIELD_REQUIRED
                </mat-error>
            </mat-form-field>

            <mat-form-field id="vat" class="default-50 sm-100">
                <mat-label translate>LOGISTICS_VAT</mat-label>
                <input matInput formControlName="vat" type="number" step=".1">
                <mat-error
                    *ngIf="form.controls['vat'].hasError('required')" translate>COMMON_FIELD_REQUIRED
                </mat-error>
            </mat-form-field>


            <mat-form-field id="header" class="default-50 sm-100">
                <mat-label translate>LOGISTICS_HEADER</mat-label>
                <textarea matInput formControlName="observation" cdkTextareaAutosize="true"></textarea>
            </mat-form-field>

            <mat-form-field id="footer" class="default-50 sm-100">
                <mat-label translate>LOGISTICS_FOOTER</mat-label>
                <textarea matInput formControlName="footerMemo" cdkTextareaAutosize="true"></textarea>
            </mat-form-field>

        </form>
    </mat-card-content>
</mat-card>
