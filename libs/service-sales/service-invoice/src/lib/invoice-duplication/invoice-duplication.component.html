<mat-card class="size">
  @if (form !== null) {
    <form novalidate [formGroup]="form">
      <mat-form-field class="numb">
        <mat-label translate>COMMON_MONTH</mat-label>
        <input matInput formControlName="month" type="number" min="1" max="12">
      </mat-form-field>
      <mat-form-field class="numb">
        <mat-label translate>COMMON_YEAR</mat-label>
        <input matInput formControlName="year" type="number" [min]="prevYear" [max]="curYear">
      </mat-form-field>
      <mat-form-field class="date">
        <mat-label translate>COMMON_DATE</mat-label>
        <ss-date-picker formControlName="date"></ss-date-picker>
      </mat-form-field>
      <button mat-raised-button type="button" (click)="list(invoiceList)">
        <i class="fa-solid fa-list"></i>
        {{ 'COMMON_LIST' | translate }}
      </button>
      <button mat-raised-button type="button" color="primary"  (click)="duplicate(invoiceList)">
        <i class="fa-solid fa-copy"></i>
        {{ 'COMMON_DUPLICATE' | translate }}
      </button>
    </form>
  }
</mat-card>

<div class="size invoice">
  <mat-selection-list #invoiceList>
    <mat-list-option #header (click)="header.selected? invoiceList.selectAll() : invoiceList.deselectAll()">
      <tr>
        <th style="width: 8em;" translate> COMMON_NUMBER</th>
        <th style="width: 10em;" translate> COMMON_DATE</th>
        <th style="width: 40em;" translate> LOGISTICS_CUSTOMER</th>
      </tr>
    </mat-list-option>
    @for (i of data$ | async; track i) {
      <mat-list-option [value]="i.number">
        <tr>
          <td style="width: 8em;">{{i.number }} </td>
          <td style="width: 10em;"> {{ i.date | date: 'dd/MM/yyyy' }} </td>
          <td style="width: 40em;">{{i.denomination}} </td>
        </tr>
      </mat-list-option>
    }
  </mat-selection-list>
</div>
