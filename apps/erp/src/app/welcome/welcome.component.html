<h2 class="f-primary" translate>SMART_ERP</h2>
<div class="main-view">
    <div class=" mat-elevation-z6" style="width: 90%; margin: auto; height: 3px;"></div>
    <div *ngFor="let l of display" class="app-card" (click)="onClick(l)">
        <div class="img">
            <i style="margin-right: 8px; margin-left: 8px" [class]="l.icon"></i>
        </div>
        <div class="txt" translate>
            {{l.name}}
        </div>
    </div>
    <div class=" mat-elevation-z6" style="width: 90%; margin: auto; height: 3px;"></div>
</div>
