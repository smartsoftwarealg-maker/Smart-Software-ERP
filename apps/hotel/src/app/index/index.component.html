<app-basic-shell [hasContent]="true">
    <div style="position: absolute; top: 48px; right: 0; bottom: 0; left: 0; overflow: hidden" class="apps-supper-container">
        <div class="apps-container">
            <div *ngFor="let app of apps" [routerLink]="'../' + app.path" class="app">
                <img [alt]="app.name" [src]="app.image" class="app-icon">
                <div class="app-name" translate>
                    {{app.name}}
                </div>
            </div>
        </div>
    </div>
</app-basic-shell>
