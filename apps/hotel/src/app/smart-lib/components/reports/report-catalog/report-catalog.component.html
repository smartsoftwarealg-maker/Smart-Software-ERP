<div class="container">
  <!--ss-ss-nav-toolbar (change)="onFilter($event)"
                      [editEnabled]="selectedId != null"
                      (add)="onAdd()"
                     (deleted)="onDelete()"
                      (refresh)="onFilter($event)"
                      (edit)="onEdit()">
  </ss-ss-nav-toolbar-->

  <mat-table matSort
             (matSortChange)="sortData($event)"
             [dataSource]="dataSource">

    <ng-container matColumnDef="filename">
      <mat-header-cell
        *matHeaderCellDef
        mat-sort-header
        translate>
        {{ 'FILE_NAME' }}
      </mat-header-cell>
      <mat-cell *matCellDef="let report">{{ report.fileName }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="description">
      <mat-header-cell *matHeaderCellDef mat-sort-header translate>{{ 'DESCRIPTION' }}</mat-header-cell>
      <mat-cell *matCellDef="let report">{{report.description}}</mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>

    <mat-row *matRowDef="let row; columns: displayedColumns;"
             [class.active-row]="selectedId === row?.id"
             (click)="select(row.id)">
    </mat-row>
  </mat-table>
  <app-pagination pagina></app-pagination>
</div>
