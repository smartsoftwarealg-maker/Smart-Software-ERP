<div class="max-700 ">
    <form novalidate [formGroup]="form" *ngIf="form" class="container max-700">
        <mat-form-field>
            <mat-placeholder translate>FILE_NAME</mat-placeholder>
            <mat-select name="fileName" formControlName="fileName">
                <mat-option *ngFor="let rep of reports" [value]="rep">
                    {{ rep }}
                </mat-option>
            </mat-select>
        </mat-form-field>
        <mat-form-field>
            <mat-placeholder translate>DESCRIPTION</mat-placeholder>
            <input matInput type="text" name="description" formControlName="description">
        </mat-form-field>
    </form>
    <app-save-bar
        class="max-700"
        (cancel)="cancel()"
        (save)="save()">
    </app-save-bar>
</div>
