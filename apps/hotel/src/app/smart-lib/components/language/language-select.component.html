<div class="language-select-container">
  <button mat-icon-button [matMenuTriggerFor]="menu" #trigger="matMenuTrigger">
    <i class="fas fa-globe"></i>
  </button>
  <mat-menu [xPosition]="langSrv.rtl ? 'before' : 'after'" yPosition="below" overlapTrigger="false" #menu="matMenu">
    <div mat-menu-item *ngFor="let l of languages" (click)="selectLocale(l.code)" style="text-align: center; width: 140px">
      {{l.name}}
    </div>
  </mat-menu>
</div>
