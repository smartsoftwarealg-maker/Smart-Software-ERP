<div class="login-container">
    <ss-loading-spinner *ngIf="loading"></ss-loading-spinner>
    <div *ngIf="!loading" class="login-form" ssVCenter>
        <form novalidate>
            <mat-form-field class="login-form-field">
                <mat-placeholder translate>LOGIN_USERNAME</mat-placeholder>
                <i class="fas fa-user-circle margin-end-8" matPrefix></i>
                <mat-error *ngIf="username.hasError('required')" class="login-error-msg theme-foreground-warn">
                    <strong translate>FIELD_REQUIRED</strong>
                </mat-error>
                <input matInput type="text" autocomplete="off" #username="ngModel" name="username"
                       [(ngModel)]="user.username" required="true" focused>
            </mat-form-field>

            <mat-form-field class="login-form-field">
                <mat-placeholder translate>LOGIN_PASSWORD</mat-placeholder>
                <i class="fas fa-lock margin-end-8 margin-end-8" matPrefix></i>
                <input matInput type="password" name="password" [(ngModel)]="user.password">
            </mat-form-field>

            <mat-form-field class="login-form-field" *ngIf="loginSrv.licenseErrorType">
                <mat-placeholder translate>LOGIN_LICENSE</mat-placeholder>
                <i class="fas fa-key margin-end-8" matPrefix></i>
                <input matInput type="text" autocomplete="off" name="license" [(ngModel)]="">
                <mat-hint align="start" class="mat-error"><strong translate>LOGIN_INVALID_LICENSE</strong></mat-hint>
            </mat-form-field>

            <div *ngIf="loginSrv.wrongData" class="mat-error login-failed">
                <i class="fas fa-exclamation-triangle mat-18"></i>
                <strong translate>LOGIN_WRONG_USERNAME_PASSWORD</strong>
            </div>

            <div class="actions-bar">
                <button mat-raised-button
                        class="float-end margin-end-16"
                        style="margin-top: 6px; margin-bottom: 6px;"
                        color="primary"
                        (click)="onSubmit()"
                        translate
                        [disabled]="updating">
                    LOGIN_LOGIN
                </button>
                <ss-theme-select
                        class="float-start margin-start-8"
                        style="margin-top: 4px; margin-bottom: 4px;"
                ></ss-theme-select>
                <ss-language-select
                        class="float-start margin-start-8"
                        style="margin-top: 4px; margin-bottom: 4px;"
                >
                </ss-language-select>
            </div>

        </form>
    </div>
</div>
