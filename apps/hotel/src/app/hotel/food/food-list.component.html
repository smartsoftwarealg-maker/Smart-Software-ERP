<div class="main-container">
    <app-list-toolbar
            (filterChange)="setFilter($event)"
            (refresh)="refresh()"
            (remove)="removeSelected()"
            (add)="showAddForm()"
            (edit)="showEditForm()"
            [removeDisabled]="!selectedId"
            [editDisabled]="!selectedId"
            [right]="accessRight"
    >
    </app-list-toolbar>
    <div class="main-list-container mat-elevation-z10">
        <ss-loading-spinner *ngIf="loadingState == 'L'"></ss-loading-spinner>
        <ss-fatal-error *ngIf="loadingState == 'E'"></ss-fatal-error>
        <div *ngIf="loadingState == 'C'" class="main-list-container-2">
            <mat-table matSort matSortActive="{{sort.active}}" matSortDirection="{{sort.direction}}"
                       (matSortChange)="sortData($event)" [dataSource]="data">

                <ng-container matColumnDef="reference">
                    <mat-header-cell class="theme-background-accent padding-start-16 padding-end-8" *matHeaderCellDef
                                     mat-sort-header translate>
                        HTL_FOD_REFERENCE
                    </mat-header-cell>
                    <mat-cell *matCellDef="let x" class="padding-start-16 padding-end-8">
                        {{ x.reference }}
                    </mat-cell>
                </ng-container>

                <ng-container matColumnDef="description2">
                    <mat-header-cell class="theme-background-accent" *matHeaderCellDef mat-sort-header translate>
                        HTL_FOD_DESCRIPTION
                    </mat-header-cell>
                    <mat-cell *matCellDef="let x">
                        {{ x.description2 }}
                    </mat-cell>
                </ng-container>

                <ng-container matColumnDef="foodType">
                    <mat-header-cell class="theme-background-accent" *matHeaderCellDef mat-sort-header translate>
                        HTL_FOD_FOOD_TYPE
                    </mat-header-cell>
                    <mat-cell *matCellDef="let x">
                        {{ foodSrv.foodTypesMap[x.foodType] }}
                    </mat-cell>
                </ng-container>

                <ng-container matColumnDef="price">
                    <mat-header-cell class="theme-background-accent align-cell-center" *matHeaderCellDef mat-sort-header translate>
                        HTL_FOD_PRICE
                    </mat-header-cell>
                    <mat-cell *matCellDef="let x" class="align-cell-right">
                        {{ (x.price || 0).toFixed(2) }}
                    </mat-cell>
                </ng-container>

                <ng-container matColumnDef="vat">
                    <mat-header-cell class="theme-background-accent align-cell-center" *matHeaderCellDef mat-sort-header translate>
                        HTL_FOD_VAT
                    </mat-header-cell>
                    <mat-cell *matCellDef="let x" class="align-cell-center">
                        {{foodSrv.vatsMap[x.vat]}}
                    </mat-cell>
                </ng-container>

                <ng-container matColumnDef="accountno">
                    <mat-header-cell class="theme-background-accent padding-end-16 padding-start-8" *matHeaderCellDef
                                     mat-sort-header translate>
                        HTL_FOD_ACCOUNTNO
                    </mat-header-cell>
                    <mat-cell *matCellDef="let x" class="padding-end-16 padding-start-8">
                        {{ x.accountno }}
                    </mat-cell>
                </ng-container>

                <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true">
                </mat-header-row>

                <mat-row *matRowDef="let row; columns: displayedColumns;"
                         (click)="select(row.id)" class="selectable"
                         [class.selectable-active]="row.id === selectedId">
                </mat-row>
            </mat-table>

            <app-pagination class="paginator" [paginationModel]="paginationModel">
            </app-pagination>
        </div>
    </div>
</div>
