<div class="htl-gym-container">
    <app-list-toolbar
            class="gym-main-toolbar"
            (filterChange)="setFilter($event)"
            (refresh)="refresh()"
            (add)="showAdd()"
            [editVisible]="false"
            [removeVisible]="false"
            [right]="accessRight">
        <button type="button" (click)="goToList()"  matTooltip="{{ 'HTL_GYM_LIST' | translate }}" mat-icon-button>
            <i class="fas fa-list"></i>
        </button>
    </app-list-toolbar>
    <!--list-->
    <div *ngIf="services" class="htl-gym-main theme-background theme-foreground">
        <div *ngFor="let c of services" class="htl-gym-client" (click)="onClick(c)">
            <div *ngIf="!c.agentName" style="width: 100%; height: 100%">
                <i class="fa fa-spinner fa-spin htl-gym-client-loading" aria-hidden="true"></i>
            </div>
            <ng-container *ngIf="c.agentName">

            </ng-container>
            <div class="htl-gym-client-image">
                <i class="fas fa-user"></i>
            </div>
            <div class="htl-gym-client-info">
                <div class="htl-gym-client-name">{{c.agentName}}</div>
                <div class="htl-gym-client-time">{{c.timeStr}}</div>
            </div>
        </div>
    </div>
    <app-pagination class="gmy-main-paginator" [paginationModel]="gymSrv.livePagination">
    </app-pagination>
</div>
