<div class="hotel-main-container">
    <div *ngFor="let m of menu" class="apps-section">
        <div class="section-title">
            <h2 translate>{{m.data.title}}</h2>
        </div>
        <div class="section-apps">
            <div *ngFor="let a of m.children" class="app-card" [routerLink]="a.path">
                <div class="app-icon theme-background-primary">
                    <i style="font-size: 32px; margin: 0;" class="{{a.data.image}}"></i>
                </div>
<!--                <img [src]="a.data.image" [alt]="a.data.title" class="app-icon">-->
                <div class="app-name">
                    <a translate>{{a.data.title}}</a>
                </div>
            </div>
        </div>
    </div>
</div>
