<div class="dlg-title theme-background-accent" translate>
    HTL_CLT_DETAIL
</div>

<ss-loading-spinner *ngIf="loadingState == 'L'"></ss-loading-spinner>
<ss-fatal-error *ngIf="loadingState == 'E'"></ss-fatal-error>
<div *ngIf="loadingState == 'C'" class="container theme-background">

    <form novalidate [formGroup]="form">
        <app-auto-complete disabled="true" [model]="agentAcModel" formControlName="agent" class="default-100">
            <span translate>HTL_CLT_DENOMINATION</span>
        </app-auto-complete>

        <mat-form-field class="sm-100 default-50">
            <mat-label translate>PAY_METHOD</mat-label>
            <mat-select formControlName="payMethod">
                <mat-option *ngFor="let c of paySrv.payMethods" [value]="c.id">{{ c.description }}</mat-option>
            </mat-select>
        </mat-form-field>

        <app-date-picker formControlName="date" class="sm-100 default-50" required="true">
            <span translate>DATE</span>
        </app-date-picker>

        <mat-form-field class="default-100">
            <mat-label translate>PAY_AMOUNT</mat-label>
            <input matInput formControlName="amount" type="number">
        </mat-form-field>


        <mat-form-field class="sm-100 default-50">
            <mat-label translate>PAY_CHECKNO</mat-label>
            <input matInput formControlName="checkNumb" type="text">
        </mat-form-field>

        <app-date-picker formControlName="checkDate" class="sm-100 default-50" required="true">
            <span translate>CHECK_DATE</span>
        </app-date-picker>

        <mat-form-field class="sm-100 default-50">
            <mat-label translate>PAY_BANK</mat-label>
            <mat-select formControlName="bankId">
                <mat-option *ngFor="let c of paySrv.banks" [value]="c.id">{{ c.description }}</mat-option>
            </mat-select>
        </mat-form-field>

        <!--mat-form-field class="code sm-100">
            <mat-label translate>HTL_CLT_CODE</mat-label>
            <input matInput formControlName="code" type="text">
        </mat-form-field>

        <mat-form-field class="denomination sm-100">
            <mat-label translate>HTL_CLT_DENOMINATION</mat-label>
            <input matInput formControlName="denomination" type="text">
        </mat-form-field>

        <mat-form-field class="phone sm-100">
            <mat-label translate>HTL_CLT_PHONE</mat-label>
            <input matInput formControlName="phone" maxlength="12" type="text">
        </mat-form-field>

        <mat-form-field class="fax sm-100">
            <mat-label translate>HTL_CLT_FAX</mat-label>
            <input matInput formControlName="fax" maxlength="12" type="text">
        </mat-form-field>

        <br>

        <mat-form-field class="mobile sm-100">
            <mat-label translate>HTL_CLT_MOBILE</mat-label>
            <input matInput formControlName="mobile" maxlength="12" type="text">
        </mat-form-field>

        <mat-form-field class="address sm-100">
            <mat-label translate>HTL_CLT_ADDRESS</mat-label>
            <input matInput formControlName="address" maxlength="80" type="text">
        </mat-form-field>

        <mat-checkbox formControlName="blocked" class="blocked" translate>
            HTL_CLT_BLOCKED
        </mat-checkbox!-->
    </form>

    <app-save-bar
            (save)="saveAgent()"
            (cancel)="close(true)"
            [saveDisabled]="!form.valid">
    </app-save-bar>
</div>
