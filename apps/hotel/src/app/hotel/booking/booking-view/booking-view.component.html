<div class="tools-bar">

    <app-auto-complete [model]="agentACModel" [selected]="bookingSrv.listFilters.selectedAgentId"
                       class="margin-start-8" style="width: 252px;">
        <span translate>HTL_BK_SEARCH_GUESTS</span>
    </app-auto-complete>

    <button class="margin-start-8" matTooltip="{{'REFRESH' | translate}}"
            mat-icon-button (click)="refresh()">
        <i class="fas fa-sync"></i>
    </button>

</div>

<div class="booking-filters">

    <div class="booking-filters-group margin-start-8">
        <app-date-picker [required]="true" [date]="firstDay" (dateChanged)="onDateChanged($event)">
            <span translate>HTL_BK_DATE</span>
        </app-date-picker>

        <mat-form-field style="max-width: 176px" class="margin-start-8">
            <mat-label translate>HTL_BK_RM_TYPE</mat-label>
            <mat-select name="type" [ngModel]="bookingSrv.listFilters.selectedRoomType" (valueChange)="onRoomTypeChanged($event)">
                <mat-option [value]="0" translate>HTL_BK_RM_TYPE_ALL</mat-option>
                <mat-option *ngFor="let rt of bookingSrv.roomTypesArray"
                            [value]="rt.id">{{ rt.description }}</mat-option>
            </mat-select>
        </mat-form-field>
    </div>

    <div class="booking-filters-group margin-start-8">
        <mat-form-field style="max-width: 120px">
            <mat-label translate>HTL_BK_FILTER_ROOMS</mat-label>
            <input matInput [formControl]="bookingSrv.listFilters.roomsFilter" type="text">
        </mat-form-field>

        <div class="buttons-container margin-start-8">
            <app-room-options-filter style="margin-top: 16px;"
                                     [options]="bookingSrv.listFilters.selectedRoomOptions"
                                     (apply)="refresh()">
            </app-room-options-filter>

            <app-htl-bk-notification
                    style="margin-top: 16px;"
                    class="margin-start-4"
                    [openBookingFn]="goToBooking"
                    [openRoomFn]="goToRoomDetail"
                    #notifications>
            </app-htl-bk-notification>

            <app-booking-stats class="margin-start-4" style="margin-top: 16px;">
            </app-booking-stats>

            <button *ngIf="!showCancelled" style="margin-top: 16px;"
                    class="margin-start-4"
                    matTooltip="{{'HTL_BK_SHOW_CANCELLED' | translate}}"
                    mat-icon-button
                    (click)="setShowCancelled(true)">
                <i class="fas fa-eye-slash"></i>
            </button>

            <button *ngIf="showCancelled" style="margin-top: 16px;"
                    class="margin-start-4"
                    matTooltip="{{'HTL_BK_HIDE_CANCELLED' | translate}}"
                    mat-icon-button
                    (click)="setShowCancelled(false)">
                <i class="fas fa-eye"></i>
            </button>

        </div>
    </div>

</div>

<ss-loading-spinner *ngIf="loadingState == 'L'"></ss-loading-spinner>
<ss-fatal-error *ngIf="loadingState == 'E'"></ss-fatal-error>

<ng-container *ngIf="loadingState == 'C'">

    <div class="rows-container">

        <app-booking-timeline-header class="list-head theme-background theme-foreground" [timelineDays]="days">
        </app-booking-timeline-header>

        <app-booking-timeline *ngFor="let room of rooms"
                              class="theme-background theme-foreground"
                              [room]="room"
                              [timelineData]="room['bookings']"
                              [timelineDays]="days"
                              [agentId]="bookingSrv.listFilters.selectedAgentId"
                              [showCancelled]="showCancelled"
                              (bookingClicked)="openEditBookingDialog($event.id)"
                              (newBooking)="createBooking2($event.start, $event.length, room)"
                              (roomClicked)="goToRoomDetail(room.id)"
        >
        </app-booking-timeline>
    </div>

    <div style="width: 100%; text-align: center; align-content: center;">
        <app-pagination [paginationModel]="paginationModel"></app-pagination>
    </div>
</ng-container>
