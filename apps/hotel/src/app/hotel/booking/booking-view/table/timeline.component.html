<!--row title-->
<div class="day-line-a-day">
    <div style="position: absolute; top: 0; bottom: 0; right: 0; left: 0;">
        <div style="display: table; width: 100%; height: 100%;">
            <div class="clickable htl-bkv-room-number" [ngClass]="{'theme-foreground-warn': !room.canBeReserved}"
                 matTooltip="{{ (room.canBeReserved ? 'ROOM_READY' : 'ROOM_NOT_READY') | translate }}"
                 (click)="onRoomClick()"
                 [matTooltipPosition]="'right'">
                {{room.number}}
            </div>
        </div>
    </div>
</div>

<!--row cells-->
<div *ngFor="let d of days, let i = index"
     class="day-line-a-day"
     [style.backgroundColor]="getCellColor(i)"
     [ngClass]="{'clickable': agentId == null && !cache[i].occupied && i >= todayIdx}"
     (click)="onCellClick(i)">

    <!--body-->
    <div class="day-line-a-day-inner">
        <div *ngFor="let b of cache[i].bookings"
             [style.width]="b.divWidth"
             [style.marginTop]="b.divTopMargin"
             class="day-line-booking">
            <div class="day-line-booking-content" [style.backgroundColor]="b.colorHex"
                 [ngClass]="{'htl-bkv-day-line-cancelled': b.cancelled}" (click)="onBookingClick(b)">
                <div class="day-line-booking-content-r">
                    <h1 style="margin: 0" appFitText fitTextMaxFontSize="30"
                        fitTextMinFontSize="10">{{b.customerName}}</h1>
                </div>
            </div>
        </div>
    </div>

</div>
