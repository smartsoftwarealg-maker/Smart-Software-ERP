<div class="center-of-button" matBadgeColor="warn" [matBadge]="badge" [matBadgePosition]="langSrv.rtl ? 'above before' : 'above after'">
</div>
<button type="button" matTooltip="{{'HTL_BK_NOTIFICATIONS' | translate}}"
        [matMenuTriggerFor]="notificationMenu" mat-icon-button>
    <i style="font-size: 18px" class="fas fa-bell"></i>
</button>

<mat-menu #notificationMenu="matMenu" class="theme-background theme-foreground" overlapTrigger="false" xPosition="after" yPosition="below">
    <div class="notification-menu">
        <div class="notifications-title" translate>HTL_BK_NOTIFICATIONS</div>
        <div class="notifications-container">
            <div *ngFor="let N of notifications" (click)="N.fn()" class="notification-card">
                <div class="icon float-start"
                     [ngClass]="{'theme-foreground-primary': N.iconColor === 1, 'theme-foreground-warn': N.iconColor === 2, 'theme-foreground-accent': N.iconColor === 3}">
                    <i class="notification-icon fa fa-{{N.icon}}"></i>
                </div>
                <div class="text float-start" [translate]="N.parameters">
                    <p>{{N.description}}</p>
                </div>
            </div>
        </div>

        <div class="notification-paging" (click)="$event.stopPropagation()">
            <app-pagination minContainerWidth="280"
                            [showPagesSizes]="false"
                            [paginationModel]="paginationModel">
            </app-pagination>
        </div>
    </div>

</mat-menu>
