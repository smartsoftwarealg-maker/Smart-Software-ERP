<ss-loading-spinner *ngIf="loadingState == 'L'"></ss-loading-spinner>
<ss-fatal-error *ngIf="loadingState == 'E'"></ss-fatal-error>
<div class="htl-bk-dtl-br-container" *ngIf="loadingState == 'C'">
    <button *ngIf="bookingRooms.length > 1 && !disabled"
            class="float-end" (click)="remove()"
            mat-icon-button color="warn">
        <i style="font-size: 18px" class="fas fa-times"></i>
    </button>
    <div style="height: 40px; line-height: 40px">
        <strong *ngIf="room" class="margin-start-8" style="font-size: 150%">
            <span translate>HTL_BK_ROOM_NO</span> {{room.number}}
        </strong>
    </div>

    <mat-form-field class="cost-field">
        <mat-label translate>HTL_BK_COST_PER_NIGHT</mat-label>
        <input min="1" matInput name="bk-rm-cost" [ngModel]="getCost()"
               (ngModelChange)="setCost($event)" [matAutocomplete]="costAC"
               type="number" [disabled]="disabled">
        <mat-autocomplete #costAC="matAutocomplete">
            <mat-option *ngFor="let c of chargingCosts" [value]="c.costRate">
                {{ c.description }}
            </mat-option>
        </mat-autocomplete>
    </mat-form-field>

    <div style="height: 40px; line-height: 40px">
        <strong *ngIf="room" class="margin-start-8">
            <span translate>HTL_BK_GUESTS</span> {{'(' + guests.length + (roomType? ('/' + roomType.adultCapacity) : '') + ')'}}
        </strong>
    </div>

    <div class="guest-list" [style.height.px]="canAddGuest()? 120 : 175">
        <div class="guest-name margin-start-8" *ngFor="let g of guests, let i = index">
            <a matTooltip="{{g.fullName}}">{{g.fullName}}</a>
            <div *ngIf="!disabled" class="remove-button float-end theme-background">
                <button style="top: -4px"
                        (click)="removeGuest(i)"
                        mat-icon-button
                        color="warn">
                    <i style="font-size: 14px" class="fas fa-minus"></i>
                </button>
            </div>
        </div>
    </div>

    <mat-form-field *ngIf="canAddGuest()" class="guest-field">
        <mat-label>
            <span translate>HTL_BK_ADD_GUEST</span>
        </mat-label>
        <input (keyup.enter)="onGuestFieldEnter()"
               matInput
               name="bk-rm-guest"
               [(ngModel)]="guestFieldText"
               type="text">
    </mat-form-field>

</div>
