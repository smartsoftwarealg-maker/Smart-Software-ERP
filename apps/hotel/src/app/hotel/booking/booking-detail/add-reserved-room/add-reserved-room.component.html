<div class="htl-bk-dtl-br-new-container">
    <button [disabled]="!room"
            class="float-end"
            (click)="addRoom()"
            mat-icon-button
            color="primary">
        <i style="font-size: 18px" class="fas fa-plus"></i>
    </button>

    <app-auto-complete class="input-field margin-start-8"
                       [selected]="room"
                       style="margin-top: 5px;"
                       [model]="roomACModel">
        <span translate>HTL_BK_ROOM_NO</span>
    </app-auto-complete>

    <mat-form-field style="max-width: 176px" class="margin-start-8">
        <mat-label translate>HTL_BK_RM_TYPE</mat-label>
        <mat-select name="type" [ngModel]="bookingSrv.listFilters.selectedRoomType" (valueChange)="setRoomType($event)">
            <mat-option [value]="0" translate>HTL_BK_RM_TYPE_ALL</mat-option>
            <mat-option *ngFor="let rt of bookingSrv.roomTypesArray"
                        [value]="rt.id">{{ rt.description }}</mat-option>
        </mat-select>
    </mat-form-field>

    <div class="options">
        <mat-checkbox *ngFor="let opt of bookingSrv.roomOptionsArray"
                      color="primary"
                      class="checkbox margin-start-8"
                      [checked]="options[opt.id]"
                      (change)="toggleOption(opt.id, $event)">
            {{opt.description}}
        </mat-checkbox>
    </div>

</div>
