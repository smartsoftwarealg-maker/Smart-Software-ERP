<div class="dlg-title theme-background-accent" translate>
    HTL_CLT_DETAIL
</div>

<ss-loading-spinner *ngIf="loadingState == 'L'"></ss-loading-spinner>
<ss-fatal-error *ngIf="loadingState == 'E'"></ss-fatal-error>
<div *ngIf="loadingState == 'C'" class="container theme-background">

    <form novalidate [formGroup]="form">
        <mat-form-field class="code sm-100">
            <mat-label translate>HTL_CLT_CODE</mat-label>
            <input matInput formControlName="code" type="text">
        </mat-form-field>

        <mat-form-field class="denomination sm-100">
            <mat-label translate>HTL_CLT_DENOMINATION</mat-label>
            <input matInput formControlName="denomination" type="text">
        </mat-form-field>

        <mat-form-field class="phone sm-100">
            <mat-label translate>HTL_CLT_PHONE</mat-label>
            <input matInput formControlName="phone" maxlength="12" type="text">
        </mat-form-field>

        <mat-form-field class="fax sm-100">
            <mat-label translate>HTL_CLT_FAX</mat-label>
            <input matInput formControlName="fax" maxlength="12" type="text">
        </mat-form-field>


        <mat-form-field class="mobile sm-100">
            <mat-label translate>HTL_CLT_MOBILE</mat-label>
            <input matInput formControlName="mobile" maxlength="12" type="text">
        </mat-form-field>

        <mat-form-field class="address sm-100">
            <mat-label translate>HTL_CLT_ADDRESS</mat-label>
            <input matInput formControlName="address" maxlength="80" type="text">
        </mat-form-field>

        <mat-checkbox formControlName="blocked" class="blocked" translate>
            HTL_CLT_BLOCKED
        </mat-checkbox>
    </form>

    <app-save-bar
            (save)="saveAgent()"
            (cancel)="close(true)"
            [saveDisabled]="!form.valid">
    </app-save-bar>
</div>
