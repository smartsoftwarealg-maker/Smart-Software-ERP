<div class="dlg-title theme-background-accent" translate>
    HTL_RM_DETAIL
</div>

<ss-loading-spinner *ngIf="loadingState == 'L'"></ss-loading-spinner>
<ss-fatal-error *ngIf="loadingState == 'E'"></ss-fatal-error>
<div *ngIf="loadingState == 'C'" class="container theme-background">

    <form novalidate [formGroup]="form">
        <mat-form-field class="number">
            <mat-label translate>HTL_RM_NUMBER</mat-label>
            <input matInput formControlName="number" type="text">
        </mat-form-field>

        <mat-form-field class="roomType">
            <mat-label>
                <span translate>HTL_RM_TYPE</span>
            </mat-label>
            <mat-select formControlName="roomType">
                <mat-option *ngFor="let rt of roomsSrv.roomTypesArray" [value]="rt.id">{{ rt.description }}</mat-option>
            </mat-select>
        </mat-form-field>

        <mat-form-field class="bedCount">
            <mat-label translate>HTL_RM_BED_COUNT</mat-label>
            <input matInput formControlName="bedCount" type="number">
        </mat-form-field>

        <mat-form-field class="state">
            <mat-label translate>HTL_RM_STATE</mat-label>
            <mat-select formControlName="state">
                <mat-option *ngFor="let rs of roomsSrv.roomStatesArray" [value]="rs.id"><span translate>{{ rs.description }}</span></mat-option>
            </mat-select>
        </mat-form-field>

        <app-tag-input formControlName="options"
                       [chipToStringFn]="optionToString"
                       [acToStringFn]="optionToString"
                       [filterFn]="filterOptionsFn"
                       [setterFn]="optionSetter"
                       [getterFn]="optionGetter"
                       class="options">
            <span translate>HTL_RM_OPTIONS</span>
        </app-tag-input>

    </form>

    <app-save-bar
            (save)="saveRoom()"
            (cancel)="close(true)"
            [saveDisabled]="!form.valid">
    </app-save-bar>
</div>
