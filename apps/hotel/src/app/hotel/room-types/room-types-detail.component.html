<div class="dlg-title theme-background-accent" translate>
    HTL_RT_DETAIL
</div>
<div class="container theme-background">

    <form novalidate [formGroup]="form">

        <mat-form-field class="description">
            <mat-label translate>HTL_RT_DESCRIPTION</mat-label>
            <input matInput formControlName="description" type="text">
        </mat-form-field>

        <mat-form-field class="adultCapacity">
            <mat-label translate>HTL_RT_ADULT_CAPACITY</mat-label>
            <input matInput formControlName="adultCapacity" type="number">
        </mat-form-field>

        <mat-form-field class="childCapacity">
            <mat-label translate>HTL_RT_CHILD_CAPACITY</mat-label>
            <input matInput formControlName="childCapacity" type="number">
        </mat-form-field>

    </form>

    <app-save-bar
            (save)="save()"
            (cancel)="close(true)"
            [saveDisabled]="!form.valid">
    </app-save-bar>
</div>
