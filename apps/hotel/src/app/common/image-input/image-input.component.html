<div class="image-input-card square-div theme-background">
    <div class="square-div-child">
        <input width="10px" type="file" ng2FileSelect #file />
        <img [src]="imgSrc">
        <div class="image-input-footer" *ngIf="editable">
            <button type="button" class="float-end" style="margin: 8px" mat-mini-fab (click)="file.click()">
                <i class="fas fa-folder-open"></i>
            </button>
        </div>
    </div>
</div>
