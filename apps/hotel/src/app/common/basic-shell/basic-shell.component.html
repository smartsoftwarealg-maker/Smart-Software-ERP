<mat-sidenav-container style="position: absolute; top: 0; right: 0; bottom: 0; left: 0;">
    <mat-sidenav class="theme-background-primary" #sidenav mode="over" [position]="langSrv.rtl ? 'end' : 'start'">
        <app-side-nav (closeSideNav)="sidenav.close()"></app-side-nav>
    </mat-sidenav>

    <mat-sidenav-content>
        <app-nav-bar (toggleSideNav)="sidenav.toggle()"></app-nav-bar>
        <div style="position: absolute; top: 48px; right: 0; bottom: 0; left: 0; overflow: auto">
			<router-outlet *ngIf="!hasContent"></router-outlet>
            <ng-content *ngIf="hasContent"></ng-content>
        </div>
    </mat-sidenav-content>
</mat-sidenav-container>
