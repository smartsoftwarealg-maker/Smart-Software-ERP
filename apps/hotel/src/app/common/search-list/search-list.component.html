<mat-form-field [matMenuTriggerFor]="menu" class="the-button">
    <mat-label>
        <ng-content></ng-content>
    </mat-label>
    <i matSuffix class="fas fa-search"></i>
    <input matInput [value]="model.toString(model.getSelected())" type="text" readonly>
</mat-form-field>

<mat-menu #menu="matMenu" overlapTrigger>

    <div [style.width]="strMenuWidth" class="small-input-field" (click)="$event.stopPropagation()">
        <!--        <mat-form-field class="filter-field" appearance="outline">-->
        <i class="icon margin-start-8 fas fa-search"></i>
        <input #filterField matInput [formControl]="filterControl"
               class="filter-field theme-background theme-foreground"
               type="text">
        <!--        </mat-form-field>-->
    </div>

    <div *ngIf="model" [style.width]="strMenuWidth">
        <div class="list-static-height">
            <button style="text-align: start" *ngFor="let e of list" mat-menu-item (focus)="filterField.focus()" (click)="model.setSelected(e)">
                {{model.toString(e)}}
            </button>
        </div>

        <app-pagination
                [forceWidth]="intMenuWidth"
                [showPagesSizes]="false"
                (click)="$event.stopPropagation()"
                [paginationModel]="model.paginationModel">
        </app-pagination>
    </div>

</mat-menu>
