<div class="nav-bar-container theme-background-primary mat-elevation-z8">
    <button mat-icon-button (click)="emitToggleSideNav()" class="float-start margin-start-8">
        <i class="fas fa-list"></i>
    </button>

    <button mat-icon-button routerLink="/" *ngIf="!navSrv.isMainPage" class="float-start">
        <i class="fas fa-home"></i>
    </button>

    <button *ngIf="!navSrv.isMainPage && langSrv.rtl" mat-icon-button (click)="goBack()" class="float-start">
        <i class="fas fa-arrow-right"></i>
    </button>

    <button *ngIf="!navSrv.isMainPage && !langSrv.rtl" mat-icon-button (click)="goBack()" class="float-start">
        <i class="fas fa-arrow-left"></i>
    </button>

    <strong class="margin-start-8" translate>{{navSrv.active.title}}</strong>

    <button mat-icon-button [matMenuTriggerFor]="menu" class="float-end margin-end-8">
        <i class="fas fa-caret-down"></i>
    </button>

    <mat-menu #menu="matMenu" style="overflow: hidden">
        <div class="nav-bar-settings-menu" (click)="$event.stopPropagation()">
            <div class="settings-item selectable" (click)="themeBtn.click()">
                <ss-theme-select (click)="$event.stopPropagation()" #themeBtn></ss-theme-select>
                <span class="text" translate>THEME_SETTINGS</span>
            </div>
            <div class="settings-item selectable" (click)="langBtn.click()">
                <ss-language-select (click)="$event.stopPropagation()" #langBtn></ss-language-select>
                <span class="text" translate>LANGUAGE_SETTINGS</span>
            </div>
            <div class="settings-item selectable" (click)="logoutBtn.click()">
                <ss-logout (click)="$event.stopPropagation()" #logoutBtn></ss-logout>
                <span class="text" translate>LOGOUT</span>
            </div>
        </div>
    </mat-menu>
</div>
