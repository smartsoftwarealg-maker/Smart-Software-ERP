<mat-form-field style="width: 100%" [ngClass]="{'theme-foreground-warn': !valid}">
    <mat-label>
        <ng-content></ng-content>
    </mat-label>
    <mat-chip-list #chipList required="{{required}}">
        <mat-chip *ngFor="let e of elements" [removable]="true">
            <div [dir]="langSrv.dir" class="chip-content">
                {{chipElementToString(e)}}
                <button (click)="onRemove(e)" mat-icon-button class="float-start small-del-btn">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </mat-chip>
        <input #txtInput
               [formControl]="txtCtrl"
               [matAutocomplete]="tagAC"
               [matChipInputFor]="chipList"
               [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
               [matChipInputAddOnBlur]="false" *ngIf="required" required>
        <input #txtInput
               [formControl]="txtCtrl"
               [matAutocomplete]="tagAC"
               [matChipInputFor]="chipList"
               [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
               [matChipInputAddOnBlur]="false" *ngIf="!required">
    </mat-chip-list>
    <mat-autocomplete #tagAC="matAutocomplete" (optionSelected)="onSelection($event)" [autoActiveFirstOption]="true">
        <mat-option *ngFor="let f of filtered" [value]="f">
            {{optionElementToString(f)}}
        </mat-option>
    </mat-autocomplete>
</mat-form-field>
