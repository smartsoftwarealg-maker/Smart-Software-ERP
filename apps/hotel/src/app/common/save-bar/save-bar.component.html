<div class="sav-container">

    <ng-content></ng-content>

    <button *ngIf="saveVisible" [disabled]="saveDisabled" matTooltip="{{ 'SAVE' | translate }}" (click)="onSave()"
            color="primary" type="button" class="margin-end-8 float-end" mat-mini-fab>
        <i class="fas fa-save"></i>
    </button>

    <button *ngIf="cancelVisible" [disabled]="cancelDisabled" matTooltip="{{ 'CLOSE' | translate }}"
            color="" type="button" class="margin-end-8 float-end" (click)="onCancel()" mat-mini-fab>
        <i class="fas fa-times"></i>
    </button>
</div>
