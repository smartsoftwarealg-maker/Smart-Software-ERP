<div class="container" [ngClass]="{'theme-foreground-warn': wasTouched && (!isValid || (required && isEmpty))}">
    <mat-form-field style="max-width: 120px; !important">
        <mat-label>
            <ng-content></ng-content>
        </mat-label>
        <input (blur)="markAsTouched()" *ngIf="!required" #element [disabled]="pOff" style="text-align: center;" matInput
               [matDatepicker]="datePicker" [min]="pMin" [value]="pDate" [max]="pMax"
               (dateChange)="onDateOnlyChanged($event.value)">
        <input (blur)="markAsTouched()" *ngIf="required" #element [disabled]="pOff" style="text-align: center;" matInput
               [matDatepicker]="datePicker" [min]="pMin" [value]="pDate" [max]="pMax"
               (dateChange)="onDateOnlyChanged($event.value)" required>
        <mat-datepicker-toggle matSuffix [for]="datePicker"></mat-datepicker-toggle>
        <mat-datepicker #datePicker></mat-datepicker>
    </mat-form-field>

    <ng-container *ngIf="hasTime">
        <mat-form-field style="width: 45px;" class="margin-start-8">
            <input (blur)="markAsTouched()" [disabled]="pOff" [value]="getHours()" style="text-align: center;" matInput type="number" min="0" max="23" (change)="onHoursChanged($event)" required>
        </mat-form-field>
        :
        <mat-form-field style="width: 45px; text-align: center">
            <input (blur)="markAsTouched()" [disabled]="pOff" [value]="getMinutes()" style="text-align: center;" matInput type="number" min="0" max="59" (change)="onMinutesChanged($event)" required>
        </mat-form-field>
    </ng-container>
</div>
