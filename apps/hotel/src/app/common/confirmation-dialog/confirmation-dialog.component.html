<div class="conf-dlg-title theme-background-accent" translate>
    {{title}}
</div>
<mat-dialog-content>
    <p translate>{{message}}</p>
</mat-dialog-content>
<mat-dialog-actions style="display: block">
    <button type="button" class="margin-end-8 float-end" mat-raised-button
            (click)="dialogRef.close(false)" color="warn" translate>
        NO
    </button>
    <button type="button" class="margin-end-8 float-end" mat-raised-button
            (click)="dialogRef.close(true)" color="primary" translate>
        YES
    </button>
</mat-dialog-actions>
