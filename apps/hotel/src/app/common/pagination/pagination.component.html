<div class="pagination-container theme-background theme-foreground">

    <button mat-icon-button class="nav-btn" type="button" style="float: right" (click)="onRightButtonClick()"
            [disabled]="isRightButtonDisabled()">
        <i class="fas fa-caret-right"></i>
    </button>

    <button mat-icon-button class="nav-btn" type="button" style="float: left" (click)="onLeftButtonClick()"
            [disabled]="isLeftButtonDisabled()">
        <i class="fas fa-caret-left"></i>
    </button>

    <div #container class="pages-buttons-container">
        <div *ngFor="let b of buttons" class="page-btn" [class.current-btn]="model.page == b.page" [style.width]="b.widthStyle" (click)="onPageButtonClick(b.page)">
            {{b.page}}
        </div>
    </div>

    <div class="middle-line">
        <a class="total-pages">
            <button mat-icon-button type="button" color="" class="second-line-button" [matMenuTriggerFor]="secondLineMenu">
                <i class="fas fa-cogs"></i>
            </button>
            <span class="margin-start-8" [translate]="{pages: lastPage}">{{pageCountLabel}}</span>
        </a>
        <a *ngIf="model.page != 1" (click)="model.page = 1" class="middle-line-text float-start margin-start-4" translate>
            {{firstPageLabel}}
        </a>
        <a *ngIf="model.page != lastPage && lastPage > 1" (click)="model.page = lastPage" class="middle-line-text float-end margin-end-4" translate>
            {{lastPageLabel}}
        </a>
    </div>

</div>

<mat-menu [xPosition]="langSrv.rtl ? 'before' : 'after'" yPosition="below" overlapTrigger="false" #secondLineMenu="matMenu">
    <div class="second-line" (click)="$event.stopPropagation()">
        <a class="second-line-text" translate>{{goToLabel}}</a>
        <input #pageInput type="text" class="goto-input margin-start-4 theme-background theme-foreground" (keyup.enter)="onGoToPage()">
        <button mat-icon-button type="button" color="" class="second-line-button" *ngIf="langSrv.rtl" (click)="onGoToPage()">
            <i class="fas fa-chevron-circle-left"></i>
        </button>
        <button mat-icon-button type="button" color="" class="second-line-button" *ngIf="!langSrv.rtl" (click)="onGoToPage()">
            <i class="fas fa-chevron-circle-right"></i>
        </button>
        <ng-container *ngIf="showPagesSizes">
            <a class="margin-start-8 second-line-text" [translate]="{page: model.pageSize}" [matMenuTriggerFor]="perPageMenu">
                {{perPageLabel}}
            </a>
            <button mat-icon-button type="button" color="" class="second-line-button" [matMenuTriggerFor]="perPageMenu">
                <i class="fas fa-chevron-circle-down"></i>
            </button>
        </ng-container>
    </div>
</mat-menu>

<mat-menu [xPosition]="langSrv.rtl ? 'before' : 'after'" yPosition="below" overlapTrigger="false" #perPageMenu="matMenu">
    <div mat-menu-item *ngFor="let o of pageSizes" (click)="model.pageSize = o" [translate]="{page: o}">
        {{perPageLabel}}
    </div>
</mat-menu>
